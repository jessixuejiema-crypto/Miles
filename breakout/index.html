<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Breaker</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: 18px; padding: 12px 14px;
    pointer-events: none;
  }
  .cur { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .dia { width: 13px; height: 13px; background: #fff; transform: rotate(45deg); box-shadow: 0 0 8px rgba(255,255,255,.55); flex: 0 0 auto; }
  .dia.p { background: #c46bff; box-shadow: 0 0 10px #a640ff; }
  .dia.s { width: 8px; height: 8px; box-shadow: none; }
  #treeBtn {
    pointer-events: auto; margin-left: auto; background: #140a1f; color: #e7cfff;
    border: 2px solid #7b3cc4; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 700;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  #ballCount { font-size: 13px; color: #8aa; font-weight: 600; }
  #hud button { white-space: nowrap; flex-shrink: 0; }
  #boardBtn { pointer-events: auto; background: #1a1410; color: #f3d9b8; border: 2px solid #7a5530; border-radius: 10px; padding: 8px 10px; font: inherit; font-weight: 700; cursor: pointer; }
  #boardBtn.arm { background: #6b3a1d; color: #fff; }
  @media (max-width: 460px) { #hud { gap: 10px; } #ballCount { display: none; } .cur { font-size: 18px; gap: 8px; } #treeBtn, #centerBtn, #boardBtn { padding: 7px 8px; font-size: 13px; } #centerBtn .w, #boardBtn:not(.arm) .w { display: none; } #centerBtn, #boardBtn { font-size: 16px; min-width: 36px; } }
  #centerBtn { pointer-events: auto; background: #10201a; color: #cfe; border: 2px solid #2c6b45; border-radius: 10px; padding: 8px 10px; font: inherit; font-weight: 700; cursor: pointer; }

  #hint {
    position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 2;
    background: rgba(0,0,0,.7); border: 1px solid #234; color: #cfe; padding: 8px 14px; border-radius: 10px;
    font-size: 14px; text-align: center; max-width: calc(100% - 40px); pointer-events: none;
  }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 14px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.9) 28%);
    scrollbar-width: none;
  }
  #bar::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; width: 96px; border: 2px solid #26302b; border-radius: 12px; background: #07100c;
    padding: 7px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
  }
  .card.sel { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,.25); }
  .card.locked { opacity: .4; }
  .card .ball { width: 22px; height: 22px; border-radius: 50%; position: relative; display: grid; place-items: center; }
  .sym { font-size: 13px; font-weight: 900; line-height: 1; color: #fff; font-style: normal; }
  .sym.dark { color: #1a0800; }
  .tn.ball .o i { display: grid; place-items: center; }
  .tn.ball .o i .sym { font-size: 22px; }
  .card .name { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .card .hand { font-size: 11px; color: #9ab; }
  .card .hand b { color: #fff; }
  .buy {
    width: 100%; border: 0; border-radius: 8px; padding: 6px 0; font: inherit; font-size: 13px; font-weight: 800;
    background: #1d2a24; color: #fff; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
  }
  .buy.ok { background: #2c6b45; }
  .buy:disabled { color: #789; }

  /* skill tree: a pannable tree of nodes */
  #tree { position: fixed; inset: 0; z-index: 5; background: #05010b; display: none; flex-direction: column; }
  #tree.open { display: flex; }
  .treeTop { display: flex; align-items: center; gap: 12px; padding: 12px 14px; z-index: 2; background: #05010b; border-bottom: 1px solid #1d1230; }
  .treeTop .cur { font-size: 22px; }
  .treeTop .lbl { color: #a99bbb; font-size: 13px; }
  .treeTop button { background: #1c1426; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; }
  .treeTop .close { margin-left: auto; }
  #treeView { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab;
    background: radial-gradient(circle at 50% 100%, #160a26 0%, #05010b 70%); }
  #treeView.drag { cursor: grabbing; }
  #treeWorld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #treeWorld svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .tn { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .tn .o { border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff;
    border: 3px solid #3a2b4d; background: #120a1c; box-sizing: border-box; transition: transform .12s; }
  .tn:hover .o { transform: scale(1.07); }
  .tn.sel .o { outline: 3px solid #fff; outline-offset: 3px; }
  .tn.ball .o { width: 70px; height: 70px; }
  .tn.ball .o i { width: 38px; height: 38px; border-radius: 50%; display: block; }
  .tn.up .o { width: 50px; height: 50px; font-size: 14px; }
  .tn.up.got .o { border-color: #c46bff; background: #2a1245; }
  .tn.up.max .o { border-color: #f2d0ff; background: #4d1f80; box-shadow: 0 0 14px #a640ff; }
  .tn.can .o { animation: can 1.4s ease-in-out infinite; }
  @keyframes can { 50% { box-shadow: 0 0 16px #c46bff; } }
  .tn.lock .o { border-color: #241a33; color: #5d5070; box-shadow: none !important; }
  .tn.lock .o i { opacity: .35; }
  .tn.lock .nm { color: #6d6080; }
  .tn .nm { margin-top: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; color: #e8dcf5; text-shadow: 0 1px 3px #000; }
  #nodeInfo { background: #0f0818; border-top: 2px solid #3a2556; padding: 12px 14px 16px; display: flex; align-items: center; gap: 12px; min-height: 64px; }
  #nodeInfo .txt { flex: 1; min-width: 0; }
  #nodeInfo .t { font-weight: 800; font-size: 16px; }
  #nodeInfo .d { font-size: 13px; color: #b9abcc; margin-top: 3px; }
  #nodeInfo button { border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 800; background: #6a2fb8; color: #fff;
    display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
  #nodeInfo button:disabled { background: #2a2235; color: #8a7d99; cursor: default; }
  #resetBtn.arm { background: #6b1d1d; }
  @media (prefers-reduced-motion: reduce) { .tn.can .o { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="cur"><span class="dia"></span><span id="money">0</span></div>
  <div class="cur"><span class="dia p"></span><span id="purple">0</span></div>
  <span id="ballCount"></span>
  <button id="centerBtn" hidden title="Recenter">⌖<span class="w"> Recenter</span></button>
  <button id="boardBtn" title="New board: start a fresh 3×3 board and keep your balls">↺<span class="w"> New board</span></button>
  <button id="treeBtn"><span class="dia p s"></span>Skill Tree</button>
</div>
<div id="hint"></div>
<div id="bar"></div>

<div id="tree">
  <div class="treeTop">
    <div class="cur"><span class="dia p"></span><span id="treePurple">0</span></div>
    <span class="lbl">Skill Tree · drag to move</span>
    <button class="close" id="resetBtn">Reset all</button>
    <button id="treeClose">Close</button>
  </div>
  <div id="treeView"><div id="treeWorld"><svg id="treeLinks"></svg><div id="treeNodes"></div></div></div>
  <div id="nodeInfo"></div>
</div>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------- blocks
// Color = the tier for the block's remaining hits ("damage units" = hits from an orange ball).
const TIERS = [
  { hp: 1,   c: '#e4e4e4', n: 'White' },
  { hp: 2,   c: '#2f7fe8', n: 'Blue' },
  { hp: 3,   c: '#45b532', n: 'Green' },
  { hp: 5,   c: '#dccf36', n: 'Yellow' },
  { hp: 7,   c: '#e8842a', n: 'Orange' },
  { hp: 10,  c: '#d8302a', n: 'Red' },
  { hp: 20,  c: '#ad2262', n: 'Red-Purple' },
  { hp: 35,  c: '#7a34cc', n: 'Purple' },
  { hp: 50,  c: '#f07ab8', n: 'Pink' },
  { hp: 100, c: '#6d7280', n: 'Gray' },
];
// Tougher blocks are rarer. Gray ends up about 1 in 500.
const WEIGHTS = [30, 22, 18, 12, 8, 5, 2.5, 1.2, 0.6, 0.2];
const WSUM = WEIGHTS.reduce((a, b) => a + b, 0);

const FREE = 0, BLOCK = 1, GEM = 2;  // GEM = glowing purple pixel (gives purple currency)
const REVEAL = 3;                    // blocks within 3 steps of open space are visible
const BR = 0.22;                     // ball radius in blocks
const FREE_COLOR = '#0f2018';

// ---------------------------------------------------------------- balls
const DEF = {
  orange: { name: 'Piercing Ball',    short: 'Piercing',    color: '#ff8a1c', dmg: 1, min: 0.5, max: 3,   unlock: 0, req: null,     cost: 10,
            desc: 'Drag strength sets speed (0.5–3 b/s).' },
  green:  { name: 'Poison Ball',      short: 'Poison',      color: '#3ddc4a', dmg: 1, min: 1,   max: 1.5, unlock: 1, req: 'orange', cost: 40,
            desc: 'Hits poison the blocks within 3. Poisoned blocks pulse green and take 0.5 damage once a second for 5 seconds.' },
  blue:   { name: 'Directional Ball', short: 'Directional', color: '#2f8cff', dmg: 3, min: 20,  max: 20,  unlock: 1, req: 'green',  cost: 120,
            desc: 'Only launches up, down, left or right. Always 20 b/s.' },
  purple: { name: 'Fast Ball',        short: 'Fast',        color: '#b05cff', dmg: 2, min: 30,  max: 30,  unlock: 1, req: 'blue',   cost: 300,
            desc: 'Just fast. 30 b/s.' },
  yellow: { name: 'Lightning Ball',   short: 'Lightning',   color: '#ffe23a', dmg: 3, min: 6,   max: 6,   unlock: 3, req: 'purple', cost: 800,
            desc: 'Strikes the nearest block every 0.5 s (range 200) for 2 dmg.' },
  red:    { name: 'Seeker Ball',      short: 'Seeker',      color: '#ff3b3b', dmg: 6, min: 18,  max: 18,  unlock: 3, req: 'yellow', cost: 2000,
            desc: 'After a bounce it flies at the nearest block in front of it (never the same one).' },
  cyan:   { name: 'Gravity Ball',     short: 'Gravity',     color: '#33f0ff', dmg: 1, min: 0.5, max: 3,   unlock: 4, req: 'red',    cost: 4000, gmul: 1,
            desc: 'Pulled toward an invisible orb circling the edge of the open space.' },
  white:  { name: 'Splitter Ball',    short: 'Splitter',    color: '#ffffff', dmg: 2, min: 30,  max: 30,  unlock: 5, req: 'cyan',   cost: 10000,
            desc: 'Big fast white ball. Every time it hits a block it splits off 3 small one-use white balls and keeps going.' },
  indigo: { name: 'Indigo Gravity Ball', short: 'Indigo',   color: '#5b3cff', dmg: 25, min: 3,   max: 8,   unlock: 5, req: 'white',  cost: 25000, gmul: 12.5,
            desc: 'A faster, much heavier Gravity Ball: 5× the pull of a fully upgraded (5/5) Gravity Ball, and 25 damage.' },
  pink:   { name: 'Pink Box Ball',    short: 'Pink',        color: '#ff6ec7', dmg: 6, min: 18,  max: 18,  unlock: 5, req: 'indigo', cost: 50000,
            desc: 'A Seeker Ball trapped in an invisible box around everything broken so far. It bounces off the box and only breaks blocks inside it; other balls pass through. The box grows as the open area grows.' },
  chain:  { name: 'Chain Ball',       short: 'Chain',       color: '#1e6bff', dmg: 3, min: 14, max: 14, unlock: 5, req: 'pink', cost: 200000, sym: '⛓',
            desc: 'Once every 30–40 seconds a hit makes 2 smaller, lighter one-use copies, and those copies split again on every hit. Splits 2 times; upgrade up to 4.' },
  magnet: { name: 'Magnet Ball',      short: 'Magnet',      color: '#e04cff', dmg: 3, min: 4, max: 10, unlock: 10, req: null, cost: 300000, gmul: 6, sym: '◆',
            desc: 'Pulled hard toward the nearest glowing purple pixel, even ones hidden in the dark, so it digs its way to them.' },
  buddy:  { name: 'Buddy Ball',       short: 'Buddy',       color: '#7dffc4', dmg: 2, min: 2, max: 8, unlock: 5, req: 'chain', cost: 400000, gmul: 4, sym: '✦',
            desc: 'Attracted to every other ball at once, pulled hardest by the closest ones, so it chases the crowd.' },
  island: { name: 'Island Ball',      short: 'Island',      color: '#e8c872', dmg: 4, min: 3, max: 9, unlock: 5, req: 'buddy', cost: 500000, gmul: 5, sym: '▲',
            desc: 'Only attracted to floating islands: chunks of blocks cut off from the outer wall, with open space all around them. It always heads for the nearest one.' },
  shooter:{ name: 'Shooter Ball',     short: 'Shooter',     color: '#c9d1d9', dmg: 2, min: 2, max: 6, unlock: 5, req: 'island', cost: 600000, sym: '+',
            desc: 'Has four cannon arms that turn on their own to line up with the nearest block in front, then fire out of all four at once, once a second. Shots earn 50× money on the blocks they hit.' },
  cloud:  { name: 'Cloud Ball',       short: 'Cloud',       color: '#dfe9f5', dmg: 1, min: 1, max: 5, unlock: 5, req: 'shooter', cost: 700000, gmul: 6, sym: '☁',
            desc: 'One Cloud Ball launches as a cloud of 10 balls. The 10 balls pull on cloud balls only, and two clouds that touch merge into one bigger cloud, with the same medium pull at any distance, and bounce off each other like solid balls, staying loosely together, so they move as one tight cloud.' },
  builder:{ name: 'Block Builder',    short: 'Builder',     color: '#b07a45', dmg: 1, min: 2, max: 6, unlock: 5, req: 'cloud', cost: 800000, sym: '■',
            desc: 'Builds a new random block in the open space 10 blocks away from itself every 2 seconds, giving your other balls more to break.' },
};
const ORDER = Object.keys(DEF);

const DMG = ['dmg', 'Damage', 5], SPD = ['spd', 'Speed', 5];
const NODES = {
  orange: [DMG, SPD, ['pierce', 'Pierce Force', 3]],
  green:  [DMG, SPD, ['prange', 'Poison Range', 3], ['pdmg', 'Poison Damage', 5]],
  blue:   [DMG, SPD],
  purple: [DMG, SPD],
  yellow: [DMG, SPD, ['rate', 'Strikes / sec', 5], ['sdmg', 'Strike Damage', 5]],
  red:    [DMG, SPD],
  cyan:   [DMG, SPD, ['grav', 'Gravity Pull', 5]],
  indigo: [DMG, SPD, ['grav', 'Gravity Pull', 5]],
  white:  [DMG, SPD, ['split', 'Split Count', 3]],
  pink:   [DMG, SPD],
  chain:  [DMG, SPD, ['depth', 'Split Times', 2]],   // 2 → 4 split times
  magnet: [DMG, SPD, ['grav', 'Gravity Pull', 5]],
  buddy:  [DMG, SPD, ['grav', 'Gravity Pull', 5]],
  island: [DMG, SPD, ['grav', 'Gravity Pull', 5]],
  shooter:[DMG, SPD, ['fire', 'Fire Rate', 5]],
  cloud:  [DMG, SPD, ['grav', 'Gravity Pull', 5]],
  builder:[DMG, SPD, ['build', 'Build Speed', 5]],
};
// Most upgrades cost 1 purple; the last levels cost more, never more than 5.
const nodeCost = (max, lv) => max === 2 ? [1, 2][lv] : max === 3 ? [1, 2, 3][lv] : [1, 1, 1, 2, 3][lv];

// ---------------------------------------------------------------- state
// The grid never ends. A cell is generated from its coordinates the first time anything looks at it
// (the same spot always gives the same block), and only cells that changed are stored.
let seed = 1;
let mod = new Map();               // key -> [type, hp] for cells that were hit or broken
let distMap = new Map();           // key -> steps to the nearest open cell (only 0–3 are stored)
let frontier = new Set();          // blocks touching open space
let poison = new Map();            // key -> { until, dps }
let balls = [];
let money = 10, purple = 0;
let inv = {}, bought = {}, unlocked = {}, up = {};
let selected = 'orange';
let everLaunched = false;
let freeBounds, freeSum, freeCount;
let T = 0;
let fx = [], bolts = [], texts = [];
let orb = { ang: 0, r: 1, cx: 0.5, cy: 0.5, dirty: true };

let worldVer = 0;
const OFF = 2 ** 20, M = 2 ** 21;  // cells from -1,048,576 to +1,048,575 each way: effectively endless
const key = (x, y) => (x + OFF) * M + (y + OFF);
const kx = k => Math.floor(k / M) - OFF;
const ky = k => (k % M) - OFF;

function rnd(x, y, salt) {          // deterministic 0..1 for a cell
  let h = (seed + salt * 0x9e3779b9) ^ Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function baseType(x, y) {
  if (Math.abs(x) <= 1 && Math.abs(y) <= 1) return FREE;
  // glowing purple pixel: 1 in 5 around the start (within 10 blocks), 1 in 1000 everywhere else
  if (rnd(x, y, 1) < (x * x + y * y <= 100 ? 1 / 5 : 1 / 1000)) return GEM;
  return BLOCK;
}
// Block Builder: put a new random block on an open cell 10 blocks away
function buildBlockNear(b) {
  for (let tries = 0; tries < 24; tries++) {
    const a = Math.random() * Math.PI * 2;
    const x = Math.floor(b.x + Math.cos(a) * 10), y = Math.floor(b.y + Math.sin(a) * 10), i = key(x, y);
    if (cellType(i) !== FREE) continue;
    if (balls.some(o => Math.abs(o.x - (x + 0.5)) < 1 && Math.abs(o.y - (y + 0.5)) < 1)) continue;   // never build on a ball
    let r = Math.random() * WSUM, hp = 1;
    for (let t = 0; t < TIERS.length; t++) { r -= WEIGHTS[t]; if (r < 0) { hp = TIERS[t].hp; break; } }
    mod.set(i, [BLOCK, hp]); worldVer++; orb.dirty = true;
    freeSum.x -= x + 0.5; freeSum.y -= y + 0.5; freeCount--;
    distMap.set(i, 1); frontier.add(i);
    for (let k = 0; k < 6; k++) fx.push({ x: x + 0.5, y: y + 0.5, vx: (Math.random() - .5) * 3, vy: (Math.random() - .5) * 3, t: 0.4, c: '#d9a066' });
    return;
  }
}

function baseHp(x, y) {
  let r = rnd(x, y, 3) * WSUM;
  for (let i = 0; i < TIERS.length; i++) { r -= WEIGHTS[i]; if (r < 0) return TIERS[i].hp; }
  return 1;
}
function cellType(k) { const m = mod.get(k); return m ? m[0] : baseType(kx(k), ky(k)); }
function cellHp(k) {
  const m = mod.get(k); if (m) return m[1];
  const x = kx(k), y = ky(k), t = baseType(x, y);
  return t === FREE ? 0 : t === GEM ? 1 : baseHp(x, y);
}
const cellDist = k => distMap.get(k) ?? REVEAL + 1;

function resetMeta() {
  money = 10; purple = 0; balls = []; poison = new Map(); everLaunched = false; selected = 'orange';
  for (const k of ORDER) { inv[k] = 0; bought[k] = 0; unlocked[k] = k === 'orange'; up[k] = {}; for (const n of NODES[k]) up[k][n[0]] = 0; }
}

function genWorld() {
  seed = (Math.random() * 2 ** 31) | 0;
  mod = new Map();
  for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) mod.set(key(x, y), [FREE, 0]);
}

const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function spreadDist(q) {             // BFS outward from open cells; distances only ever shrink
  for (let h = 0; h < q.length; h++) {
    const a = q[h], d = distMap.get(a); if (d >= REVEAL) continue;
    const ax = kx(a), ay = ky(a);
    for (const [ox, oy] of NB) {
      const j = key(ax + ox, ay + oy);
      if (cellDist(j) > d + 1) { distMap.set(j, d + 1); q.push(j); if (d + 1 === 1 && cellType(j) !== FREE) frontier.add(j); }
    }
  }
}

function rebuildDerived() {
  distMap = new Map(); frontier = new Set();
  freeBounds = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity }; freeSum = { x: 0, y: 0 }; freeCount = 0;
  const q = [];
  for (const [k, m] of mod) if (m[0] === FREE) { distMap.set(k, 0); q.push(k); addFreeStats(kx(k), ky(k)); }
  spreadDist(q);
  orb.dirty = true;
}

function addFreeStats(x, y) {
  freeBounds.x0 = Math.min(freeBounds.x0, x); freeBounds.y0 = Math.min(freeBounds.y0, y);
  freeBounds.x1 = Math.max(freeBounds.x1, x); freeBounds.y1 = Math.max(freeBounds.y1, y);
  freeSum.x += x + 0.5; freeSum.y += y + 0.5; freeCount++;
}

function breakCell(i) {
  const x = kx(i), y = ky(i);
  const col = cellType(i) === GEM ? '#c46bff' : tierOf(Math.max(cellHp(i), 0.01)).c;
  mod.set(i, [FREE, 0]); distMap.set(i, 0); worldVer++;
  frontier.delete(i); poison.delete(i);
  addFreeStats(x, y);
  spreadDist([i]);
  orb.dirty = true;
  for (let k = 0; k < 6; k++) fx.push({ x: x + 0.5, y: y + 0.5, vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4, t: 0.5, c: col });
}

function tierOf(h) {
  const v = Math.ceil(h - 1e-6);
  let t = TIERS[0];
  for (const tr of TIERS) if (tr.hp <= v) t = tr;
  return t;
}

function damage(i, amt, mult = 1) {
  const t = cellType(i);
  if (t === FREE) return false;
  if (t === GEM) {
    purple++;
    texts.push({ x: kx(i) + 0.5, y: ky(i) + 0.2, s: '+1', t: 1.2, c: '#d28bff' });
    breakCell(i); dirtyUI = true; return true;
  }
  const h = cellHp(i);
  money += Math.min(amt, h) * mult;
  if (h - amt <= 1e-4) { breakCell(i); return true; }
  mod.set(i, [BLOCK, h - amt]);
  return false;
}

// ---------------------------------------------------------------- ball stats
function stat(k) {
  const d = DEF[k], u = up[k];
  const sm = 1 + 0.2 * u.spd;
  return { dmg: d.dmgStep ? d.dmg + d.dmgStep * u.dmg : d.dmg * (1 + 0.5 * u.dmg), min: d.min * sm, max: d.max * sm };
}
const pierceHp = () => up.orange.pierce;                      // 1 = white, 2 = blue, 3 = green
const poisonRange = () => 3 + up.green.prange;
const poisonDps = () => 0.5 + 0.25 * up.green.pdmg;
const strikeInterval = () => 0.5 / (1 + 0.4 * up.yellow.rate);
const strikeDmg = () => 2 + up.yellow.sdmg;
const gravity = k => 5 * DEF[k].gmul * (1 + 0.3 * up[k].grav);   // b/s² toward the invisible orb
const splitCount = () => 3 + up.white.split;
const chainDepth = () => 2 + up.chain.depth;
const fireRate = () => 1 + 0.3 * up.shooter.fire;
const buildEvery = () => 2 / (1 + 0.4 * up.builder.build);   // seconds between new blocks
const SHOT_PROFIT = 50;
const MAX_MINIS = 300;                                         // cap on one-use balls alive at once
let miniCount = 0;
const fmt1 = v => (Math.round(v * 100) / 100).toString();

function nodeValue(k, key, lv) {
  const d = DEF[k];
  switch (key) {
    case 'dmg': return fmt1(d.dmgStep ? d.dmg + d.dmgStep * lv : d.dmg * (1 + 0.5 * lv)) + ' dmg';
    case 'depth': return (2 + lv) + ' times';
    case 'fire': return fmt1(1 + 0.3 * lv) + ' volleys/s';
    case 'build': return 'every ' + fmt1(2 / (1 + 0.4 * lv)) + ' s';
    case 'spd': return d.min === d.max ? fmt1(d.min * (1 + 0.2 * lv)) + ' b/s' : fmt1(d.min * (1 + .2 * lv)) + '–' + fmt1(d.max * (1 + .2 * lv)) + ' b/s';
    case 'pierce': return ['none', 'White', 'White + Blue', 'White → Green'][lv];
    case 'prange': return (3 + lv) + ' blocks';
    case 'pdmg': return fmt1(0.5 + 0.25 * lv) + ' dmg/s';
    case 'rate': return fmt1(1 / (0.5 / (1 + 0.4 * lv))) + ' /s';
    case 'sdmg': return (2 + lv) + ' dmg';
    case 'grav': return '×' + fmt1(d.gmul * (1 + 0.3 * lv));
    case 'split': return (3 + lv) + ' balls';
  }
  return '';
}

// ---------------------------------------------------------------- physics
function spawnBall(k, x, y, dx, dy, f, extra) {
  const b = Object.assign({ k, x, y, vx: dx, vy: dy, f, last: [-1, -1], st: 0, cs: 0 }, extra || {});
  if (DEF[k].gmul) { const s = stat(k); b.cs = s.min + (s.max - s.min) * f; }
  balls.push(b);
  if (b.oneUse) miniCount++;
  return b;
}

function ballSpeed(b) {
  if (b.shot) return 14;
  if (DEF[b.k].gmul) return b.cs;
  const s = stat(b.k);
  return s.min + (s.max - s.min) * b.f;
}

function solidAt(cx, cy) {
  const i = key(cx, cy);
  return cellType(i) === FREE ? -1 : i;
}

function moveAxis(b, ax, d) {
  if (!d) return;
  const sgn = d > 0 ? 1 : -1, R = b.k === 'white' && !b.oneUse ? BR * 1.5 : b.k === 'shooter' && !b.shot ? BR * 1.3 : BR;
  if (b.k === 'pink') {
    // the invisible box: the smallest rectangle around every broken cell. Only the pink ball feels it.
    const lo = ax === 0 ? freeBounds.x0 : freeBounds.y0, hi = (ax === 0 ? freeBounds.x1 : freeBounds.y1) + 1;
    const edge = (ax === 0 ? b.x : b.y) + d + sgn * R;
    if (edge < lo || edge > hi) { reflect(b, ax); seek(b, -1); return; }
  }
  let nx = b.x, ny = b.y, c1, c2;
  if (ax === 0) {
    nx += d; const ex = Math.floor(nx + sgn * R);
    c1 = solidAt(ex, Math.floor(b.y - R * 0.7)); c2 = solidAt(ex, Math.floor(b.y + R * 0.7));
  } else {
    ny += d; const ey = Math.floor(ny + sgn * R);
    c1 = solidAt(Math.floor(b.x - R * 0.7), ey); c2 = solidAt(Math.floor(b.x + R * 0.7), ey);
  }
  const hit = c1 !== -1 ? c1 : c2;
  if (hit === -1) { b.x = nx; b.y = ny; return; }
  if (onHit(b, hit)) { b.x = nx; b.y = ny; return; }   // pierced through
  reflect(b, ax);
  afterBounce(b, hit);
}

function reflect(b, ax) { if (ax === 0) b.vx = -b.vx; else b.vy = -b.vy; }

function onHit(b, i) {
  // Pierce Force: orange ball smashes weak blocks and keeps going.
  if (b.k === 'orange' && pierceHp() > 0 && cellType(i) === BLOCK && cellHp(i) <= pierceHp() + 1e-6) {
    damage(i, cellHp(i));
    return true;
  }
  const dmg = stat(b.k).dmg;
  if (b.shot) {                                  // Shooter's shots: 50× the money
    const got = Math.min(dmg, cellHp(i)) * SHOT_PROFIT;
    if (cellType(i) === BLOCK && got >= 1) texts.push({ x: kx(i) + 0.5, y: ky(i) + 0.3, s: '+' + fmt(got), t: 0.8, c: '#ffd76a' });
    damage(i, dmg, SHOT_PROFIT);
    return false;
  }
  damage(i, dmg);
  if (b.k === 'green') poisonAround(i);
  return false;
}

function afterBounce(b, hit) {
  b.last = [hit, b.last[0]];
  // the big Chain Ball only splits once every 30–40 seconds; its copies split on every hit
  const chainReady = b.k === 'chain' && (b.gen ? b.gen < chainDepth() : T >= (b.nextSplit || 0));
  if (chainReady) {
    if (!b.gen) b.nextSplit = T + 30 + Math.random() * 10;
    // two smaller, lighter one-use copies; they split again until the chain runs out
    const base = Math.atan2(b.vy, b.vx), g = (b.gen || 0) + 1;
    for (const off of [-0.5, 0.5]) {
      if (miniCount >= MAX_MINIS) break;
      spawnBall('chain', b.x, b.y, Math.cos(base + off), Math.sin(base + off), 1, { oneUse: true, gen: g });
    }
  }
  if (b.oneUse) { b.dead = true; return; }
  if (b.k === 'red' || b.k === 'pink') seek(b, hit);
  if (b.k === 'white') {
    const n = Math.min(splitCount(), MAX_MINIS - miniCount);
    const base = Math.atan2(b.vy, b.vx);
    for (let s = 0; s < n; s++) {
      const a = base + (s - (n - 1) / 2) * 0.45;
      spawnBall('white', b.x, b.y, Math.cos(a), Math.sin(a), 1, { oneUse: true });   // small one-use white balls; the big one keeps going
    }
  }
}

const inBox = j => { const x = kx(j), y = ky(j); return x >= freeBounds.x0 && x <= freeBounds.x1 && y >= freeBounds.y0 && y <= freeBounds.y1; };

// Islands: groups of blocks inside the open area that don't connect to the outer wall.
let islandCache = { ver: -1, t: -9, list: [] };
function findIslands() {
  if (islandCache.ver === worldVer || T < islandCache.t + 0.5) return islandCache.list;
  islandCache = { ver: worldVer, t: T, list: [] };
  const x0 = freeBounds.x0 - 1, y0 = freeBounds.y0 - 1, x1 = freeBounds.x1 + 1, y1 = freeBounds.y1 + 1;
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w * h > 400000) return islandCache.list;    // too big to scan quickly
  const seen = new Uint8Array(w * h), q = [];
  const solid = (x, y) => cellType(key(x, y)) !== FREE;
  const push = (x, y) => { const i = (y - y0) * w + (x - x0); if (!seen[i] && solid(x, y)) { seen[i] = 1; q.push(x, y); } };
  const flood = () => { const out = []; while (q.length) { const y = q.pop(), x = q.pop(); out.push(key(x, y));
      for (const [ox, oy] of NB) { const nx = x + ox, ny = y + oy; if (nx >= x0 && nx <= x1 && ny >= y0 && ny <= y1) push(nx, ny); } } return out; };
  // everything touching the edge of the box is the mainland wall
  for (let x = x0; x <= x1; x++) { push(x, y0); push(x, y1); }
  for (let y = y0; y <= y1; y++) { push(x0, y); push(x1, y); }
  flood();
  // whatever solid is left is floating
  for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) {
    if (seen[(y - y0) * w + (x - x0)] || !solid(x, y)) continue;
    push(x, y);
    islandCache.list.push({ cells: flood() });
  }
  return islandCache.list;
}

function nearestGem(x, y) {
  // search outward ring by ring (up to 80 blocks away)
  const cx = Math.floor(x), cy = Math.floor(y);
  let best = -1, bd = Infinity;
  for (let r = 0; r <= 80; r++) {
    for (let dx = -r; dx <= r; dx++) {
      const edge = Math.abs(dx) === r;
      for (let dy = -r; dy <= r; dy += edge ? 1 : 2 * r || 1) {
        const k = key(cx + dx, cy + dy);
        if (cellType(k) !== GEM) continue;
        const d = (cx + dx + 0.5 - x) ** 2 + (cy + dy + 0.5 - y) ** 2;
        if (d < bd) { bd = d; best = k; }
      }
    }
    if (best >= 0 && r * r > bd) break;              // nothing closer can be further out
  }
  return best;
}

function seek(b, hit) {
  // a block in the 180° half in front of the ball, never one it just hit. Blocks far from the middle
  // of the open area count as farther away, so it clears the edge evenly instead of digging tunnels.
  if (orb.dirty) updateOrb(0);
  let best = -1, bd = Infinity;
  for (const j of frontier) {
    if (j === hit || j === b.last[1]) continue;
    if (b.k === 'pink' && !inBox(j)) continue;          // pink only goes for blocks inside its box
    const jx = kx(j) + 0.5, jy = ky(j) + 0.5, dx = jx - b.x, dy = jy - b.y;
    const d = Math.hypot(dx, dy);
    if (dx * b.vx + dy * b.vy <= 0.05 * d) continue;
    const score = d + Math.hypot(jx - orb.cx, jy - orb.cy);
    if (score < bd) { bd = score; best = j; }
  }
  if (best < 0) return;
  const dx = kx(best) + 0.5 - b.x, dy = ky(best) + 0.5 - b.y, l = Math.hypot(dx, dy);
  b.vx = dx / l; b.vy = dy / l;
}

function poisonAround(i) {
  const x = kx(i), y = ky(i), r = poisonRange(), until = T + 5, dps = poisonDps();
  for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) {
    const j = key(xx, yy);
    if ((xx - x) ** 2 + (yy - y) ** 2 > r * r + 0.5 || cellType(j) !== BLOCK) continue;   // round area, radius 3
    const p = poison.get(j);
    if (p) { p.until = until; p.dps = dps; }
    else poison.set(j, { until, dps, next: T + 1, flash: -9 });
  }
}

function nearestFrontier(x, y, maxD) {
  let best = -1, bd = maxD * maxD;
  for (const j of frontier) {
    const dx = kx(j) + 0.5 - x, dy = ky(j) + 0.5 - y, dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = j; }
  }
  return best;
}

function updateOrb(dt) {
  if (orb.dirty && freeCount) {
    orb.cx = freeSum.x / freeCount; orb.cy = freeSum.y / freeCount;
    let s = 0, n = 0;
    for (const j of frontier) { s += Math.hypot(kx(j) + 0.5 - orb.cx, ky(j) + 0.5 - orb.cy); n++; }
    orb.r = Math.max(0.6, (n ? s / n : 1) - 0.9);   // as close to the unbroken edge as possible
    orb.dirty = false;
  }
  orb.ang += (2.5 / Math.max(orb.r, 0.6)) * dt;
}

function updateBall(b, dt) {
  if (DEF[b.k].gmul) {
    const s = stat(b.k);
    let ox = orb.cx + Math.cos(orb.ang) * orb.r, oy = orb.cy + Math.sin(orb.ang) * orb.r;
    if (b.k === 'magnet') {
      // re-check the nearest purple pixel twice a second; with none nearby it circles like a Gravity Ball
      if (b.gem == null || T >= (b.gemT || 0) || cellType(b.gem) !== GEM) { b.gem = nearestGem(b.x, b.y); b.gemT = T + 0.5; }
      if (b.gem >= 0) { ox = kx(b.gem) + 0.5; oy = ky(b.gem) + 0.5; }
    }
    if (b.k === 'island') {
      // the nearest island block, whatever its size
      let best = null, bs = Infinity;
      for (const isl of findIslands()) {
        for (const c of isl.cells) {
          const d = Math.hypot(kx(c) + 0.5 - b.x, ky(c) + 0.5 - b.y);
          if (d < bs) { bs = d; best = c; }
        }
      }
      if (best != null) { ox = kx(best) + 0.5; oy = ky(best) + 0.5; }   // no islands: circles like a Gravity Ball
    }
    if (b.k === 'buddy' || b.k === 'cloud') {
      // pulled toward every other ball; closer balls pull harder
      let ax = 0, ay = 0;
      for (const o of balls) {
        if (o === b || o.dead || (b.k === 'cloud' && o.k !== 'cloud')) continue;   // cloud balls feel every cloud ball, so clouds drift together
        const ex = o.x - b.x, ey = o.y - b.y, d = Math.hypot(ex, ey);
        if (d < 1e-3) continue;
        // cloud: same pull at every distance, but none from balls already close by (keeps 1–2 blocks of room); buddy: closer pulls harder
        const w = b.k === 'cloud' ? (d < 1.5 ? 0 : 1) : 1 / Math.max(d, 1) ** 2;
        ax += ex / d * w; ay += ey / d * w;
      }
      if (ax || ay) { ox = b.x + ax; oy = b.y + ay; }   // with no other balls it circles like a Gravity Ball
    }
    const dx = ox - b.x, dy = oy - b.y, l = Math.hypot(dx, dy) || 1, g = gravity(b.k);
    let vx = b.vx * b.cs + dx / l * g * dt, vy = b.vy * b.cs + dy / l * g * dt;
    const sp = Math.hypot(vx, vy) || 1;
    b.vx = vx / sp; b.vy = vy / sp; b.cs = Math.min(s.max, Math.max(s.min, sp));
  }
  if (b.k === 'shooter' && !b.shot) {
    // only the ring of four cannons turns (the ball itself doesn't), lining one cannon up with the nearest block in front
    let tgt = -1, bd = Infinity;
    for (const j of frontier) {
      const ex = kx(j) + 0.5 - b.x, ey = ky(j) + 0.5 - b.y, dd = ex * ex + ey * ey;
      if (ex * b.vx + ey * b.vy < 0) continue;              // only blocks it is facing
      if (dd < bd) { bd = dd; tgt = j; }
    }
    if (tgt < 0) tgt = nearestFrontier(b.x, b.y, 200);
    b.rot = b.rot || 0; b.cool = (b.cool || 0) - dt;
    if (tgt >= 0) {
      const want = Math.atan2(ky(tgt) + 0.5 - b.y, kx(tgt) + 0.5 - b.x);
      let diff = ((want - b.rot) % (Math.PI / 2) + Math.PI * 2.25) % (Math.PI / 2) - Math.PI / 4;   // to the nearest of 4 cannons
      const turn = 6 * dt;
      b.rot += Math.max(-turn, Math.min(turn, diff));
      if (Math.abs(diff) < 0.08 && b.cool <= 0 && miniCount + 4 <= MAX_MINIS) {
        b.cool = 1 / fireRate();
        for (let q = 0; q < 4; q++) {                  // every cannon fires at once
          const a = b.rot + q * Math.PI / 2;
          spawnBall('shooter', b.x + Math.cos(a) * BR, b.y + Math.sin(a) * BR, Math.cos(a), Math.sin(a), 1, { oneUse: true, shot: true });
        }
      }
    }
  }
  if (b.k === 'builder') {
    b.st += dt;
    if (b.st >= buildEvery()) { b.st = 0; buildBlockNear(b); }
  }
  if (b.k === 'yellow') {
    b.st += dt;
    const iv = strikeInterval();
    while (b.st >= iv) {
      b.st -= iv;
      const j = nearestFrontier(b.x, b.y, 200);
      if (j >= 0) {
        bolts.push({ x1: b.x, y1: b.y, x2: kx(j) + 0.5, y2: ky(j) + 0.5, t: 0.18 });
        damage(j, strikeDmg());
      }
    }
  }
  const travel = ballSpeed(b) * dt;
  const steps = Math.max(1, Math.ceil(travel / 0.08)), st = travel / steps;
  for (let s = 0; s < steps && !b.dead; s++) {
    moveAxis(b, 0, b.vx * st);
    if (b.dead) break;
    moveAxis(b, 1, b.vy * st);
  }
  // safety: if a ball ever ends up inside a block, pop it back into open space
  const cx = Math.floor(b.x), cy = Math.floor(b.y);
  if (solidAt(cx, cy) !== -1) { const p = nearestFreeCenter(b.x, b.y); b.x = p.x; b.y = p.y; }
}

function nearestFreeCenter(x, y) {
  let best = { x: 0.5, y: 0.5 }, bd = Infinity;
  for (let yy = freeBounds.y0; yy <= freeBounds.y1; yy++) for (let xx = freeBounds.x0; xx <= freeBounds.x1; xx++) {
    if (cellType(key(xx, yy)) !== FREE) continue;
    const d = (xx + .5 - x) ** 2 + (yy + .5 - y) ** 2;
    if (d < bd) { bd = d; best = { x: xx + .5, y: yy + .5 }; }
  }
  return best;
}

// A cloud's balls are solid: when two touch they bounce off each other like real balls and never overlap.
// None may drift more than 2 blocks from the cloud's middle.
const CLOUD_RADIUS = 2;
function keepCloudsTight(dt) {
  // clouds that touch merge into one: any two balls from different clouds within 1 block
  const cl = balls.filter(b => b.k === 'cloud' && !b.dead);
  for (let i = 0; i < cl.length; i++) for (let j = i + 1; j < cl.length; j++) {
    const a = cl[i], c = cl[j];
    if (a.grp === c.grp || Math.abs(a.x - c.x) > 1 || Math.abs(a.y - c.y) > 1 || Math.hypot(a.x - c.x, a.y - c.y) > 1) continue;
    const from = c.grp, to = a.grp;
    for (const o of cl) if (o.grp === from) o.grp = to;
  }
  const groups = new Map();
  for (const b of balls) if (b.k === 'cloud' && !b.dead) { const g = groups.get(b.grp); if (g) g.push(b); else groups.set(b.grp, [b]); }
  const tryMove = (b, nx, ny) => { if (solidAt(Math.floor(nx), Math.floor(ny)) === -1) { b.x = nx; b.y = ny; } };
  const touch = BR * 2, lo = stat('cloud').min, hi = stat('cloud').max;
  for (const g of groups.values()) {
    if (g.length < 2) continue;
    for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
      const a = g[i], c = g[j];
      let nx = c.x - a.x, ny = c.y - a.y, d = Math.hypot(nx, ny);
      if (d >= touch) continue;
      if (d < 1e-6) { nx = 1; ny = 0; d = 1e-6; } else { nx /= d; ny /= d; }
      // equal-mass bounce: swap the parts of their velocities along the line between them
      const avx = a.vx * a.cs, avy = a.vy * a.cs, cvx = c.vx * c.cs, cvy = c.vy * c.cs;
      const rel = (cvx - avx) * nx + (cvy - avy) * ny;
      if (rel < 0) {
        const ax2 = avx + rel * nx, ay2 = avy + rel * ny, cx2 = cvx - rel * nx, cy2 = cvy - rel * ny;
        const sa = Math.hypot(ax2, ay2) || 1, sc = Math.hypot(cx2, cy2) || 1;
        a.vx = ax2 / sa; a.vy = ay2 / sa; a.cs = Math.min(hi, Math.max(lo, sa));
        c.vx = cx2 / sc; c.vy = cy2 / sc; c.cs = Math.min(hi, Math.max(lo, sc));
      }
      // solids can't overlap: set them back to just touching
      const over = (touch - d) / 2;
      tryMove(a, a.x - nx * over, a.y - ny * over);
      tryMove(c, c.x + nx * over, c.y + ny * over);
    }
    // pull stragglers back in
    let mx = 0, my = 0; for (const b of g) { mx += b.x; my += b.y; } mx /= g.length; my /= g.length;
    for (const b of g) {
      const dx = b.x - mx, dy = b.y - my, d = Math.hypot(dx, dy);
      const lim = CLOUD_RADIUS * Math.sqrt(g.length / 10);   // bigger merged clouds get more room
      if (d > lim) tryMove(b, mx + dx / d * lim, my + dy / d * lim);
    }
  }
}

function update(dt) {
  T += dt;
  updateOrb(dt);
  for (const [j, p] of poison) {
    if (T > p.until || cellType(j) !== BLOCK) { poison.delete(j); continue; }
    if (T >= p.next) { p.next += 1; p.flash = T; damage(j, p.dps); }   // one slow tick a second
  }
  for (const b of balls) updateBall(b, dt);
  keepCloudsTight(dt);
  if (balls.some(b => b.dead)) { balls = balls.filter(b => !b.dead); miniCount = 0; for (const b of balls) if (b.oneUse) miniCount++; }
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }
  fx = fx.filter(p => p.t > 0);
  for (const b of bolts) b.t -= dt;
  bolts = bolts.filter(b => b.t > 0);
  for (const t of texts) { t.y -= dt * 0.8; t.t -= dt; }
  texts = texts.filter(t => t.t > 0);
}

// ---------------------------------------------------------------- rendering
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { x: 0.5, y: 0.5, s: 40, init: false };
const TOP = 56, BOTTOM = 124;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize);

function camTarget() {
  const x0 = freeBounds.x0 - REVEAL - 1, x1 = freeBounds.x1 + REVEAL + 2;
  const y0 = freeBounds.y0 - REVEAL - 1, y1 = freeBounds.y1 + REVEAL + 2;
  const vw = Math.max(x1 - x0, 11), vh = Math.max(y1 - y0, 11);
  const ph = Math.max(100, H - TOP - BOTTOM);
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, s: Math.min(W / vw, ph / vh) };
}

const toScreen = (wx, wy) => [(wx - cam.x) * cam.s + W / 2, (wy - cam.y) * cam.s + TOP + (H - TOP - BOTTOM) / 2];
const toWorld = (sx, sy) => [(sx - W / 2) / cam.s + cam.x, (sy - TOP - (H - TOP - BOTTOM) / 2) / cam.s + cam.y];

const shadeCache = new Map();
function shade(hex, f) {
  const key = hex + f; let v = shadeCache.get(key);
  if (!v) {
    const n = parseInt(hex.slice(1), 16);
    v = `rgb(${((n >> 16) & 255) * f | 0},${((n >> 8) & 255) * f | 0},${(n & 255) * f | 0})`;
    shadeCache.set(key, v);
  }

}
const DIST_SHADE = [1, 1, 0.6, 0.3];

function draw() {
  const t = camTarget();
  if (!cam.init) { Object.assign(cam, t); cam.init = true; }
  const k = 0.08;
  if (!cam.manual) { cam.x += (t.x - cam.x) * k; cam.y += (t.y - cam.y) * k; cam.s += (t.s - cam.s) * k; }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const [wx0, wy0] = toWorld(0, 0), [wx1, wy1] = toWorld(W, H);
  const gx0 = Math.floor(wx0), gy0 = Math.floor(wy0), gx1 = Math.ceil(wx1), gy1 = Math.ceil(wy1);
  const s = cam.s, pulse = 0.55 + 0.45 * Math.sin(T * 3);
  const area = (gx1 - gx0 + 1) * (gy1 - gy0 + 1);

  const drawCell = (x, y, i, d, ty) => {
    const [sx, sy] = toScreen(x, y);
    if (ty === FREE) { ctx.fillStyle = FREE_COLOR; ctx.fillRect(sx, sy, s + 0.6, s + 0.6); return; }
    if (ty === GEM) {
      const f = d <= REVEAL ? DIST_SHADE[d] : 0.22;
      ctx.fillStyle = shade('#b45cff', Math.min(1, f * (0.75 + 0.25 * pulse)));
      if (s > 2) { ctx.shadowColor = '#a640ff'; ctx.shadowBlur = s * 0.6 * pulse; }
      ctx.fillRect(sx, sy, Math.max(s + 0.6, 1.5), Math.max(s + 0.6, 1.5));
      ctx.shadowBlur = 0;
      return;
    }
    if (d > REVEAL) return;                           // out of reach: black
    const tr = tierOf(cellHp(i));
    ctx.fillStyle = shade(tr.c, DIST_SHADE[d]);
    ctx.fillRect(sx, sy, s + 0.6, s + 0.6);
    if (tr.hp === 100 && s > 4) {                     // stone texture so gray reads differently from dim white
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(sx + s * 0.18, sy + s * 0.18, s * 0.64, s * 0.64);
    }
    const pz = poison.get(i);
    if (pz) {                                         // faint tint while poisoned, a bright green pulse on each tick
      const a = 0.12 + 0.55 * Math.max(0, 1 - (T - pz.flash) / 0.6);
      ctx.fillStyle = `rgba(80,255,60,${a})`; ctx.fillRect(sx, sy, s + 0.6, s + 0.6);
    }
  };

  if (area <= 60000) {
    // close up: every visible cell, including the glowing purple pixels hidden in the dark
    for (let y = gy0; y <= gy1; y++) for (let x = gx0; x <= gx1; x++) {
      const i = key(x, y);
      drawCell(x, y, i, cellDist(i), cellType(i));
    }
  } else {
    // zoomed far out: only the open space and the blocks around it
    for (const [i, d] of distMap) {
      const x = kx(i), y = ky(i);
      if (x < gx0 || x > gx1 || y < gy0 || y > gy1) continue;
      drawCell(x, y, i, d, cellType(i));
    }
  }

  // lightning
  ctx.lineCap = 'round';
  for (const b of bolts) {
    const [x1, y1] = toScreen(b.x1, b.y1), [x2, y2] = toScreen(b.x2, b.y2);
    ctx.strokeStyle = `rgba(255,240,120,${b.t / 0.18})`; ctx.lineWidth = Math.max(1.5, s * 0.07);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    for (let q = 1; q < 6; q++) {
      const f = q / 6, j = (Math.random() - .5) * s * 0.5;
      ctx.lineTo(x1 + (x2 - x1) * f + j, y1 + (y2 - y1) * f - j);
    }
    ctx.lineTo(x2, y2); ctx.stroke();
  }
  // particles
  for (const p of fx) {
    const [sx, sy] = toScreen(p.x, p.y); ctx.globalAlpha = p.t / 0.5;
    ctx.fillStyle = p.c; ctx.fillRect(sx - s * .08, sy - s * .08, s * .16, s * .16);
  }
  ctx.globalAlpha = 1;
  // balls
  for (const b of balls) drawBallOf(b);
  // aim
  if (aim) drawAim();
  // floating text
  ctx.textAlign = 'center'; ctx.font = `800 ${Math.max(12, s * 0.45)}px system-ui`;
  for (const t of texts) {
    const [sx, sy] = toScreen(t.x, t.y); ctx.globalAlpha = Math.min(1, t.t);
    ctx.fillStyle = t.c; ctx.fillText(t.s, sx, sy);
  }
  ctx.globalAlpha = 1;
}

function lighten(hex, f) {
  const n = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * f);
  return `rgb(${m((n >> 16) & 255)},${m((n >> 8) & 255)},${m(n & 255)})`;
}
function drawBallOf(b) {
  let col = DEF[b.k].color, scale = 1;
  if (b.k === 'white') scale = b.oneUse ? 0.5 : 1.5;         // big Splitter, small splits
  else if (b.k === 'chain') { const g = b.gen || 0; scale = Math.max(0.25, Math.pow(0.78, g)); col = lighten(col, Math.min(0.8, g * 0.16)); }
  else if (b.oneUse) scale = 0.5;

  if (b.k === 'shooter') scale = 1.3;
  drawBall(b.x, b.y, col, scale);
  if (b.k === 'shooter') drawCannons(b.x, b.y, b.rot || 0);
  drawSym(b.k, b.x, b.y, scale);
}
function drawCannons(x, y, rot) {
  // a turning ring with four cannon arms, on top of a ball body that stays still
  const [sx, sy] = toScreen(x, y), r = Math.max(4, BR * cam.s * 1.3);
  ctx.save(); ctx.translate(sx, sy);
  ctx.strokeStyle = '#4a5360'; ctx.lineWidth = Math.max(1.5, r * 0.14);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.stroke();
  ctx.rotate(rot); ctx.fillStyle = '#7d8896'; ctx.strokeStyle = '#2a3038'; ctx.lineWidth = 1;
  for (let q = 0; q < 4; q++) {
    ctx.fillRect(r * 0.55, -r * 0.24, r * 1.0, r * 0.48); ctx.strokeRect(r * 0.55, -r * 0.24, r * 1.0, r * 0.48);
    ctx.fillStyle = '#2a3038'; ctx.fillRect(r * 1.42, -r * 0.13, r * 0.13, r * 0.26); ctx.fillStyle = '#7d8896';   // muzzle
    ctx.rotate(Math.PI / 2);

  ctx.fillStyle = '#2a3038'; ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();

}
function drawSym(k, x, y, scale) {
  const r = BR * cam.s * scale;
  if (r < 6 || !DEF[k].sym) return;
  const [sx, sy] = toScreen(x, y);
  ctx.save(); ctx.translate(sx, sy);
  if (k === 'builder') {                                // a little brick
    ctx.fillStyle = '#fff'; ctx.fillRect(-r * 0.36, -r * 0.36, r * 0.72, r * 0.72);
    ctx.fillStyle = '#b07a45'; ctx.fillRect(-r * 0.36, -r * 0.03, r * 0.72, r * 0.06); ctx.fillRect(-r * 0.03, -r * 0.36, r * 0.06, r * 0.33);
  } else if (k === 'cloud') {                                  // little cloud
    ctx.fillStyle = '#7a8ca3';
    for (const [cx, cy, cr] of [[-0.25, 0.08, 0.24], [0.05, -0.12, 0.3], [0.3, 0.08, 0.22], [0.02, 0.14, 0.24]]) { ctx.beginPath(); ctx.arc(cx * r, cy * r, cr * r, 0, Math.PI * 2); ctx.fill(); }

    ctx.fillStyle = '#0b3b2a'; ctx.beginPath();

  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawAim() {
  const a = aimInfo();
  drawBall(aim.ox, aim.oy, DEF[selected].color, selected === 'white' ? 1.5 : 1);
  drawSym(selected, aim.ox, aim.oy, selected === 'white' ? 1.5 : 1);
  if (selected === 'shooter') drawCannons(aim.ox, aim.oy, 0);
  if (!a) return;
  const [sx, sy] = toScreen(aim.ox, aim.oy);
  const len = 30 + a.f * 110;
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + a.dx * len, sy + a.dy * len); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#fff'; ctx.font = '700 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(fmt1(a.speed) + ' b/s', sx + a.dx * (len + 18), sy + a.dy * (len + 18) + 4);
}

// ---------------------------------------------------------------- input
let aim = null;
function aimInfo() {
  let dx = aim.sx - aim.cx, dy = aim.sy - aim.cy;   // pull back, release to shoot the other way
  const l = Math.hypot(dx, dy);
  if (l < 12) return null;
  dx /= l; dy /= l;
  if (selected === 'blue') {                         // directional ball: snap to nearest straight direction
    if (Math.abs(dx) >= Math.abs(dy)) { dx = Math.sign(dx); dy = 0; } else { dy = Math.sign(dy); dx = 0; }
  }
  const f = Math.min(1, l / (Math.min(W, H) * 0.32));
  const s = stat(selected);
  return { dx, dy, f, speed: s.min + (s.max - s.min) * f };
}

// One finger on the dark green space with a ball in hand: aim and launch.
// One finger anywhere else: drag to move. Two fingers: pinch to zoom and move. Mouse wheel zooms.
const ZOOM_MAX = 160;                              // pixels per block when zoomed all the way in
const gp = new Map();
let pan = null, pinch = null;
function setManual() { cam.manual = true; $('centerBtn').hidden = false; }
function zoomAt(sx, sy, ns) {
  ns = Math.max(1e-6, Math.min(ZOOM_MAX, ns));     // no limit on zooming out
  const [wx, wy] = toWorld(sx, sy);
  cam.s = ns;
  cam.x = wx - (sx - W / 2) / ns;
  cam.y = wy - (sy - TOP - (H - TOP - BOTTOM) / 2) / ns;
  setManual();
}
function startPan(x, y) { pan = { x, y, cx: cam.x, cy: cam.y }; }
function startPinch() {
  const [a, b] = [...gp.values()];
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  gp.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gp.size >= 2) { aim = null; pan = null; startPinch(); return; }
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  if (inv[selected] > 0 && solidAt(Math.floor(wx), Math.floor(wy)) === -1) {
    aim = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY, ox: wx, oy: wy };
  } else startPan(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', e => {
  if (!gp.has(e.pointerId)) return;
  gp.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gp.size >= 2 && pinch) {
    const [a, b] = [...gp.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoomAt(pinch.mx, pinch.my, cam.s * d / pinch.d);
    cam.x -= (mx - pinch.mx) / cam.s; cam.y -= (my - pinch.my) / cam.s;
    pinch = { d, mx, my };
    return;
  }
  if (aim && e.pointerId === aim.id) { aim.cx = e.clientX; aim.cy = e.clientY; return; }
  if (pan) {
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (cam.manual || Math.hypot(dx, dy) > 4) { cam.x = pan.cx - dx / cam.s; cam.y = pan.cy - dy / cam.s; setManual(); }

});
function pointerEnd(e, cancel) {
  if (!gp.has(e.pointerId)) return;
  gp.delete(e.pointerId);

    aim.cx = e.clientX; aim.cy = e.clientY;
    const a = cancel ? null : aimInfo();
    if (a && inv[selected] > 0) {
      inv[selected]--;
      if (selected === 'cloud') {                       // one Cloud Ball = a cloud of 10
        const grp = Math.random(), base = Math.atan2(a.dy, a.dx);
        for (let q = 0; q < 10; q++) {
          const ang = base + (q - 4.5) * 0.12;
          spawnBall('cloud', aim.ox + (Math.random() - .5) * 0.3, aim.oy + (Math.random() - .5) * 0.3, Math.cos(ang), Math.sin(ang), a.f, { grp });
        }
      } else spawnBall(selected, aim.ox, aim.oy, a.dx, a.dy, a.f);
      everLaunched = true; dirtyUI = true;
    }
    aim = null;
  }

  if (gp.size === 1) { const [q] = [...gp.values()]; startPan(q.x, q.y); }   // keep moving with the finger left down

cv.addEventListener('pointerup', e => pointerEnd(e, false));
cv.addEventListener('pointercancel', e => pointerEnd(e, true));
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, cam.s * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
document.getElementById('centerBtn').addEventListener('click', () => { cam.manual = false; document.getElementById('centerBtn').hidden = true; });

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
let dirtyUI = true;
const price = k => Math.round(DEF[k].cost * Math.pow(1.5, bought[k]));
const fmt = v => {
  v = Math.floor(v);
  if (v < 10000) return String(v);
  const u = ['K', 'M', 'B', 'T']; let i = -1;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return v.toFixed(v < 100 ? 1 : 0) + u[i];
};

const symHtml = k => DEF[k].sym ? `<span class="sym${k === 'buddy' || k === 'island' || k === 'shooter' || k === 'cloud' ? ' dark' : ''}">${DEF[k].sym}</span>` : '';

function buildBar() {
  const bar = $('bar'); bar.innerHTML = '';
  for (const k of ORDER) {
    const d = DEF[k], c = document.createElement('div');
    c.className = 'card' + (k === selected ? ' sel' : '') + (unlocked[k] ? '' : ' locked');
    c.innerHTML = `<div class="ball" style="background:${d.color};box-shadow:0 0 8px ${d.color}">${symHtml(k)}</div>
      <div class="name">${d.short}</div>
      <div class="hand">${unlocked[k] ? `in hand: <b>${inv[k]}</b>` : 'locked'}</div>
      ${unlocked[k] ? `<button class="buy" data-k="${k}"><span class="dia s"></span>${fmt(price(k))}</button>`
                    : `<button class="buy" disabled><span class="dia p s"></span>${d.unlock}</button>`}`;
    c.addEventListener('click', ev => {
      if (!unlocked[k]) { tsel = { k, key: null }; tv.init = false; openTree(); return; }
      if (ev.target.closest('.buy')) buy(k);
      selected = k; dirtyUI = true;
    });
    bar.appendChild(c);
  }
}

function buy(k) {
  const p = price(k);
  if (money < p) return;
  money -= p; bought[k]++; inv[k]++; dirtyUI = true;
}

function refreshAffordable() {
  for (const b of document.querySelectorAll('.buy[data-k]')) {
    const ok = money >= price(b.dataset.k);
    b.classList.toggle('ok', ok); b.disabled = !ok;
  }
}

function setHint() {
  const h = $('hint');
  if (everLaunched && balls.length) { h.style.display = 'none'; return; }
  h.style.display = '';
  if (inv[selected] > 0) h.textContent = 'Drag back on the dark green space and release to launch. Drag elsewhere to move, pinch to zoom.';
  else if (Object.values(inv).some(v => v > 0)) h.textContent = 'Select a ball you have in hand';
  else h.textContent = 'Buy a ball below';
}
function flashHint() { setHint(); const h = $('hint'); h.style.display = ''; h.animate([{ opacity: .3 }, { opacity: 1 }], 300); }

// Skill tree: the Piercing Ball is the root at the bottom; each ball grows the next one above it,
// and its upgrades branch off to the sides.
const TREE = ['magnet', ...ORDER.filter(k => k !== 'magnet')];   // bottom to top; Magnet is its own root
const TW = 640, ROW = 165, TTOP = 80, TH = TTOP + (TREE.length - 1) * ROW + 100;
const BRANCH = [[-120, -10], [120, -10], [-215, -62], [215, -62]];
const ballPos = n => ({ x: TW / 2, y: TTOP + (TREE.length - 1 - n) * ROW });
const reqOk = k => !DEF[k].req || unlocked[DEF[k].req];
const tv = { x: 0, y: 0, s: 1, init: false };
let tsel = { k: 'orange', key: null }, tDragged = false;

function openTree() {
  $('tree').classList.add('open');
  buildTree();
  if (!tv.init) {                       // first open: fit the width and look at the newest branch
    const v = $('treeView'), w = v.clientWidth, h = v.clientHeight;
    tv.s = Math.max(0.5, Math.min(1.1, w / TW));
    const n = Math.min(TREE.length - 1, TREE.filter(k => unlocked[k]).length);
    tv.x = (w - TW * tv.s) / 2;
    tv.y = h * 0.55 - ballPos(n).y * tv.s;
    tv.init = true;
  }
  clampTree(); applyTree();
}
$('treeBtn').addEventListener('click', openTree);
$('treeClose').addEventListener('click', () => $('tree').classList.remove('open'));

function applyTree() { $('treeWorld').style.transform = `translate(${tv.x}px,${tv.y}px) scale(${tv.s})`; }
function clampTree() {
  const v = $('treeView'), w = v.clientWidth, h = v.clientHeight, m = 120;
  tv.x = Math.min(w - m, Math.max(m - TW * tv.s, tv.x));
  tv.y = Math.min(h - m, Math.max(m - TH * tv.s, tv.y));
}

function upState(k, key, max) {
  const lv = up[k][key];
  return { lv, max, cost: lv >= max ? 0 : nodeCost(max, lv) };
}

function buildTree() {
  $('treePurple').textContent = purple;
  let lines = '', nodes = '';
  TREE.forEach((k, n) => {
    const d = DEF[k], p = ballPos(n);
    if (d.req) {                                     // trunk link from the ball it needs
      const q = ballPos(TREE.indexOf(d.req)), on = unlocked[k];
      lines += `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${on ? '#a64dff' : '#2e2140'}" stroke-width="${on ? 8 : 6}" stroke-linecap="round"/>`;
    }
    const can = !unlocked[k] && reqOk(k) && purple >= d.unlock;
    nodes += `<div class="tn ball${unlocked[k] ? '' : ' lock'}${can ? ' can' : ''}${tsel.k === k && !tsel.key ? ' sel' : ''}" data-k="${k}" style="left:${p.x}px;top:${p.y}px">
      <div class="o" style="${unlocked[k] ? `border-color:${d.color};box-shadow:0 0 18px ${d.color}66` : ''}"><i style="background:${d.color}">${symHtml(k)}</i></div>
      <div class="nm">${d.short}</div></div>`;
    NODES[k].forEach(([key, label, max], j) => {
      const o = BRANCH[j], ux = p.x + o[0], uy = p.y + o[1], st = upState(k, key, max);
      lines += `<line x1="${p.x}" y1="${p.y}" x2="${ux}" y2="${uy}" stroke="${st.lv ? '#a64dff' : '#2e2140'}" stroke-width="4" stroke-linecap="round"/>`;
      const cls = !unlocked[k] ? ' lock' : st.lv >= max ? ' max got' : st.lv ? ' got' : '';
      const canUp = unlocked[k] && st.lv < max && purple >= st.cost;
      nodes += `<div class="tn up${cls}${canUp ? ' can' : ''}${tsel.k === k && tsel.key === key ? ' sel' : ''}" data-k="${k}" data-key="${key}" style="left:${ux}px;top:${uy}px">
        <div class="o">${st.lv}/${max}</div><div class="nm">${label}</div></div>`;
    });
  });
  const svg = $('treeLinks');
  svg.setAttribute('width', TW); svg.setAttribute('height', TH); svg.innerHTML = lines;
  const box = $('treeNodes'); box.innerHTML = nodes;
  box.querySelectorAll('.tn').forEach(el => el.addEventListener('click', () => {
    if (tDragged) return;
    tsel = { k: el.dataset.k, key: el.dataset.key || null }; buildTree();
  }));
  renderInfo();
}

function renderInfo() {
  const { k, key } = tsel, d = DEF[k], box = $('nodeInfo');
  let title, desc, btn;
  if (!key) {
    title = d.name;
    desc = `${fmt1(d.dmg)} dmg · ${d.min === d.max ? d.min : d.min + '–' + d.max} b/s. ${d.desc}`;
    if (unlocked[k]) btn = `<button disabled>Unlocked</button>`;
    else if (!reqOk(k)) btn = `<button disabled>Needs ${DEF[d.req].short}</button>`;
    else btn = `<button id="infoBuy" ${purple >= d.unlock ? '' : 'disabled'}>Unlock <span class="dia p s"></span>${d.unlock}</button>`;
  } else {
    const node = NODES[k].find(nd => nd[0] === key), st = upState(k, key, node[2]);
    title = `${d.short}: ${node[1]} (${st.lv}/${st.max})`;
    desc = nodeValue(k, key, st.lv) + (st.lv < st.max ? ' → ' + nodeValue(k, key, st.lv + 1) : ' (max)');
    if (!unlocked[k]) btn = `<button disabled>Unlock ${d.short} first</button>`;
    else if (st.lv >= st.max) btn = `<button disabled>MAX</button>`;
    else btn = `<button id="infoBuy" ${purple >= st.cost ? '' : 'disabled'}>Buy <span class="dia p s"></span>${st.cost}</button>`;
  }
  box.innerHTML = `<div class="txt"><div class="t">${title}</div><div class="d">${desc}</div></div>${btn}`;
  const b = $('infoBuy'); if (b) b.addEventListener('click', buyNode);
}

function buyNode() {
  const { k, key } = tsel, d = DEF[k];
  if (!key) {
    if (unlocked[k] || !reqOk(k) || purple < d.unlock) return;
    purple -= d.unlock; unlocked[k] = true; inv[k]++; selected = k;
  } else {
    const node = NODES[k].find(nd => nd[0] === key), lv = up[k][key];
    if (!unlocked[k] || lv >= node[2]) return;
    const cost = nodeCost(node[2], lv); if (purple < cost) return;
    purple -= cost; up[k][key]++;
  }
  dirtyUI = true; buildTree(); save();
}

// drag to pan, pinch / wheel to zoom
(() => {
  const view = $('treeView'), pts = new Map();
  let start = null;
  const zoomAt = (cx, cy, ns) => {
    ns = Math.max(1e-6, Math.min(3, ns));   // zoom out as far as you like
    const r = view.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
    tv.x = px - (px - tv.x) * ns / tv.s; tv.y = py - (py - tv.y) * ns / tv.s; tv.s = ns;
    clampTree(); applyTree();
  };
  view.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { tDragged = false; start = { x: e.clientX, y: e.clientY, tx: tv.x, ty: tv.y }; }
  });
  view.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], d0 = Math.hypot(a.x - b.x, a.y - b.y);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const [c, d] = [...pts.values()], d1 = Math.hypot(c.x - d.x, c.y - d.y);
      if (d0 > 0) zoomAt((c.x + d.x) / 2, (c.y + d.y) / 2, tv.s * d1 / d0);
      tDragged = true; return;
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!tDragged && Math.hypot(dx, dy) > 6) { tDragged = true; view.classList.add('drag'); }
    if (tDragged) { tv.x = start.tx + dx; tv.y = start.ty + dy; clampTree(); applyTree(); }
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pts.size === 0) { start = null; view.classList.remove('drag'); setTimeout(() => { tDragged = false; }, 0); }
    else if (pts.size === 1) { const [a] = [...pts.values()]; start = { x: a.x, y: a.y, tx: tv.x, ty: tv.y }; }
  };
  view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
  view.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, tv.s * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  addEventListener('resize', () => { if ($('tree').classList.contains('open')) { clampTree(); applyTree(); } });
})();

// two-tap reset (pop-up confirm dialogs are not allowed everywhere)
// New board: a fresh 3×3 start, keeping balls, money, purple and upgrades
let boardArmed = 0;
$('boardBtn').addEventListener('click', () => {
  const b = $('boardBtn');
  const idle = '↺<span class="w"> New board</span>';
  if (Date.now() - boardArmed > 3000) { boardArmed = Date.now(); b.innerHTML = '<span class="w">Sure?</span>'; b.classList.add('arm');
    setTimeout(() => { b.innerHTML = idle; b.classList.remove('arm'); }, 3000); return; }
  boardArmed = 0; b.innerHTML = idle; b.classList.remove('arm');
  genWorld(); rebuildDerived(); worldVer++;
  poison = new Map(); fx = []; bolts = []; texts = [];
  balls = balls.filter(o => !o.oneUse);
  for (const o of balls) {                            // every ball goes back into the 3×3
    o.x = -1.5 + BR + Math.random() * (3 - 2 * BR); o.y = -1.5 + BR + Math.random() * (3 - 2 * BR);
    o.last = [-1, -1]; o.gem = null;
  }
  miniCount = 0;
  cam.init = false; cam.manual = false; $('centerBtn').hidden = true;
  save();
});

let resetArmed = 0;
$('resetBtn').addEventListener('click', () => {
  const b = $('resetBtn');
  if (Date.now() - resetArmed > 3000) { resetArmed = Date.now(); b.textContent = 'Tap again to erase'; b.classList.add('arm');
    setTimeout(() => { b.textContent = 'Reset all'; b.classList.remove('arm'); }, 3000); return; }
  resetArmed = 0; b.textContent = 'Reset all'; b.classList.remove('arm');
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  resetMeta(); genWorld(); rebuildDerived(); cam.init = false; cam.manual = false; $('centerBtn').hidden = true; dirtyUI = true; tv.init = false; tsel = { k: 'orange', key: null };
  $('tree').classList.remove('open');
});

// ---------------------------------------------------------------- save / load
const SAVE_KEY = 'pixelBreaker.v2', OLD_KEY = 'pixelBreaker.v1';
function save() {
  try {
    const cells = [];
    for (const [k, m] of mod) cells.push(kx(k), ky(k), m[0], Math.round(m[1] * 1000) / 1000);
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      seed, cells, money, purple, inv, bought, unlocked, up, selected, everLaunched,
      balls: balls.filter(b => !b.oneUse).map(b => ({ k: b.k, x: b.x, y: b.y, vx: b.vx, vy: b.vy, f: b.f, cs: b.cs, grp: b.grp })),
    }));
  } catch (e) {}
}
function loadMeta(s) {
  money = s.money; purple = s.purple; selected = DEF[s.selected] ? s.selected : 'orange'; everLaunched = !!s.everLaunched;
  if (s.unlocked?.nuke) {                           // the Nuke Ball was removed: give back the purple spent on it (once: new saves drop it)
    purple += 5;
    for (const key of ['dmg', 'spd']) for (let lv = 0; lv < (s.up?.nuke?.[key] || 0); lv++) purple += nodeCost(5, lv);
  }
  for (const k of ORDER) {
    inv[k] = s.inv?.[k] || 0; bought[k] = s.bought?.[k] || 0; unlocked[k] = k === 'orange' || !!s.unlocked?.[k];
    for (const n of NODES[k]) {
      const had = s.up?.[k]?.[n[0]] || 0;
      up[k][n[0]] = Math.min(had, n[2]);
      // Split Times used to go to 8 levels: give back the purple for levels above the new max
      if (k === 'chain' && n[0] === 'depth') for (let lv = n[2]; lv < had; lv++) purple += [1, 1, 1, 1, 2, 2, 3, 3][lv] || 0;
    }
  }
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.cells)) {
      seed = s.seed | 0; mod = new Map();
      for (let q = 0; q < s.cells.length; q += 4) mod.set(key(s.cells[q], s.cells[q + 1]), [s.cells[q + 2], s.cells[q + 3]]);
      loadMeta(s);
      balls = (s.balls || []).filter(b => DEF[b.k]).map(b => ({ ...b, last: [-1, -1], st: 0, grp: b.grp ?? (b.k === 'cloud' ? Math.random() : undefined) }));
      return true;
    }
    // older save from the fixed 81×81 grid: it becomes the middle of the endless grid
    const o = JSON.parse(localStorage.getItem(OLD_KEY));
    if (!o || typeof o.type !== 'string' || o.type.length !== 81 * 81) return false;
    seed = (Math.random() * 2 ** 31) | 0; mod = new Map();
    for (let q = 0; q < 81 * 81; q++) mod.set(key((q % 81) - 40, Math.floor(q / 81) - 40), [+o.type[q], o.hp[q]]);
    loadMeta(o);
    balls = (o.balls || []).filter(b => DEF[b.k]).map(b => ({ ...b, x: b.x - 40, y: b.y - 40, last: [-1, -1], st: 0 }));
    return true;
  } catch (e) { return false; }
}
setInterval(save, 4000);
addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ---------------------------------------------------------------- loop
resetMeta();
if (!load()) genWorld();
rebuildDerived();
resize();

let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  uiT += dt;
  if (dirtyUI) { buildBar(); dirtyUI = false; uiT = 1; }
  if (uiT > 0.1) {
    uiT = 0;
    $('money').textContent = fmt(money);
    $('purple').textContent = purple;
    const live = balls.filter(b => !b.oneUse).length;
    $('ballCount').textContent = live ? live + (live === 1 ? ' ball' : ' balls') : '';
    refreshAffordable(); setHint();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook
window.__pb = { get state() { return { islands: findIslands().map(i => i.cells.length), money, purple, balls: balls.length, frontier: frontier.size, freeCount, freeBounds, stored: mod.size, list: balls.map(b => [b.k, b.x, b.y]) }; },
  give(m, p) { money += m; purple += p; dirtyUI = true; } };
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Deep Time</title>
<style>
  /* Committed single-theme design: a dark geological-survey console.
     Every color is painted explicitly so the page holds on any host ground. */
  :root {
    --ground: #12151b;
    --panel: #1b212b;
    --panel-edge: #2a3340;
    --text: #e9e2d0;
    --muted: #8b93a0;
    --magma: #f2a13d;
    --magma-hot: #ff7b3d;
    --sea-hint: #3a6ea5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--panel-edge);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  header h1 span { color: var(--magma); }
  .readout {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-left: auto;
  }
  .readout .label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  #yearText {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.35rem;
    color: var(--magma);
    min-width: 11ch;
    text-align: right;
  }
  #rateText {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #0a0e14;
  }
  canvas#world {
    position: absolute;
    inset: 0;
    margin: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
  }
  #hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(18, 21, 27, 0.82);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 14px 22px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text);
    pointer-events: none;
    line-height: 1.6;
    transition: opacity 0.5s;
  }
  #hint b { color: var(--magma); }
  #hint.gone { opacity: 0; }

  #legend {
    position: absolute;
    right: 10px;
    top: 10px;
    background: rgba(18, 21, 27, 0.85);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.68rem;
    line-height: 1.9;
    pointer-events: none;
  }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend .swatch {
    width: 11px; height: 11px;
    border-radius: 2px;
    flex: none;
  }
  #legend .count {
    margin-left: auto;
    padding-left: 14px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  #events {
    position: absolute;
    left: 10px;
    bottom: 10px;
    max-width: 46ch;
    display: flex;
    flex-direction: column-reverse;
    gap: 3px;
    font-size: 0.7rem;
    color: var(--text);
    pointer-events: none;
  }
  #events > div {
    background: rgba(18, 21, 27, 0.85);
    border: 1px solid var(--panel-edge);
    border-radius: 5px;
    padding: 4px 9px;
  }
  #events .when {
    color: var(--magma);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.62rem;
    margin-right: 4px;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--panel);
    border-top: 1px solid var(--panel-edge);
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
  }
  .group .glabel {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 0 6px;
  }
  button {
    font: inherit;
    font-size: 0.8rem;
    color: var(--text);
    background: #232b37;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover { background: #2c3644; }
  button:focus-visible { outline: 2px solid var(--magma); outline-offset: 1px; }
  button.on {
    background: #3a4353;
    border-color: var(--magma);
    color: var(--magma);
  }
  button.max {
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  button.max.on {
    background: linear-gradient(180deg, #4a2d18, #3a2212);
    border-color: var(--magma-hot);
    color: var(--magma-hot);
  }
  .spacer { flex: 1; }

  @media (max-width: 640px) {
    #yearText { font-size: 1.05rem; }
    #legend { font-size: 0.6rem; padding: 6px 9px; }
    button { padding: 6px 9px; font-size: 0.72rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Deep <span>Time</span></h1>
  <div class="readout">
    <span class="label">World age</span>
    <span id="yearText">0 years</span>
    <span id="rateText"></span>
  </div>
</header>

<div id="stage">
  <canvas id="world"></canvas>
  <div id="hint">Paint some <b>grass</b> onto the ocean to raise land,<br>then press <b>⚡ MAX SPEED</b> and watch 4,000,000 years pass every second.</div>
  <div id="legend"></div>
  <div id="events"></div>
</div>

<footer>
  <div class="group">
    <span class="glabel">Tool</span>
    <button id="toolGrass" class="on">🌱 Grass</button>
    <button id="toolOcean">🌊 Ocean</button>
    <button id="brushBtn">Brush 3</button>
  </div>
  <div class="group">
    <span class="glabel">Time</span>
    <button id="pauseBtn" class="on">⏸ Pause</button>
    <button id="speed1">▶ 100 k yr/s</button>
    <button id="speed2">▶▶ 1 M yr/s</button>
    <button id="speedMax" class="max">⚡ MAX 4 M yr/s</button>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="randomBtn">🎲 Random world</button>
    <button id="clearBtn">🧹 Clear</button>
  </div>
</footer>

<script>
'use strict';

/* ---------------- world grid ---------------- */
const W = 192, H = 112;          // simulation cells; x wraps like a globe
const N = W * H;
const OCEAN = 0, GRASS = 1, DESERT = 2, SAVANNA = 3, FOREST = 4,
      JUNGLE = 5, TUNDRA = 6, MOUNTAIN = 7, SCORCHED = 8;

const BIOMES = [
  { id: GRASS,    name: 'Grassland', color: [106, 176, 76]  },
  { id: FOREST,   name: 'Forest',    color: [55, 118, 66]   },
  { id: JUNGLE,   name: 'Jungle',    color: [17, 130, 74]   },
  { id: SAVANNA,  name: 'Savanna',   color: [181, 172, 82]  },
  { id: DESERT,   name: 'Desert',    color: [226, 193, 110] },
  { id: TUNDRA,   name: 'Tundra',    color: [214, 224, 228] },
  { id: MOUNTAIN, name: 'Mountains', color: [138, 130, 118] },
  { id: SCORCHED, name: 'Scorched',  color: [66, 56, 47]    },
];
const COLOR = [];
COLOR[OCEAN] = [27, 66, 110];
for (const b of BIOMES) COLOR[b.id] = b.color;
const OCEAN_SHALLOW = [45, 100, 156];

let terrain = new Uint8Array(N);
let scratch = new Uint8Array(N);
let coastDist = new Uint8Array(N);   // land cells: steps to nearest ocean
let labels = new Int32Array(N);      // continent labels per geo step

let riftCool = new Uint8Array(N);    // freshly torn ocean resists healing shut
const unitGrid = new Int16Array(N).fill(-1); // which named continent owns each cell

let simYears = 0;
let lastGeoYear = 0;
const GEO_INTERVAL = 250000;         // one geologic step per 250,000 years
let speed = 0;                       // years per real second (0 = paused)
let rngState = 12345;
let lastRiftYear = 0, lastBreakYear = 0, lastWarYear = 0, lastMergeYear = 0;

function rand() { // xorshift32, deterministic per world
  rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5;
  return (rngState >>> 0) / 4294967296;
}
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) { // smooth value noise in [0,1]
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s),
        c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const wrapX = x => (x + W) % W;
const idx = (x, y) => y * W + wrapX(x);

function landNeighbors(x, y) {
  let n = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const ny = y + dy;
    if (ny < 0 || ny >= H) continue;
    if (terrain[idx(x + dx, ny)] !== OCEAN) n++;
  }
  return n;
}

/* ---------------- continent names & world events ---------------- */
const NAME_A = ['Gon', 'Pan', 'Lau', 'Ava', 'Bal', 'Zea', 'Kar', 'Mor', 'Tel',
                'Ur', 'Oro', 'Vel', 'Nym', 'Cas', 'Dra', 'Ith', 'Sar', 'Fen', 'Que', 'Bo'];
const NAME_B = ['da', 'ra', 'ti', 'lo', 've', 'na', 'mi', 'sa', 'ga', 'the', 'ru', 'no'];
const NAME_C = ['nia', 'dia', 'land', 'gard', 'thos', 'mar', 'ria', 'tica', 'via',
                'dor', 'stan', 'heim', 'ora'];
let namedConts = [];   // {name, cx, cy, size, color} — persists so names follow the drift
let ghostNames = [];   // recently lost names linger a while and can come back

function strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function nameColor(name) {           // stable saturated hue per continent name
  const hue = strHash(name) % 360, s = 0.72, l = 0.55;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + hue / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  };
  return [f(0), f(8), f(4)];
}

function makeName() {
  for (let t = 0; t < 12; t++) {
    let n = NAME_A[(rand() * NAME_A.length) | 0];
    if (rand() < 0.6) n += NAME_B[(rand() * NAME_B.length) | 0];
    n += NAME_C[(rand() * NAME_C.length) | 0];
    if (!namedConts.some(c => c.name === n) && !ghostNames.some(c => c.name === n)) return n;
  }
  return 'Terra ' + ((rand() * 90 + 10) | 0);
}
function contDist(ax, ay, bx, by) {
  let dx = Math.abs(ax - bx);
  if (dx > W / 2) dx = W - dx;
  return Math.hypot(dx, ay - by);
}
function nameAt(x, y) {
  let best = null, bs = 1e9;
  for (const c of namedConts) {          // big continents claim a wider radius
    const s = contDist(x, y, c.cx, c.cy) - 0.7 * Math.sqrt(c.size);
    if (s < bs) { bs = s; best = c; }
  }
  return best && bs < 28 ? best.name : 'a nameless land';
}
// a landmass big enough holds several continents at once: carve it into
// regions around deterministic farthest-point seeds so names stay put
function regionUnits(comps) {
  const units = [];
  for (const c of comps) {
    const k = c.size < 1200 ? 1 : Math.min(5, 2 + Math.floor((c.size - 1200) / 1600));
    if (k === 1) {
      units.push({ cx: c.cx, cy: c.cy, size: c.size, cid: c.id, sx: c.cx, sy: c.cy });
      continue;
    }
    const cells = [];
    for (let i = 0; i < N; i++) {
      if (terrain[i] !== OCEAN && labels[i] === c.id) cells.push(i);
    }
    const stride = Math.max(1, (cells.length / 260) | 0);
    const sample = [];
    for (let s = 0; s < cells.length; s += stride) sample.push(cells[s]);
    // first seed: the sampled cell nearest the centroid (deterministic),
    // then farthest-point picks — regions barely move between steps
    let seed0 = sample[0], bd0 = 1e9;
    for (const i of sample) {
      const d = contDist(i % W, (i / W) | 0, c.cx, c.cy);
      if (d < bd0) { bd0 = d; seed0 = i; }
    }
    const seeds = [seed0];
    while (seeds.length < k) {
      let best = sample[0], bd = -1;
      for (const i of sample) {
        let md = 1e9;
        for (const sd of seeds) md = Math.min(md, contDist(i % W, (i / W) | 0, sd % W, (sd / W) | 0));
        if (md > bd) { bd = md; best = i; }
      }
      seeds.push(best);
    }
    const agg = seeds.map(() => ({ sx: 0, sy: 0, n: 0 }));
    for (const i of sample) {
      const x = i % W, y = (i / W) | 0;
      let bi = 0, bd = 1e9;
      for (let s2 = 0; s2 < seeds.length; s2++) {
        const d = contDist(x, y, seeds[s2] % W, (seeds[s2] / W) | 0);
        if (d < bd) { bd = d; bi = s2; }
      }
      let ddx = x - seeds[bi] % W;
      if (ddx > W / 2) ddx -= W; else if (ddx < -W / 2) ddx += W;
      agg[bi].sx += ddx; agg[bi].sy += y; agg[bi].n++;
    }
    for (let s2 = 0; s2 < seeds.length; s2++) {
      const a = agg[s2];
      if (!a.n) continue;
      units.push({
        cx: ((seeds[s2] % W) + a.sx / a.n + W) % W,
        cy: a.sy / a.n,
        size: Math.round(c.size * a.n / sample.length),
        cid: c.id, sx: seeds[s2] % W, sy: (seeds[s2] / W) | 0,
      });
    }
  }
  return units;
}

// re-match names to continents by nearest previous centroid; splits mint new
// names, and a sizable name that vanishes into a neighbor logs a merger
function renameContinents() {
  const comps = regionUnits(labelContinents().filter(c => c.size >= 50))
    .sort((a, b) => b.size - a.size);
  const claimed = new Set(), next = [];
  const candidates = namedConts.concat(ghostNames);
  for (const c of comps) {
    // names are sticky: a generous match radius that grows with size, a score
    // that favors big established names, and lost names haunting the area
    // come back before any new name is coined — so renames stay rare
    let best = null, bs = 1e9;
    for (const o of candidates) {
      if (claimed.has(o)) continue;
      const d = contDist(c.cx, c.cy, o.cx, o.cy);
      if (d < 34 + 0.8 * Math.sqrt(Math.max(c.size, o.size))) {
        const score = d - 0.4 * Math.sqrt(o.size);
        if (score < bs) { bs = score; best = o; }
      }
    }
    if (best) claimed.add(best);
    const nm = best ? best.name : makeName();
    next.push({ name: nm, cx: c.cx, cy: c.cy, size: c.size, color: nameColor(nm) });
  }
  // unmatched names above a real size become ghosts for ~10 M years
  const nextGhosts = [];
  for (const o of namedConts) {
    if (!claimed.has(o) && o.size >= 150) nextGhosts.push({ ...o, ttl: 120 });
  }
  for (const g of ghostNames) {
    if (!claimed.has(g) && --g.ttl > 0) nextGhosts.push(g);
  }
  ghostNames = nextGhosts;
  // paint per-cell ownership so coasts and region borders can wear their color
  const byComp = new Map();
  comps.forEach((u, ui) => {
    if (!byComp.has(u.cid)) byComp.set(u.cid, []);
    byComp.get(u.cid).push(ui);
  });
  unitGrid.fill(-1);
  for (let i = 0; i < N; i++) {
    if (terrain[i] === OCEAN) continue;
    const us = byComp.get(labels[i]);
    if (!us) continue;
    if (us.length === 1) { unitGrid[i] = us[0]; continue; }
    const x = i % W, y = (i / W) | 0;
    let bi = us[0], bd = 1e9;
    for (const ui of us) {
      const d = contDist(x, y, comps[ui].sx, comps[ui].sy);
      if (d < bd) { bd = d; bi = ui; }
    }
    unitGrid[i] = bi;
  }
  for (const o of namedConts) {
    // only announce substantial mergers, and not more than one per while —
    // region bookkeeping churn is not news
    if (claimed.has(o) || o.size < 300 || simYears - lastMergeYear < 12e6) continue;
    let best = null, bd = 1e9;
    for (const n2 of next) {
      const d = contDist(o.cx, o.cy, n2.cx, n2.cy) - 0.5 * Math.sqrt(n2.size);
      if (d < bd && n2.size > 300 && n2.name !== o.name) { bd = d; best = n2; }
    }
    if (best && bd < 12) {
      addEvent('🤝 ' + o.name + ' merged into ' + best.name);
      lastMergeYear = simYears;
    }
  }
  namedConts = next;
}

const eventsEl = document.getElementById('events');
let events = [];
function addEvent(msg) {
  if (events[0] && events[0].msg === msg) return;
  events.unshift({ msg, y: simYears });
  events = events.slice(0, 4);
  renderEvents();
}
function renderEvents() {
  eventsEl.innerHTML = events
    .map(e => '<div><span class="when">' + formatYears(e.y) + '</span> ' + e.msg + '</div>')
    .join('');
}

/* ---------------- tectonics ---------------- */
// Continents are connected land components. Each drifts along a slowly
// rotating vector field, occasionally rotates a little, rifts apart when
// large, and welds into mountain ranges where two plates collide.

const compCells = new Int32Array(N); // scratch for flood fill / component lists
const queue = new Int32Array(N);

function labelContinents() {
  labels.fill(-1);
  const comps = [];
  for (let i = 0; i < N; i++) {
    if (terrain[i] === OCEAN || labels[i] !== -1) continue;
    const id = comps.length;
    let head = 0, tail = 0, sSin = 0, sCos = 0, sy = 0, minY = H, maxY = 0;
    queue[tail++] = i; labels[i] = id;
    while (head < tail) {
      const c = queue[head++];
      const cx = c % W, cy = (c / W) | 0;
      const a = cx * 2 * Math.PI / W;      // circular mean handles the wrap seam
      sSin += Math.sin(a); sCos += Math.cos(a); sy += cy;
      if (cy < minY) minY = cy;
      if (cy > maxY) maxY = cy;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const ny = cy + dy;
        if (ny < 0 || ny >= H) continue;
        const j = idx(cx + dx, ny);
        if (terrain[j] !== OCEAN && labels[j] === -1) { labels[j] = id; queue[tail++] = j; }
      }
    }
    let cxm = Math.atan2(sSin, sCos) / (2 * Math.PI) * W;
    if (cxm < 0) cxm += W;
    comps.push({ id, size: tail, cx: cxm, cy: sy / tail, minY, maxY });
  }
  return comps;
}

function geoStep() {
  const T = simYears / 200e6; // drift field slowly re-arranges over ~200 M yr
  const comps = labelContinents();

  /* --- plate drift + occasional rotation --- */
  scratch.fill(OCEAN);
  const moves = comps.map(c => {
    // each continent holds a steady heading tied to its name, wandering only
    // over tens of millions of years — a smooth glide, not a jitter
    const nh = strHash(nameAt(c.cx, c.cy));
    const ang = vnoise(T * 2.2, (nh % 997) * 0.37, 911) * Math.PI * 4;
    const go = rand() < 0.25;
    let dx = 0, dy = 0;
    if (go) { dx = Math.round(Math.cos(ang)); dy = Math.round(Math.sin(ang)); }
    // firm equatorward push — no continents parked on the poles: a plate
    // whose edge touches the polar band is marched straight back
    if (c.minY < 6) dy = 1;
    else if (c.maxY > H - 7) dy = -1;
    else if (c.cy < 16) dy = rand() < 0.75 ? 1 : Math.max(dy, 0);
    else if (c.cy > H - 17) dy = rand() < 0.75 ? -1 : Math.min(dy, 0);
    let rot = 0;
    if (rand() < 0.05) rot = (rand() - 0.5) * 0.12; // ± ~3.5°, rarely
    return { dx, dy, rot };
  });
  compCells.fill(-1);                      // which plate wrote each cell
  for (let i = 0; i < N; i++) {
    if (terrain[i] === OCEAN) continue;
    const x = i % W, y = (i / W) | 0;
    const c = comps[labels[i]], m = moves[c.id];
    let nx = x + m.dx, ny = y + m.dy;
    if (m.rot) {
      const rx = x - c.cx, ry = y - c.cy;
      const cos = Math.cos(m.rot), sin = Math.sin(m.rot);
      nx = Math.round(c.cx + rx * cos - ry * sin) + m.dx;
      ny = Math.round(c.cy + rx * sin + ry * cos) + m.dy;
    }
    if (ny < 0) ny = 0; if (ny >= H) ny = H - 1;
    const j = idx(nx, ny);
    if (scratch[j] === OCEAN) {
      scratch[j] = terrain[i];
      compCells[j] = c.id;
    } else {
      // collision between DIFFERENT plates welds and crumples into mountains;
      // a plate folding onto itself (rotation, polar clamp) never does
      if (compCells[j] !== c.id && rand() < 0.35) scratch[j] = MOUNTAIN;
      const k = idx(x, y);
      if (scratch[k] === OCEAN) { scratch[k] = terrain[i]; compCells[k] = c.id; }
    }
  }
  [terrain, scratch] = [scratch, terrain];

  /* --- close pinholes left by rotation --- */
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);
    if (terrain[i] === OCEAN && riftCool[i] === 0 && landNeighbors(x, y) >= 6) scratch[i] = GRASS;
    else scratch[i] = terrain[i];
  }
  [terrain, scratch] = [scratch, terrain];

  /* --- coastlines flex: continents stretch, swell, and waste away --- */
  let land = 0;
  for (let i = 0; i < N; i++) if (terrain[i] !== OCEAN) land++;
  const crowded = land > N * 0.38;         // more land means less water: shrink
  const sparse = land < N * 0.12;          // young worlds grow eagerly
  const room = Math.max(0, Math.min(1, 1 - (land / N - 0.26) / 0.12)); // growth fades as oceans fill
  const comps2 = labelContinents();        // fresh labels after the drift
  // every continent sculpts itself toward a superellipse whose exponent,
  // aspect, and tilt wander through the ages: circle → oval → squircle →
  // square and back, while its growth mood swells or shrinks the target
  for (const c of comps2) {
    c.mood = vnoise(c.cx * 0.017 + 9, c.cy * 0.017 + T * 1.4, 426) - 0.5;
    const axis = Math.PI * vnoise(c.cx * 0.013 + 5, c.cy * 0.013 + T * 0.8, 424);
    const sp = vnoise(c.cx * 0.01 + 3, c.cy * 0.01 + T * 1.9, 427);
    c.p = 2 + 6 * sp * sp;                 // 2 = round … 8 = square-cornered
    c.aspect = 0.65 + 0.7 * vnoise(c.cx * 0.02, c.cy * 0.02 + T, 425);
    const g = 0.785 + 0.215 * (1 - 2 / c.p);   // superellipse area factor
    c.b = Math.sqrt(Math.max(9, c.size * (1 + c.mood * 0.35)) / (4 * g * c.aspect));
    c.a = c.aspect * c.b;
    c.cos = Math.cos(axis); c.sin = Math.sin(axis);
  }
  const shapeS = (c, x, y) => {           // <1 inside the target shape, >1 outside
    let ddx = x - c.cx;
    if (ddx > W / 2) ddx -= W; else if (ddx < -W / 2) ddx += W;
    const dyv = y - c.cy;
    const u = ddx * c.cos + dyv * c.sin, v = -ddx * c.sin + dyv * c.cos;
    return Math.pow(Math.abs(u / c.a), c.p) + Math.pow(Math.abs(v / c.b), c.p);
  };
  scratch.set(terrain);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);
    const n = landNeighbors(x, y);
    if (terrain[i] !== OCEAN) {
      const c = comps2[labels[i]];
      // thin necks between landmasses snap almost immediately
      const lL = terrain[idx(x - 1, y)] !== OCEAN, lR = terrain[idx(x + 1, y)] !== OCEAN;
      const lU = y > 0 && terrain[idx(x, y - 1)] !== OCEAN;
      const lD = y < H - 1 && terrain[idx(x, y + 1)] !== OCEAN;
      if (((lL && lR && !lU && !lD) || (lU && lD && !lL && !lR)) && rand() < 0.5) {
        scratch[i] = OCEAN; riftCool[i] = 40;
      } else if (n === 0 || !c || c.size < 9) { // scraps and shoals dissolve away
        if (rand() < 0.3) scratch[i] = OCEAN;
      } else if (n <= 4) {
        const s = shapeS(c, x, y);
        let p = s > 1.15 ? 0.24 : s > 0.95 ? 0.03 : 0.012;  // trim what juts past the shape
        p += (crowded ? 0.10 : 0) + Math.max(0, -c.mood) * 0.06;
        if (y < 3 || y >= H - 3) p += 0.15;  // polar seas gnaw the ice line
        if (rand() < p) scratch[i] = OCEAN;
      }
    } else if (n >= 3 && !crowded) {
      let c = null, cid = -1, bridge = false; // which continent is this shore of?
      for (let dy2 = -1; dy2 <= 1; dy2++) for (let dx2 = -1; dx2 <= 1; dx2++) {
        const ny2 = y + dy2;
        if (ny2 < 0 || ny2 >= H) continue;
        const j = idx(x + dx2, ny2);
        if (terrain[j] !== OCEAN && labels[j] >= 0) {
          if (cid === -1) { cid = labels[j]; c = comps2[cid]; }
          else if (labels[j] !== cid) bridge = true;  // two continents — never silt them together
        }
      }
      if (c && !bridge && c.size >= 9 && riftCool[i] === 0 && y >= 3 && y < H - 3) {
        const s = shapeS(c, x, y);
        const p = ((s < 0.85 ? 0.22 : s < 1.05 ? 0.06 : 0.008)  // fill in toward the shape
                + Math.max(0, c.mood) * 0.08 + Math.min(0.04, c.size / 10000)
                + (sparse ? 0.08 : 0)) * room;
        if (rand() < p) scratch[i] = GRASS;
      }
    }
  }
  [terrain, scratch] = [scratch, terrain];

  /* --- rifting: big continents crack apart (rarely, and for good) --- */
  if (simYears - lastRiftYear > 15e6) {
    for (const c of comps2) {
      if (c.size < 110 || rand() > 0.009 + c.size / 110000) continue;
      const ang = rand() * Math.PI;
      const nx = Math.cos(ang), nyv = Math.sin(ang);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (terrain[i] === OCEAN || labels[i] !== c.id) continue;
        // signed distance to the rift line through the centroid, with a wobble
        let ddx = x - c.cx;
        if (ddx > W / 2) ddx -= W; if (ddx < -W / 2) ddx += W;
        const d = ddx * nx + (y - c.cy) * nyv
                + (vnoise(x * 0.09, y * 0.09, 555 + c.id) - 0.5) * 6;
        if (Math.abs(d) < 2.0) { terrain[i] = OCEAN; riftCool[i] = 150; }
      }
      addEvent('⛰ ' + nameAt(c.cx, c.cy) + ' rifts apart');
      lastRiftYear = simYears;
      break;                                 // at most one rift per step
    }
  }

  /* --- breakup: an overgrown continent shatters into 2–10 shards --- */
  if (simYears - lastBreakYear > 18e6) {
    for (const c of comps2) {
      const crowdedBig = land > N * 0.40 && c.size > land * 0.30;
      if (!(crowdedBig || c.size > N * 0.15) || rand() > 0.09) continue;
      const cells = [];
      for (let i = 0; i < N; i++) {
        if (terrain[i] !== OCEAN && labels[i] === c.id) cells.push(i);
      }
      const k = 2 + ((rand() * 9) | 0);       // 2–10 pieces
      const seeds = [];
      for (let s = 0; s < k; s++) seeds.push(cells[(rand() * cells.length) | 0]);
      for (const i of cells) {                // sink the fault lines between shards
        const x = i % W, y = (i / W) | 0;
        let d1 = 1e9, d2 = 1e9;
        for (const sIdx of seeds) {
          const d = contDist(x, y, sIdx % W, (sIdx / W) | 0);
          if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
        }
        if (d2 - d1 < 1.8) { terrain[i] = OCEAN; riftCool[i] = 150; }
      }
      addEvent('💥 ' + nameAt(c.cx, c.cy) + ' shatters into ' + k + ' pieces');
      lastBreakYear = simYears;
      break;
    }
  }

  /* --- once the world is old enough, human wars scar the land --- */
  if (simYears > 250e6 && simYears - lastWarYear > 25e6 && land > 400 && rand() < 0.02) {
    for (let t = 0; t < 50; t++) {
      const i = (rand() * N) | 0;
      if (terrain[i] === OCEAN) continue;
      const ex = i % W, ey = (i / W) | 0;
      const r = 3 + rand() * 4;
      for (let dy = -7; dy <= 7; dy++) for (let dx = -7; dx <= 7; dx++) {
        const ny = ey + dy;
        if (ny < 0 || ny >= H) continue;
        const d = Math.hypot(dx, dy);
        if (d > r) continue;
        const j = idx(ex + dx, ny);
        if (terrain[j] === OCEAN || rand() > 0.85 * (1 - d / (r + 1))) continue;
        if (rand() < 0.45) { terrain[j] = OCEAN; riftCool[j] = 90; }
        else terrain[j] = SCORCHED;
      }
      addEvent('⚔ War scorches ' + nameAt(ex, ey));
      lastWarYear = simYears;
      break;
    }
  }

  for (let i = 0; i < N; i++) if (riftCool[i] > 0) riftCool[i]--;
  renameContinents();
  climateStep();
}

/* ---------------- climate & biomes ---------------- */
function computeCoastDist() {
  coastDist.fill(255);
  let head = 0, tail = 0;
  for (let i = 0; i < N; i++) {
    if (terrain[i] === OCEAN) { coastDist[i] = 0; queue[tail++] = i; }
  }
  while (head < tail) {
    const c = queue[head++];
    const x = c % W, y = (c / W) | 0, d = coastDist[c];
    if (d >= 30) continue;
    for (let k = 0; k < 4; k++) {
      const nx = k === 0 ? x + 1 : k === 1 ? x - 1 : x;
      const ny = k === 2 ? y + 1 : k === 3 ? y - 1 : y;
      if (ny < 0 || ny >= H) continue;
      const j = idx(nx, ny);
      if (coastDist[j] > d + 1) { coastDist[j] = d + 1; queue[tail++] = j; }
    }
  }
}

function climateStep() {
  computeCoastDist();
  const epoch = simYears / 60e6;                     // climate re-shuffles every ~60 M yr
  const e0 = Math.floor(epoch), ef = epoch - e0;
  const wobble = 0.14 * Math.sin(simYears / 130e6 * Math.PI * 2 + 1.3); // ice ages
  const half = (H - 1) / 2;

  for (let y = 0; y < H; y++) {
    const lat = 1 - Math.abs(y - half) / half;       // 1 equator → 0 poles
    for (let x = 0; x < W; x++) {
      const i = idx(x, y);
      const b = terrain[i];
      if (b === OCEAN) continue;
      if (b === MOUNTAIN) {                          // ranges erode back down
        if (rand() < 0.035) terrain[i] = GRASS;
        continue;
      }
      if (b === SCORCHED) {                          // war scars slowly regrow
        if (rand() < 0.04) terrain[i] = GRASS;
        continue;
      }
      // temperature and moisture drift with the epochs
      const tn = vnoise(x * 0.05, y * 0.05, 100 + e0) * (1 - ef)
               + vnoise(x * 0.05, y * 0.05, 101 + e0) * ef;
      const mnA = vnoise(x * 0.045 + 7, y * 0.045, 200 + e0);
      const mnB = vnoise(x * 0.045 + 7, y * 0.045, 201 + e0);
      const mn = mnA * (1 - ef) + mnB * ef;
      const temp = lat + wobble + (tn - 0.5) * 0.22;
      const moist = mn * 0.62 + Math.max(0, 1 - coastDist[i] / 13) * 0.5;

      let want;
      if (temp < 0.24) want = TUNDRA;
      else if (moist < 0.30) want = DESERT;
      else if (temp > 0.72 && moist > 0.56) want = JUNGLE;
      else if (temp > 0.62 && moist < 0.48) want = SAVANNA;
      else if (moist > 0.58) want = FOREST;
      else want = GRASS;

      // gradual, patchy transitions rather than instant repaints
      if (want !== b && rand() < 0.3) terrain[i] = want;
    }
  }
}

/* ---------------- rendering ---------------- */
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const off = document.createElement('canvas');
off.width = W; off.height = H;
const offCtx = off.getContext('2d');
const img = offCtx.createImageData(W, H);

function render() {
  const d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);
    const b = terrain[i];
    let c, mix = 0, tint = null;
    if (b === OCEAN) {
      c = landNeighbors(x, y) > 0 ? OCEAN_SHALLOW : COLOR[OCEAN];
    } else {
      c = COLOR[b];
      const u = unitGrid[i];
      if (u >= 0 && namedConts[u]) {
        // outline: coasts and internal region borders wear the continent color
        for (let k = 0; k < 4; k++) {
          const nx = k === 0 ? x + 1 : k === 1 ? x - 1 : x;
          const ny = k === 2 ? y + 1 : k === 3 ? y - 1 : y;
          if (ny < 0 || ny >= H) continue;
          const jj = idx(nx, ny);
          if (terrain[jj] === OCEAN) { mix = 0.8; break; }
          if (unitGrid[jj] !== u && unitGrid[jj] >= 0) mix = 0.55;
        }
        if (mix) tint = namedConts[u].color;
      }
    }
    const j = hash(x, y, 7) * 22 - 11;   // per-cell texture jitter
    const p = i * 4;
    for (let ch = 0; ch < 3; ch++) {
      const v = tint ? c[ch] * (1 - mix) + tint[ch] * mix : c[ch];
      d[p + ch] = Math.max(0, Math.min(255, v + j));
    }
    d[p + 3] = 255;
  }
  offCtx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(off, 0, 0, canvas.width, canvas.height);

  // continent names ride along with their landmass
  const sc = canvas.width / W;
  ctx.font = '700 ' + Math.max(11, sc * 2.1) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(10, 14, 20, 0.75)';
  for (const c of namedConts) {
    if (c.size < 45) continue;
    const px = (c.cx + 0.5) * sc, py = (c.cy + 0.5) * sc;
    const [r, g, bl] = c.color;                  // label in the continent color
    ctx.fillStyle = `rgb(${Math.min(255, r + 80)},${Math.min(255, g + 80)},${Math.min(255, bl + 80)})`;
    ctx.strokeText(c.name, px, py);
    ctx.fillText(c.name, px, py);
  }
}

function fitCanvas() {
  const stage = document.getElementById('stage');
  const s = Math.max(1, Math.min(stage.clientWidth / W, stage.clientHeight / H));
  canvas.width = Math.floor(W * s); canvas.height = Math.floor(H * s);
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  render();
}
window.addEventListener('resize', fitCanvas);

/* ---------------- legend & readout ---------------- */
const legendEl = document.getElementById('legend');
function updateLegend() {
  const counts = new Array(8).fill(0);
  for (let i = 0; i < N; i++) counts[terrain[i]]++;
  let html = '';
  for (const b of BIOMES) {
    if (!counts[b.id]) continue;
    html += `<div class="row"><span class="swatch" style="background:rgb(${b.color})"></span>` +
            `${b.name}<span class="count">${counts[b.id]}</span></div>`;
  }
  legendEl.innerHTML = html || '<div class="row" style="color:#8b93a0">Open ocean</div>';
}

const yearEl = document.getElementById('yearText');
const rateEl = document.getElementById('rateText');
function formatYears(y) {
  if (y < 1e6) return Math.floor(y).toLocaleString('en-US') + ' years';
  if (y < 1e9) return (y / 1e6).toFixed(2) + ' million years';
  return (y / 1e9).toFixed(3) + ' billion years';
}

/* ---------------- painting ---------------- */
let tool = GRASS;
let brush = 3;
let painting = false;

function paintAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((clientX - r.left) / r.width * W);
  const y = Math.floor((clientY - r.top) / r.height * H);
  const rad = brush - 1;
  for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    if (dx * dx + dy * dy > rad * rad + rad * 0.5) continue;
    const ny = y + dy;
    if (ny < 0 || ny >= H) continue;
    terrain[idx(x + dx, ny)] = tool;
  }
  document.getElementById('hint').classList.add('gone');
  render();
}
canvas.addEventListener('pointerdown', e => {
  painting = true;
  canvas.setPointerCapture(e.pointerId);
  paintAt(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', e => { if (painting) paintAt(e.clientX, e.clientY); });
canvas.addEventListener('pointerup', () => {
  painting = false;
  renameContinents();       // fresh paint gets outlined and named right away
  render(); updateLegend();
});

/* ---------------- controls ---------------- */
const speedButtons = [
  ['pauseBtn', 0],
  ['speed1', 100_000],
  ['speed2', 1_000_000],
  ['speedMax', 4_000_000],
];
for (const [bid, s] of speedButtons) {
  document.getElementById(bid).addEventListener('click', () => setSpeed(s));
}
function setSpeed(s) {
  speed = s;
  for (const [bid, bs] of speedButtons) {
    document.getElementById(bid).classList.toggle('on', bs === s);
  }
  rateEl.textContent = s ? '+' + s.toLocaleString('en-US') + ' yr/s' : '· paused ·';
  document.getElementById('hint').classList.add('gone');
}

const toolGrass = document.getElementById('toolGrass');
const toolOcean = document.getElementById('toolOcean');
toolGrass.addEventListener('click', () => {
  tool = GRASS;
  toolGrass.classList.add('on'); toolOcean.classList.remove('on');
});
toolOcean.addEventListener('click', () => {
  tool = OCEAN;
  toolOcean.classList.add('on'); toolGrass.classList.remove('on');
});
const brushBtn = document.getElementById('brushBtn');
brushBtn.addEventListener('click', () => {
  brush = brush >= 6 ? 1 : brush + 1;
  brushBtn.textContent = 'Brush ' + brush;
});

function resetWorldState() {
  simYears = 0; lastGeoYear = 0;
  lastRiftYear = 0; lastBreakYear = 0; lastWarYear = 0; lastMergeYear = 0;
  riftCool.fill(0);
  unitGrid.fill(-1);
  namedConts = [];
  ghostNames = [];
  events = []; renderEvents();
  yearEl.textContent = formatYears(0);
}
document.getElementById('clearBtn').addEventListener('click', () => {
  terrain.fill(OCEAN);
  resetWorldState();
  setSpeed(0);
  render(); updateLegend();
});
document.getElementById('randomBtn').addEventListener('click', () => {
  const s = (Math.random() * 1e9) | 0;
  rngState = s || 1;
  terrain.fill(OCEAN);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = vnoise(x * 0.045, y * 0.045, s) * 0.7 + vnoise(x * 0.11, y * 0.11, s + 1) * 0.3;
    if (n > 0.585) terrain[idx(x, y)] = GRASS;
  }
  resetWorldState();
  climateStep();
  renameContinents();                 // fresh continents get their names at birth
  document.getElementById('hint').classList.add('gone');
  render(); updateLegend();
});

/* ---------------- main loop ---------------- */
let lastTime = performance.now();
let legendTimer = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  if (speed > 0) {
    simYears += speed * dt;
    let steps = 0;
    while (simYears - lastGeoYear >= GEO_INTERVAL && steps < 24) {
      lastGeoYear += GEO_INTERVAL;
      geoStep();
      steps++;
    }
    if (simYears - lastGeoYear >= GEO_INTERVAL) lastGeoYear = simYears; // don't spiral on slow devices
    if (steps > 0) render();
    yearEl.textContent = formatYears(simYears);
    legendTimer += dt;
    if (legendTimer > 0.5) { legendTimer = 0; updateLegend(); }
  }
  requestAnimationFrame(frame);
}

fitCanvas();
updateLegend();
setSpeed(0);
yearEl.textContent = formatYears(0);
requestAnimationFrame(frame);
</script>
</body>
</html>

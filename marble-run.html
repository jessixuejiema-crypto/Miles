<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Run!</title>
<style>
  :root {
    --bg: #14162b;
    --panel: #1e2140;
    --panel-2: #262a52;
    --border: #383d6e;
    --text: #eef0ff;
    --muted: #9aa0d0;
    --accent: #ffb703;
    --accent-2: #4cc9f0;
    --good: #6ee7a0;
    --danger: #ff5d73;
    --shadow: rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -100px, #232759, var(--bg));
    color: var(--text);
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }
  h1 {
    margin: 4px 0 8px;
    font-size: 26px;
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  h1 .m1 { color: var(--accent); }
  h1 .m2 { color: var(--accent-2); }
  h1 .m3 { color: var(--good); }
  h1 .m4 { color: var(--danger); }

  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 8px;
    box-shadow: 0 4px 14px var(--shadow);
    max-width: 1040px;
  }
  .bar .sep {
    width: 1px;
    align-self: stretch;
    background: var(--border);
    margin: 0 4px;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 6px 10px;
    cursor: pointer;
    transition: transform .06s ease, background .15s ease;
  }
  button:hover { background: #303566; }
  button:active { transform: scale(0.95); }
  button.tool.on {
    background: var(--accent);
    color: #23200a;
    border-color: var(--accent);
    font-weight: bold;
  }
  button.big {
    background: var(--accent-2);
    color: #06263a;
    font-weight: bold;
    border-color: var(--accent-2);
  }
  button.big:hover { filter: brightness(1.1); }
  button.warn { color: var(--danger); border-color: #6e3844; }
  #collideBtn.colliding {
    background: var(--good);
    color: #0a2c18;
    border-color: var(--good);
    font-weight: bold;
  }
  #collideBtn.ghost {
    background: #6d5bd0;
    color: #fff;
    border-color: #8a7ae0;
    font-weight: bold;
  }
  #stampBar { flex-direction: column; align-items: stretch; }
  #stampBar .lbl { font-size: 13px; color: var(--muted); }
  #stampBar .lbl b { color: var(--accent); }
  .stampHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  #stampGrid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    max-height: 72px;
    overflow: hidden;
  }
  #stampGrid.open { max-height: 250px; overflow-y: auto; }
  .obsSaveRow { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #obsName {
    font-family: inherit;
    font-size: 13px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 6px 10px;
    width: 160px;
  }
  #customRow {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
  }
  #customRow .lbl { font-size: 13px; color: var(--accent); font-weight: bold; }
  #stampBar .stamp.custom { border-color: var(--accent); }
  #stampBar .stamp .del { margin-left: 6px; color: var(--danger); font-weight: bold; }
  #stampBar .stamp.on {
    background: var(--accent-2);
    color: #06263a;
    border-color: var(--accent-2);
    font-weight: bold;
  }
  label.chk {
    font-size: 13px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  #stage {
    position: relative;
    border: 3px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px var(--shadow);
    touch-action: none;
    max-width: 100%;
  }
  canvas { display: block; background: #10122a; max-width: 100%; height: auto; }
  #hud {
    position: absolute;
    left: 8px;
    top: 6px;
    font-size: 12px;
    color: var(--muted);
    background: rgba(16, 18, 42, 0.7);
    padding: 2px 8px;
    border-radius: 8px;
    pointer-events: none;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--accent);
    color: #23200a;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 10px;
    box-shadow: 0 6px 20px var(--shadow);
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
    z-index: 50;
  }
  #toast.show { opacity: 1; }

  #tplPanel {
    width: 100%;
    max-width: 1040px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    margin-top: 8px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  #tplPanel h2 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
  .tplRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tplRow input[type=text] {
    font-family: inherit;
    font-size: 13px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 6px 10px;
    width: 180px;
  }
  #tplList { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tplCard {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 6px;
    font-size: 13px;
  }
  .tplCard .name { padding: 0 4px; font-weight: bold; }
  .tplCard .preset { color: var(--accent-2); }
  .tplCard button { padding: 3px 7px; font-size: 12px; border-radius: 7px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<h1><span class="m1">●</span> Marble <span class="m2">●</span> Run<span class="m3">!</span> <span class="m4">●</span></h1>

<div class="bar" id="toolbar">
  <button class="tool" data-tool="select" title="Move pieces around">✋ Move</button>
  <button class="tool on" data-tool="ramp" title="Drag to draw a ramp">📏 Ramp</button>
  <button class="tool" data-tool="peg" title="Click to drop pegs">📍 Peg</button>
  <button class="tool" data-tool="bumper" title="Bouncy! Marbles get a boost">🍄 Bumper</button>
  <button class="tool" data-tool="switch" title="Flicks marbles left or right, taking turns. Tap a placed dot to flip its arrow">🔀 Dot</button>
  <button class="tool" data-tool="boost" title="Drag to draw a speed pad — marbles zoom along it">⚡ Boost</button>
  <button class="tool" data-tool="spin" title="Spinning bar. Tap a placed spinner to spin it the other way">🌀 Spinner</button>
  <button class="tool" data-tool="mover" title="Platform that slides left and right">↔️ Mover</button>
  <button class="tool" data-tool="motion" title="Drag from any piece to draw a path it will patrol — up-down, left-right, or any squiggle. Tap a moving piece to freeze it">🛤️ Motion</button>
  <button class="tool" data-tool="erase" title="Click a piece to remove it">🧽 Erase</button>
  <div class="sep"></div>
  <button id="add1">+1 marble</button>
  <button id="add100">+100</button>
  <button id="add1000" class="big">+1000 marbles!</button>
  <button id="add5000">+5000</button>
  <button id="clearMarbles" class="warn">Clear marbles</button>
  <div class="sep"></div>
  <button id="collideBtn" class="colliding">💥 Touch mode</button>
  <label class="chk"><input type="checkbox" id="recycle" checked> ♻️ recycle at bottom</label>
  <button id="pauseBtn">⏸ Pause</button>
  <button id="clearTrack" class="warn">Clear track</button>
</div>

<div class="bar" id="stampBar">
  <div class="stampHead">
    <span class="lbl">✨ <b>100 one-tap obstacles</b> — pick one, then tap the canvas to stamp it:</span>
    <span class="obsSaveRow">
      <input type="text" id="obsName" placeholder="Name your obstacle…" maxlength="24">
      <button id="obsSave" title="Saves everything on the canvas as your own one-tap obstacle">💾 Save my obstacle</button>
      <button id="stampToggle">Show all 100 ▾</button>
    </span>
  </div>
  <div id="stampGrid"></div>
  <div id="customRow"></div>
</div>

<div id="stage">
  <canvas id="cv" width="1000" height="620"></canvas>
  <div id="hud"></div>
</div>

<div id="tplPanel">
  <h2>💾 Templates</h2>
  <div class="tplRow">
    <input type="text" id="tplName" placeholder="Name your track…" maxlength="30">
    <button id="tplSave" class="big">Save template</button>
    <button id="tplLink">🔗 Copy link to this track</button>
  </div>
  <div id="tplList"></div>
  <div class="hint">
    Saved templates stay in this browser. <b>🔗 Link</b> copies a shareable URL — anyone who opens it
    gets your track loaded and ready. Blue ones are built-in starters.
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";

// ---------- world ----------
const W = 1000, H = 620;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const hud = document.getElementById("hud");

const MARBLE_R = 4.5;
const MAX_MARBLES = 10000;
const GRAV = 620;            // px/s^2
const AIR = 0.999;
const WALL_E = 0.45;
const SUBSTEPS = 2;

let pieces = [];             // ramps, pegs, bumpers
let spawner = { x: W / 2, y: 26 };
let marbles = [];
let spawnQueue = 0;
let collide = true;          // marble-vs-marble collisions
let recycle = true;
let paused = false;

// ---------- marbles ----------
let hueSeed = 0;
function spawnMarble() {
  if (marbles.length >= MAX_MARBLES) return;
  hueSeed = (hueSeed + 47) % 360;
  marbles.push({
    x: spawner.x + (Math.random() - 0.5) * 26,
    y: spawner.y + (Math.random() - 0.5) * 8,
    vx: (Math.random() - 0.5) * 40,
    vy: 0,
    hue: hueSeed
  });
}
function recycleMarble(m) {
  m.x = spawner.x + (Math.random() - 0.5) * 26;
  m.y = spawner.y + (Math.random() - 0.5) * 8;
  m.vx = (Math.random() - 0.5) * 40;
  m.vy = 0;
}

// ---------- physics ----------
let T = 0; // sim clock, drives spinners and movers (kept out of templates so saves stay stateless)
function spinAngle(pc) { return pc.dir * T * 2.4 + (pc.x * 7 + pc.y * 13) * 0.002; }
const SPIN_L = 55, MOVER_HALF = 48, MOVER_RANGE = 65, MOVER_W = 1.7;
function moverPhase(pc) { return T * MOVER_W + pc.x * 0.013; }
function moverX(pc) { return pc.x + Math.sin(moverPhase(pc)) * MOVER_RANGE; }
function moverVX(pc) { return Math.cos(moverPhase(pc)) * MOVER_RANGE * MOVER_W; }

// custom patrol paths: any piece with pc.path ping-pongs along it forever
const ZERO4 = [0, 0, 0, 0];
const PATH_SPD = 90; // px/s
function pathOffset(pc) {
  const pts = pc.path;
  let L = pc._plen;
  if (L === undefined) {
    L = 0;
    for (let i = 1; i < pts.length; i++)
      L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    pc._plen = L;
  }
  if (L < 4) return ZERO4;
  let u = (T * PATH_SPD) % (2 * L);
  let fwd = 1;
  if (u > L) { u = 2 * L - u; fwd = -1; }
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    const sl = Math.hypot(dx, dy);
    if (u <= sl || i === pts.length - 1) {
      const t = sl > 0 ? u / sl : 0;
      const inv = sl > 0 ? PATH_SPD / sl : 0;
      return [pts[i - 1][0] + dx * t, pts[i - 1][1] + dy * t, dx * inv * fwd, dy * inv * fwd];
    }
    u -= sl;
  }
  return ZERO4;
}

function collideSegment(m, x1, y1, x2, y2, e, boost) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-9) return false;
  let t = ((m.x - x1) * dx + (m.y - y1) * dy) / len2;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  const cx = x1 + dx * t, cy = y1 + dy * t;
  let nx = m.x - cx, ny = m.y - cy;
  const d2 = nx * nx + ny * ny;
  const rr = MARBLE_R + 2.5; // half track thickness
  if (d2 >= rr * rr) return false;
  let d = Math.sqrt(d2);
  if (d < 1e-6) { nx = -dy; ny = dx; d = Math.sqrt(len2); }
  nx /= d; ny /= d;
  const push = rr - Math.sqrt(Math.max(d2, 1e-12));
  m.x += nx * push;
  m.y += ny * push;
  const vn = m.vx * nx + m.vy * ny;
  if (vn < 0) {
    m.vx -= (1 + e) * vn * nx;
    m.vy -= (1 + e) * vn * ny;
    // tangential friction so marbles roll, not skate
    const tx = -ny, ty = nx;
    const vt = m.vx * tx + m.vy * ty;
    m.vx -= vt * 0.015 * tx;
    m.vy -= vt * 0.015 * ty;
  }
  if (boost) {
    const sp = Math.hypot(m.vx, m.vy);
    const target = Math.max(sp * 1.15, 240);
    m.vx += nx * (target - sp) * 0.9;
    m.vy += ny * (target - sp) * 0.9;
  }
  return true;
}

function collideCircle(m, cx, cy, r, e, boost) {
  let nx = m.x - cx, ny = m.y - cy;
  const rr = r + MARBLE_R;
  const d2 = nx * nx + ny * ny;
  if (d2 >= rr * rr) return;
  let d = Math.sqrt(d2);
  if (d < 1e-6) { nx = 0; ny = -1; d = 1; }
  nx /= d; ny /= d;
  m.x += nx * (rr - d);
  m.y += ny * (rr - d);
  const vn = m.vx * nx + m.vy * ny;
  if (vn < 0) {
    m.vx -= (1 + e) * vn * nx;
    m.vy -= (1 + e) * vn * ny;
  }
  if (boost) {
    const sp = Math.hypot(m.vx, m.vy);
    const target = Math.max(sp * 1.2, 260);
    m.vx += nx * (target - sp);
    m.vy += ny * (target - sp);
  }
}

const SWITCH_R = 10;
function collideSwitch(m, pc) {
  const rr = SWITCH_R + MARBLE_R;
  const nx = m.x - pc.x, ny = m.y - pc.y;
  const d2 = nx * nx + ny * ny;
  if (d2 >= rr * rr) return;
  if (m.vy > 0 && ny < 3) {
    // falling onto the dot: flick it sideways, then flip the arrow
    const d = Math.sqrt(Math.max(d2, 1e-6));
    m.x += (nx / d) * (rr - d);
    m.y += (ny / d) * (rr - d);
    m.vx = pc.dir * 122;
    m.vy = -60;
    pc.dir = -pc.dir;
  } else {
    collideCircle(m, pc.x, pc.y, SWITCH_R, 0.4, false);
  }
}

// spatial hash for marble-marble collisions
const CELL = 12;
const grid = new Map();
function marbleVsMarble() {
  grid.clear();
  for (let i = 0; i < marbles.length; i++) {
    const m = marbles[i];
    const key = ((m.x / CELL) | 0) * 4096 + ((m.y / CELL) | 0);
    const bucket = grid.get(key);
    if (bucket) bucket.push(i); else grid.set(key, [i]);
  }
  const rr = MARBLE_R * 2, rr2 = rr * rr;
  for (let i = 0; i < marbles.length; i++) {
    const a = marbles[i];
    const cx = (a.x / CELL) | 0, cy = (a.y / CELL) | 0;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const bucket = grid.get(gx * 4096 + gy);
        if (!bucket) continue;
        for (let k = 0; k < bucket.length; k++) {
          const j = bucket[k];
          if (j <= i) continue;
          const b = marbles[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr2 || d2 < 1e-9) continue;
          const d = Math.sqrt(d2);
          dx /= d; dy /= d;
          const push = (rr - d) * 0.5;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
          const rvn = (b.vx - a.vx) * dx + (b.vy - a.vy) * dy;
          if (rvn < 0) {
            const imp = -(1 + 0.25) * rvn * 0.5;
            a.vx -= dx * imp; a.vy -= dy * imp;
            b.vx += dx * imp; b.vy += dy * imp;
          }
        }
      }
    }
  }
}

function step(dt) {
  // stream queued marbles in gently so +1000 doesn't explode in one spot
  if (spawnQueue > 0) {
    if (marbles.length >= MAX_MARBLES) {
      spawnQueue = 0;
      toast("That's the limit — 10,000 marbles! 🤯");
    } else {
      const n = Math.min(spawnQueue, 40, MAX_MARBLES - marbles.length);
      for (let i = 0; i < n; i++) spawnMarble();
      spawnQueue -= n;
    }
  }
  const h = dt / SUBSTEPS;
  const bounds = [], offs = [];
  for (let s = 0; s < SUBSTEPS; s++) {
    T += h;
    // cheap bounding boxes per piece so 10k marbles can skip far-away pieces fast,
    // plus each piece's current patrol-path offset and velocity
    bounds.length = 0;
    offs.length = 0;
    for (const pc of pieces) {
      const o = pc.path ? pathOffset(pc) : ZERO4;
      offs.push(o);
      let bb;
      if (pc.type === "ramp" || pc.type === "boost") {
        bb = [Math.min(pc.x1, pc.x2) - 8, Math.max(pc.x1, pc.x2) + 8,
              Math.min(pc.y1, pc.y2) - 8, Math.max(pc.y1, pc.y2) + 8];
      } else if (pc.type === "spin") {
        const e = SPIN_L + 9;
        bb = [pc.x - e, pc.x + e, pc.y - e, pc.y + e];
      } else if (pc.type === "mover") {
        const mx = moverX(pc);
        bb = [mx - MOVER_HALF - 8, mx + MOVER_HALF + 8, pc.y - 8, pc.y + 8];
      } else {
        const e = (pc.type === "peg" ? 7 : pc.type === "switch" ? SWITCH_R : 15) + MARBLE_R + 1;
        bb = [pc.x - e, pc.x + e, pc.y - e, pc.y + e];
      }
      bb[0] += o[0]; bb[1] += o[0]; bb[2] += o[1]; bb[3] += o[1];
      bounds.push(bb);
    }
    for (let i = 0; i < marbles.length; i++) {
      const m = marbles[i];
      m.vy += GRAV * h;
      m.vx *= AIR; m.vy *= AIR;
      m.x += m.vx * h;
      m.y += m.vy * h;

      // walls
      if (m.x < MARBLE_R) { m.x = MARBLE_R; if (m.vx < 0) m.vx *= -WALL_E; }
      else if (m.x > W - MARBLE_R) { m.x = W - MARBLE_R; if (m.vx > 0) m.vx *= -WALL_E; }
      if (m.y < -80) { m.y = -80; if (m.vy < 0) m.vy = 0; }

      // pieces
      for (let p = 0; p < pieces.length; p++) {
        const bb = bounds[p];
        if (m.x < bb[0] || m.x > bb[1] || m.y < bb[2] || m.y > bb[3]) continue;
        const pc = pieces[p];
        // collide in the patrolling piece's frame so it pushes marbles as it moves
        const o = offs[p];
        if (o !== ZERO4) { m.x -= o[0]; m.y -= o[1]; m.vx -= o[2]; m.vy -= o[3]; }
        if (pc.type === "ramp") collideSegment(m, pc.x1, pc.y1, pc.x2, pc.y2, 0.25, false);
        else if (pc.type === "peg") collideCircle(m, pc.x, pc.y, 7, 0.55, false);
        else if (pc.type === "switch") collideSwitch(m, pc);
        else if (pc.type === "boost") {
          if (collideSegment(m, pc.x1, pc.y1, pc.x2, pc.y2, 0.1, false)) {
            let bx = pc.x2 - pc.x1, by = pc.y2 - pc.y1;
            const bl = Math.hypot(bx, by) || 1;
            bx /= bl; by /= bl;
            const proj = m.vx * bx + m.vy * by;
            if (proj < 420) { m.vx += bx * (420 - proj) * 0.3; m.vy += by * (420 - proj) * 0.3; }
          }
        } else if (pc.type === "spin") {
          const a = spinAngle(pc), c = Math.cos(a), sn = Math.sin(a);
          if (collideSegment(m, pc.x - c * SPIN_L, pc.y - sn * SPIN_L,
                             pc.x + c * SPIN_L, pc.y + sn * SPIN_L, 0.5, false)) {
            // add the bar's surface velocity so it whacks marbles around
            const w = pc.dir * 2.4;
            m.vx += -(m.y - pc.y) * w * 0.6;
            m.vy += (m.x - pc.x) * w * 0.6;
          }
        } else if (pc.type === "mover") {
          // collide in the platform's moving frame so it pushes and carries marbles
          const mx = moverX(pc), pvx = moverVX(pc);
          m.vx -= pvx;
          const hit = collideSegment(m, mx - MOVER_HALF, pc.y, mx + MOVER_HALF, pc.y, 0.2, false);
          m.vx += pvx;
          if (hit) m.x += pvx * h;
        }
        else collideCircle(m, pc.x, pc.y, 15, 0.9, true);
        if (o !== ZERO4) { m.x += o[0]; m.y += o[1]; m.vx += o[2]; m.vy += o[3]; }
      }

      // bottom
      if (m.y > H - MARBLE_R) {
        if (recycle) recycleMarble(m);
        else { m.y = H - MARBLE_R; if (m.vy > 0) { m.vy *= -WALL_E; m.vx *= 0.94; } }
      }
    }
    if (collide) marbleVsMarble();
  }
}

// ---------- drawing ----------
function draw() {
  ctx.clearRect(0, 0, W, H);

  // faint dot grid
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let x = 40; x < W; x += 40)
    for (let y = 40; y < H; y += 40)
      ctx.fillRect(x, y, 2, 2);

  // spawner
  ctx.save();
  ctx.translate(spawner.x, spawner.y);
  ctx.fillStyle = selected === spawner ? "#ffe08a" : "#ffb703";
  ctx.beginPath();
  ctx.moveTo(-26, -12); ctx.lineTo(26, -12); ctx.lineTo(14, 8); ctx.lineTo(-14, 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#10122a";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("DROP", 0, 1);
  ctx.restore();

  // pieces
  for (const pc of pieces) {
    const sel = pc === selected;
    const po = pc.path ? pathOffset(pc) : null;
    if (pc.path && (tool === "motion" || sel)) {
      // show the patrol path
      const ax = pc.x1 !== undefined ? (pc.x1 + pc.x2) / 2 : pc.x;
      const ay = pc.y1 !== undefined ? (pc.y1 + pc.y2) / 2 : pc.y;
      ctx.strokeStyle = "rgba(76,201,240,0.55)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(ax + pc.path[0][0], ay + pc.path[0][1]);
      for (let i = 1; i < pc.path.length; i++)
        ctx.lineTo(ax + pc.path[i][0], ay + pc.path[i][1]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (po) { ctx.save(); ctx.translate(po[0], po[1]); }
    if (pc.type === "ramp") {
      ctx.strokeStyle = sel ? "#ffe08a" : "#8d99ae";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(pc.x1, pc.y1); ctx.lineTo(pc.x2, pc.y2);
      ctx.stroke();
      if (sel) {
        ctx.fillStyle = "#ffe08a";
        for (const [hx, hy] of [[pc.x1, pc.y1], [pc.x2, pc.y2]]) {
          ctx.beginPath(); ctx.arc(hx, hy, 6, 0, 7); ctx.fill();
        }
      }
    } else if (pc.type === "peg") {
      ctx.fillStyle = sel ? "#ffe08a" : "#b8c0ff";
      ctx.beginPath(); ctx.arc(pc.x, pc.y, 7, 0, 7); ctx.fill();
    } else if (pc.type === "boost") {
      ctx.strokeStyle = sel ? "#ffe08a" : "#ffd166";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(pc.x1, pc.y1); ctx.lineTo(pc.x2, pc.y2);
      ctx.stroke();
      const bl = Math.hypot(pc.x2 - pc.x1, pc.y2 - pc.y1) || 1;
      const ux = (pc.x2 - pc.x1) / bl, uy = (pc.y2 - pc.y1) / bl;
      ctx.fillStyle = "#7a5c00";
      for (let d = 14; d < bl - 6; d += 22) {
        const ax = pc.x1 + ux * d, ay = pc.y1 + uy * d;
        ctx.beginPath();
        ctx.moveTo(ax - ux * 4 - uy * 4, ay - uy * 4 + ux * 4);
        ctx.lineTo(ax + ux * 5, ay + uy * 5);
        ctx.lineTo(ax - ux * 4 + uy * 4, ay - uy * 4 - ux * 4);
        ctx.closePath(); ctx.fill();
      }
    } else if (pc.type === "spin") {
      const a = spinAngle(pc), c = Math.cos(a), sn = Math.sin(a);
      ctx.strokeStyle = sel ? "#ffe08a" : "#e07bff";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(pc.x - c * SPIN_L, pc.y - sn * SPIN_L);
      ctx.lineTo(pc.x + c * SPIN_L, pc.y + sn * SPIN_L);
      ctx.stroke();
      // arrowheads at each tip showing which way it turns
      ctx.fillStyle = sel ? "#ffe08a" : "#f3b5ff";
      const D = pc.dir >= 0 ? 1 : -1;
      for (const e of [1, -1]) {
        const tx = pc.x + c * SPIN_L * e, ty = pc.y + sn * SPIN_L * e;
        const ux = -sn * e * D, uy = c * e * D;   // tip motion direction
        const bx = c * e, by = sn * e;            // along the bar
        ctx.beginPath();
        ctx.moveTo(tx + ux * 13, ty + uy * 13);
        ctx.lineTo(tx + bx * 5, ty + by * 5);
        ctx.lineTo(tx - bx * 5, ty - by * 5);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(pc.x, pc.y, 4, 0, 7); ctx.fill();
    } else if (pc.type === "mover") {
      const mx = moverX(pc);
      ctx.strokeStyle = sel ? "#ffe08a" : "#2ec4b6";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(mx - MOVER_HALF, pc.y); ctx.lineTo(mx + MOVER_HALF, pc.y);
      ctx.stroke();
      ctx.fillStyle = sel ? "#ffe08a" : "#2ec4b6";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("◄ ►", mx, pc.y + 14);
    } else if (pc.type === "switch") {
      ctx.fillStyle = sel ? "#ffe08a" : "#4cc9f0";
      ctx.beginPath(); ctx.arc(pc.x, pc.y, SWITCH_R, 0, 7); ctx.fill();
      ctx.fillStyle = "#10122a";
      ctx.beginPath();
      ctx.moveTo(pc.x - pc.dir * 3.5, pc.y - 5);
      ctx.lineTo(pc.x + pc.dir * 5, pc.y);
      ctx.lineTo(pc.x - pc.dir * 3.5, pc.y + 5);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = sel ? "#ffe08a" : "#ff5d73";
      ctx.beginPath(); ctx.arc(pc.x, pc.y, 15, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(pc.x, pc.y, 6, 0, 7); ctx.fill();
    }
    if (po) ctx.restore();
  }

  // path being drawn with the Motion tool
  if (motionRec && motionRec.pts.length > 0) {
    ctx.strokeStyle = "#4cc9f0";
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(motionRec.sx, motionRec.sy);
    for (const q of motionRec.pts) ctx.lineTo(motionRec.sx + q[0], motionRec.sy + q[1]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ramp preview while drawing
  if (drawing) {
    ctx.strokeStyle = drawing.kind === "boost" ? "rgba(255,209,102,0.8)" : "rgba(255,183,3,0.7)";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(drawing.x1, drawing.y1); ctx.lineTo(drawing.x2, drawing.y2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // marbles — batch by hue bucket to cut fillStyle churn
  const TWO_PI = Math.PI * 2;
  for (let bucketHue = 0; bucketHue < 360; bucketHue += 30) {
    ctx.fillStyle = `hsl(${bucketHue + 15}, 85%, 62%)`;
    ctx.beginPath();
    for (let i = 0; i < marbles.length; i++) {
      const m = marbles[i];
      if (m.hue - bucketHue >= 30 || m.hue < bucketHue) continue;
      ctx.moveTo(m.x + MARBLE_R, m.y);
      ctx.arc(m.x, m.y, MARBLE_R, 0, TWO_PI);
    }
    ctx.fill();
  }
}

// ---------- main loop ----------
let last = performance.now(), fps = 60;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  fps = fps * 0.95 + (1 / Math.max(dt, 1e-4)) * 0.05;
  if (!paused) step(dt);
  draw();
  hud.textContent =
    `marbles: ${marbles.length}${spawnQueue ? " (+" + spawnQueue + " incoming)" : ""}` +
    ` · ${collide ? "touch: ON 💥" : "no-touch 👻"} · ${Math.round(fps)} fps`;
  requestAnimationFrame(frame);
}

// ---------- editor ----------
let tool = "ramp";
let selected = null;   // piece object, or spawner
let drawing = null;    // in-progress ramp
let dragInfo = null;   // {piece, mode, ox, oy}
let motionRec = null;  // in-progress path recording {piece, sx, sy, pts}

function canvasPos(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (W / r.width),
    y: (ev.clientY - r.top) * (H / r.height)
  };
}

function pickPiece(px, py) {
  if (Math.abs(px - spawner.x) < 28 && Math.abs(py - spawner.y) < 15) return spawner;
  for (let i = pieces.length - 1; i >= 0; i--) {
    const pc = pieces[i];
    let x = px, y = py;
    if (pc.path) { const o = pathOffset(pc); x -= o[0]; y -= o[1]; }
    if (pc.type === "ramp" || pc.type === "boost") {
      const dx = pc.x2 - pc.x1, dy = pc.y2 - pc.y1;
      const len2 = dx * dx + dy * dy || 1;
      let t = ((x - pc.x1) * dx + (y - pc.y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      if (Math.hypot(x - (pc.x1 + dx * t), y - (pc.y1 + dy * t)) < 9) return pc;
    } else if (pc.type === "spin") {
      if (Math.hypot(x - pc.x, y - pc.y) < 18) return pc;
    } else if (pc.type === "mover") {
      if (Math.abs(x - moverX(pc)) < MOVER_HALF + 6 && Math.abs(y - pc.y) < 12) return pc;
    } else {
      const r = pc.type === "peg" ? 7 : pc.type === "switch" ? SWITCH_R : 15;
      if (Math.hypot(x - pc.x, y - pc.y) < r + 5) return pc;
    }
  }
  return null;
}

cv.addEventListener("pointerdown", (ev) => {
  ev.preventDefault();
  cv.setPointerCapture(ev.pointerId);
  const { x, y } = canvasPos(ev);
  if (tool === "ramp" || tool === "boost") {
    drawing = { x1: x, y1: y, x2: x, y2: y, kind: tool };
  } else if (tool === "peg") {
    pieces.push({ type: "peg", x, y });
  } else if (tool === "bumper") {
    pieces.push({ type: "bumper", x, y });
  } else if (tool === "switch") {
    const hit = pickPiece(x, y);
    if (hit && hit !== spawner && hit.type === "switch") {
      hit.dir = -hit.dir;
      toast(hit.dir > 0 ? "Dot flips right next ➡️" : "Dot flips left next ⬅️");
    } else pieces.push({ type: "switch", x, y, dir: 1 });
  } else if (tool === "spin") {
    const hit = pickPiece(x, y);
    if (hit && hit !== spawner && hit.type === "spin") {
      hit.dir = -hit.dir;
      toast("Spinner reversed! 🌀");
    } else pieces.push({ type: "spin", x, y, dir: 1 });
  } else if (tool === "mover") {
    pieces.push({ type: "mover", x, y });
  } else if (tool === "stamp") {
    stampAt(x, y);
  } else if (tool === "motion") {
    const hit = pickPiece(x, y);
    if (hit === spawner) toast("The dropper can't take a path — pick a piece!");
    else if (hit) { motionRec = { piece: hit, sx: x, sy: y, pts: [[0, 0]] }; selected = hit; }
    else toast("Drag starting on a piece to draw its path ✏️");
  } else if (tool === "erase") {
    const hit = pickPiece(x, y);
    if (hit && hit !== spawner) pieces.splice(pieces.indexOf(hit), 1);
    if (selected === hit) selected = null;
  } else { // select / move
    const hit = pickPiece(x, y);
    selected = hit;
    if (hit === spawner) {
      dragInfo = { piece: hit, mode: "spawner", ox: x - spawner.x, oy: y - spawner.y };
    } else if (hit && (hit.type === "ramp" || hit.type === "boost")) {
      let mode = "whole";
      if (Math.hypot(x - hit.x1, y - hit.y1) < 12) mode = "p1";
      else if (Math.hypot(x - hit.x2, y - hit.y2) < 12) mode = "p2";
      dragInfo = { piece: hit, mode, ox: x, oy: y };
    } else if (hit) {
      const po = hit.path ? pathOffset(hit) : ZERO4;
      dragInfo = { piece: hit, mode: "circle", ox: x - hit.x - po[0], oy: y - hit.y - po[1], sx: hit.x, sy: hit.y };
    }
  }
});

cv.addEventListener("pointermove", (ev) => {
  const { x, y } = canvasPos(ev);
  if (drawing) { drawing.x2 = x; drawing.y2 = y; return; }
  if (motionRec) {
    const last = motionRec.pts[motionRec.pts.length - 1];
    const dx = x - motionRec.sx, dy = y - motionRec.sy;
    if (Math.hypot(dx - last[0], dy - last[1]) > 8)
      motionRec.pts.push([Math.round(dx), Math.round(dy)]);
    return;
  }
  if (!dragInfo) return;
  const p = dragInfo.piece;
  if (dragInfo.mode === "spawner") {
    spawner.x = Math.max(30, Math.min(W - 30, x - dragInfo.ox));
    spawner.y = Math.max(14, Math.min(H - 40, y - dragInfo.oy));
  } else if (dragInfo.mode === "circle") {
    p.x = x - dragInfo.ox; p.y = y - dragInfo.oy;
  } else if (dragInfo.mode === "p1") { p.x1 = x; p.y1 = y; }
  else if (dragInfo.mode === "p2") { p.x2 = x; p.y2 = y; }
  else if (dragInfo.mode === "whole") {
    const dx = x - dragInfo.ox, dy = y - dragInfo.oy;
    p.x1 += dx; p.y1 += dy; p.x2 += dx; p.y2 += dy;
    dragInfo.ox = x; dragInfo.oy = y;
  }
});

cv.addEventListener("pointerup", () => {
  if (motionRec) {
    const pc = motionRec.piece;
    let L = 0;
    for (let i = 1; i < motionRec.pts.length; i++)
      L += Math.hypot(motionRec.pts[i][0] - motionRec.pts[i - 1][0],
                      motionRec.pts[i][1] - motionRec.pts[i - 1][1]);
    if (L >= 15) {
      pc.path = motionRec.pts;
      delete pc._plen;
      toast("Path set — it patrols back and forth! 🛤️");
    } else if (pc.path) {
      delete pc.path;
      delete pc._plen;
      toast("Motion removed — it's frozen again 🧊");
    } else {
      toast("Drag to draw a path, or tap a moving piece to freeze it");
    }
    motionRec = null;
    return;
  }
  if (drawing) {
    if (Math.hypot(drawing.x2 - drawing.x1, drawing.y2 - drawing.y1) > 12) {
      pieces.push({ type: drawing.kind, x1: drawing.x1, y1: drawing.y1, x2: drawing.x2, y2: drawing.y2 });
    }
    drawing = null;
  }
  // a tap (no drag) on a switch dot or spinner in Move mode flips its direction
  if (dragInfo && dragInfo.mode === "circle" &&
      (dragInfo.piece.type === "switch" || dragInfo.piece.type === "spin") &&
      Math.hypot(dragInfo.piece.x - dragInfo.sx, dragInfo.piece.y - dragInfo.sy) < 3) {
    dragInfo.piece.dir = -dragInfo.piece.dir;
  }
  dragInfo = null;
});

window.addEventListener("keydown", (ev) => {
  if ((ev.key === "Delete" || ev.key === "Backspace") && selected && selected !== spawner &&
      document.activeElement.tagName !== "INPUT") {
    pieces.splice(pieces.indexOf(selected), 1);
    selected = null;
    ev.preventDefault();
  }
});

// ---------- one-tap obstacle library ----------
// piece factories (coords relative to the click point)
const pg = (x, y) => ({ type: "peg", x, y });
const bp = (x, y) => ({ type: "bumper", x, y });
const sw = (x, y, dir = 1) => ({ type: "switch", x, y, dir });
const sp = (x, y, dir = 1) => ({ type: "spin", x, y, dir });
const mv = (x, y) => ({ type: "mover", x, y });
const rp = (x1, y1, x2, y2) => ({ type: "ramp", x1, y1, x2, y2 });
const bo = (x1, y1, x2, y2) => ({ type: "boost", x1, y1, x2, y2 });
function row(n, gap, fn) {
  const a = [];
  for (let i = 0; i < n; i++) a.push(fn((i - (n - 1) / 2) * gap));
  return a;
}
function ring(n, r, fn) {
  const a = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * 2 * Math.PI;
    a.push(fn(Math.round(Math.cos(t) * r), Math.round(Math.sin(t) * r)));
  }
  return a;
}
function pyr(rows, gx, gy, fn) {
  const a = [];
  for (let r = 0; r < rows; r++)
    for (let i = 0; i <= r; i++)
      a.push(fn((i - r / 2) * gx, (r - (rows - 1) / 2) * gy, i));
  return a;
}

let stampSel = null; // piece list (relative coords) of the selected obstacle
function stampAt(x, y) {
  if (!stampSel) return;
  for (const pc of stampSel) {
    const c = { ...pc };
    if (c.x1 !== undefined) { c.x1 += x; c.y1 += y; c.x2 += x; c.y2 += y; }
    else { c.x += x; c.y += y; }
    pieces.push(c);
  }
}

document.getElementById("obsSave").onclick = () => {
  if (!pieces.length) { toast("Build something on the canvas first! 🛠"); return; }
  const nameInput = document.getElementById("obsName");
  const store = loadObs();
  const name = nameInput.value.trim() || "My obstacle " + (Object.keys(store).length + 1);
  const comp = compactPieces(pieces);
  // center the obstacle on its bounding box so it stamps around the tap point
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of comp) {
    const seg = p.t === "r" || p.t === "o";
    minX = Math.min(minX, p.a, seg ? p.c : p.a);
    maxX = Math.max(maxX, p.a, seg ? p.c : p.a);
    minY = Math.min(minY, p.b, seg ? p.d : p.b);
    maxY = Math.max(maxY, p.b, seg ? p.d : p.b);
  }
  const cx = Math.round((minX + maxX) / 2), cy = Math.round((minY + maxY) / 2);
  for (const p of comp) {
    p.a -= cx; p.b -= cy;
    if (p.t === "r" || p.t === "o") { p.c -= cx; p.d -= cy; }
  }
  store[name] = comp;
  saveObs(store);
  nameInput.value = "";
  renderCustomStamps();
  toast(`Saved your obstacle “${name}” ⭐`);
};

const LS_KEY = "marbleRunTemplates.v1";

const TYPE_TO_TAG = { peg: "p", bumper: "b", switch: "s", spin: "w", mover: "m" };
const TAG_TO_TYPE = { p: "peg", b: "bumper", s: "switch", w: "spin", m: "mover" };
function compactPieces(list) {
  return list.map(pc => {
    let o;
    if (pc.type === "ramp" || pc.type === "boost")
      o = { t: pc.type === "ramp" ? "r" : "o",
            a: Math.round(pc.x1), b: Math.round(pc.y1), c: Math.round(pc.x2), d: Math.round(pc.y2) };
    else if (pc.type === "switch" || pc.type === "spin")
      o = { t: TYPE_TO_TAG[pc.type], a: Math.round(pc.x), b: Math.round(pc.y), d: pc.dir };
    else
      o = { t: TYPE_TO_TAG[pc.type], a: Math.round(pc.x), b: Math.round(pc.y) };
    if (pc.path && pc.path.length > 1)
      o.pth = pc.path.map(q => [Math.round(q[0]), Math.round(q[1])]);
    return o;
  });
}
function layoutData() {
  return {
    v: 1,
    spawner: { x: Math.round(spawner.x), y: Math.round(spawner.y) },
    pieces: compactPieces(pieces)
  };
}
const numOr = (v, fb) => (typeof v === "number" && isFinite(v)) ? v : fb;
function decompactPieces(arr) {
  return arr
    .map(p => {
      const o =
        (p.t === "r" || p.t === "o")
          ? { type: p.t === "r" ? "ramp" : "boost", x1: numOr(p.a), y1: numOr(p.b), x2: numOr(p.c), y2: numOr(p.d) }
        : (p.t === "s" || p.t === "w")
          ? { type: TAG_TO_TYPE[p.t], x: numOr(p.a), y: numOr(p.b), dir: p.d === -1 ? -1 : 1 }
          : { type: TAG_TO_TYPE[p.t] || "peg", x: numOr(p.a), y: numOr(p.b) };
      if (Array.isArray(p.pth)) {
        const pts = p.pth
          .filter(q => Array.isArray(q) && isFinite(q[0]) && isFinite(q[1]))
          .map(q => [+q[0], +q[1]]);
        if (pts.length > 1) o.path = pts;
      }
      return o;
    })
    .filter(p => (p.type === "ramp" || p.type === "boost")
      ? [p.x1, p.y1, p.x2, p.y2].every(isFinite)
      : [p.x, p.y].every(isFinite));
}
function applyLayout(data) {
  if (!data || !Array.isArray(data.pieces)) return false;
  spawner.x = numOr(data.spawner?.x, W / 2);
  spawner.y = numOr(data.spawner?.y, 26);
  pieces = decompactPieces(data.pieces);
  selected = null;
  return true;
}

function encodeLayout(data) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeLayout(str) {
  try {
    const b64 = str.replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch { return null; }
}

function loadStore() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch { return {}; }
}
function saveStore(store) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch { toast("Couldn't save — storage is full 😢"); }
}

function pegLine(ps, x1, y1, x2, y2, gap = 16, skip = null) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.max(1, Math.round(d / gap));
  for (let i = 0; i <= n; i++) {
    const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n;
    if (skip && skip(x, y)) continue;
    ps.push({ type: "peg", x, y });
  }
}

function templateURL(data) {
  return location.origin + location.pathname + "#t=" + encodeLayout(data);
}
async function copyLink(data, name) {

}

function renderTplList() {
  const list = document.getElementById("tplList");
  list.innerHTML = "";
  const addCard = (name, data, preset) => {
    const card = document.createElement("div");
    card.className = "tplCard";
    const label = document.createElement("span");
    label.className = "name" + (preset ? " preset" : "");
    label.textContent = (preset ? "★ " : "") + name;
    card.appendChild(label);
    const loadBtn = document.createElement("button");
    loadBtn.textContent = "Load";
    loadBtn.onclick = () => {
      applyLayout({ v: 1, ...data });
      toast(`Loaded “${name}” 🛠`);
    };
    card.appendChild(loadBtn);
    const linkBtn = document.createElement("button");
    linkBtn.textContent = "🔗";
    linkBtn.title = "Copy shareable link";
    linkBtn.onclick = () => copyLink({ v: 1, ...data }, name);
    card.appendChild(linkBtn);
    if (!preset) {
      const delBtn = document.createElement("button");
      delBtn.textContent = "✕";
      delBtn.className = "warn";
      delBtn.title = "Delete template";
      delBtn.onclick = () => {
        const store = loadStore();
        delete store[name];
        saveStore(store);
        renderTplList();

  for (const [name, make] of Object.entries(PRESETS)) {
    const d = make();
    addCard(name, { spawner: d.spawner, pieces: compactPieces(d.pieces) }, true);
  }
  const store = loadStore();
  for (const name of Object.keys(store).sort()) addCard(name, store[name], false);
}

document.getElementById("tplSave").onclick = () => {
  const nameInput = document.getElementById("tplName");
  const name = nameInput.value.trim() || "My track " + new Date().toLocaleTimeString();
  const store = loadStore();
  store[name] = layoutData();
  saveStore(store);
  nameInput.value = "";
  renderTplList();
  toast(`Saved “${name}” 💾`);
};
document.getElementById("tplLink").onclick = () => copyLink(layoutData(), "this track");

// load from a shared link
function tryLoadFromHash() {
  const m = location.hash.match(/#t=([A-Za-z0-9_-]+)/);
  if (!m) return false;
  const data = decodeLayout(m[1]);
  if (data && applyLayout(data)) {
    toast("Loaded a shared track! 🔗✨");
    return true;
  }
  return false;
}
window.addEventListener("hashchange", tryLoadFromHash);

// ---------- boot ----------
renderTplList();
renderCustomStamps();
if (!tryLoadFromHash()) {
  const d = PRESETS["Switcheroo"]();
  applyLayout({ v: 1, spawner: d.spawner, pieces: compactPieces(d.pieces) });
}
spawnQueue = 200;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbital Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #04060f; font-family: 'Segoe UI', system-ui, sans-serif; border: none; }
  #space { position: fixed; inset: 0; touch-action: none; cursor: crosshair; display: block; border: none; outline: none; }

  #toolbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    max-width: 96vw; padding: 8px 10px; border-radius: 14px;
    background: rgba(10, 14, 30, 0.82); border: 1px solid rgba(120, 140, 255, 0.25);
    backdrop-filter: blur(6px); z-index: 10;
  }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 8px; border-radius: 10px; border: 1px solid transparent;
    background: rgba(255,255,255,0.05); color: #cdd6ff; font-size: 10px;
    cursor: pointer; user-select: none; min-width: 52px;
  }
  .tool:hover { background: rgba(255,255,255,0.12); }
  .tool.active { border-color: #7c9bff; background: rgba(90, 120, 255, 0.25); color: #fff; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }

  #panel {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
    max-width: 96vw; padding: 8px 14px; border-radius: 14px;
    background: rgba(10, 14, 30, 0.82); border: 1px solid rgba(120, 140, 255, 0.25);
    backdrop-filter: blur(6px); z-index: 10; color: #cdd6ff; font-size: 12px;
  }
  #panel label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #panel input[type=range] { width: 80px; accent-color: #7c9bff; }
  #panel input[type=checkbox] { accent-color: #7c9bff; }
  .btn {
    padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(120,140,255,0.4);
    background: rgba(90, 120, 255, 0.18); color: #e5ebff; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: rgba(90, 120, 255, 0.35); }
  .btn.active { background: rgba(255, 120, 80, 0.4); border-color: #ff9060; color: #fff; }
  #count { color: #8fa3ff; font-weight: 600; }

  #hint {
    position: absolute; top: 140px; left: 50%; transform: translateX(-50%);
    color: rgba(200, 210, 255, 0.55); font-size: 12px; z-index: 5;
    pointer-events: none; text-align: center; padding: 0 12px;
    transition: opacity 1.5s; white-space: nowrap; max-width: 96vw;
  }
  #infoPanel {
    position: absolute; top: 10px; right: 10px; width: 238px;
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px; border-radius: 14px;
    background: rgba(10, 14, 30, 0.88); border: 1px solid rgba(120, 140, 255, 0.25);
    backdrop-filter: blur(6px); z-index: 11; color: #cdd6ff; font-size: 12px;
  }
  #infoPanel[hidden] { display: none; }
  #infoHeader { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  #infoTitle { font-weight: 600; color: #fff; font-size: 13px; }
  #infoPanel .btn { padding: 3px 8px; font-size: 11px; white-space: nowrap; }
  #infoBody { display: flex; flex-direction: column; gap: 6px; }
  #infoPanel canvas { width: 100%; height: 60px; background: rgba(255,255,255,0.04); border-radius: 6px; }
  .glabel { color: rgba(200, 210, 255, 0.6); font-size: 10px; margin-top: -3px; }
  #xRow { display: flex; align-items: center; gap: 6px; }
  #xRow input[type=range] { flex: 1; accent-color: #7c9bff; }
  #rateBox {
    background: rgba(90, 120, 255, 0.15); border: 1px solid rgba(120, 140, 255, 0.3);
    border-radius: 8px; padding: 6px 8px; font-weight: 600; color: #fff;
  }
  @media (max-width: 700px) {
    .tool { min-width: 44px; font-size: 9px; }
    #panel input[type=range] { width: 60px; }
    #infoPanel { top: auto; bottom: 120px; right: 6px; width: 200px; }
  }
</style>
</head>
<body>
<canvas id="space"></canvas>

<div id="toolbar"></div>

<div id="hint">Click empty space to place &bull; click an object to follow it &bull; drag to fling &bull; scroll / pinch to zoom &bull; two fingers to pan</div>

<div id="infoPanel" hidden>
  <div id="infoHeader">
    <span id="infoTitle"></span>
    <button class="btn" id="stopFollowBtn">&#9209; Stop Recenter</button>
  </div>
  <div id="infoBody">
    <div id="infoAge"></div>
    <div id="infoHits"></div>
    <canvas id="graphCum" width="214" height="60"></canvas>
    <div class="glabel">Total collisions over its life</div>
    <canvas id="graphRate" width="214" height="60"></canvas>
    <div class="glabel">Collisions per <span id="xVal">5</span>s chunk</div>
    <div id="xRow">X <input type="range" id="xSlider" min="1" max="30" step="1" value="5"> <span id="xVal2">5s</span></div>
    <div id="rateBox"></div>
  </div>
</div>

<div id="panel">
  <label>Size <input type="range" id="sizeSlider" min="0.5" max="2.2" step="0.05" value="1"></label>
  <label>Speed <input type="range" id="timeSlider" min="0" max="3" step="0.05" value="1"></label>
  <label>Gravity <input type="range" id="gravSlider" min="0.2" max="3" step="0.05" value="1"></label>
  <label><input type="checkbox" id="autoOrbit" checked> auto-orbit</label>
  <label><input type="checkbox" id="showTrails" checked> trails</label>
  <button class="btn" id="pauseBtn">&#10074;&#10074; Pause</button>
  <button class="btn" id="spamBtn">&#128165; Spam</button>
  <button class="btn" id="messBtn">&#127922; Big Mess</button>
  <button class="btn" id="presetBtn">&#9728; Solar System</button>
  <button class="btn" id="clearBtn">Clear</button>
  <span id="count">0 bodies</span>
</div>

<script>
'use strict';

// ---------------------------------------------------------------- constants
const G_BASE = 1200;          // gravitational constant (px^3 / mass / s^2)
const SOFTEN = 40;            // gravity softening to avoid slingshot singularities
const MAX_BODIES = 1100;
const IMPACT_COOL = 10;       // seconds for a fresh impact scar to cool into a gray crater
const SHATTER_SPEED = 240;    // relative impact speed (px/s) that shatters bodies
const SUPERNOVA_MASS = 62000; // stars heavier than this go supernova
const TRAIL_LEN = 70;
const TAU = Math.PI * 2;

// ---------------------------------------------------------------- body types
const TYPES = {
  starRed:    { label: 'Red Star',    star: true,  mass: 14000, r: 34, color: '#ff5040' },
  starOrange: { label: 'Orange Star', star: true,  mass: 18000, r: 36, color: '#ff9430' },
  starYellow: { label: 'Yellow Star', star: true,  mass: 22000, r: 38, color: '#ffd94a' },
  starWhite:  { label: 'White Star',  star: true,  mass: 26000, r: 32, color: '#f2f4ff' },
  starBlue:   { label: 'Blue Star',   star: true,  mass: 32000, r: 42, color: '#6fa8ff' },
  starBlack:  { label: 'Black Dwarf', star: true,  mass: 10000, r: 22, color: '#3a3348' },
  gasGiant:   { label: 'Gas Giant',   star: false, mass: 900,   r: 24, color: '#e0a960' },
  earth:      { label: 'Planet',      star: false, mass: 220,   r: 14, color: '#3f8fd8' },
  rocky:      { label: 'Rocky',       star: false, mass: 160,   r: 12, color: '#c07850' },
  moon:       { label: 'Moon',        star: false, mass: 24,    r: 7,  color: '#b8b8c0' },
  asteroid:   { label: 'Asteroid',    star: false, mass: 7.3,   r: 3,  color: '#8a7f72' }, // 1/30 of a planet
};

// ---------------------------------------------------------------- state
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const cam = { x: 0, y: 0, zoom: 1 };

const bodies = [];
const effects = [];   // supernova rings, flashes, collision sparks
let selectedType = 'starYellow';
let paused = false;
let idCounter = 0;
let followed = null;   // body the camera is locked onto
let spamMode = false;  // hold-and-drag fires an asteroid stream
const spray = { on: false, sx: 0, sy: 0, dx: 1, dy: 0, acc: 0 };

const ui = {
  size: document.getElementById('sizeSlider'),
  time: document.getElementById('timeSlider'),
  grav: document.getElementById('gravSlider'),
  autoOrbit: document.getElementById('autoOrbit'),
  trails: document.getElementById('showTrails'),
  count: document.getElementById('count'),
};

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

function screenToWorld(sx, sy) {
  return {
    x: (sx * devicePixelRatio - W / 2) / cam.zoom + cam.x,
    y: (sy * devicePixelRatio - H / 2) / cam.zoom + cam.y,
  };
}

// ---------------------------------------------------------------- textures
// Every body gets its own procedurally painted texture on an offscreen canvas.
const TEX_SIZE = 128;

function makeTexture(type, seedColor, size = TEX_SIZE) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const R = size / 2;

  g.save();
  g.beginPath();
  g.arc(R, R, R - 1, 0, TAU);
  g.clip();

  switch (type) {
    case 'earth': paintEarth(g, R); break;
    case 'rocky': paintRocky(g, R, Array.isArray(seedColor) ? seedColor : null); break;
    case 'gasGiant': paintGasGiant(g, R); break;
    case 'moon': paintMoon(g, R); break;
    case 'asteroid': paintAsteroid(g, R, Array.isArray(seedColor) ? seedColor : null); break;
    default: paintStar(g, R, seedColor, type === 'starBlack');
  }

  // limb shading so everything looks like a lit sphere
  if (type !== 'starBlack' && !type.startsWith('star')) {
    const sh = g.createRadialGradient(R * 0.65, R * 0.6, R * 0.15, R, R, R * 1.35);
    sh.addColorStop(0, 'rgba(255,255,255,0.10)');
    sh.addColorStop(0.55, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(0,0,20,0.75)');
    g.fillStyle = sh;
    g.fillRect(0, 0, size, size);
  }
  g.restore();
  return c;
}

function paintEarth(g, R) {
  // random world generator: every planet rolls a style archetype, then random
  // palettes, continent counts, ice caps, and clouds on top — no two look alike
  const kinds = [
    // [sea hue/sat/light]        [land hue/sat/light]          blobs   caps  clouds
    { sea: [rand(195, 230), rand(50, 80), rand(28, 45)], land: [rand(75, 140), rand(30, 65), rand(24, 45)],  blobs: [4, 9],  caps: 0.8,  clouds: [3, 7] },  // earthlike
    { sea: [rand(180, 250), rand(55, 85), rand(20, 40)], land: [rand(80, 200), rand(25, 55), rand(30, 50)],  blobs: [1, 3],  caps: 0.4,  clouds: [5, 9] },  // ocean world
    { sea: [rand(25, 48),  rand(35, 65), rand(45, 62)],  land: [rand(12, 40),  rand(30, 60), rand(26, 45)],  blobs: [6, 12], caps: 0.15, clouds: [0, 2] },  // desert
    { sea: [rand(185, 215), rand(15, 40), rand(70, 86)], land: [rand(190, 220), rand(25, 50), rand(55, 72)], blobs: [5, 10], caps: 1,    clouds: [1, 4] },  // ice world
    { sea: [rand(5, 20),   rand(45, 75), rand(10, 18)],  land: [rand(8, 30),   rand(85, 100), rand(44, 58)], blobs: [6, 12], caps: 0,    clouds: [0, 0] },  // lava world
    { sea: [rand(0, 360),  rand(40, 80), rand(22, 50)],  land: null,                                         blobs: [4, 10], caps: 0.3,  clouds: [0, 5] },  // alien world
  ];
  const k = kinds[randInt(0, kinds.length - 1)];
  g.fillStyle = `hsl(${k.sea[0]}, ${k.sea[1]}%, ${k.sea[2]}%)`;
  g.fillRect(0, 0, R * 2, R * 2);
  // land masses; alien worlds pick a hue clashing with their sea
  const land = k.land || [(k.sea[0] + rand(90, 270)) % 360, rand(35, 70), rand(25, 55)];
  const n = randInt(k.blobs[0], k.blobs[1]);
  for (let i = 0; i < n; i++) {
    g.fillStyle = `hsl(${land[0] + rand(-14, 14)}, ${Math.min(100, land[1] + rand(-8, 8))}%, ${land[2] + rand(-8, 8)}%)`;
    blob(g, rand(0, R * 2), rand(R * 0.25, R * 1.75), rand(R * 0.18, R * 0.5));
  }
  if (Math.random() < k.caps) {
    g.fillStyle = 'rgba(240, 248, 255, 0.9)';
    blob(g, R, -R * 0.15, R * rand(0.3, 0.5));
    blob(g, R, R * 2.15, R * rand(0.3, 0.5));
  }
  const nc = randInt(k.clouds[0], k.clouds[1]);
  g.fillStyle = 'rgba(255,255,255,0.28)';
  for (let i = 0; i < nc; i++) blob(g, rand(0, R * 2), rand(0, R * 2), rand(R * 0.1, R * 0.22));
}

function paintRocky(g, R, base) {
  // base (an [h,s,l] array) tints the whole planet — used by compacted rubble piles
  const hue = base ? base[0] : (Math.random() < 0.6 ? rand(5, 45) : rand(0, 360));
  const sat = base ? base[1] : rand(30, 55);
  const light = base ? Math.max(25, Math.min(60, base[2])) : rand(35, 50);
  g.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
  g.fillRect(0, 0, R * 2, R * 2);
  for (let i = 0; i < 9; i++) {
    g.fillStyle = `hsla(${hue + rand(-12, 12)}, ${Math.min(100, sat + rand(-10, 10))}%, ${light + rand(-13, 10)}%, 0.6)`;
    blob(g, rand(0, R * 2), rand(0, R * 2), rand(R * 0.12, R * 0.4));
  }
  craters(g, R, randInt(4, 8));
}

function paintGasGiant(g, R) {
  const hue = Math.random() < 0.6
    ? (Math.random() < 0.5 ? rand(18, 45) : rand(190, 260))       // classic tan or blue giants
    : rand(0, 360);                                               // ...or any exotic color
  const bands = randInt(6, 10);
  for (let i = 0; i < bands; i++) {
    g.fillStyle = `hsl(${hue + rand(-15, 15)}, ${rand(35, 65)}%, ${rand(38, 66)}%)`;
    const y = (i / bands) * R * 2;
    g.fillRect(0, y, R * 2, R * 2 / bands + 2);
  }
  // great storm spot
  g.fillStyle = `hsla(${hue + rand(-30, 30)}, 70%, ${rand(45, 70)}%, 0.85)`;
  g.beginPath();
  g.ellipse(rand(R * 0.5, R * 1.5), rand(R * 0.6, R * 1.4), R * 0.28, R * 0.16, 0, 0, TAU);
  g.fill();
}

function paintMoon(g, R) {
  const l = rand(55, 72);
  g.fillStyle = `hsl(240, 5%, ${l}%)`;
  g.fillRect(0, 0, R * 2, R * 2);
  for (let i = 0; i < 7; i++) {
    g.fillStyle = `hsla(240, 6%, ${l + rand(-14, 8)}%, 0.7)`;
    blob(g, rand(0, R * 2), rand(0, R * 2), rand(R * 0.15, R * 0.4));
  }
  craters(g, R, randInt(6, 11));
}

function paintAsteroid(g, R, hsl) {
  const [h, s, l] = hsl || [rand(20, 40), rand(10, 25), rand(28, 42)];
  g.fillStyle = `hsl(${h}, ${s}%, ${l}%)`;
  g.fillRect(0, 0, R * 2, R * 2);
  for (let i = 0; i < 5; i++) {
    g.fillStyle = `hsla(${h + rand(-10, 10)}, ${s}%, ${l + rand(-12, 10)}%, 0.6)`;
    blob(g, rand(0, R * 2), rand(0, R * 2), rand(R * 0.15, R * 0.4));
  }
  craters(g, R, randInt(3, 6));
}

function paintStar(g, R, color, isBlack) {
  if (isBlack) {
    // a burnt-out black dwarf: dark core, faint smoldering rim (NOT a black hole — it just sits there)
    g.fillStyle = '#0b0812';
    g.fillRect(0, 0, R * 2, R * 2);
    const rim = g.createRadialGradient(R, R, R * 0.3, R, R, R);
    rim.addColorStop(0, 'rgba(20, 12, 30, 1)');
    rim.addColorStop(0.75, 'rgba(70, 40, 90, 0.55)');
    rim.addColorStop(1, 'rgba(140, 80, 160, 0.85)');
    g.fillStyle = rim;
    g.fillRect(0, 0, R * 2, R * 2);
    for (let i = 0; i < 5; i++) {
      g.fillStyle = 'rgba(160, 100, 200, 0.35)';
      blob(g, rand(0, R * 2), rand(0, R * 2), rand(R * 0.06, R * 0.14));
    }
    return;
  }
  const grad = g.createRadialGradient(R, R, 0, R, R, R);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.35, color);
  grad.addColorStop(1, shade(color, -35));
  g.fillStyle = grad;
  g.fillRect(0, 0, R * 2, R * 2);
  // granulation speckles
  for (let i = 0; i < 14; i++) {
    g.fillStyle = i % 2 ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.10)';
    blob(g, rand(0, R * 2), rand(0, R * 2), rand(R * 0.05, R * 0.16));
  }
}

function blob(g, x, y, r) {
  // lumpy organic blob from overlapping circles
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  g.fill();
  for (let i = 0; i < 4; i++) {
    const a = rand(0, TAU);
    g.beginPath();
    g.arc(x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, r * rand(0.35, 0.65), 0, TAU);
    g.fill();
  }
}

function craters(g, R, n) {
  for (let i = 0; i < n; i++) {
    const x = rand(R * 0.15, R * 1.85), y = rand(R * 0.15, R * 1.85), cr = rand(R * 0.05, R * 0.18);
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.arc(x, y, cr, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.beginPath(); g.arc(x - cr * 0.3, y - cr * 0.3, cr * 0.55, 0, TAU); g.fill();
  }
}

function shade(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (num >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (num & 255) + amt));
  return `rgb(${r},${g},${b})`;
}

// pre-rendered star glow sprite (radial gradient), tinted per star color
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, color);
  grad.addColorStop(0.4, colorWithAlpha(color, 0.25));
  grad.addColorStop(1, colorWithAlpha(color, 0));
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  glowCache[color] = c;
  return c;
}
function colorWithAlpha(hex, a) {
  const num = parseInt(hex.slice(1), 16);
  return `rgba(${num >> 16},${(num >> 8) & 255},${num & 255},${a})`;
}

// ---------------------------------------------------------------- bodies
function makeBody(type, x, y, vx, vy, sizeMul = 1, massOverride = null) {
  const def = TYPES[type];
  const r = def.r * sizeMul;
  const mass = massOverride !== null ? massOverride : def.mass * sizeMul * sizeMul;
  // asteroids roll their own tint: red, orange, yellow, or gray — nothing exotic
  let color = def.color, astHSL = null;
  if (type === 'asteroid') {
    astHSL = Math.random() < 0.35
      ? [rand(20, 45), rand(4, 14), rand(30, 58)]   // gray (a hint of warmth)
      : [rand(0, 58), rand(35, 75), rand(30, 55)];  // red → orange → yellow

    color = `hsl(${astHSL[0].toFixed(0)}, ${astHSL[1].toFixed(0)}%, ${astHSL[2].toFixed(0)}%)`;
  }
  return {
    id: idCounter++,
    type, x, y, vx, vy, mass, r,
    star: def.star,
    color,
    rgbTint: astHSL ? hslToRgb(astHSL[0], astHSL[1], astHSL[2]) : null,
    texture: makeTexture(type, astHSL || def.color, type === 'asteroid' ? 48 : TEX_SIZE),
    trail: [],
    impacts: [],         // hot asteroid-strike scars still cooling on the surface
    rot: rand(0, TAU),
    rotSpeed: rand(-0.6, 0.6),
    novaTimer: -1,       // >=0 means counting down to supernova
    captureCd: 1.5,      // asteroids: cooldown between orbit-capture rolls
    age: 0,
    totalHits: 0,        // things that have collided into this body
    hitCounts: { asteroid: 0, moon: 0, planet: 0, other: 0 },
    hitTimes: [],        // body-age timestamps of each hit, for the info graphs
  };
}

function addBody(b) {
  if (bodies.length >= MAX_BODIES) return false;
  bodies.push(b);
  return true;
}

function bodyAt(x, y) {
  let best = null, bestD = Infinity;
  for (const b of bodies) {
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < Math.max(b.r * 1.15, 12 / cam.zoom) && d < bestD) { bestD = d; best = b; }
  }
  return best;
}

// strongest gravitational attractor at a point (for auto-orbit placement)
function dominantAttractor(x, y) {
  let best = null, bestPull = 0;
  for (const b of bodies) {
    const dx = b.x - x, dy = b.y - y;
    const d2 = dx * dx + dy * dy + 1;
    const pull = b.mass / d2;
    if (pull > bestPull) { bestPull = pull; best = b; }
  }
  return best;
}

function circularOrbitVelocity(x, y, attractor) {
  const G = G_BASE * parseFloat(ui.grav.value);
  const dx = x - attractor.x, dy = y - attractor.y;
  const d = Math.hypot(dx, dy) || 1;
  const v = Math.sqrt(G * attractor.mass / d);
  // perpendicular (counterclockwise), riding along with the attractor
  return { vx: attractor.vx + (-dy / d) * v, vy: attractor.vy + (dx / d) * v };
}

// ---------------------------------------------------------------- physics
let accX = new Float64Array(0), accY = new Float64Array(0);

function stepPhysics(dt) {
  const G = G_BASE * parseFloat(ui.grav.value);
  const n = bodies.length;

  // pairwise gravity, symmetric pairs (semi-implicit Euler)
  if (accX.length < n) { accX = new Float64Array(n); accY = new Float64Array(n); }
  accX.fill(0, 0, n); accY.fill(0, 0, n);
  const S2 = SOFTEN * SOFTEN;
  for (let i = 0; i < n; i++) {
    const a = bodies[i];
    for (let j = i + 1; j < n; j++) {
      const b = bodies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy + S2;
      const f = G / (d2 * Math.sqrt(d2));
      const fb = f * b.mass, fa = f * a.mass;
      accX[i] += dx * fb; accY[i] += dy * fb;
      accX[j] -= dx * fa; accY[j] -= dy * fa;
    }
  }
  for (let i = 0; i < n; i++) {
    bodies[i].vx += accX[i] * dt;
    bodies[i].vy += accY[i] * dt;
  }
  const exploding = [];
  for (const b of bodies) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += b.rotSpeed * dt;
    b.age += dt;
    if (b.novaTimer >= 0) {
      b.novaTimer -= dt;
      if (b.novaTimer <= 0) exploding.push(b);
    }
    // impact scars cool down; fully cooled ones bake into the texture as craters
    for (let i = b.impacts.length - 1; i >= 0; i--) {
      const imp = b.impacts[i];
      imp.age += dt;
      if (imp.age >= IMPACT_COOL) { paintCrater(b, imp); b.impacts.splice(i, 1); }
    }
  }
  for (const b of exploding) explodeSupernova(b);

  handleCollisions();
  tryCaptures(dt);

  // stars that grew too fat begin their death throes
  for (const b of bodies) {
    if (b.star && b.type !== 'starBlack' && b.novaTimer < 0 && b.mass > SUPERNOVA_MASS) {
      b.novaTimer = 1.6;
    }
  }
}

// an asteroid wandering near a world has a 50% chance to get pulled into orbit
function tryCaptures(dt) {
  const G = G_BASE * parseFloat(ui.grav.value);
  for (const ast of bodies) {
    if (ast.type !== 'asteroid') continue;
    if (ast.captureCd > 0) { ast.captureCd -= dt; continue; }
    for (const w of bodies) {
      if (w === ast || w.star || w.type === 'asteroid') continue; // moons, planets, rocky, gas giants
      if (w.mass < ast.mass * 3) continue;                        // too puny to capture anything
      const dx = ast.x - w.x, dy = ast.y - w.y;
      const capR = w.r * 5;
      const d2 = dx * dx + dy * dy;
      if (d2 > capR * capR || d2 < (w.r + ast.r) ** 2 * 2) continue; // near, but not touching
      ast.captureCd = 6; // one roll per encounter, then leave it alone a while
      if (Math.random() < 0.5) {
        const d = Math.sqrt(d2);
        // circular speed under the softened gravity actually simulated
        const v = Math.sqrt(G * w.mass * d2 / Math.pow(d2 + SOFTEN * SOFTEN, 1.5));
        // orbit in whichever direction it was already swinging past
        const cross = dx * (ast.vy - w.vy) - dy * (ast.vx - w.vx);
        const s = cross >= 0 ? 1 : -1;
        ast.vx = w.vx + (-dy / d) * v * s;
        ast.vy = w.vy + (dx / d) * v * s;
        spawnSparks(ast.x, ast.y, 4, ast.color);
      }
      break;
    }
  }
}

function handleCollisions() {
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const a = bodies[i], b = bodies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      if (dx * dx + dy * dy > rr * rr * 0.81) continue; // need real overlap, not a graze
      // fresh debris gets a grace period so a new asteroid cloud doesn't instantly clump
      if (a.type === 'asteroid' && b.type === 'asteroid' && (a.age < 2 || b.age < 2)) continue;

      const relSpeed = Math.hypot(a.vx - b.vx, a.vy - b.vy);

      if (a.star && b.star) {
        mergeBodies(a, b);           // star + star: fuse (may trigger supernova)
      } else if (a.star || b.star) {
        const star = a.star ? a : b, other = a.star ? b : a;
        absorb(star, other);         // stars swallow whatever falls in
      } else if (a.type === 'asteroid' && b.type === 'asteroid') {
        // asteroid pile-up: 99% clump into a bigger rock, 1% smash into even more shards
        if (Math.random() < 0.01) shatter(a, b);
        else mergeBodies(a, b);
      } else if (a.type === 'asteroid' || b.type === 'asteroid') {
        // asteroid strikes a world: glowing scar that cools to a crater, plus ejecta
        const ast = a.type === 'asteroid' ? a : b;
        asteroidImpact(ast === a ? b : a, ast);
      } else if (relSpeed > SHATTER_SPEED) {
        shatter(a, b);               // fast impact: smash both into asteroids
      } else {
        mergeBodies(a, b);           // gentle impact: clump together
      }
      return handleCollisions();     // body list changed; restart scan
    }
  }
}

function recordHit(b, type) {
  b.totalHits++;
  const k = type === 'asteroid' ? 'asteroid'
    : type === 'moon' ? 'moon'
    : (type === 'earth' || type === 'rocky' || type === 'gasGiant') ? 'planet'
    : 'other';
  b.hitCounts[k]++;
  b.hitTimes.push(b.age);
  if (b.hitTimes.length > 600) b.hitTimes.shift();
}

function mergeBodies(a, b) {
  const big = a.mass >= b.mass ? a : b;
  const small = big === a ? b : a;
  const m = big.mass + small.mass;
  recordHit(big, small.type);
  // merged rubble blends its color, weighted by mass
  if (big.rgbTint && small.rgbTint) {
    for (let i = 0; i < 3; i++) {
      big.rgbTint[i] = (big.rgbTint[i] * big.mass + small.rgbTint[i] * small.mass) / m;
    }
  }
  big.vx = (big.vx * big.mass + small.vx * small.mass) / m;
  big.vy = (big.vy * big.mass + small.vy * small.mass) / m;
  big.x = (big.x * big.mass + small.x * small.mass) / m;
  big.y = (big.y * big.mass + small.y * small.mass) / m;
  big.mass = m;
  big.r = Math.cbrt(big.r ** 3 + small.r ** 3);
  spawnSparks(big.x, big.y, 6, big.color);
  if (followed === small) followed = big;
  removeBody(small);
  // a rubble pile grown to rocky-planet size compacts into a real planet,
  // and anything that keeps growing to gas-giant size becomes a gas giant —
  // both transformations keep the body's mass exactly as it was
  if (big.type === 'asteroid' && big.r >= TYPES.rocky.r) asteroidToRocky(big);
  if (!big.star && big.type !== 'gasGiant' && big.r >= TYPES.gasGiant.r) toGasGiant(big);
}

function toGasGiant(b) {
  b.type = 'gasGiant';
  b.color = TYPES.gasGiant.color;
  b.texture = makeTexture('gasGiant', TYPES.gasGiant.color, TEX_SIZE);
  b.impacts = [];
  b.rgbTint = null;
  spawnSparks(b.x, b.y, 14, b.color);
  effects.push({ kind: 'flash', x: b.x, y: b.y, t: 0, dur: 0.5, r: b.r * 3, color: '#e0c090' });
}

function asteroidToRocky(b) {
  b.type = 'rocky';
  const hsl = rgbToHsl(b.rgbTint[0], b.rgbTint[1], b.rgbTint[2]);
  b.color = `hsl(${Math.round(hsl[0])}, ${Math.round(hsl[1])}%, ${Math.round(hsl[2])}%)`;
  b.texture = makeTexture('rocky', hsl, TEX_SIZE); // averaged tint of everything merged in
  b.impacts = [];
  spawnSparks(b.x, b.y, 14, b.color);
  effects.push({ kind: 'flash', x: b.x, y: b.y, t: 0, dur: 0.5, r: b.r * 3, color: b.color });
}

function absorb(star, other) {
  recordHit(star, other.type);
  const m = star.mass + other.mass;
  star.vx = (star.vx * star.mass + other.vx * other.mass) / m;
  star.vy = (star.vy * star.mass + other.vy * other.mass) / m;
  star.mass = m;
  star.r = Math.cbrt(star.r ** 3 + other.r ** 3 * 0.25); // matter compresses into the star
  spawnSparks(other.x, other.y, 10, '#ffd080');
  if (followed === other) followed = star;
  removeBody(other);
}

const isPlanet = t => t === 'earth' || t === 'rocky' || t === 'gasGiant';

function shatter(a, b) {
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  const cmass = a.mass + b.mass;
  const cvx = (a.vx * a.mass + b.vx * b.mass) / cmass;
  const cvy = (a.vy * a.mass + b.vy * b.mass) / cmass;
  // two planets colliding blow apart into a huge debris cloud (~100 asteroids);
  // smaller stuff (moons, stray rocks) breaks into just a handful
  const bigCrash = isPlanet(a.type) && isPlanet(b.type);
  const want = bigCrash ? randInt(92, 108) : randInt(6, 12);
  const count = Math.min(want, Math.max(2, MAX_BODIES - bodies.length + 2));
  spawnSparks(cx, cy, bigCrash ? 40 : 18, '#ffb060');
  effects.push({ kind: 'flash', x: cx, y: cy, t: 0, dur: bigCrash ? 0.6 : 0.35, r: (a.r + b.r) * (bigCrash ? 4 : 2), color: '#ffd9a0' });
  removeBody(a);
  removeBody(b);
  for (let k = 0; k < count; k++) {
    const ang = rand(0, TAU), spd = bigCrash ? rand(40, 190) : rand(30, 130);
    const spread = (a.r + b.r) * (bigCrash ? 2.5 : 1);
    const frag = makeBody('asteroid', cx + Math.cos(ang) * rand(4, spread),
      cy + Math.sin(ang) * rand(4, spread),
      cvx + Math.cos(ang) * spd, cvy + Math.sin(ang) * spd,
      bigCrash ? rand(0.4, 1.1) : rand(0.6, 1.4));
    frag.mass = Math.max(0.5, cmass / count * 0.4); // most mass is vaporized
    addBody(frag);
  }
}

function asteroidImpact(world, ast) {
  const relSpeed = Math.hypot(world.vx - ast.vx, world.vy - ast.vy);
  const m = world.mass + ast.mass;
  world.vx = (world.vx * world.mass + ast.vx * ast.mass) / m;
  world.vy = (world.vy * world.mass + ast.vy * ast.mass) / m;
  const fullMass = world.mass + ast.mass; // asteroid buries itself in the crust

  // scar position in texture-local coordinates so it spins with the world
  recordHit(world, 'asteroid');
  const ang = Math.atan2(ast.y - world.y, ast.x - world.x);
  const local = ang - world.rot;
  const sr = Math.max(7, Math.min(22, (ast.r / world.r) * 64 * 2.2));
  world.impacts.push({ lx: Math.cos(local) * 40, ly: Math.sin(local) * 40, r: sr, age: 0 });
  if (world.impacts.length > 10) { paintCrater(world, world.impacts[0]); world.impacts.shift(); }

  spawnSparks(ast.x, ast.y, 8, '#ffb060');
  if (followed === ast) followed = world;
  removeBody(ast);

  // ejecta excavates the crust — the world loses the mass that flies away
  let excavated = 0;
  const nEj = Math.min(relSpeed > 150 ? randInt(3, 5) : randInt(1, 2),
    Math.max(0, MAX_BODIES - bodies.length));
  for (let k = 0; k < nEj; k++) {
    const ea = ang + rand(-0.9, 0.9);
    const spd = rand(100, 240);
    const frag = makeBody('asteroid',
      world.x + Math.cos(ea) * (world.r + 6), world.y + Math.sin(ea) * (world.r + 6),
      world.vx + Math.cos(ea) * spd, world.vy + Math.sin(ea) * spd, rand(0.4, 0.9));
    if (addBody(frag)) excavated += frag.mass;
  }
  world.mass = Math.max(5, fullMass - excavated * 1.4); // extra 40% vaporizes
  world.r *= Math.cbrt(world.mass / fullMass);          // shrinks a little each hit
  if (world.mass <= 10 || world.r < 3.4) crumble(world); // bombarded to rubble
}

function crumble(world) {
  // a world eroded down to nothing falls apart into a few last rocks
  const { x, y, vx, vy, r } = world;
  spawnSparks(x, y, 14, '#c09070');
  effects.push({ kind: 'flash', x, y, t: 0, dur: 0.5, r: r * 3.5, color: '#e0b090' });
  removeBody(world);
  const n = Math.min(randInt(3, 5), Math.max(0, MAX_BODIES - bodies.length));
  for (let k = 0; k < n; k++) {
    const ang = rand(0, TAU), spd = rand(30, 90);
    addBody(makeBody('asteroid',
      x + Math.cos(ang) * r, y + Math.sin(ang) * r,
      vx + Math.cos(ang) * spd, vy + Math.sin(ang) * spd, rand(0.5, 1)));
  }
}

function paintCrater(b, imp) {
  // bake the cooled scar into the texture as a permanent gray crater
  const g = b.texture.getContext('2d');
  const R = b.texture.width / 2;
  const s = R / 64;
  const x = R + imp.lx * s, y = R + imp.ly * s, cr = imp.r * s;
  g.save();
  g.beginPath(); g.arc(R, R, R - 1, 0, TAU); g.clip();
  g.fillStyle = 'rgba(88, 88, 95, 0.95)';
  g.beginPath(); g.arc(x, y, cr, 0, TAU); g.fill();
  g.fillStyle = 'rgba(140, 140, 148, 0.9)';
  g.beginPath(); g.arc(x - cr * 0.25, y - cr * 0.25, cr * 0.55, 0, TAU); g.fill();
  g.fillStyle = 'rgba(40, 40, 48, 0.6)';
  g.beginPath(); g.arc(x + cr * 0.2, y + cr * 0.2, cr * 0.35, 0, TAU); g.fill();
  g.restore();
}

function explodeSupernova(star) {
  const { x, y, vx, vy, mass, color } = star;
  const wasFollowed = followed === star;
  removeBody(star);

  effects.push({ kind: 'nova', x, y, t: 0, dur: 2.2, r: 30, color });
  effects.push({ kind: 'flash', x, y, t: 0, dur: 0.6, r: 300, color: '#ffffff' });
  spawnSparks(x, y, 40, color);

  // shockwave shoves everything nearby
  for (const b of bodies) {
    const dx = b.x - x, dy = b.y - y;
    const d = Math.hypot(dx, dy) || 1;
    const kick = Math.min(500, 90000 / d) * (200 / (b.mass + 200));
    b.vx += (dx / d) * kick;
    b.vy += (dy / d) * kick;
  }

  // debris: a shell of tiny asteroids plus a moon or two flung out
  const nAst = Math.min(randInt(16, 26), Math.max(0, MAX_BODIES - bodies.length - 3));
  for (let k = 0; k < nAst; k++) {
    const ang = rand(0, TAU), spd = rand(80, 300);
    addBody(makeBody('asteroid',
      x + Math.cos(ang) * rand(10, 50), y + Math.sin(ang) * rand(10, 50),
      vx + Math.cos(ang) * spd, vy + Math.sin(ang) * spd,
      rand(0.5, 1.5)));
  }
  const nMoons = randInt(1, 2);
  for (let k = 0; k < nMoons; k++) {
    const ang = rand(0, TAU), spd = rand(60, 160);
    addBody(makeBody('moon',
      x + Math.cos(ang) * 60, y + Math.sin(ang) * 60,
      vx + Math.cos(ang) * spd, vy + Math.sin(ang) * spd,
      rand(0.7, 1.2)));
  }
  // the collapsed core survives as a small white dwarf (never a black hole!)
  const remnant = makeBody('starWhite', x, y, vx, vy, 0.45, mass * 0.12);
  addBody(remnant);
  if (wasFollowed) followed = remnant; // camera stays with the star's remains
}

function spawnSparks(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, TAU), spd = rand(40, 220);
    effects.push({
      kind: 'spark', x, y, t: 0, dur: rand(0.4, 1.1),
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, color,
    });
  }
}

function removeBody(b) {
  const i = bodies.indexOf(b);
  if (i !== -1) bodies.splice(i, 1);
}

// ---------------------------------------------------------------- trails
function updateTrails() {
  for (const b of bodies) {
    b.trail.push(b.x, b.y);
    // asteroids keep short trails so a 100-piece debris cloud stays cheap to draw
    const cap = (b.type === 'asteroid' ? 26 : TRAIL_LEN) * 2;
    if (b.trail.length > cap) b.trail.splice(0, b.trail.length - cap);
  }
}

// ---------------------------------------------------------------- rendering
const stars = [];  // decorative background starfield
for (let i = 0; i < 220; i++) {
  stars.push({ x: Math.random(), y: Math.random(), s: rand(0.4, 1.6), tw: rand(0, TAU) });
}

function render(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04060f';
  ctx.fillRect(0, 0, W, H);

  // background starfield (parallax-free, twinkling)
  ctx.fillStyle = '#ffffff';
  for (const s of stars) {
    const a = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(now * 0.001 + s.tw));
    ctx.globalAlpha = a;
    ctx.fillRect(s.x * W, s.y * H, s.s * devicePixelRatio, s.s * devicePixelRatio);
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(cam.zoom, 0, 0, cam.zoom, W / 2 - cam.x * cam.zoom, H / 2 - cam.y * cam.zoom);

  // trails
  if (ui.trails.checked) {
    ctx.lineCap = 'round';
    const many = bodies.length > 350; // huge scenes: one flat stroke per trail
    for (const b of bodies) {
      const t = b.trail;
      const pts = t.length / 2;
      if (pts < 2) continue;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = Math.max(1 / cam.zoom, b.r * 0.25);
      if (many) {
        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        ctx.moveTo(t[0], t[1]);
        for (let i = 8; i < t.length; i += 8) ctx.lineTo(t[i], t[i + 1]);
        ctx.lineTo(t[t.length - 2], t[t.length - 1]);
        ctx.stroke();
      } else {
        for (let i = 2; i < t.length; i += 4) {
          ctx.globalAlpha = (i / t.length) * 0.45;
          ctx.beginPath();
          ctx.moveTo(t[i - 2], t[i - 1]);
          ctx.lineTo(t[Math.min(i + 2, t.length - 2)], t[Math.min(i + 3, t.length - 1)]);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // star glows (behind bodies)
  for (const b of bodies) {
    if (!b.star || b.type === 'starBlack') continue;
    let glowR = b.r * 3.2;
    if (b.novaTimer >= 0) glowR *= 1 + (1.6 - b.novaTimer) * 1.5; // swell before the bang
    ctx.globalAlpha = b.novaTimer >= 0 ? 0.9 : 0.55;
    ctx.drawImage(glowSprite(b.color), b.x - glowR, b.y - glowR, glowR * 2, glowR * 2);
  }
  ctx.globalAlpha = 1;

  // bodies (textured, spinning)
  for (const b of bodies) {
    let drawR = b.r;
    if (b.novaTimer >= 0) drawR *= 1 + (1.6 - b.novaTimer) * 0.6;
    // bodies just a few pixels on screen: cheap draws instead of texture transforms
    const screenR = drawR * cam.zoom;
    if (screenR < 3 && !b.impacts.length) {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - drawR, b.y - drawR, drawR * 2, drawR * 2);
      continue;
    }
    if (screenR < 6 && !b.impacts.length) {
      ctx.drawImage(b.texture, b.x - drawR, b.y - drawR, drawR * 2, drawR * 2);
      continue;
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.drawImage(b.texture, -drawR, -drawR, drawR * 2, drawR * 2);
    // molten impact scars: gray crater emerging beneath a yellow→orange→red glow
    if (b.impacts.length) {
      const s = drawR / 64;
      for (const imp of b.impacts) {
        const p = imp.age / IMPACT_COOL;
        const x = imp.lx * s, y = imp.ly * s, r = imp.r * s;
        ctx.globalAlpha = Math.min(1, 0.2 + p);
        ctx.fillStyle = 'rgb(105, 105, 112)';
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        const hue = 55 - 50 * Math.min(1, p * 1.4);   // yellow → orange → red
        ctx.globalAlpha = Math.max(0, 1 - p * 1.05);  // glow dies as it cools
        ctx.fillStyle = `hsl(${hue}, 100%, ${68 - 38 * p}%)`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // ring around the followed body
  if (followed) {
    ctx.strokeStyle = 'rgba(140, 170, 255, 0.85)';
    ctx.lineWidth = 2 / cam.zoom;
    ctx.setLineDash([5 / cam.zoom, 4 / cam.zoom]);
    ctx.beginPath();
    ctx.arc(followed.x, followed.y, followed.r + 8 / cam.zoom, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // effects
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    const p = e.t / e.dur;
    if (p >= 1) { effects.splice(i, 1); continue; }
    if (e.kind === 'spark') {
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = e.color;
      const sx = e.x + e.vx * e.t, sy = e.y + e.vy * e.t;
      ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3);
    } else if (e.kind === 'flash') {
      ctx.globalAlpha = (1 - p) * 0.8;
      const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * (0.3 + p));
      grad.addColorStop(0, e.color);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + p), 0, TAU); ctx.fill();
    } else if (e.kind === 'nova') {
      ctx.globalAlpha = (1 - p) * 0.9;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 6 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + p * 700, 0, TAU); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + p * 500, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // drag-to-fling aim line
  if (drag.placing) {
    ctx.strokeStyle = 'rgba(140, 170, 255, 0.8)';
    ctx.lineWidth = 2 / cam.zoom;
    ctx.setLineDash([6 / cam.zoom, 6 / cam.zoom]);
    ctx.beginPath();
    ctx.moveTo(drag.wx, drag.wy);
    ctx.lineTo(drag.cwx, drag.cwy);
    ctx.stroke();
    ctx.setLineDash([]);
    const def = TYPES[selectedType];
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.arc(drag.wx, drag.wy, def.r * parseFloat(ui.size.value), 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- main loop
let lastTime = performance.now();
function frame(now) {
  const rawDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const timeScale = parseFloat(ui.time.value);

  // spam mode: hold to hose out a fast asteroid stream toward your drag direction
  if (spray.on && spamMode && !paused) {
    spray.acc += rawDt;
    while (spray.acc > 0.035) {
      spray.acc -= 0.035;
      const w = screenToWorld(spray.sx, spray.sy);
      const spd = rand(500, 800), perp = rand(-70, 70);
      if (!addBody(makeBody('asteroid', w.x, w.y,
        spray.dx * spd - spray.dy * perp, spray.dy * spd + spray.dx * perp,
        rand(0.5, 1.1)))) { spray.acc = 0; break; }
    }
  } else spray.acc = 0;

  if (!paused && timeScale > 0) {
    const dt = rawDt * timeScale;
    const sub = bodies.length > 400 ? 1 : 3; // fewer substeps when the world is huge
    for (let s = 0; s < sub; s++) stepPhysics(dt / sub);
    for (const e of effects) e.t += dt;
    updateTrails();
  }

  // camera lock: ride along with the followed body, gliding to close any gap
  if (followed) {
    if (!bodies.includes(followed)) followed = null;
    else {
      const simDt = (!paused && timeScale > 0) ? rawDt * timeScale : 0;
      const k = 1 - Math.exp(-rawDt * 6);
      cam.x += followed.vx * simDt + (followed.x - cam.x) * k;
      cam.y += followed.vy * simDt + (followed.y - cam.y) * k;
    }
  }

  render(now);
  updateInfoPanel(now);
  ui.count.textContent = bodies.length + (bodies.length === 1 ? ' body' : ' bodies');
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
const drag = { placing: false, panning: false, wx: 0, wy: 0, cwx: 0, cwy: 0, sx: 0, sy: 0 };

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  if (e.button === 1 || e.button === 2) {
    drag.panning = true;
    drag.sx = e.clientX; drag.sy = e.clientY;
    return;
  }
  if (activePointers.size > 0) return; // second finger = pinch, handled below
  if (spamMode) {
    spray.on = true;
    spray.sx = e.clientX; spray.sy = e.clientY;
    const a0 = rand(0, TAU);
    spray.dx = Math.cos(a0); spray.dy = Math.sin(a0);
    return;
  }
  const w = screenToWorld(e.clientX, e.clientY);
  drag.placing = true;
  drag.wx = w.x; drag.wy = w.y;
  drag.cwx = w.x; drag.cwy = w.y;
});

canvas.addEventListener('pointermove', (e) => {
  if (drag.panning) {
    followed = null; // panning breaks the camera lock
    cam.x -= (e.clientX - drag.sx) * devicePixelRatio / cam.zoom;
    cam.y -= (e.clientY - drag.sy) * devicePixelRatio / cam.zoom;
    drag.sx = e.clientX; drag.sy = e.clientY;
    return;
  }
  if (spray.on) {
    const mdx = e.clientX - spray.sx, mdy = e.clientY - spray.sy;
    const L = Math.hypot(mdx, mdy);
    if (L > 3) { spray.dx = mdx / L; spray.dy = mdy / L; } // aim follows your drag
    spray.sx = e.clientX; spray.sy = e.clientY;
    return;
  }
  if (drag.placing) {
    const w = screenToWorld(e.clientX, e.clientY);
    drag.cwx = w.x; drag.cwy = w.y;
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (spray.on) { spray.on = false; return; }
  if (drag.panning) { drag.panning = false; return; }
  if (!drag.placing) return;
  drag.placing = false;

  const dx = drag.cwx - drag.wx, dy = drag.cwy - drag.wy;
  const dragLen = Math.hypot(dx, dy);
  let vx = dx * 1.6, vy = dy * 1.6;

  // a tap on an existing body centers the camera on it instead of placing
  if (dragLen < 8) {
    const hit = bodyAt(drag.wx, drag.wy);
    if (hit) {
      followed = followed === hit ? null : hit;
      return;
    }
  }

  if (dragLen < 8 && ui.autoOrbit.checked) {
    const att = dominantAttractor(drag.wx, drag.wy);
    if (att && att.mass > TYPES[selectedType].mass * parseFloat(ui.size.value) ** 2 * 2) {
      const v = circularOrbitVelocity(drag.wx, drag.wy, att);
      vx = v.vx; vy = v.vy;
    } else { vx = 0; vy = 0; }
  } else if (dragLen < 8) {
    vx = 0; vy = 0;
  }

  const sizeMul = parseFloat(ui.size.value) * rand(0.85, 1.15); // "some big, some small"
  if (!addBody(makeBody(selectedType, drag.wx, drag.wy, vx, vy, sizeMul))) {
    flashCount();
  }
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  cam.zoom *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
  cam.zoom = Math.max(0.08, Math.min(6, cam.zoom));
  const after = screenToWorld(e.clientX, e.clientY);
  cam.x += before.x - after.x;
  cam.y += before.y - after.y;
}, { passive: false });

// touch pinch-zoom & two-finger pan
const activePointers = new Map();
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size === 2) drag.placing = false; // cancel placement, it's a gesture
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'touch' || !activePointers.has(e.pointerId)) return;
  const prev = new Map(activePointers);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 2) {
    const pts = [...activePointers.values()];
    const old = [...prev.values()];
    const dNew = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const dOld = Math.hypot(old[0].x - old[1].x, old[0].y - old[1].y);
    if (dOld > 0) {
      cam.zoom = Math.max(0.08, Math.min(6, cam.zoom * (dNew / dOld)));
    }
    const mxNew = (pts[0].x + pts[1].x) / 2, myNew = (pts[0].y + pts[1].y) / 2;
    const mxOld = (old[0].x + old[1].x) / 2, myOld = (old[0].y + old[1].y) / 2;
    cam.x -= (mxNew - mxOld) * devicePixelRatio / cam.zoom;
    cam.y -= (myNew - myOld) * devicePixelRatio / cam.zoom;
  }
});
const clearPointer = (e) => activePointers.delete(e.pointerId);
canvas.addEventListener('pointerup', clearPointer);
canvas.addEventListener('pointercancel', clearPointer);

function flashCount() {
  ui.count.style.color = '#ff6060';
  setTimeout(() => (ui.count.style.color = ''), 600);
}

// ---------------------------------------------------------------- info panel
const info = {
  panel: document.getElementById('infoPanel'),
  title: document.getElementById('infoTitle'),
  body: document.getElementById('infoBody'),
  age: document.getElementById('infoAge'),
  hits: document.getElementById('infoHits'),
  gCum: document.getElementById('graphCum'),
  gRate: document.getElementById('graphRate'),
  xSlider: document.getElementById('xSlider'),
  xVal: document.getElementById('xVal'),
  xVal2: document.getElementById('xVal2'),
  rateBox: document.getElementById('rateBox'),
};
let lastGraphAt = 0;

document.getElementById('stopFollowBtn').addEventListener('click', () => { followed = null; });
info.xSlider.addEventListener('input', () => {
  info.xVal.textContent = info.xSlider.value;
  info.xVal2.textContent = info.xSlider.value + 's';
  lastGraphAt = 0; // redraw immediately with the new bucket width
});

function updateInfoPanel(now) {
  if (!followed) { info.panel.hidden = true; return; }
  const b = followed;
  info.panel.hidden = false;
  info.title.textContent = 'Following: ' + TYPES[b.type].label;
  info.body.style.display = b.star ? 'none' : ''; // stars just get the stop button
  if (b.star) return;

  info.age.textContent = 'Age: ' + b.age.toFixed(0) + 's';
  const h = b.hitCounts;
  info.hits.textContent = 'Hit by ' + b.totalHits + (b.totalHits === 1 ? ' object' : ' objects')
    + ' — ' + h.asteroid + ' asteroids, ' + h.moon + ' moons, ' + h.planet + ' planets';

  const X = parseInt(info.xSlider.value, 10);
  const recent = b.hitTimes.filter(t => b.age - t <= X).length;
  const avg = b.age > 0 ? (b.totalHits / Math.max(1, b.age / X)).toFixed(1) : '0';
  info.rateBox.textContent = recent + ' collisions in last ' + X + 's (avg ' + avg + ' per ' + X + 's)';

  if (now - lastGraphAt > 250) {
    lastGraphAt = now;
    drawCumGraph(b);
    drawRateGraph(b, X);
  }
}

function drawCumGraph(b) {
  const c = info.gCum, g = c.getContext('2d');
  const cw = c.width, ch = c.height, pad = 4;
  g.clearRect(0, 0, cw, ch);
  const total = b.totalHits, dur = Math.max(b.age, 1);
  const yFor = n => ch - pad - (total ? (n / total) * (ch - 2 * pad) : 0);
  const xFor = t => pad + (t / dur) * (cw - 2 * pad);
  g.strokeStyle = '#7c9bff';
  g.lineWidth = 1.5;
  g.beginPath();
  let count = total - b.hitTimes.length; // baseline if old hits were trimmed
  let y = yFor(count);
  g.moveTo(pad, y);
  for (const t of b.hitTimes) {           // step chart: flat, then up at each hit
    const x = xFor(t);
    g.lineTo(x, y);
    y = yFor(++count);
    g.lineTo(x, y);
  }
  g.lineTo(cw - pad, y);
  g.stroke();
}

function drawRateGraph(b, X) {
  const c = info.gRate, g = c.getContext('2d');
  const cw = c.width, ch = c.height;
  g.clearRect(0, 0, cw, ch);
  const nBuckets = Math.max(1, Math.ceil(Math.max(b.age, 0.001) / X));
  const show = Math.min(nBuckets, 36);   // most recent 36 chunks
  const start = nBuckets - show;
  const counts = new Array(show).fill(0);
  for (const t of b.hitTimes) {
    const bi = Math.min(nBuckets - 1, Math.floor(t / X)) - start;
    if (bi >= 0) counts[bi]++;
  }
  const max = Math.max(1, ...counts);
  const xFor = i => show === 1 ? cw / 2 : 4 + (i / (show - 1)) * (cw - 8);
  const yFor = n => ch - 4 - (n / max) * (ch - 8);
  g.strokeStyle = '#7c9bff';
  g.lineWidth = 1.5;
  g.beginPath();
  for (let i = 0; i < show; i++) {
    if (i === 0) g.moveTo(xFor(i), yFor(counts[i]));
    else g.lineTo(xFor(i), yFor(counts[i]));
  }
  g.stroke();
  // dot on the current chunk
  g.fillStyle = '#ffb060';
  g.beginPath();
  g.arc(xFor(show - 1), yFor(counts[show - 1]), 3, 0, TAU);
  g.fill();
}

// ---------------------------------------------------------------- toolbar
const toolbar = document.getElementById('toolbar');
for (const [key, def] of Object.entries(TYPES)) {
  const el = document.createElement('div');
  el.className = 'tool' + (key === selectedType ? ' active' : '');
  el.dataset.type = key;
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.background = def.star && key !== 'starBlack'
    ? `radial-gradient(circle at 40% 40%, #fff, ${def.color})`
    : key === 'starBlack'
      ? 'radial-gradient(circle at 50% 50%, #100a18 55%, #8a50a0)'
      : `radial-gradient(circle at 38% 35%, ${def.color}, #101425)`;
  if (def.star && key !== 'starBlack') dot.style.boxShadow = `0 0 8px ${def.color}`;
  el.appendChild(dot);
  const lbl = document.createElement('span');
  lbl.textContent = def.label;
  el.appendChild(lbl);
  el.addEventListener('click', () => {
    selectedType = key;
    document.querySelectorAll('.tool').forEach(t => t.classList.toggle('active', t === el));
  });
  toolbar.appendChild(el);
}

// ---------------------------------------------------------------- buttons
document.getElementById('pauseBtn').addEventListener('click', function () {
  paused = !paused;
  this.innerHTML = paused ? '&#9654; Play' : '&#10074;&#10074; Pause';
});
document.getElementById('clearBtn').addEventListener('click', () => {
  bodies.length = 0;
  effects.length = 0;
});
document.getElementById('presetBtn').addEventListener('click', spawnSolarSystem);
const spamBtn = document.getElementById('spamBtn');
spamBtn.addEventListener('click', () => {
  spamMode = !spamMode;
  spray.on = false;
  spamBtn.classList.toggle('active', spamMode);
});
document.getElementById('messBtn').addEventListener('click', spawnBigMess);

function spawnBigMess() {
  bodies.length = 0;
  effects.length = 0;
  followed = null;
  cam.x = 0; cam.y = 0; cam.zoom = 0.14;

  // a handful of stars scattered through the chaos
  const starTypes = ['starYellow', 'starRed', 'starBlue', 'starOrange', 'starWhite'];
  for (const t of starTypes) {
    addBody(makeBody(t, rand(-2600, 2600), rand(-2600, 2600),
      rand(-40, 40), rand(-40, 40), rand(0.8, 1.3)));
  }
  // ~1000 objects, mostly planets
  const pick = () => {
    const r = Math.random();
    if (r < 0.62) return 'earth';
    if (r < 0.74) return 'rocky';
    if (r < 0.80) return 'gasGiant';
    if (r < 0.88) return 'moon';
    return 'asteroid';
  };
  while (bodies.length < Math.min(1000, MAX_BODIES)) {
    const ang = rand(0, TAU), d = Math.sqrt(Math.random()) * 3400;
    addBody(makeBody(pick(), Math.cos(ang) * d, Math.sin(ang) * d,
      rand(-90, 90), rand(-90, 90), rand(0.6, 1.6)));
  }
}

function spawnSolarSystem() {
  bodies.length = 0;
  effects.length = 0;
  cam.x = 0; cam.y = 0; cam.zoom = Math.min(1, window.innerWidth / 1500);

  const sun = makeBody('starYellow', 0, 0, 0, 0, 1.1);
  addBody(sun);
  const G = G_BASE * parseFloat(ui.grav.value);

  const plan = [
    ['rocky', 170, 0.75],
    ['earth', 260, 1.0],
    ['rocky', 350, 0.9],
    ['gasGiant', 520, 1.1],
    ['gasGiant', 680, 0.85],
  ];
  let earthRef = null;
  for (const [type, dist, size] of plan) {
    const ang = rand(0, TAU);
    const x = Math.cos(ang) * dist, y = Math.sin(ang) * dist;
    const v = Math.sqrt(G * sun.mass / dist);
    const p = makeBody(type, x, y, -Math.sin(ang) * v, Math.cos(ang) * v, size);
    addBody(p);
    if (type === 'earth') earthRef = p;
  }
  // a moon around the earth-like planet
  if (earthRef) {
    const md = 40;
    const mv = Math.sqrt(G * earthRef.mass / md);
    addBody(makeBody('moon', earthRef.x + md, earthRef.y,
      earthRef.vx, earthRef.vy + mv, 0.8));
  }
  // asteroid belt between the rocky worlds and the gas giants
  for (let i = 0; i < 45; i++) {
    const dist = rand(410, 470);
    const ang = rand(0, TAU);
    const v = Math.sqrt(G * sun.mass / dist) * rand(0.97, 1.03);
    addBody(makeBody('asteroid',
      Math.cos(ang) * dist, Math.sin(ang) * dist,
      -Math.sin(ang) * v, Math.cos(ang) * v, rand(0.6, 1.6)));
  }
}

// ---------------------------------------------------------------- go!
setTimeout(() => (document.getElementById('hint').style.opacity = '0'), 14000);
spawnSolarSystem();
requestAnimationFrame(frame);
</script>
</body>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Clapback</title>
<style>
  /* ── Committed single-theme neon arcade design: every color painted explicitly ── */
  :root{
    --ground:#070A14;
    --panel:#0E1424;
    --panel-2:#131B30;
    --line:#22304F;
    --ink:#EAF0FF;
    --ink-dim:#8FA0C4;
    --blue:#3D8BFF;
    --blue-hot:#6FD8FF;
    --red:#FF4D5E;
    --red-deep:#B3202E;
    --gold:#FFD34D;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ground);
    background-image:
      radial-gradient(1200px 500px at 20% -10%, rgba(61,139,255,.14), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(255,77,94,.10), transparent 60%);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh;
  }
  .app{
    width:100%; max-width:560px; min-height:100dvh;
    display:flex; flex-direction:column;
  }

  /* ── Header ── */
  header{padding:18px 18px 10px; text-align:center}
  h1{
    font-size:clamp(26px, 7vw, 36px);
    font-weight:900; letter-spacing:-.5px; text-wrap:balance;
    background:linear-gradient(92deg, var(--blue-hot) 0%, var(--blue) 45%, #B48CFF 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 34px rgba(61,139,255,.35);
  }
  .tag{color:var(--ink-dim); font-size:13px; margin-top:4px}

  /* ── Aura bar (fighting-game HP bar) ── */
  .aurabar-wrap{padding:8px 16px 4px; position:sticky; top:0; z-index:5;
    background:linear-gradient(var(--ground) 78%, transparent)}
  .aura-labels{display:flex; justify-content:space-between; font-size:12px; font-weight:700;
    letter-spacing:1.5px; text-transform:uppercase; padding:0 2px 5px}
  .aura-labels .you{color:var(--blue-hot)} .aura-labels .them{color:var(--red)}
  .aurabar{
    position:relative; height:26px; border-radius:999px; overflow:hidden;
    border:1px solid var(--line);
    background:var(--panel);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.6);
  }
  .fill-red{position:absolute; inset:0;
    background:linear-gradient(90deg, var(--red-deep), var(--red));
  }
  .fill-blue{position:absolute; inset:0; width:50%;
    background:linear-gradient(90deg, #1E5FD6, var(--blue) 60%, var(--blue-hot));
    box-shadow:0 0 18px rgba(61,139,255,.55);
    transition:width .8s cubic-bezier(.2,.9,.25,1.2);
  }
  .bolt{
    position:absolute; top:-4px; bottom:-4px; left:50%; width:4px;
    background:#fff; transform:translateX(-50%) skewX(-14deg);
    box-shadow:0 0 12px #fff, 0 0 26px var(--blue-hot);
    transition:left .8s cubic-bezier(.2,.9,.25,1.2);
  }
  .aura-counts{display:flex; justify-content:space-between; padding:6px 2px 0;
    font-variant-numeric:tabular-nums; font-weight:800; font-size:15px}
  .aura-counts .b{color:var(--blue-hot)} .aura-counts .r{color:var(--red)}
  .aura-verdict{text-align:center; font-size:12px; color:var(--ink-dim); padding-top:2px; min-height:16px}

  /* ── Chat ── */
  .chat{flex:1; padding:14px 16px 8px; display:flex; flex-direction:column; gap:10px; overflow-y:auto}
  .hint{
    margin:auto; text-align:center; color:var(--ink-dim); font-size:14px; line-height:1.6;
    max-width:34ch; padding:24px 0;
  }
  .hint b{color:var(--ink)}
  .bubble{
    max-width:86%; padding:10px 14px; border-radius:var(--radius); font-size:15px; line-height:1.5;
    animation:pop .35s cubic-bezier(.2,.9,.3,1.4) both;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  @keyframes pop{from{transform:scale(.85) translateY(8px); opacity:0}}
  .bubble.bully{
    align-self:flex-start;
    background:linear-gradient(135deg, #2A121A, #3A1620);
    border:1px solid rgba(255,77,94,.45);
    border-bottom-left-radius:4px;
  }
  .bubble.bully .who{color:var(--red)}
  .bubble.ai{
    align-self:flex-end;
    background:linear-gradient(135deg, #10233F, #14304F);
    border:1px solid rgba(111,216,255,.45);
    border-bottom-right-radius:4px;
    box-shadow:0 4px 22px rgba(61,139,255,.22);
  }
  .bubble.ai .who{color:var(--blue-hot)}
  .who{display:block; font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:4px}
  .stamp{
    align-self:flex-end; display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    animation:pop .4s .1s both;
  }
  .stamp .grade{color:var(--gold); text-shadow:0 0 14px rgba(255,211,77,.6)}
  .stamp .gain{color:var(--blue-hot)}
  .copy-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; padding:3px 9px; border-radius:999px; cursor:pointer;
  }
  .copy-btn:hover{color:var(--ink); border-color:var(--blue)}
  .copy-btn:focus-visible{outline:2px solid var(--blue-hot); outline-offset:2px}
  .care{
    align-self:center; max-width:92%;
    background:var(--panel-2); border:1px solid var(--gold);
    color:var(--ink); border-radius:var(--radius);
    padding:10px 14px; font-size:13px; line-height:1.55;
    animation:pop .4s both;
  }
  .care b{color:var(--gold)}

  /* ── Composer ── */
  .composer{
    position:sticky; bottom:0; padding:10px 16px 16px;
    background:linear-gradient(transparent, var(--ground) 26%);
  }
  .fields{display:flex; flex-direction:column; gap:8px}
  .field-row{display:flex; gap:8px; align-items:center; animation:pop .3s both}
  .field-row input{
    flex:1; background:var(--panel-2); border:1px solid var(--line);
    color:var(--ink); border-radius:12px; padding:12px 14px; font-size:15px;
    font-family:inherit;
  }
  .field-row input::placeholder{color:var(--ink-dim)}
  .field-row input:focus{outline:2px solid var(--red); outline-offset:1px; border-color:transparent}
  .remove-btn{
    background:none; border:none; color:var(--ink-dim); font-size:18px;
    cursor:pointer; padding:4px 6px; line-height:1;
  }
  .remove-btn:hover{color:var(--red)}
  .remove-btn:focus-visible{outline:2px solid var(--red); outline-offset:2px; border-radius:6px}
  .actions{display:flex; gap:8px; margin-top:10px}
  .add-btn{
    background:var(--panel-2); color:var(--ink); border:1px dashed var(--line);
    border-radius:12px; padding:12px 14px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .add-btn:hover{border-color:var(--red); color:var(--red)}
  .add-btn:focus-visible{outline:2px solid var(--red); outline-offset:2px}
  .fire-btn{
    flex:1; border:none; border-radius:12px; padding:12px 16px;
    font-size:16px; font-weight:900; letter-spacing:.5px; font-family:inherit;
    color:#04101F; cursor:pointer;
    background:linear-gradient(92deg, var(--blue-hot), var(--blue));
    box-shadow:0 4px 24px rgba(61,139,255,.45);
    transition:transform .12s;
  }
  .fire-btn:hover{transform:translateY(-1px)}
  .fire-btn:active{transform:scale(.97)}
  .fire-btn:focus-visible{outline:2px solid #fff; outline-offset:2px}
  .fire-btn:disabled{opacity:.5; cursor:default; transform:none}
  .reset-btn{
    background:none; border:none; color:var(--ink-dim); font-size:12px;
    cursor:pointer; margin:10px auto 0; display:block; font-family:inherit;
    text-decoration:underline; text-underline-offset:3px;
  }
  .reset-btn:hover{color:var(--ink)}
  .reset-btn:focus-visible{outline:2px solid var(--blue-hot); outline-offset:2px}

  /* ── Floating aura gain ── */
  .float-gain{
    position:fixed; left:50%; transform:translateX(-50%);
    font-size:34px; font-weight:900; pointer-events:none; z-index:20;
    color:var(--blue-hot); text-shadow:0 0 20px rgba(111,216,255,.8);
    animation:rise 1.3s ease-out forwards;
  }
  .float-gain.crit{color:var(--gold); text-shadow:0 0 24px rgba(255,211,77,.9); font-size:42px}
  @keyframes rise{
    0%{top:46%; opacity:0; transform:translateX(-50%) scale(.6)}
    18%{opacity:1; transform:translateX(-50%) scale(1.15)}
    100%{top:26%; opacity:0; transform:translateX(-50%) scale(1)}
  }
  .shake{animation:shake .5s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)} 40%{transform:translateX(5px)}
    60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>

<div class="app">
  <header>
    <h1>⚡ Aura Clapback</h1>
    <div class="tag">They talk trash. You farm aura.</div>
  </header>

  <div class="aurabar-wrap">
    <div class="aura-labels"><span class="you">You + AI</span><span class="them">The Bully</span></div>
    <div class="aurabar" id="aurabar">
      <div class="fill-red"></div>
      <div class="fill-blue" id="fillBlue"></div>
      <div class="bolt" id="bolt"></div>
    </div>
    <div class="aura-counts">
      <span class="b" id="blueCount">0 aura</span>
      <span class="r" id="redCount">0 aura</span>
    </div>
    <div class="aura-verdict" id="verdict"></div>
  </div>

  <div class="chat" id="chat">
    <div class="hint" id="hint">
      Type what the bully said below.<br>
      Hit <b>Fire back</b> and the AI drops the comeback.<br>
      They sent two messages? Press <b>＋ Add message</b>.
    </div>
  </div>

  <div class="composer">
    <div class="fields" id="fields">
      <div class="field-row">
        <input type="text" maxlength="280" placeholder="What did they say?" aria-label="Bully message 1">
      </div>
    </div>
    <div class="actions">
      <button class="add-btn" id="addBtn" type="button">＋ Add message</button>
      <button class="fire-btn" id="fireBtn" type="button">Fire back 🔥</button>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">reset the battle</button>
  </div>
</div>

<script>
'use strict';

/* ─────────── The Comeback Brain ───────────
   Reads the bully's message(s), figures out what kind of toxic it is,
   and picks the hardest-hitting comeback from that category.
   Comebacks never repeat until a category's whole pool is used up. */

const CATEGORIES = [
  {
    id:'appearance',
    words:['ugly','fat','skinny','hair','face','clothes','outfit','shoes','looks','look like','teeth','nose','short','small','ears','skin','gross','hideous','cooked face'],
    lines:[
      "You spent your whole day thinking about how I look. Rent free. In your head. No charge.",
      "I looked in the mirror this morning and won. What happened when you tried?",
      "My style is called confidence — sorry it doesn't come in your size.",
      "Funny how the fashion police always show up dressed like that.",
      "I'd rather look like me on my worst day than act like you on your best one.",
      "The mirror isn't scared of me. Can you say the same?",
      "You're rating my looks like your opinion made the leaderboard. It didn't qualify.",
      "I get my style from confidence. Where'd you get yours — the lost and found?",
    ]
  },
  {
    id:'smarts',
    words:['dumb','stupid','idiot','brain','smart','iq','slow','can\'t read','cant read','failing','grades','no brain cells','braindead'],
    lines:[
      "You calling anyone dumb is the funniest thing you've said all year. Unintentionally.",
      "I'd explain why you're wrong, but I left my crayons at home.",
      "Big words scare you, so I'll keep it short: no.",
      "My brain has bad days. Yours has a bad career.",
      "Takes real confidence to call someone dumb while spelling like the keyboard fought back.",
      "I failed one quiz. You're failing the vibe check daily. We are not the same.",
      "Every time you talk, a teacher somewhere sighs and doesn't know why.",
      "You'd need a map, a flashlight, and a guide to find the point. Let me know when you get there.",
    ]
  },
  {
    id:'social',
    words:['no friends','friendless','loner','nobody likes','no one likes','loser','lonely','sit alone','weirdo','outcast','left out','unpopular'],
    lines:[
      "I'd rather have two real friends than an audience I have to bully to keep.",
      "Nobody likes me? Weird — you can't stop talking to me.",
      "You count followers. I count people who'd actually show up. I'm winning.",
      "Being alone is a Tuesday. Being you is a life sentence.",
      "The only person here working THIS hard for attention is you. Take a break, king.",
      "Quality over quantity. That's why I'm not friends with you.",
      "If I'm such a loser, why am I the main character of your whole day?",
      "You need a crowd to feel brave. I don't even need to raise my voice.",
    ]
  },
  {
    id:'skill',
    words:['trash','garbage','noob','bad at','you suck','terrible','worst','carried','bot','washed','no skill','dogwater','ratio','ez','easy clap','get good','1v1'],
    lines:[
      "I'm trash? You've studied my gameplay more than your homework.",
      "Talking like an esports coach, playing like a tutorial NPC.",
      "You only win arguments in your imagination — and even there it's close.",
      "Scoreboard talk from someone who peaked in the loading screen. Bold.",
      "I don't need to be the best. I just need to be better than you, and the bar is on the floor.",
      "You spectate my losses. I don't even watch your wins. That's the difference.",
      "'EZ' says the person sweating through their keyboard. Hydrate.",
      "Keep coaching from the bench. It's the only position you've ever earned.",
    ]
  },
  {
    id:'laughing',
    words:['lol','lmao','lmfao','haha','😂','🤣','💀','xd','hilarious','so funny','dying'],
    lines:[
      "Laughing alone at your own message. That's the saddest party I've ever seen.",
      "You laugh like it's a comeback. It's a loading screen for someone with nothing to say.",
      "'Lol' — the official sound of running out of arguments.",
      "Glad I'm funny to you. You're funny to everyone, just not on purpose.",
      "That 😂 is doing all the work your brain couldn't.",
      "Keep laughing. It's the only thing you've committed to all week.",
    ]
  },
  {
    id:'cringe',
    words:['cringe','weird','embarrassing','try hard','tryhard','pick me','npc','mid','basic','lame','corny','yapping','yap'],
    lines:[
      "Calling things cringe is the personality starter pack. Did yours come with anything else?",
      "I'm mid? You're the extended warranty of people. Nobody asked, nobody wants it.",
      "'Weird' is what boring people call anyone having more fun than them.",
      "I'd rather be cringe and happy than cool and exhausting like you.",
      "You call everything mid because 'better than me' hurts to type.",
      "NPC? You've said the same three insults since September. Update your dialogue tree.",
      "Yap detected? Buddy, you wrote me a paragraph. About me. Again.",
    ]
  },
  {
    id:'threats',
    words:['kill','kys','die','hurt you','beat you up','punch','fight you','end you','watch your back','unalive'],
    lines:[
      "That's not tough, that's you announcing you lost the argument. Screenshot saved.",
      "Threats are what people type when their brain taps out. Noted, saved, and reported to my archive.",
      "You went from words to threats — thanks for admitting defeat in writing.",
    ],
    care:true
  },
];

const GENERIC = [
  "I'd take you seriously, but then we'd both be embarrassed.",
  "You spent effort typing that. I'm spending none reading it.",
  "Your opinion has been received, reviewed, and recycled.",
  "Is being annoying a hobby, or are you going pro?",
  "I've been ignored by better people than you. You don't even make the list.",
  "Say it again slower — maybe it'll sound smart the second time. (It won't.)",
  "You're not my hater. You're my unpaid promoter.",
  "Every villain thinks they're the main character. You're not even in the credits.",
  "I'm not arguing with you. I'm just watching you lose to yourself.",
  "Somewhere out there is a tree making oxygen for you. Apologize to it.",
  "You bring nothing to the conversation but volume.",
  "Keep talking. Aura donations are always welcome.",
];

const MULTI_OPENERS = [
  "Two messages? All that typing just to hand me aura twice.",
  "A double text AND an L? You're speedrunning embarrassment.",
  "Sending messages in waves doesn't help when every wave is this weak.",
  "You needed multiple messages. I only need one.",
];

const GRADES = [
  [200, "☄️ AURA NUKE"],
  [150, "💥 CRITICAL HIT"],
  [110, "🔥 SAVAGE"],
  [80,  "⚡ CLEAN HIT"],
  [0,   "👊 SOLID"],
];

const usedLines = {};   // categoryId -> Set of used indexes

function pickLine(pool, id){
  if(!usedLines[id]) usedLines[id] = new Set();
  const used = usedLines[id];
  if(used.size >= pool.length) used.clear();
  let i;
  do { i = Math.floor(Math.random()*pool.length); } while(used.has(i));
  used.add(i);
  return pool[i];
}

function detect(text){
  const t = text.toLowerCase();
  let best = null, bestScore = 0;
  for(const cat of CATEGORIES){
    let score = 0;
    for(const w of cat.words) if(t.includes(w)) score += w.length; // longer match = stronger signal
    if(score > bestScore){ bestScore = score; best = cat; }
  }
  return best;
}

function buildComeback(messages){
  const cat = detect(messages.join(' \n '));
  const pool = cat ? cat.lines : GENERIC;
  const id = cat ? cat.id : 'generic';
  let line = pickLine(pool, id);
  if(messages.length > 1 && !(cat && cat.care)){
    line = pickLine(MULTI_OPENERS, 'multi') + ' ' + line;
  }
  // matched category = sharper hit; multi-message claps harder; small crit chance
  let gain = 60 + Math.floor(Math.random()*45);
  if(cat) gain += 25;
  if(messages.length > 1) gain += 15 * (messages.length - 1);
  if(Math.random() < 0.15) gain += 80; // CRIT
  return { line, gain, care: !!(cat && cat.care) };
}

/* ─────────── Aura state + UI ─────────── */

let blueAura = 0, redAura = 0;

const $ = id => document.getElementById(id);
const chat = $('chat'), fields = $('fields');

function updateBar(){
  const total = blueAura + redAura;
  const share = total === 0 ? 50 : Math.round(blueAura / total * 100);
  $('fillBlue').style.width = share + '%';
  $('bolt').style.left = share + '%';
  $('blueCount').textContent = blueAura.toLocaleString() + ' aura';
  $('redCount').textContent = redAura.toLocaleString() + ' aura';
  const v = $('verdict');
  if(total === 0) v.textContent = '';
  else if(share >= 90) v.textContent = "Total domination. Their aura filed a missing person report.";
  else if(share >= 75) v.textContent = "You're glowing. They're gone.";
  else if(share >= 55) v.textContent = "Blue side winning — keep clapping back.";
  else if(share >= 45) v.textContent = "Neck and neck. Drop another comeback.";
  else v.textContent = "They're loud right now. Fire back and flip it.";
}

function addBubble(cls, whoLabel, text){
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  const who = document.createElement('span');
  who.className = 'who'; who.textContent = whoLabel;
  b.appendChild(who);
  b.appendChild(document.createTextNode(text));
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function addStamp(gain){
  const grade = GRADES.find(g => gain >= g[0])[1];
  const s = document.createElement('div');
  s.className = 'stamp';
  s.innerHTML = '<span class="grade"></span><span class="gain"></span>';
  s.querySelector('.grade').textContent = grade;
  s.querySelector('.gain').textContent = '+' + gain + ' aura';
  const copy = document.createElement('button');
  copy.className = 'copy-btn'; copy.type = 'button'; copy.textContent = 'copy';
  s.appendChild(copy);
  chat.appendChild(s);
  chat.scrollTop = chat.scrollHeight;
  return s;
}

function floatGain(gain){
  const f = document.createElement('div');
  f.className = 'float-gain' + (gain >= 150 ? ' crit' : '');
  f.textContent = '+' + gain + ' AURA';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1400);
}

function addCareNote(){
  const c = document.createElement('div');
  c.className = 'care';
  c.innerHTML = '<b>Real talk for a second:</b> that message crossed from trash talk into threats. ' +
    'The actual power move is to screenshot it and show a parent, teacher, or another adult you trust. ' +
    'That’s not snitching — that’s strategy. You deserve to feel safe. 💙';
  chat.appendChild(c);
  chat.scrollTop = chat.scrollHeight;
}

function makeFieldRow(){
  const row = document.createElement('div');
  row.className = 'field-row';
  const input = document.createElement('input');
  input.type = 'text'; input.maxLength = 280;
  input.placeholder = 'They said something else too…';
  input.setAttribute('aria-label', 'Extra bully message');
  const rm = document.createElement('button');
  rm.className = 'remove-btn'; rm.type = 'button';
  rm.textContent = '✕'; rm.setAttribute('aria-label', 'Remove this message');
  rm.addEventListener('click', () => row.remove());
  row.appendChild(input); row.appendChild(rm);
  return { row, input };
}

$('addBtn').addEventListener('click', () => {
  if(fields.children.length >= 5) return;
  const { row, input } = makeFieldRow();
  fields.appendChild(row);
  input.focus();
});

function fire(){
  const inputs = [...fields.querySelectorAll('input')];
  const messages = inputs.map(i => i.value.trim()).filter(Boolean);
  if(messages.length === 0){
    inputs[0].focus();
    inputs[0].placeholder = 'Type their message first…';
    return;
  }
  $('hint')?.remove();

  // Bully messages land: red aura ticks up, screen shakes
  for(const m of messages){
    addBubble('bully', 'The Bully', m);
    redAura += 10 + Math.floor(Math.random()*11);
  }
  updateBar();
  $('aurabar').classList.remove('shake');
  void $('aurabar').offsetWidth;
  $('aurabar').classList.add('shake');

  // Reset composer to a single empty field
  fields.innerHTML = '';
  const first = document.createElement('div');
  first.className = 'field-row';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.maxLength = 280;
  inp.placeholder = 'What did they say?';
  inp.setAttribute('aria-label', 'Bully message 1');
  first.appendChild(inp);
  fields.appendChild(first);

  // AI cooks for a moment, then claps back
  $('fireBtn').disabled = true;
  const cooking = addBubble('ai', 'Comeback AI', '…cooking 🍳');
  setTimeout(() => {
    const { line, gain, care } = buildComeback(messages);
    cooking.remove();
    addBubble('ai', 'Comeback AI', line);
    const stamp = addStamp(gain);
    stamp.querySelector('.copy-btn').addEventListener('click', function(){
      navigator.clipboard?.writeText(line).then(() => {
        this.textContent = 'copied!';
        setTimeout(() => this.textContent = 'copy', 1200);
      });
    });
    blueAura += gain;
    floatGain(gain);
    updateBar();
    if(care) addCareNote();
    $('fireBtn').disabled = false;
    inp.focus();
  }, 900 + Math.random()*500);
}

$('fireBtn').addEventListener('click', fire);
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('.field-row input')) fire();
});

$('resetBtn').addEventListener('click', () => {
  blueAura = 0; redAura = 0;
  updateBar();
  chat.innerHTML = '<div class="hint" id="hint">Fresh battle. Type what they said and fire back.</div>';
});

updateBar();
</script>

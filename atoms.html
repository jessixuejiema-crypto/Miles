<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atom Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: an isotope picker grid, then a detail "readout" of stacked, unit-ruled bars. */
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --panel-2: #f5f7f9;
    --border: #d5dbe2;
    --text: #18212b;
    --muted: #5f6b78;
    --track: #e2e7ec;
    --tick: rgba(255, 255, 255, 0.75);
    --tick-dark: rgba(10, 18, 28, 0.35);
    --accent: #c98a00;
    --proton: #d6362f;
    --neutron: #2f66d6;
    --electron: #23a352;
    --halflife: #8350c8;
    --chain: #4d6070;
    --stable: #c98a00;
    --r0: #8a96a3;
    --r1: #9cbb2f;
    --r2: #e1b320;
    --r3: #ec8a1d;
    --r4: #e3561f;
    --r5: #c5172e;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a;
      --panel: #171e26;
      --panel-2: #1c242e;
      --border: #2b3643;
      --text: #e3e9ef;
      --muted: #8f9cab;
      --track: #232d38;
      --tick: rgba(0, 0, 0, 0.45);
      --tick-dark: rgba(0, 0, 0, 0.5);
      --accent: #f0b429;
      --proton: #ef5049;
      --neutron: #4f86f0;
      --electron: #36c06a;
      --halflife: #a375e8;
      --chain: #5b7285;
      --stable: #e0a72a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141a;
    --panel: #171e26;
    --panel-2: #1c242e;
    --border: #2b3643;
    --text: #e3e9ef;
    --muted: #8f9cab;
    --track: #232d38;
    --tick: rgba(0, 0, 0, 0.45);
    --tick-dark: rgba(0, 0, 0, 0.5);
    --accent: #f0b429;
    --proton: #ef5049;
    --neutron: #4f86f0;
    --electron: #36c06a;
    --halflife: #a375e8;
    --chain: #5b7285;
    --stable: #e0a72a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 48px;
    display: grid;
    gap: 20px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.02em;
    margin: 0;
  }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0; font-size: 0.9rem; }

  /* ---- Picker ---- */
  .picker {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: grid;
    gap: 12px;
  }
  .search {
    width: 100%;
    font: inherit;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
  }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 8px;
    max-height: 236px;
    overflow-y: auto;
    padding: 2px;
  }
  .tile {
    font: inherit;
    color: inherit;
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 8px 7px;
    cursor: pointer;
    display: grid;
    gap: 1px;
    position: relative;
  }
  .tile:hover { border-color: var(--muted); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tile .mass { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
  .tile .sym { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1; }
  .tile .nm { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .dot {
    position: absolute; top: 7px; right: 7px;
    width: 8px; height: 8px; border-radius: 50%;
  }
  .grid-note { margin: 0; font-size: 0.8rem; color: var(--muted); }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 6px 2px; }

  /* ---- Readout ---- */
  .readout {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: grid;
    gap: 22px;
  }
  .ident {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    width: 92px; height: 92px;
    border: 2px solid var(--text);
    border-radius: 6px;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: 6px 8px;
    flex: none;
  }
  .badge .z { font-family: var(--mono); font-size: 0.78rem; }
  .badge .s { font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1; align-self: center; justify-self: center; }
  .ident-text { min-width: 0; display: grid; gap: 4px; }
  .ident h2 {
    font-family: var(--display);
    font-size: 1.8rem;
    margin: 0;
    line-height: 1.1;
    text-wrap: balance;
  }
  .ident .facts { color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }
  .ident .blurb { margin: 2px 0 0; font-size: 0.92rem; max-width: 60ch; }

  .decay {
    display: flex;
    align-items: center;
    gap: 10px 14px;
    flex-wrap: wrap;
    padding: 12px;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .iterate {
    font: inherit;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    padding: 10px 18px;
    border-radius: 7px;
    border: 0;
    background: var(--accent);
    color: #1b1300;
    cursor: pointer;
  }
  .decay-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .iterate.play {
    background: transparent;
    color: var(--text);
    box-shadow: inset 0 0 0 2px var(--accent);
    min-width: 7.5em;
  }
  .iterate.play[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .iterate.play:disabled { box-shadow: none; }
  .iterate:hover:not(:disabled) { filter: brightness(1.08); }
  .iterate:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .iterate:disabled { background: var(--track); color: var(--muted); cursor: not-allowed; }
  .decay-msg { font-size: 0.88rem; color: var(--muted); min-width: 0; flex: 1 1 220px; }
  .decay-msg b { color: var(--text); }
  @media (prefers-reduced-motion: no-preference) {
    .readout.flash .badge { animation: zap 0.6s ease; }
    @keyframes zap {
      0% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent); }
      40% { transform: scale(1.08); box-shadow: 0 0 0 10px transparent; }
      100% { transform: scale(1); }
    }
  }
  .readout-part { display: grid; gap: 22px; }
  .anim { display: grid; gap: 10px; }
  .anim-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px 12px;
    flex-wrap: wrap;
  }
  .anim-controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
  }
  .chip:hover:not(:disabled) { border-color: var(--muted); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip:disabled { color: var(--muted); opacity: 0.6; cursor: not-allowed; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel-2)); }
  #chamber {
    display: block;
    width: 100%;
    height: 340px;
    border-radius: 8px;
    background:
      radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
      var(--panel-2);
    border: 1px solid var(--border);
  }
  .anim-caption { margin: 0; font-size: 0.88rem; min-height: 2.6em; }
  .bars { display: grid; gap: 18px; }
  .bar { display: grid; gap: 6px; }
  .bar-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .bar-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
  }
  .bar-value {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.35rem;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .bar-value small {
    font-family: var(--body);
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: 4px;
  }
  .track {
    height: 30px;
    background: var(--track);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .track svg { display: block; width: 100%; height: 100%; }
  .bar-foot { font-size: 0.8rem; color: var(--muted); }

  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* Decay chain: one segment per atom, divided by lines, not gaps */
  .chain-scroll { overflow-x: auto; padding-bottom: 4px; }
  .chain {
    display: flex;
    min-height: 56px;
    border-radius: 5px;
    overflow: hidden;
    min-width: 100%;
  }
  .seg {
    flex: 1 0 76px;
    font: inherit;
    color: #fff;
    background: var(--chain);
    border: 0;
    border-right: 2px solid var(--tick-dark);
    padding: 6px 4px;
    cursor: pointer;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 0;
    position: relative;
  }
  .seg:last-child { border-right: 0; }
  .seg.start { background: var(--neutron); }
  .seg.end { background: var(--stable); color: #1b1300; }
  .seg:hover { filter: brightness(1.12); }
  .seg:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }
  .seg .ss { font-family: var(--display); font-weight: 700; font-size: 0.98rem; line-height: 1.1; white-space: nowrap; }
  .seg .sm { font-family: var(--mono); font-size: 0.62rem; opacity: 0.85; }
  .seg .arrow {
    position: absolute; right: 0; top: 50%;
    transform: translate(50%, -50%);
    min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; white-space: nowrap;
    background: var(--panel); color: var(--text);
    font-size: 0.6rem; line-height: 16px; text-align: center;
    z-index: 1; font-family: var(--mono); font-weight: 600;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  @media (max-width: 480px) {
    .readout { padding: 16px; }
    .badge { width: 76px; height: 76px; }
    .badge .s { font-size: 2.1rem; }
    .ident h2 { font-size: 1.45rem; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .fill { transition: width 0.5s ease; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Atom <span>Viewer</span></h1>
    <p class="sub">Pick an atom to see what is inside it and how it decays.</p>
  </header>

  <section class="picker" aria-label="Choose an atom">
    <input id="search" class="search" type="search" placeholder="Search any isotope: Sr-99, uranium 236, lead…" autocomplete="off">
    <div id="grid" class="grid" role="list"></div>
    <p id="grid-note" class="grid-note"></p>
  </section>

  <section id="readout" class="readout">
    <div id="readout-head" class="readout-part" aria-live="polite"></div>
    <div class="anim">
      <div class="anim-head">
        <span class="bar-label">Inside the atom</span>
        <div class="anim-controls">
          <button id="radiate" class="chip" aria-pressed="true">Radiation: on</button>
          <button id="split" class="chip">Split the nucleus</button>
          <button id="reset" class="chip" disabled>Put it back together</button>
        </div>
      </div>
      <canvas id="chamber" aria-label="Animation of the atom's nucleus and electrons"></canvas>
      <p id="anim-caption" class="anim-caption" aria-live="polite"></p>
      <div class="legend"><span><i style="background:var(--proton)"></i>Proton</span><span><i style="background:var(--neutron)"></i>Neutron</span><span><i style="background:var(--electron)"></i>Electron</span><span><i style="background:var(--accent)"></i>Gamma ray (energy)</span></div>
    </div>
    <div id="readout-bars" class="readout-part"></div>
  </section>
</div>

<script>

  "Fe-56": "One of the most tightly bound nuclei. Stars build up to iron and then stop.",
  "Pb-208": "The heaviest stable atom. Many decay chains end here.",
  "Au-197": "The only stable form of gold.",
};

// What one decay does, step by step. Used to work out the next atom and to drive the animation.
const CLUSTER_RE = /^(\d+)([A-Z][a-z]?)$/;
function opsFor(mode) {
  const alpha = () => ({ t: "emit", p: 2, n: 2, label: "α particle" });
  const P = () => ({ t: "emit", p: 1, n: 0, label: "proton" });
  const N = () => ({ t: "emit", p: 0, n: 1, label: "neutron" });
  const bm = () => ({ t: "b-" }), bp = () => ({ t: "b+" }), sf = () => ({ t: "sf" });
  switch (mode) {
    case "B-": return [bm()];
    case "2B-": return [bm(), bm()];
    case "B+": case "e+": case "EC+B+": return [bp()];
    case "EC": return [{ t: "ec" }];
    case "2B+": return [bp(), bp()];
    case "A": return [alpha()];
    case "p": return [P()];
    case "2p": return [P(), P()];
    case "3p": return [P(), P(), P()];
    case "n": return [N()];
    case "2n": return [N(), N()];
    case "3n": return [N(), N(), N()];
    case "4n": return [N(), N(), N(), N()];
    case "B-n": return [bm(), N()];
    case "B-p": return [bm(), P()];
    case "B-d": return [bm(), { t: "emit", p: 1, n: 1, label: "deuteron" }];
    case "B-t": return [bm(), { t: "emit", p: 1, n: 2, label: "triton" }];
    case "B-A": return [bm(), alpha()];
    case "B+p": return [bp(), P()];
    case "B+A": return [bp(), alpha()];
    case "B+pA": return [bp(), P(), alpha()];
    case "SF": return [sf()];
    case "B+SF": return [bp(), sf()];
    case "B-SF": return [bm(), sf()];
  }
  const m = CLUSTER_RE.exec(mode);
  if (m) {
    const cz = SYMBOLS.indexOf(m[2]) + 1, ca = +m[1];
    if (cz > 0) return [{ t: "emit", p: cz, n: ca - cz, label: `${NAMES[cz - 1].toLowerCase()}-${ca} nucleus` }];
  }
  return [];
}

// Roughly how a heavy nucleus splits: a bigger and a smaller piece, plus a few free neutrons.
function fissionProducts(z, a) {
  const free = a >= 230 ? 3 : 2;
  const z1 = Math.round(z * 56 / 92), a1 = Math.round((a - free) * 0.605);
  return { z1, a1, z2: z - z1, a2: a - free - a1, free };
}

const ISOTOPES = {};
NUCLIDE_DATA.split("|").forEach((group, i) => {
  for (const entry of group.split(",")) {
    if (!entry) continue;
    const [aStr, hlStr, mode] = entry.split(":");
    const z = i + 1, a = +aStr, sym = SYMBOLS[i];
    const stable = hlStr === "";
    ISOTOPES[`${sym}-${a}`] = {
      id: `${sym}-${a}`, z, a, n: a - z, sym, name: NAMES[i], stable,
      hl: stable || hlStr === "?" ? null : +hlStr,   // null for stable atoms and for half-lives nobody has measured
      mode: stable ? null : mode,
      ops: stable ? [] : opsFor(mode),
      daughter: null,
    };
  }
});
for (const iso of Object.values(ISOTOPES)) {
  if (iso.stable || !iso.ops.length) continue;
  let z = iso.z, a = iso.a;
  for (const op of iso.ops) {
    if (op.t === "b-") z++;
    else if (op.t === "b+" || op.t === "ec") z--;
    else if (op.t === "emit") { z -= op.p; a -= op.p + op.n; }
    else if (op.t === "sf") { op.split = fissionProducts(z, a); z = op.split.z1; a = op.split.a1; }
  }
  const id = z >= 1 && z <= SYMBOLS.length ? `${SYMBOLS[z - 1]}-${a}` : null;
  if (id && ISOTOPES[id]) iso.daughter = id;
}
const canDecay = iso => !iso.stable && !!iso.daughter;

function plural(k, word) { return `${k} ${word}${k === 1 ? "" : "s"}`; }

// Short label for the arrows in the decay chain.
function modeShort(mode) {
  const fixed = { "A": "α", "B-": "β−", "B+": "β+", "e+": "β+", "EC+B+": "β+", "2B-": "2β−", "2B+": "2β+" };
  return fixed[mode] || mode.replace("B-", "β−").replace("B+", "β+").replace(/A$/, "α");
}

// Plain-words description of one decay.
function describeOps(ops) {
  const text = (op, k) => {
    if (op.t === "b-") return k > 1 ? `${k} neutrons turned into protons and shot out ${k} electrons (double beta decay)` : "a neutron turned into a proton and shot out an electron (beta decay)";
    if (op.t === "b+") return k > 1 ? `${k} protons turned into neutrons and shot out ${k} positrons (double beta-plus decay)` : "a proton turned into a neutron and shot out a positron (beta-plus decay)";
    if (op.t === "ec") return "the nucleus swallowed one of its electrons, turning a proton into a neutron (electron capture)";
    if (op.t === "sf") return `the nucleus burst into ${NAMES[op.split.z1 - 1]}-${op.split.a1}, ${NAMES[op.split.z2 - 1]}-${op.split.a2} and ${plural(op.split.free, "free neutron")} (spontaneous fission). The chain follows the bigger piece`;
    if (op.label === "α particle") return "it shot out an alpha particle: 2 protons and 2 neutrons stuck together (alpha decay)";
    if (op.p + op.n === 1) return k > 1 ? `${k} ${op.label}s escaped from the nucleus` : `a ${op.label} escaped from the nucleus (${op.label} emission)`;
    return `it shot out a ${op.label} made of ${plural(op.p, "proton")} and ${plural(op.n, "neutron")}`;
  };
  const parts = [];
  for (let i = 0; i < ops.length;) {
    let j = i;
    while (j < ops.length && ops[j].t === ops[i].t && ops[j].label === ops[i].label) j++;
    parts.push(text(ops[i], j - i));
    i = j;
  }
  const s = parts.join(", then ");
  return s ? s[0].toUpperCase() + s.slice(1) + "." : "";
}

// ---------- Helpers ----------
function chainOf(id) {
  const out = [];
  let cur = ISOTOPES[id];
  while (cur && out.length < 80) {
    out.push(cur);
    if (!canDecay(cur)) break;
    cur = ISOTOPES[cur.daughter];
  }
  return out;
}

const RATINGS = [
  { word: "Not radioactive (stable)", short: "Stable", color: "var(--r0)" },
  { word: "Slightly radioactive", short: "Slight", color: "var(--r1)" },
  { word: "Mildly radioactive", short: "Mild", color: "var(--r2)" },
  { word: "Moderately radioactive", short: "Moderate", color: "var(--r3)" },
  { word: "Highly radioactive", short: "High", color: "var(--r4)" },
  { word: "Extremely radioactive", short: "Extreme", color: "var(--r5)" },
];
// A shorter half-life means atoms decay faster, so a sample gives off radiation faster.
function ratingOf(iso) {
  const hl = iso.hl;
  if (iso.stable) return 0;
  if (hl == null) return 5; // never measured: these vanish almost instantly
  if (hl >= 1e9 * Y) return 1;
  if (hl >= 1e5 * Y) return 2;
  if (hl >= 1 * Y) return 3;
  if (hl >= 1 * H) return 4;
  return 5;
}

// Pick the biggest unit where the half-life is at least 1 of it.
const UNITS = [
  { s: 1e24 * Y, one: "septillion years", many: "septillion years", head: "Septillion years" },
  { s: 1e21 * Y, one: "sextillion years", many: "sextillion years", head: "Sextillion years" },
  { s: 1e18 * Y, one: "quintillion years", many: "quintillion years", head: "Quintillion years" },
  { s: 1e15 * Y, one: "quadrillion years", many: "quadrillion years", head: "Quadrillion years" },
  { s: 1e12 * Y, one: "trillion years", many: "trillion years", head: "Trillion years" },
  { s: 1e9 * Y, one: "billion years", many: "billion years", head: "Billion years" },
  { s: 1e6 * Y, one: "million years", many: "million years", head: "Million years" },
  { s: 1e3 * Y, one: "thousand years", many: "thousand years", head: "Thousand years" },
  { s: Y, one: "year", many: "years", head: "Years" },
  { s: D, one: "day", many: "days", head: "Days" },
  { s: H, one: "hour", many: "hours", head: "Hours" },
  { s: MIN, one: "minute", many: "minutes", head: "Minutes" },
  { s: 1, one: "second", many: "seconds", head: "Seconds" },
  { s: 1e-3, one: "millisecond", many: "milliseconds", head: "Milliseconds" },
  { s: 1e-6, one: "microsecond", many: "microseconds", head: "Microseconds" },
  { s: 1e-9, one: "nanosecond", many: "nanoseconds", head: "Nanoseconds" },
  { s: 1e-12, one: "picosecond", many: "picoseconds", head: "Picoseconds" },
  { s: 1e-15, one: "femtosecond", many: "femtoseconds", head: "Femtoseconds" },
  { s: 1e-18, one: "attosecond", many: "attoseconds", head: "Attoseconds" },
  { s: 1e-21, one: "zeptosecond", many: "zeptoseconds", head: "Zeptoseconds" },
  { s: 1e-24, one: "yoctosecond", many: "yoctoseconds", head: "Yoctoseconds" },
];
function halfLifeParts(sec) {
  const u = UNITS.find(u => sec >= u.s * 0.9995) || UNITS[UNITS.length - 1];
  const v = sec / u.s;
  const rounded = v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100;
  return { unit: u, value: v, text: `${fmtNum(rounded)} ${rounded === 1 ? u.one : u.many}` };
}
function fmtNum(x) { return x.toLocaleString("en-US", { maximumFractionDigits: 2 }); }
function shortHL(iso) { return iso.stable ? "stable" : iso.hl == null ? "not measured" : halfLifeParts(iso.hl).text; }

// One bar: filled up to `value`, with a thin line at every whole unit inside the fill.
// `total` is how many units the full track stands for.
function ruledBar(value, total, color) {
  const w = 1000;
  const fillW = total > 0 ? (value / total) * w : 0;
  const ticks = Math.floor(value - 1e-9);
  const step = total > 0 ? w / total : 0;
  const thin = step < 4;
  let lines = "";
  for (let i = 1; i <= ticks; i++) {
    const x = (i * step).toFixed(3);
    lines += `<line x1="${x}" x2="${x}" y1="0" y2="1"/>`;
  }
  return `<div class="track"><svg viewBox="0 0 ${w} 1" preserveAspectRatio="none" aria-hidden="true">
    <rect class="fill" x="0" y="0" width="${fillW.toFixed(3)}" height="1" fill="${color}"/>
    <g stroke="var(--tick)" stroke-width="${thin ? 0.75 : 1.5}" vector-effect="non-scaling-stroke" style="vector-effect:non-scaling-stroke">${lines}</g>
  </svg></div>`;
}

function barBlock({ label, value, extra = "", body, foot = "" }) {
  return `<div class="bar">
    <div class="bar-head"><span class="bar-label">${label}</span><span class="bar-value">${value}${extra ? `<small>${extra}</small>` : ""}</span></div>
    ${body}
    ${foot ? `<div class="bar-foot">${foot}</div>` : ""}
  </div>`;
}

// ---------- Rendering ----------
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const readout = document.getElementById("readout");
const readoutHead = document.getElementById("readout-head");
const readoutBars = document.getElementById("readout-bars");
let current = "U-236";
let playing = false;  // Play button: keep decaying until the atom is stable
let playTimer = null;
let lastDecay = null; // { from, to, mode } after pressing the button

const LIST = Object.values(ISOTOPES).sort((a, b) => a.z - b.z || a.a - b.a);
const MAX_TILES = 300;
const gridNote = document.getElementById("grid-note");

function renderGrid() {
  const raw = search.value.trim();
  const q = raw.toLowerCase().replace(/[\s-]+/g, "");
  let items;
  if (!q) {
    items = FEATURED.map(id => ISOTOPES[id]).filter(Boolean);
    gridNote.textContent = `Showing ${items.length} well-known atoms. Search to find any of all ${LIST.length.toLocaleString("en-US")} known isotopes, like Sr-99.`;
  } else {
    const lettersOnly = /^[a-z]+$/.test(q);
    items = LIST.filter(i => {
      const sym = i.sym.toLowerCase(), nm = i.name.toLowerCase(), a = String(i.a);
      return (sym + a).startsWith(q) || (nm + a).startsWith(q) || a === q ||
        (lettersOnly && (sym === q || nm.startsWith(q)));
    });
    const exact = i => (i.sym + i.a).toLowerCase() === q || (i.name + i.a).toLowerCase() === q;
    items.sort((x, y) => exact(y) - exact(x));
    const total = items.length;
    if (total > MAX_TILES) items = items.slice(0, MAX_TILES);
    gridNote.textContent = total > MAX_TILES
      ? `Showing ${MAX_TILES} of ${total.toLocaleString("en-US")} matches. Type more to narrow it down.`
      : `${plural(total, "match")}.`.replace("matchs", "matches");
  }
  if (!items.length) {
    grid.innerHTML = `<div class="empty">No atom matches “${raw.replace(/[<>&"]/g, "")}”. Try a name like “strontium”, a symbol like “Sr-99”, or a mass number like “236”.</div>`;
    return;
  }
  grid.innerHTML = items.map(i => {
    const r = RATINGS[ratingOf(i)];
    return `<button class="tile${i.id === current ? " on" : ""}" role="listitem" data-id="${i.id}" title="${i.name}-${i.a} · ${r.word}">
      <span class="dot" style="background:${r.color}"></span>
      <span class="mass">${i.a}</span>
      <span class="sym">${i.sym}</span>
      <span class="nm">${i.name}</span>
    </button>`;
  }).join("");
}

function renderReadout() {
  const iso = ISOTOPES[current];
  const rating = ratingOf(iso);
  const r = RATINGS[rating];
  const maxCount = Math.max(iso.z, iso.n, 1);

  const particles = [
    barBlock({ label: "Protons", value: iso.z, body: ruledBar(iso.z, maxCount, "var(--proton)") }),
    barBlock({ label: "Neutrons", value: iso.n, body: ruledBar(iso.n, maxCount, "var(--neutron)") }),
    barBlock({ label: "Electrons", value: iso.z, body: ruledBar(iso.z, maxCount, "var(--electron)") }),
  ].join("");

  const ratingBar = barBlock({
    label: "Radioactivity rating",
    value: r.word,
    extra: `${rating} / 5`,
    body: ruledBar(rating, 5, r.color) +
      `<div class="scale"><span>Stable</span><span>Slight</span><span>Mild</span><span>Moderate</span><span>High</span><span>Extreme</span></div>`,
  });

  let hlBar;
  if (!iso.stable && iso.hl == null) {
    hlBar = barBlock({
      label: "Half-life",
      value: "Not measured",
      body: ruledBar(0, 1, "var(--halflife)"),
      foot: "Scientists have spotted this atom, but nobody has measured its half-life yet. Most atoms like this fall apart in a tiny fraction of a second.",
    });
  } else if (iso.stable) {
    hlBar = barBlock({
      label: "Half-life",
      value: "Never decays",
      body: ruledBar(0, 1, "var(--halflife)"),
      foot: "This atom is stable, so it has no half-life.",
    });
  } else {
    const p = halfLifeParts(iso.hl);
    const total = Math.max(1, Math.ceil(p.value - 1e-9));
    hlBar = barBlock({
      label: "Half-life",
      value: p.unit.head,
      extra: p.text,
      body: ruledBar(p.value, total, "var(--halflife)"),
      foot: `After ${p.text}, half of a sample of ${iso.name}-${iso.a} has turned into something else. Each section of the bar is 1 ${p.unit.one}.`,
    });
  }

  const chain = chainOf(iso.id);
  const end = chain[chain.length - 1];
  const steps = chain.length - 1;
  const chainHead = steps === 0 ? (iso.stable ? "Already stable" : "1 atom") : `${chain.length} atoms`;
  const chainExtra = steps === 0 ? "" : end.stable ? `${plural(steps, "decay")} until stable` : `${plural(steps, "decay")} shown`;
  const segs = chain.map((c, i) => {
    const cls = c.stable ? " end" : i === 0 ? " start" : "";
    const arrow = i < chain.length - 1 ? `<span class="arrow" title="${describeOps(c.ops)}">${modeShort(c.mode)}</span>` : "";
    return `<button class="seg${cls}" data-id="${c.id}" title="${c.name}-${c.a} · ${shortHL(c)}">
      <span class="ss">${c.sym}-${c.a}</span><span class="sm">${shortHL(c)}</span>${arrow}
    </button>`;
  }).join("");
  const chainText = chain.map(c => c.name).join(" → ");
  const chainBar = barBlock({
    label: "Decay chain",
    value: chainHead,
    extra: chainExtra,
    body: `<div class="chain-scroll"><div class="chain">${segs}</div></div>`,
    foot: (steps === 0
      ? (iso.stable ? `${iso.name}-${iso.a} does not decay, so its chain is just itself.` : `${iso.name}-${iso.a} is radioactive, but nobody knows for sure what it turns into.`)
      : `${chainText}. ` + (end.stable ? `It stops at ${end.name}-${end.a}, which is stable.` : `The data stops at ${end.name}-${end.a}.`) + " Tap any atom in the chain to view it.") +
      (steps ? ` <br>α = alpha decay, β− = beta decay, β+ = beta-plus decay, EC = electron capture, p = a proton escapes, n = a neutron escapes, SF = the nucleus splits apart.` : ""),
  });

  readoutHead.innerHTML = `
    <div class="ident">
      <div class="badge"><span class="z">${iso.z}</span><span class="s">${iso.sym}</span></div>
      <div class="ident-text">
        <h2>${iso.name}-${iso.a}</h2>
        <div class="facts">${iso.sym}-${iso.a} · atomic number ${iso.z} · mass number ${iso.a}</div>
        ${BLURBS[iso.id] ? `<p class="blurb">${BLURBS[iso.id]}</p>` : ""}
      </div>
    </div>
    <div class="decay">
      <div class="decay-buttons">
        <button id="iterate" class="iterate" ${!canDecay(iso) || playing ? "disabled" : ""}>One more iteration</button>
        <button id="play" class="iterate play" ${!canDecay(iso) ? "disabled" : ""} aria-pressed="${playing}">${playing ? "❚❚ Pause" : "▶ Play"}</button>
      </div>
      <span class="decay-msg">${decayMessage(iso)}</span>
    </div>`;
  readoutBars.innerHTML = `
    <div class="bars">
      ${particles}
      <div class="legend"><span><i style="background:var(--proton)"></i>Protons</span><span><i style="background:var(--neutron)"></i>Neutrons</span><span><i style="background:var(--electron)"></i>Electrons</span><span>Each line on a bar marks 1 particle.</span></div>
      ${ratingBar}
      ${hlBar}
      ${chainBar}
    </div>`;
}

function decayMessage(iso) {
  let msg = "";
  if (lastDecay && lastDecay.to === iso.id) {
    const f = ISOTOPES[lastDecay.from];
    msg = `<b>${f.name}-${f.a} decayed into ${iso.name}-${iso.a}.</b> ${describeOps(f.ops)} `;
  }
  if (iso.stable) return msg + `${iso.name}-${iso.a} is stable, so it cannot decay any further.`;
  if (!iso.daughter) return msg + `${iso.name}-${iso.a} is radioactive, but nobody knows for sure what it turns into.`;
  const next = ISOTOPES[iso.daughter];
  return msg + `Press to watch it decay into ${next.name}-${next.a}. Press Play to keep going until it is stable.`;
}

function iterate() {
  const iso = ISOTOPES[current];
  if (!canDecay(iso) || Anim.busy) return;
  const finish = () => {
    lastDecay = { from: iso.id, to: iso.daughter, mode: iso.mode };
    if (!canDecay(ISOTOPES[iso.daughter])) playing = false;
    select(iso.daughter, true);
    readout.classList.remove("flash");
    void readout.offsetWidth;
    readout.classList.add("flash");
    if (playing) {
      playTimer = setTimeout(iterate, 900);
      document.getElementById("play").focus();
    } else if (canDecay(ISOTOPES[iso.daughter])) {
      document.getElementById("iterate").focus();
    }
  };
  // Play the decay in the animation panel first, then switch to the new atom.
  if (Anim.decay(finish)) document.getElementById("iterate").disabled = true;
  else finish();
}

function togglePlay() {
  clearTimeout(playTimer);
  playing = !playing;
  renderReadout();
  document.getElementById("play").focus();
  if (playing && !Anim.busy) iterate();
}

function select(id, fromDecay = false) {
  if (!ISOTOPES[id]) return;
  if (!fromDecay) { lastDecay = null; playing = false; clearTimeout(playTimer); }
  current = id;
  renderGrid();
  renderReadout();
  Anim.setIsotope(ISOTOPES[id]);
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  const tile = grid.querySelector(`[data-id="${id}"]`);
  if (tile) tile.scrollIntoView({ block: "nearest" });
}

grid.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (t) select(t.dataset.id);
});
readout.addEventListener("click", e => {
  if (e.target.closest("#iterate")) { iterate(); return; }
  if (e.target.closest("#play")) { togglePlay(); return; }
  const s = e.target.closest(".seg");
  if (s) { select(s.dataset.id); readout.scrollIntoView({ block: "start", behavior: "smooth" }); }
});
search.addEventListener("input", renderGrid);
search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const first = grid.querySelector(".tile");
    if (first) select(first.dataset.id);
  }
});

// ---------- Animation panel ----------
// Draws the nucleus (protons + neutrons), the electron shells, and what comes out when it decays or splits.
// Electrons per shell, filled in the usual order (1s 2s 2p 3s 3p 4s 3d ...).
function shellsFor(z) {
  const order = [[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];
  const shells = [];
  let left = z;
  for (const [n, l] of order) {
    if (left <= 0) break;
    const c = Math.min(left, 2 * (2 * l + 1));
    shells[n - 1] = (shells[n - 1] || 0) + c;
    left -= c;
  }
  return shells.map(x => x || 0);
}

const Anim = (() => {
  const canvas = document.getElementById("chamber");
  const ctx = canvas.getContext("2d");
  const caption = document.getElementById("anim-caption");
  const radBtn = document.getElementById("radiate");
  const splitBtn = document.getElementById("split");
  const resetBtn = document.getElementById("reset");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1, scale = 1;
  let col = {};
  let iso = null;
  let nucleons = [];   // { kind: "p" | "n", lx, ly, x, y, g, ph, glow }
  let groups = [];     // nucleus centres: { cx, cy, tx, ty, label, sx, sy }
  let particles = [];  // flying things: alpha clusters, electrons, neutrons, sparks
  let rays = [];       // gamma rays
  let timers = [];
  let clock = 0, last = 0, nextEmit = 0, flash = 0, eFade = 1;
  let radiating = !reduce, busy = false, split = false;
  let ball = 0.03;

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ["proton", "neutron", "electron", "accent", "text", "muted", "border", "panel-2"]) col[k] = cs.getPropertyValue("--" + k).trim();
  }
  readColors();
  setInterval(readColors, 1000);

  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    scale = Math.min(W, H) / 2 * 0.96;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const nucR = a => Math.max(0.42 * Math.sqrt(a / 240), 0.14);
  const ballFor = a => Math.min(nucR(a) * 0.92 / Math.sqrt(a), 0.065);

  // Sunflower packing: spreads n balls evenly over a disc.
  function layoutGroup(g) {
    const members = nucleons.filter(n => n.g === g);
    members.sort((a, b) => (a.lx * a.lx + a.ly * a.ly) - (b.lx * b.lx + b.ly * b.ly));
    const R = ball * Math.sqrt(members.length) / 0.92;
    members.forEach((n, i) => {
      const rr = R * Math.sqrt((i + 0.5) / members.length);
      const a = i * 2.39996;
      n.lx = rr * Math.cos(a); n.ly = rr * Math.sin(a);
    });
  }

  function build(newIso) {
    iso = newIso;
    timers = []; particles = []; rays = []; busy = false; split = false; eFade = 1; flash = 0;
    ball = ballFor(iso.a);
    const kinds = [...Array(iso.z).fill("p"), ...Array(iso.n).fill("n")];
    for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
    nucleons = kinds.map(k => ({ kind: k, lx: 0, ly: 0, x: 0, y: 0, g: 0, ph: Math.random() * 6.28, glow: 0 }));
    groups = [{ cx: 0, cy: 0, tx: 0, ty: 0, sx: 1, sy: 1, label: "" }];
    layoutGroup(0);
    for (const n of nucleons) { n.x = n.lx; n.y = n.ly; }
    nextEmit = clock + 0.6;
    updateControls();
    idleCaption();
  }

  function idleCaption() {
    if (iso.stable) caption.textContent = `${iso.name}-${iso.a} is stable. Its nucleus holds together, so nothing shoots out.`;
    else caption.textContent = radiating
      ? `${iso.name}-${iso.a} is radioactive. Each little flash shows radiation leaving the nucleus. Press "One more iteration" to watch it decay.`
      : `Press "One more iteration" to watch ${iso.name}-${iso.a} decay, or turn radiation on.`;
  }

  function updateControls() {
    radBtn.setAttribute("aria-pressed", String(radiating));
    radBtn.textContent = radiating ? "Radiation: on" : "Radiation: off";
    splitBtn.disabled = busy || split || iso.z < 90;
    splitBtn.title = iso.z < 90 ? "Only very heavy atoms like uranium and plutonium can be split." : "";
    resetBtn.disabled = busy || !split;
  }

  const after = (sec, fn) => timers.push({ at: clock + sec, fn });
  const edgeScore = (n, a) => n.lx * Math.cos(a) + n.ly * Math.sin(a);

  function gamma(angle, delay = 0) {
    after(delay, () => rays.push({ a: angle, t: 0, from: nucR(iso.a) * 0.9 }));
  }

  function setIsotope(newIso) {
    const p = nucleons.filter(n => n.kind === "p").length;
    const keep = !split && iso && newIso.z === p && nucleons.length === newIso.a;
    if (keep) { iso = newIso; ball = ballFor(iso.a); busy = false; updateControls(); idleCaption(); }
    else build(newIso);
  }

  const pickEdge = (kind, k, ang) => nucleons.filter(n => n.kind === kind)
    .sort((a, b) => edgeScore(b, ang) - edgeScore(a, ang)).slice(0, k);
  const randAngle = () => Math.random() * Math.PI * 2;

  // Plays one decay of the current atom, step by step, then calls onDone.
  function decay(onDone) {
    if (busy || split || !canDecay(iso)) return false;
    busy = true; updateControls();
    let t = 0;
    for (const op of iso.ops) t += runOp(op, t);
    after(t + 0.7, () => { busy = false; nucleons.forEach(n => n.glow = 0); onDone && onDone(); });
    return true;
  }

  function runOp(op, at) {
    if (op.t === "b-" || op.t === "b+") { after(at, () => betaStep(op.t)); return 1.0; }
    if (op.t === "ec") { after(at, captureStep); return 1.1; }
    if (op.t === "emit") { after(at, () => emitStep(op)); return 0.8; }
    if (op.t === "sf") { after(at, () => splitStep(op.split, true)); return 1.7; }
    return 0;
  }

  // Beta-minus: neutron -> proton + electron. Beta-plus: proton -> neutron + positron.
  function betaStep(kind) {
    const minus = kind === "b-";
    const ang = randAngle();
    const nuc = pickEdge(minus ? "n" : "p", 1, ang)[0];
    if (!nuc) return;
    caption.textContent = minus
      ? "Beta decay: a neutron turns into a proton and throws out a fast electron."
      : "Beta-plus decay: a proton turns into a neutron and throws out a positron, the electron's antimatter twin.";
    nuc.glow = 1;
    after(0.5, () => {
      nuc.kind = minus ? "p" : "n"; nuc.glow = 1;
      particles.push({ type: minus ? "e" : "pos", x: nuc.x, y: nuc.y, vx: Math.cos(ang) * 1.9, vy: Math.sin(ang) * 1.9, life: 0, max: 1.4, label: minus ? "β electron" : "β+ positron" });
      particles.push({ type: "nu", x: nuc.x, y: nuc.y, vx: Math.cos(ang + 0.9) * 1.6, vy: Math.sin(ang + 0.9) * 1.6, life: 0, max: 1.2, label: minus ? "antineutrino" : "neutrino" });
      flash = 0.7;
      gamma(ang - 2.2, 0.2);
    });
  }

  // Electron capture: an inner electron falls into the nucleus and a proton becomes a neutron.
  function captureStep() {
    const ang = randAngle();
    const nuc = pickEdge("p", 1, ang)[0];
    if (!nuc) return;
    caption.textContent = "Electron capture: the nucleus pulls in one of its own electrons. The electron and a proton join to make a neutron.";
    const rs = nucR(iso.a) + 0.1;
    const x = Math.cos(ang) * rs, y = Math.sin(ang) * rs;
    particles.push({ type: "e", x, y, vx: (nuc.x - x) / 0.5, vy: (nuc.y - y) / 0.5, life: 0, max: 0.5, label: "electron" });
    nuc.glow = 1;
    after(0.5, () => {
      nuc.kind = "n"; nuc.glow = 1; flash = 0.6;
      particles.push({ type: "nu", x: nuc.x, y: nuc.y, vx: -Math.cos(ang) * 1.6, vy: -Math.sin(ang) * 1.6, life: 0, max: 1.2, label: "neutrino" });
      gamma(ang + 1.6, 0.1);
    });
  }

  // Something leaves the nucleus: an alpha particle, a single proton or neutron, or a bigger cluster.
  function emitStep(op) {
    const ang = randAngle();
    const size = op.p + op.n;
    if (op.label === "α particle") caption.textContent = "Alpha decay: a clump of 2 protons and 2 neutrons bursts out of the nucleus.";
    else if (size === 1) caption.textContent = `A ${op.label} escapes! The nucleus has too many ${op.p ? "protons" : "neutrons"} to hold on to all of them.`;
    else caption.textContent = `A whole ${op.label} (${plural(op.p, "proton")} and ${plural(op.n, "neutron")}) bursts out of the nucleus.`;
    const out = [...pickEdge("p", op.p, ang), ...pickEdge("n", op.n, ang)];
    out.forEach(n => n.glow = 1);
    after(0.3, () => {
      nucleons = nucleons.filter(n => !out.includes(n));
      const mx = out.reduce((s, n) => s + n.x, 0) / out.length, my = out.reduce((s, n) => s + n.y, 0) / out.length;
      const balls = out.map((n, i) => {
        const rr = ball * 1.15 * Math.sqrt(i), a = i * 2.39996;
        return { kind: n.kind, dx: rr * Math.cos(a), dy: rr * Math.sin(a) };
      });
      const speed = size === 1 ? 1.8 : 1.4;
      particles.push({ type: "cluster", x: mx, y: my, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, life: 0, max: 1.6, label: op.label, balls });
      layoutGroup(0);
      flash = 0.9;
      gamma(ang + 2.4, 0.25);
    });
  }

  // The nucleus stretches into a peanut and tears into two smaller nuclei plus free neutrons.
  function splitStep(fp, spontaneous) {
    const name = `${iso.name}-${iso.a}`;
    caption.textContent = spontaneous
      ? `Spontaneous fission: ${name} is so heavy that it wobbles, stretches and tears itself apart.`
      : "The nucleus soaks up the neutron, wobbles and stretches…";
    for (let i = 1; i <= 10; i++) after(i * 0.07, () => { groups[0].sx = 1 + i * 0.06; groups[0].sy = 1 - i * 0.03; });
    after(0.8, () => {
      const byX = arr => arr.sort((a, b) => b.lx - a.lx);
      const neutrons = nucleons.filter(n => n.kind === "n").sort((a, b) => Math.hypot(a.lx, a.ly) - Math.hypot(b.lx, b.ly));
      const free = neutrons.slice(0, fp.free);
      byX(nucleons.filter(n => n.kind === "p")).forEach((n, i) => n.g = i < fp.z1 ? 1 : 2);
      byX(neutrons.slice(fp.free)).forEach((n, i) => n.g = i < fp.a1 - fp.z1 ? 1 : 2);
      nucleons = nucleons.filter(n => !free.includes(n));
      free.forEach((n, i) => {
        const a = -Math.PI / 2 + (i - 1) * 2.1 + Math.random() * 0.4;
        particles.push({ type: "n", x: n.x, y: n.y, vx: Math.cos(a) * 1.7, vy: Math.sin(a) * 1.7, life: 0, max: 1.6, label: i === 0 ? "free neutron" : "" });
      });
      groups = [{ cx: 0, cy: 0, tx: 0, ty: 0, sx: 1, sy: 1, label: "" },
        { cx: 0.12, cy: 0, tx: 0.62, ty: 0.05, sx: 1, sy: 1, label: `${SYMBOLS[fp.z1 - 1]}-${fp.a1}` },
        { cx: -0.12, cy: 0, tx: -0.62, ty: -0.05, sx: 1, sy: 1, label: `${SYMBOLS[fp.z2 - 1]}-${fp.a2}` }];
      layoutGroup(1); layoutGroup(2);
      split = true; flash = 1.4;
      for (let i = 0; i < 4; i++) gamma(Math.random() * 6.28, i * 0.12);
      const pieces = `${NAMES[fp.z1 - 1]}-${fp.a1} and ${NAMES[fp.z2 - 1]}-${fp.a2}`;
      caption.textContent = spontaneous
        ? `${name} split into ${pieces} and set ${plural(fp.free, "neutron")} free. We follow the bigger piece next.`
        : `It split into ${pieces}, set ${plural(fp.free, "neutron")} free and released a huge burst of energy. This is nuclear fission, the reaction inside nuclear power plants.`;
      updateControls();
    });
  }

  // "Split the nucleus" button: a neutron flies in first.
  function fission() {
    if (busy || split || iso.z < 90) return;
    busy = true; updateControls();
    caption.textContent = `A neutron flies in and hits ${iso.name}-${iso.a}…`;
    const startX = -W / scale / 2;
    particles.push({ type: "n", x: startX, y: 0, vx: (0 - startX) / 0.7, vy: 0, life: 0, max: 0.7, label: "neutron" });
    after(0.7, () => {
      nucleons.push({ kind: "n", lx: -nucR(iso.a), ly: 0, x: -nucR(iso.a), y: 0, g: 0, ph: 0, glow: 1 });
      layoutGroup(0);
      splitStep(fissionProducts(iso.z, iso.a + 1), false);
    });
    after(2.4, () => { busy = false; updateControls(); });
  }

  function emitAmbient() {
    const ang = randAngle();
    const R = nucR(iso.a);
    const x = Math.cos(ang) * R, y = Math.sin(ang) * R;
    if (Math.random() < 0.25) { rays.push({ a: ang, t: 0, from: R, small: true }); return; }
    const op = iso.ops.find(o => o.t !== "ec") || iso.ops[0];
    let type = "spark-e";
    if (!op || op.t === "sf" || (op.t === "emit" && op.p + op.n > 1)) type = "spark-a";
    else if (op.t === "b+") type = "spark-pos";
    else if (op.t === "emit") type = op.p ? "spark-p" : "spark-n";
    const sp = type === "spark-a" ? 0.9 : 1.2;
    particles.push({ type, x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0, max: 0.7 });
  }

  function step(dt) {
    clock += dt;
    const due = timers.filter(t => clock >= t.at);
    timers = timers.filter(t => clock < t.at);
    due.forEach(t => t.fn());
    if (radiating && !busy && !split && !iso.stable && clock >= nextEmit) {
      emitAmbient();
      const gap = [0, 2.6, 1.6, 1.0, 0.55, 0.28][ratingOf(iso)];
      nextEmit = clock + gap * (0.6 + Math.random() * 0.8);
    }
    for (const g of groups) {
      const k = Math.min(1, dt * 2.2);
      g.cx += (g.tx - g.cx) * k; g.cy += (g.ty - g.cy) * k;
    }
    if (!split && !busy) { groups[0].sx += (1 - groups[0].sx) * Math.min(1, dt * 4); groups[0].sy += (1 - groups[0].sy) * Math.min(1, dt * 4); }
    for (const n of nucleons) {
      const g = groups[n.g];
      const tx = g.cx + n.lx * g.sx, ty = g.cy + n.ly * g.sy;
      const k = Math.min(1, dt * 7);
      n.x += (tx - n.x) * k; n.y += (ty - n.y) * k;
      n.glow = Math.max(0, n.glow - dt * 0.5);
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt; }
    particles = particles.filter(p => p.life < p.max);
    for (const r of rays) r.t += dt;
    rays = rays.filter(r => r.t < (r.small ? 0.5 : 0.9));
    flash = Math.max(0, flash - dt * 2);
    eFade += ((split ? 0 : 1) - eFade) * Math.min(1, dt * 3);
  }

  function dot(x, y, r, fill, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
    ctx.globalAlpha = 1;
  }
  function nucleonBall(x, y, kind, glow) {
    const r = ball * 1.12;
    if (glow > 0) dot(x, y, r * (1.6 + glow), col.accent, 0.35 * glow);
    dot(x, y, r, kind === "p" ? col.proton : col.neutron);
    dot(x - r * 0.3, y - r * 0.3, r * 0.35, "#ffffff", 0.35);
  }
  function label(text, x, y) {
    if (!text) return;
    ctx.font = `600 ${12 / scale}px "IBM Plex Mono", ui-monospace, monospace`;
    ctx.fillStyle = col.text; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * W / 2, dpr * H / 2);
    const R = nucR(iso.a);

    // Electron shells
    if (eFade > 0.02) {
      const shells = shellsFor(iso.z);
      const inner = R + 0.1, outer = 0.97;
      const gap = shells.length > 1 ? (outer - inner) / (shells.length - 1) : 0;
      shells.forEach((count, s) => {
        const rr = shells.length > 1 ? inner + gap * s : Math.max(inner, 0.4);
        ctx.globalAlpha = 0.6 * eFade;
        ctx.strokeStyle = col.border; ctx.lineWidth = 1 / scale;
        ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
        const speed = reduce ? 0 : 0.9 / (s + 1);
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + clock * speed + s;
          dot(Math.cos(a) * rr, Math.sin(a) * rr, 3 / scale, col.electron, eFade);
        }
      });
    }

    if (flash > 0) dot(0, 0, R * (1.4 + flash * 0.6), col.accent, Math.min(0.45, flash * 0.35));

    // Gamma rays: a wiggly line racing outwards
    for (const r of rays) {
      const life = r.small ? 0.5 : 0.9;
      const head = r.from + r.t * 2.2, len = r.small ? 0.16 : 0.32;
      ctx.save(); ctx.rotate(r.a);
      ctx.strokeStyle = col.accent; ctx.lineWidth = (r.small ? 1.5 : 2.2) / scale;
      ctx.globalAlpha = 1 - r.t / life;
      ctx.beginPath();
      for (let d = Math.max(r.from, head - len); d <= head; d += 0.005) {
        const y = Math.sin(d * 90) * 0.018;
        d === Math.max(r.from, head - len) ? ctx.moveTo(d, y) : ctx.lineTo(d, y);
      }
      ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
      if (!r.small && r.t < 0.6) label("γ ray", Math.cos(r.a) * (head + 0.06), Math.sin(r.a) * (head + 0.06));
    }

    // Nucleons, back to front so the middle looks domed
    const amp = reduce ? 0 : ball * (0.12 + ratingOf(iso) * 0.05);
    const sorted = [...nucleons].sort((a, b) => (b.lx * b.lx + b.ly * b.ly) - (a.lx * a.lx + a.ly * a.ly));
    for (const n of sorted) {
      nucleonBall(n.x + Math.sin(clock * 9 + n.ph) * amp, n.y + Math.cos(clock * 11 + n.ph) * amp, n.kind, n.glow);
    }
    for (const g of groups) {
      if (!g.label) continue;
      const count = nucleons.filter(n => n.g === groups.indexOf(g)).length;
      label(g.label, g.cx, g.cy + ball * Math.sqrt(count) / 0.92 + 0.08);
    }

    // Flying particles
    for (const p of particles) {
      const fade = p.type.startsWith("spark") ? 1 - p.life / p.max : Math.min(1, (p.max - p.life) * 3);
      ctx.globalAlpha = fade;
      if (p.type === "cluster") p.balls.forEach(b => nucleonBall(p.x + b.dx, p.y + b.dy, b.kind, 0));
      else if (p.type === "e") { dot(p.x, p.y, 9 / scale, col.electron, 0.25 * fade); dot(p.x, p.y, 4.5 / scale, col.electron, fade); }
      else if (p.type === "pos") { dot(p.x, p.y, 9 / scale, col.accent, 0.3 * fade); dot(p.x, p.y, 4.5 / scale, col.accent, fade); }
      else if (p.type === "spark-pos") dot(p.x, p.y, 3 / scale, col.accent, fade);
      else if (p.type === "spark-p") dot(p.x, p.y, 3.2 / scale, col.proton, fade);
      else if (p.type === "spark-n") dot(p.x, p.y, 3.2 / scale, col.neutron, fade);
      else if (p.type === "nu") dot(p.x, p.y, 3 / scale, col.muted, fade);
      else if (p.type === "n") nucleonBall(p.x, p.y, "n", 0);
      else if (p.type === "spark-a") { for (const [ox, oy] of [[-1,-1],[1,1],[-1,1],[1,-1]]) dot(p.x + ox * 2.2 / scale, p.y + oy * 2.2 / scale, 2.4 / scale, ox * oy > 0 ? col.proton : col.neutron, fade); }
      else if (p.type === "spark-e") dot(p.x, p.y, 3 / scale, col.electron, fade);
      ctx.globalAlpha = fade;
      if (p.label) label(p.label, p.x, p.y - 0.09);
      ctx.globalAlpha = 1;
    }
  }

  function frame(ts) {
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts;
    if (iso) { step(dt); draw(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  radBtn.addEventListener("click", () => { radiating = !radiating; nextEmit = clock + 0.2; updateControls(); if (!busy && !split) idleCaption(); });
  splitBtn.addEventListener("click", fission);
  resetBtn.addEventListener("click", () => build(iso));

  return { setIsotope, decay, get busy() { return busy; }, reduce };
})();

const fromHash = decodeURIComponent(location.hash.slice(1));
select(ISOTOPES[fromHash] ? fromHash : "U-236");
</script>
</body>
</html>

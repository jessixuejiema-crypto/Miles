<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recamán Sequence Visualizer</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #eb6834;
    --ramp-start: #86b6ef;
    --ramp-end: #0d366b;
    --card: #ffffff;
    --btn-bg: #f0efec;
    --btn-bg-hover: #e6e5e0;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #d95926;
    --ramp-start: #2a78d6;
    --ramp-end: #cde2fb;
    --card: #222221;
    --btn-bg: #2c2c2a;
    --btn-bg-hover: #383835;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #d95926;
      --ramp-start: #2a78d6;
      --ramp-end: #cde2fb;
      --card: #222221;
      --btn-bg: #2c2c2a;
      --btn-bg-hover: #383835;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px 10px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header p { margin: 0; color: var(--ink-2); font-size: 13px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 0 20px 10px;
    font-size: 13px;
  }
  .toolbar .group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .toolbar label { color: var(--ink-2); white-space: nowrap; }
  .toolbar input[type="range"] { width: 160px; accent-color: var(--accent); }
  .toolbar input[type="number"] {
    width: 90px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
  }
  .toolbar #termsVal {
    min-width: 42px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: var(--btn-bg-hover); }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.06); }

  .readout {
    margin: 0 20px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    min-height: 54px;
  }
  .readout .big {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .readout .detail { font-size: 14px; color: var(--ink-2); }
  .readout .detail strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .readout .hint { font-size: 13px; color: var(--muted); }

  .stage {
    flex: 1;
    position: relative;
    margin: 0 20px 8px;
    min-height: 260px;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: crosshair;
    touch-action: none;
    display: block;
  }
  canvas.panning { cursor: grabbing; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--ink);
    white-space: nowrap;
    transform: translate(-50%, calc(-100% - 10px));
    display: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  .tooltip .sub { color: var(--muted); }

  footer {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 20px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend { display: flex; align-items: center; gap: 6px; }
  .legend .bar {
    width: 110px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--ramp-start), var(--ramp-end));
  }
</style>
</head>
<body>

<header>
  <h1>Recamán’s Sequence</h1>
  <p>a(0) = 0; a(n) = a(n−1) − n if that is positive and new, otherwise a(n−1) + n &nbsp;(OEIS A005132)</p>
</header>

<div class="toolbar">
  <div class="group">
    <label for="terms">Steps</label>
    <input type="range" id="terms" min="10" max="5000" value="100" step="1">
    <span id="termsVal">100</span>
  </div>
  <div class="group">
    <label for="lookup">Number</label>
    <input type="number" id="lookup" min="0" step="1" placeholder="e.g. 42">
    <button class="primary" id="lookupBtn">Look&nbsp;up</button>
  </div>
  <button id="animateBtn">▶ Animate</button>
  <button id="fitBtn">Fit view</button>
  <button id="themeBtn" title="Toggle light/dark">◐</button>
</div>

<div class="readout" id="readout">
  <span class="hint">Click a number on the line — or type one above — to see how many steps the
  sequence takes to reach it.</span>
</div>

<div class="stage">
  <canvas id="canvas"></canvas>
  <div class="tooltip" id="tooltip"></div>
</div>

<footer>
  <div class="legend"><span>step 0</span><div class="bar"></div><span id="legendEnd">step 100</span></div>
  <span>scroll to zoom · drag to pan · click to select a number</span>
</footer>

<script>
'use strict';

/* ---------- sequence ---------- */

// Terms a(0..n) for the drawn view, plus first-visit index for each value.
function computeSequence(n) {
  const seq = new Array(n + 1);
  const first = new Map();
  seq[0] = 0;
  first.set(0, 0);
  let cur = 0;
  for (let i = 1; i <= n; i++) {
    const back = cur - i;
    cur = (back > 0 && !first.has(back)) ? back : cur + i;
    seq[i] = cur;
    if (!first.has(cur)) first.set(cur, i);
  }
  return { seq, first };
}

// Background search for numbers beyond the drawn range: simulate from scratch
// with a growable bitset (memory-lean, so it can run for hundreds of millions
// of steps), chunked through setTimeout so the page stays responsive.
const answers = new Map([[0, 0]]);   // resolved lookups: value -> first-visit step
let search = null;

function cancelSearch() {
  if (search) { search.active = false; clearTimeout(search.timer); search = null; }
}

function bitGet(s, x) { return (s.bits[x >> 3] >> (x & 7)) & 1; }
function bitSet(s, x) {
  const idx = x >> 3;
  if (idx >= s.bits.length) {
    let len = s.bits.length;
    while (idx >= len) len *= 2;
    const nb = new Uint8Array(len);
    nb.set(s.bits);
    s.bits = nb;
  }
  s.bits[idx] |= 1 << (x & 7);
}

function runSearchChunk() {
  if (!search || !search.active) return;
  const s = search;
  let { n, cur } = s;
  let found = -1;
  for (let k = 0; k < 2_000_000; k++) {
    const i = ++n;
    const back = cur - i;
    cur = (back > 0 && !bitGet(s, back)) ? back : cur + i;
    if (!bitGet(s, cur)) {
      bitSet(s, cur);
      if (cur === s.v) { found = i; break; }
    }
  }
  s.n = n;
  s.cur = cur;
  if (found >= 0) {
    const v = s.v;
    answers.set(v, found);
    cancelSearch();
    if (selected === v) renderResult(v, found);
    return;
  }
  const el = document.getElementById('searchN');
  if (el) el.textContent = n.toLocaleString();
  if (n >= 100_000_000) {
    const note = document.getElementById('searchNote');
    if (note) note.textContent = '— this one may take astronomically long, or never appear';
  }
  s.timer = setTimeout(runSearchChunk, 0);
}

function startSearch(v) {
  readout.innerHTML = `<span class="big">${v.toLocaleString()}</span>
    <span class="detail">searching… checked <strong id="searchN">0</strong> steps so far</span>
    <span class="hint" id="searchNote"></span>
    <button id="stopSearchBtn">Stop</button>`;
  document.getElementById('stopSearchBtn').addEventListener('click', () => {
    const n = search ? search.n : 0;
    cancelSearch();
    readout.innerHTML = `<span class="big">${v.toLocaleString()}</span>
      <span class="detail">search stopped — <strong>not visited</strong> within the first
      ${n.toLocaleString()} steps.</span>`;
  });
  search = { v, n: 0, cur: 0, bits: new Uint8Array(1 << 17), active: true, timer: 0 };
  bitSet(search, 0);
  runSearchChunk();
}

/* ---------- state ---------- */

let termCount = 100;
let { seq, first } = computeSequence(termCount);
let selected = null;          // number the user picked, or null
let hoverX = null;            // integer under the pointer, or null
let view = { scale: 10, offset: 0 };   // px per unit; world x at left edge
let anim = { on: false, progress: 0, last: 0 };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const readout = document.getElementById('readout');

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rampColor(t) {
  const a = hexToRgb(css('--ramp-start'));
  const b = hexToRgb(css('--ramp-end'));
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* ---------- view / canvas ---------- */

function fitView() {
  const w = canvas.clientWidth;
  const maxVal = Math.max(...seq);
  const span = maxVal + 4;
  view.scale = (w * 0.92) / span;
  view.offset = -2 - (w * 0.04) / view.scale;
  requestRender();
}

function xToScreen(x) { return (x - view.offset) * view.scale; }
function screenToX(sx) { return sx / view.scale + view.offset; }

let renderQueued = false;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function niceTickStep(pxPerUnit) {
  const minPx = 56;
  let step = 1;
  while (step * pxPerUnit < minPx) {
    const d = Math.pow(10, Math.floor(Math.log10(step)));
    const m = step / d;
    step = (m === 1 ? 2 : m === 2 ? 5 : 10) * d;
  }
  return step;
}

function drawArc(a, b, y0, up, fraction) {
  const r = Math.abs(b - a) / 2 * view.scale;
  if (r < 0.3) return;
  const cx = xToScreen((a + b) / 2);
  if (cx + r < 0 || cx - r > canvas.clientWidth) return;
  const f = fraction === undefined ? 1 : fraction;
  ctx.beginPath();
  if (b > a) {
    if (up) ctx.arc(cx, y0, r, Math.PI, Math.PI + f * Math.PI, false);
    else    ctx.arc(cx, y0, r, Math.PI, Math.PI - f * Math.PI, true);
  } else {
    if (up) ctx.arc(cx, y0, r, 0, -f * Math.PI, true);
    else    ctx.arc(cx, y0, r, 0, f * Math.PI, false);
  }
  ctx.stroke();
}

function render() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const y0 = h * 0.55;

  // axis + ticks
  ctx.strokeStyle = css('--axis');
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y0);
  ctx.lineTo(w, y0);
  ctx.stroke();

  const step = niceTickStep(view.scale);
  const start = Math.ceil(screenToX(0) / step) * step;
  const end = screenToX(w);
  ctx.fillStyle = css('--muted');
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  for (let x = start; x <= end; x += step) {
    const sx = xToScreen(x);
    ctx.strokeStyle = css('--grid');
    ctx.beginPath();
    ctx.moveTo(sx, y0 - 4);
    ctx.lineTo(sx, y0 + 4);
    ctx.stroke();
    if (x >= 0) ctx.fillText((x + 0).toLocaleString(), sx, y0 + 18);
  }

  // arcs, colored by step order (sequential ramp)
  const shown = anim.on ? anim.progress : termCount;
  const whole = Math.min(Math.floor(shown), termCount);
  const selSteps = selected !== null ? first.get(selected) : undefined;
  const dimOthers = selSteps !== undefined && selSteps <= whole;

  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  for (let n = 1; n <= whole; n++) {
    ctx.strokeStyle = rampColor(n / termCount);
    ctx.globalAlpha = dimOthers && n > selSteps ? 0.18 : (dimOthers ? 0.45 : 1);
    drawArc(seq[n - 1], seq[n], y0, n % 2 === 1);
  }
  if (anim.on && whole < termCount) {
    const n = whole + 1;
    ctx.strokeStyle = rampColor(n / termCount);
    ctx.globalAlpha = 1;
    drawArc(seq[n - 1], seq[n], y0, n % 2 === 1, shown - whole);
  }
  ctx.globalAlpha = 1;

  // highlighted path to the selected number
  if (dimOthers) {
    ctx.strokeStyle = css('--accent');
    ctx.lineWidth = 2.5;
    for (let n = 1; n <= selSteps; n++) drawArc(seq[n - 1], seq[n], y0, n % 2 === 1);
  }

  // selection marker
  if (selected !== null) {
    const sx = xToScreen(selected);
    if (sx >= -40 && sx <= w + 40) {
      ctx.strokeStyle = css('--accent');
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(sx, 28);
      ctx.lineTo(sx, h - 12);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = css('--accent');
      ctx.beginPath();
      ctx.arc(sx, y0, 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = css('--ink');
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      const label = selSteps !== undefined
        ? `${selected.toLocaleString()} · step ${selSteps.toLocaleString()}`
        : selected.toLocaleString();
      ctx.fillText(label, Math.min(Math.max(sx, 50), w - 50), 20);
    }
  }

  // hover tick
  if (hoverX !== null && hoverX !== selected) {
    const sx = xToScreen(hoverX);
    ctx.fillStyle = css('--ink-2');
    ctx.beginPath();
    ctx.arc(sx, y0, 3.5, 0, 2 * Math.PI);
    ctx.fill();
  }
}

/* ---------- selection & readout ---------- */

function renderResult(v, steps) {
  if (steps > termCount) {
    const canShow = steps <= 5000;
    readout.innerHTML = `<span class="big">${v.toLocaleString()}</span>
      <span class="detail">is first reached after <strong>${steps.toLocaleString()}</strong> steps
      — beyond the ${termCount.toLocaleString()} currently drawn.</span>
      ${canShow ? `<button id="extendBtn">Draw ${steps.toLocaleString()} steps</button>` : ''}`;
    const btn = document.getElementById('extendBtn');
    if (btn) btn.addEventListener('click', () => {
      document.getElementById('terms').value = steps;
      setTermCount(steps);
      fitView();
    });
  } else {
    readout.innerHTML = `<span class="big">${v.toLocaleString()}</span>
      <span class="detail">is first reached after <strong>${steps.toLocaleString()}</strong>
      step${steps === 1 ? '' : 's'} &nbsp;·&nbsp; a(${steps.toLocaleString()}) = ${v.toLocaleString()}</span>`;
  }
  requestRender();
}

function describeSelection(v) {
  cancelSearch();
  if (v < 0) {
    readout.innerHTML = `<span class="big">${v}</span>
      <span class="detail">is <strong>never</strong> visited — Recamán’s sequence stays at 0 or above.</span>`;
    return;
  }
  const steps = first.has(v) ? first.get(v) : answers.get(v);
  if (steps !== undefined) renderResult(v, steps);
  else startSearch(v);
}

function select(v) {
  selected = v;
  describeSelection(v);
  requestRender();
}

/* ---------- controls ---------- */

function setTermCount(n) {
  termCount = n;
  ({ seq, first } = computeSequence(n));
  document.getElementById('termsVal').textContent = n.toLocaleString();
  document.getElementById('legendEnd').textContent = 'step ' + n.toLocaleString();
  anim.on = false;
  document.getElementById('animateBtn').textContent = '▶ Animate';
  if (selected !== null) describeSelection(selected);
  requestRender();
}

document.getElementById('terms').addEventListener('input', e => {
  setTermCount(+e.target.value);
  fitView();
});

function doLookup() {
  const v = Math.round(+document.getElementById('lookup').value);
  if (!Number.isFinite(v)) return;
  select(v);
  const sx = xToScreen(v);
  const w = canvas.clientWidth;
  if (sx < 0 || sx > w) view.offset = v - (w / 2) / view.scale;
  requestRender();
}
document.getElementById('lookupBtn').addEventListener('click', doLookup);
document.getElementById('lookup').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLookup();
});

document.getElementById('fitBtn').addEventListener('click', fitView);

document.getElementById('animateBtn').addEventListener('click', function () {
  anim.on = !anim.on;
  if (anim.on) {
    anim.progress = 0;
    anim.last = performance.now();
    anim.maxShown = 1;
    anim.tracked = 0;
    anim.userView = false;
    this.textContent = '⏸ Stop';
    tickAnim();
  } else {
    this.textContent = '▶ Animate';
    requestRender();
  }
});

// Once the animation catches up with the drawn range, grow the sequence in
// place so it never has to stop.
const ANIM_MAX = 50_000;
const ANIM_RATE = 30;   // steps per second — constant, so long runs stay smooth

function extendTo(n) {
  let cur = seq[termCount];
  for (let i = termCount + 1; i <= n; i++) {
    const back = cur - i;
    cur = (back > 0 && !first.has(back)) ? back : cur + i;
    seq[i] = cur;
    if (!first.has(cur)) first.set(cur, i);
  }
  termCount = n;
  document.getElementById('terms').value = Math.min(n, 5000);
  document.getElementById('termsVal').textContent = n.toLocaleString();
  document.getElementById('legendEnd').textContent = 'step ' + n.toLocaleString();
}

function tickAnim() {
  if (!anim.on) return;
  const now = performance.now();
  anim.progress += (now - anim.last) / 1000 * ANIM_RATE;
  anim.last = now;

  const needed = Math.ceil(anim.progress) + 1;
  if (needed > termCount && termCount < ANIM_MAX) {
    const prev = termCount;
    extendTo(Math.min(Math.max(needed, termCount + 64), ANIM_MAX));
    if (selected !== null && !search) {
      const st = first.get(selected);
      if (st !== undefined && st > prev && st <= termCount) renderResult(selected, st);
    }
  }
  if (anim.progress >= ANIM_MAX) {
    anim.on = false;
    document.getElementById('animateBtn').textContent = '▶ Animate';
  }

  // keep the growing figure in frame unless the user has taken over the view
  const whole = Math.min(Math.floor(anim.progress) + 1, termCount);
  for (let i = anim.tracked + 1; i <= whole; i++) {
    if (seq[i] > anim.maxShown) anim.maxShown = seq[i];
  }
  anim.tracked = whole;
  if (!anim.userView) {
    const w = canvas.clientWidth;
    const target = (w * 0.92) / (anim.maxShown + 4);
    view.scale += (target - view.scale) * 0.08;
    view.offset = -2 - (w * 0.04) / view.scale;
  }

  render();
  if (anim.on) requestAnimationFrame(tickAnim);
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue('color-scheme').includes('dark');
  root.dataset.theme = dark ? 'light' : 'dark';
  requestRender();
});

/* ---------- pointer interaction ---------- */

const pointers = new Map();
let dragStart = null, pinchDist = 0;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (pointers.size === 1) {
    dragStart = { x: e.offsetX, offset: view.offset, moved: false };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    dragStart = null;
  }
});

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0 && d > 0) {
      if (anim.on) anim.userView = true;
      const mid = (a.x + b.x) / 2;
      zoomAt(mid, d / pinchDist);
      pinchDist = d;
    }
    return;
  }

  if (dragStart && pointers.size === 1) {
    const dx = e.offsetX - dragStart.x;
    if (Math.abs(dx) > 4) dragStart.moved = true;
    if (dragStart.moved) {
      if (anim.on) anim.userView = true;
      view.offset = dragStart.offset - dx / view.scale;
      canvas.classList.add('panning');
      tooltip.style.display = 'none';
      requestRender();
      return;
    }
  }

  // hover
  const x = Math.round(screenToX(e.offsetX));
  if (x !== hoverX) {
    hoverX = x;
    requestRender();
  }
  if (x >= 0) {
    const steps = first.has(x) ? first.get(x) : answers.get(x);
    tooltip.innerHTML = `<strong>${x.toLocaleString()}</strong> <span class="sub">${
      steps !== undefined
        ? '· step ' + steps.toLocaleString()
        : '· not in first ' + termCount.toLocaleString() + ' steps'
    }</span>`;
    tooltip.style.left = e.offsetX + 'px';
    tooltip.style.top = e.offsetY + 'px';
    tooltip.style.display = 'block';
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  canvas.classList.remove('panning');
  if (dragStart && !dragStart.moved) {
    const v = Math.round(screenToX(e.offsetX));
    select(v);
    document.getElementById('lookup').value = v >= 0 ? v : '';
  }
  dragStart = null;
  pinchDist = 0;
});

canvas.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  canvas.classList.remove('panning');
  dragStart = null;
  pinchDist = 0;
});

canvas.addEventListener('pointerleave', () => {
  hoverX = null;
  tooltip.style.display = 'none';
  requestRender();
});

function zoomAt(sx, factor) {
  const worldX = screenToX(sx);
  view.scale = Math.min(400, Math.max(0.02, view.scale * factor));
  view.offset = worldX - sx / view.scale;
  requestRender();
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (anim.on) anim.userView = true;
  zoomAt(e.offsetX, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

/* ---------- boot ---------- */

new ResizeObserver(requestRender).observe(canvas);
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', requestRender);
fitView();
</script>

</body>
</html>

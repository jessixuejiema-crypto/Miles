<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Algebra 🎲</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #a78bfa;
    --good: #34d399;
    --dice-face: #f8fafc;
    --pip: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 0.95rem;
  }

  /* Tabs */
  .tabs {
    display: inline-flex;
    background: var(--card);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 28px;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tab {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1220;
  }

  /* 2D dice button (d100) */
  .dice-zone { margin-bottom: 10px; }
  .dice {
    width: 110px;
    height: 110px;
    background: var(--dice-face);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.45), inset 0 -6px 0 rgba(0,0,0,0.12);
    transition: transform 0.15s;
    user-select: none;
  }
  .dice:hover { transform: translateY(-4px) scale(1.03); }
  .dice:active { transform: translateY(0) scale(0.97); }
  .dice.rolling { animation: roll 0.8s ease-in-out; }
  @keyframes roll {
    0%   { transform: rotate(0deg)   scale(1); }
    25%  { transform: rotate(90deg)  scale(1.15); }
    50%  { transform: rotate(200deg) scale(0.9); }
    75%  { transform: rotate(310deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .dice .num {
    font-size: 2.1rem;
    font-weight: 800;
    color: var(--pip);
    font-variant-numeric: tabular-nums;
  }
  .dice .num.label { font-size: 1.6rem; letter-spacing: 1px; }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .difficulty {
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 22px;
    min-height: 1.2em;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .difficulty.easy   { color: var(--good); }
  .difficulty.medium { color: var(--accent); }
  .difficulty.hard   { color: var(--accent-2); }

  /* Problem card */
  .card {
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 28px 24px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .placeholder { color: var(--muted); font-size: 1.05rem; }
  .equation {
    font-family: "Cambria Math", Cambria, Georgia, serif;
    font-size: 1.9rem;
    letter-spacing: 1px;
  }
  .equation .brace {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-left: 3px solid var(--accent);
    padding-left: 18px;
    text-align: left;
  }
  .reveal-btn {
    margin-top: 6px;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid #3e4f68;
    border-radius: 10px;
    padding: 9px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .reveal-btn:hover { background: #32415a; }
  .answer {
    font-family: "Cambria Math", Cambria, Georgia, serif;
    font-size: 1.4rem;
    color: var(--good);
    font-weight: 700;
  }

  /* 3D panel */
  #canvas3d {
    max-width: 100%;
    cursor: pointer;
    touch-action: manipulation;
  }
  footer {
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎲 Dice Algebra</h1>
  <p class="subtitle">Click the 100-sided dice to roll a random equation. The roll sets the difficulty!</p>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-x" role="tab" aria-selected="true">Solve for x</button>
    <button class="tab" id="tab-xy" role="tab" aria-selected="false">Solve for x &amp; y</button>
    <button class="tab" id="tab-3d" role="tab" aria-selected="false">3D Dice</button>
  </div>

  <div id="panel-algebra">
    <div class="dice-zone">
      <button class="dice" id="dice" aria-label="Roll the 100-sided dice">
        <span class="num label" id="dice-num">d100</span>
      </button>
    </div>
    <p class="hint">1–33 easy &nbsp;·&nbsp; 34–66 medium &nbsp;·&nbsp; 67–100 hard</p>
    <p class="difficulty" id="difficulty"></p>

    <div class="card" id="card">
      <p class="placeholder" id="placeholder">Roll the dice to get your first problem!</p>
      <div class="equation" id="equation" hidden></div>
      <button class="reveal-btn" id="reveal" hidden>Show answer</button>
      <p class="answer" id="answer" hidden></p>
    </div>
  </div>

  <div id="panel-3d" hidden>
    <canvas id="canvas3d" width="340" height="340" aria-label="3D 100-sided dice — click to roll"></canvas>
    <p class="hint">Click the dice to watch it roll in 3D</p>
    <p class="difficulty" id="result3d"></p>
  </div>

  <footer>Every problem has a whole-number answer. Good luck! ✏️</footer>
</div>

<script>
(function () {
  var mode = 'x'; // 'x', 'xy', or '3d'
  var rolling = false;

  var diceEl = document.getElementById('dice');
  var diceNumEl = document.getElementById('dice-num');
  var diffEl = document.getElementById('difficulty');
  var placeholderEl = document.getElementById('placeholder');
  var equationEl = document.getElementById('equation');
  var revealBtn = document.getElementById('reveal');
  var answerEl = document.getElementById('answer');
  var tabX = document.getElementById('tab-x');
  var tabXY = document.getElementById('tab-xy');
  var tab3D = document.getElementById('tab-3d');
  var panelAlgebra = document.getElementById('panel-algebra');
  var panel3D = document.getElementById('panel-3d');
  var result3dEl = document.getElementById('result3d');

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function randNonZero(min, max) {
    var n = 0;
    while (n === 0) n = randInt(min, max);
    return n;
  }

  // Format "a·x" nicely: 1x -> x, -1x -> -x
  function coef(a, v) {
    if (a === 1) return v;
    if (a === -1) return '−' + v;
    return fmt(a) + v;
  }
  // Format numbers with a proper minus sign
  function fmt(n) {
    return n < 0 ? '−' + Math.abs(n) : String(n);
  }
  // Format "+ b" / "− b" as a trailing term; b of 0 gives empty string
  function trail(b) {
    if (b === 0) return '';
    return b > 0 ? ' + ' + b : ' − ' + Math.abs(b);
  }

  // ---- Single-variable generators. Each returns {text, answer} ----
  // Solutions are built backwards from a chosen integer x so answers are always whole numbers.

  function genX(level) {
    var x, a, b, c, d;
    if (level === 1) {
      // easy: x + b = c  or  ax = c  or  ax + b = c (small numbers)
      x = randInt(1, 10);
      var kind = randInt(0, 2);
      if (kind === 0) {
        b = randNonZero(-10, 10);
        return { text: 'x' + trail(b) + ' = ' + fmt(x + b), answer: x };
      }
      if (kind === 1) {
        a = randInt(2, 9);
        return { text: coef(a, 'x') + ' = ' + fmt(a * x), answer: x };
      }
      a = randInt(2, 5);
      b = randNonZero(-9, 9);
      return { text: coef(a, 'x') + trail(b) + ' = ' + fmt(a * x + b), answer: x };
    }
    if (level === 2) {
      // medium: ax + b = c with negatives, a(x + b) = c, or x/a + b = c
      x = randInt(-10, 12);
      var kind2 = randInt(0, 2);
      if (kind2 === 0) {
        a = randNonZero(-9, 9);
        b = randNonZero(-12, 12);
        return { text: coef(a, 'x') + trail(b) + ' = ' + fmt(a * x + b), answer: x };
      }
      if (kind2 === 1) {
        a = randNonZero(-6, 6);
        b = randNonZero(-8, 8);
        return { text: fmt(a) + '(x' + trail(b) + ') = ' + fmt(a * (x + b)), answer: x };
      }
      a = randInt(2, 6);
      x = a * randInt(-6, 6); // make x divisible by a
      b = randNonZero(-10, 10);
      return { text: 'x/' + a + trail(b) + ' = ' + fmt(x / a + b), answer: x };
    }
    // hard: variables on both sides  ax + b = cx + d,  or  a(x + b) = cx + d
    x = randInt(-9, 9);
    a = randNonZero(-9, 9);
    c = randNonZero(-9, 9);
    while (c === a) c = randNonZero(-9, 9); // keep it solvable
    var kind3 = randInt(0, 1);
    if (kind3 === 0) {
      b = randNonZero(-15, 15);
      d = a * x + b - c * x;
      return {
        text: coef(a, 'x') + trail(b) + ' = ' + coef(c, 'x') + trail(d),
        answer: x
      };
    }
    b = randNonZero(-8, 8);
    d = a * (x + b) - c * x;
    return {
      text: fmt(a) + '(x' + trail(b) + ') = ' + coef(c, 'x') + trail(d),
      answer: x
    };
  }

  // ---- Two-variable system generators. Each returns {lines: [eq1, eq2], x, y} ----

  function eqLine(a, b, rhs) {
    // Build "ax + by = rhs" with nice signs; a is never 0 here
    var left = coef(a, 'x');
    if (b > 0) left += ' + ' + (b === 1 ? 'y' : b + 'y');
    else if (b < 0) left += ' − ' + (b === -1 ? 'y' : Math.abs(b) + 'y');
    return left + ' = ' + fmt(rhs);
  }

  function genXY(level) {
    var x, y, a1, b1, a2, b2;
    if (level === 1) {
      // easy: x + y = s, x − y = d  (substitution-friendly)
      x = randInt(1, 12); y = randInt(1, 12);
      var kind = randInt(0, 1);
      if (kind === 0) {
        return { lines: ['x + y = ' + fmt(x + y), 'x − y = ' + fmt(x - y)], x: x, y: y };
      }
      a1 = randInt(2, 4);
      return { lines: [eqLine(1, 1, x + y), eqLine(a1, 1, a1 * x + y)], x: x, y: y };
    }
    if (level === 2) {
      // medium: small coefficients, elimination needed
      x = randInt(-6, 8); y = randInt(-6, 8);
      a1 = randNonZero(-4, 4); b1 = randNonZero(-4, 4);
      a2 = randNonZero(-4, 4); b2 = randNonZero(-4, 4);
      while (a1 * b2 - a2 * b1 === 0) { a2 = randNonZero(-4, 4); b2 = randNonZero(-4, 4); }
      return {
        lines: [eqLine(a1, b1, a1 * x + b1 * y), eqLine(a2, b2, a2 * x + b2 * y)],
        x: x, y: y
      };
    }
    // hard: bigger coefficients and answers
    x = randInt(-12, 12); y = randInt(-12, 12);
    a1 = randNonZero(-8, 8); b1 = randNonZero(-8, 8);
    a2 = randNonZero(-8, 8); b2 = randNonZero(-8, 8);
    while (a1 * b2 - a2 * b1 === 0) { a2 = randNonZero(-8, 8); b2 = randNonZero(-8, 8); }
    return {
      lines: [eqLine(a1, b1, a1 * x + b1 * y), eqLine(a2, b2, a2 * x + b2 * y)],
      x: x, y: y
    };
  }

  // d100 difficulty bands
  function levelFor(face) {
    if (face <= 33) return 1;
    if (face <= 66) return 2;
    return 3;
  }

  var DIFF_LABEL = { 1: ['easy', 'Easy'], 2: ['medium', 'Medium'], 3: ['hard', 'Hard'] };

  function renderProblem(face) {
    var level = levelFor(face);
    diffEl.className = 'difficulty ' + DIFF_LABEL[level][0];
    diffEl.textContent = 'You rolled ' + face + ' — ' + DIFF_LABEL[level][1];

    placeholderEl.hidden = true;
    equationEl.hidden = false;
    revealBtn.hidden = false;
    revealBtn.textContent = 'Show answer';
    answerEl.hidden = true;

    if (mode === 'x') {
      var p = genX(level);
      equationEl.textContent = p.text;
      answerEl.textContent = 'x = ' + fmt(p.answer);
    } else {
      var s = genXY(level);
      equationEl.innerHTML = '<div class="brace"><div>' + s.lines[0] + '</div><div>' + s.lines[1] + '</div></div>';
      answerEl.textContent = 'x = ' + fmt(s.x) + ',  y = ' + fmt(s.y);
    }
  }

  diceEl.addEventListener('click', function () {
    if (rolling) return;
    rolling = true;
    diceEl.classList.add('rolling');
    diceNumEl.classList.remove('label');

    // Flicker random numbers while the dice spins
    var flicker = setInterval(function () {
      diceNumEl.textContent = randInt(1, 100);
    }, 70);

    setTimeout(function () {
      clearInterval(flicker);
      diceEl.classList.remove('rolling');
      rolling = false;
      var face = randInt(1, 100);
      diceNumEl.textContent = face;
      renderProblem(face);
    }, 800);
  });

  revealBtn.addEventListener('click', function () {
    if (answerEl.hidden) {
      answerEl.hidden = false;
      revealBtn.textContent = 'Hide answer';
    } else {
      answerEl.hidden = true;
      revealBtn.textContent = 'Show answer';
    }
  });

  // ================= 3D d100 (software-rendered, no libraries) =================
  // The die is a zocchihedron-style sphere: 100 flat hexagonal facets placed on
  // a Fibonacci lattice, each numbered 1-100. Rendered on canvas with painter's
  // algorithm, Lambert shading, and a mild perspective camera.

  var canvas = document.getElementById('canvas3d');
  var ctx = canvas.getContext && canvas.getContext('2d');
  var CSIZE = 340, CX = CSIZE / 2, CY = CSIZE / 2, RADIUS = 118, CAMD = 4;
  var LIGHT = normalize3([-0.35, 0.55, 0.76]);

  function normalize3(v) {
    var l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }
  function cross3(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

  // Quaternions as [w, x, y, z]
  function qmul(a, b) {
    return [
      a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
      a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
      a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
      a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]
    ];
  }
  function qaxis(axis, angle) {
    var s = Math.sin(angle / 2);
    return [Math.cos(angle / 2), axis[0] * s, axis[1] * s, axis[2] * s];
  }
  function qrot(q, v) {
    var r = qmul(qmul(q, [0, v[0], v[1], v[2]]), [q[0], -q[1], -q[2], -q[3]]);
    return [r[1], r[2], r[3]];
  }
  function qslerp(a, b, t) {
    var d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
    if (d < 0) { b = [-b[0], -b[1], -b[2], -b[3]]; d = -d; }
    var wa, wb;
    if (d > 0.9995) { wa = 1 - t; wb = t; }
    else {
      var th = Math.acos(Math.min(1, d)), sth = Math.sin(th);
      wa = Math.sin((1 - t) * th) / sth;
      wb = Math.sin(t * th) / sth;
    }
    var out = [
      a[0] * wa + b[0] * wb, a[1] * wa + b[1] * wb,
      a[2] * wa + b[2] * wb, a[3] * wa + b[3] * wb
    ];
    return normalizeQ(out);
  }
  function normalizeQ(q) {
    var l = Math.sqrt(q[0] * q[0] + q[1] * q[1] + q[2] * q[2] + q[3] * q[3]) || 1;
    return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
  }

  // Build the 100 facets on a Fibonacci sphere
  var FACETS = []; // {n, normal, center, verts[6]}
  (function buildDie() {
    var GA = Math.PI * (3 - Math.sqrt(5)); // golden angle
    var FR = 0.19;                          // facet circumradius
    for (var i = 0; i < 100; i++) {
      var y = 1 - 2 * (i + 0.5) / 100;
      var r = Math.sqrt(Math.max(0, 1 - y * y));
      var th = i * GA;
      var p = [Math.cos(th) * r, y, Math.sin(th) * r];
      var ref = Math.abs(p[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
      var t1 = normalize3(cross3(p, ref));
      var t2 = cross3(p, t1);
      var verts = [];
      for (var k = 0; k < 6; k++) {
        var a = k * Math.PI / 3 + Math.PI / 6;
        var ca = Math.cos(a) * FR, sa = Math.sin(a) * FR;
        verts.push([
          p[0] + ca * t1[0] + sa * t2[0],
          p[1] + ca * t1[1] + sa * t2[1],
          p[2] + ca * t1[2] + sa * t2[2]
        ]);
      }
      FACETS.push({ n: i + 1, normal: p, verts: verts });
    }
  })();

  // Quaternion that brings facet n's normal to face the camera (+z)
  function targetQuat(n) {
    var p = FACETS[n - 1].normal, z = [0, 0, 1];
    var d = dot3(p, z);
    if (d > 0.99999) return [1, 0, 0, 0];
    if (d < -0.99999) return qaxis([1, 0, 0], Math.PI);
    return qaxis(normalize3(cross3(p, z)), Math.acos(d));
  }

  function project(v) {
    var s = CAMD / (CAMD - v[2]);
    return [CX + v[0] * RADIUS * s, CY - v[1] * RADIUS * s, s];
  }

  var q3 = qaxis([0.3, 1, 0.2], 0.6); // current orientation
  var anim = { phase: 'idle', done: false };
  var winFace = -1;
  var rafId = null, lastT = 0;

  function draw() {
    ctx.clearRect(0, 0, CSIZE, CSIZE);

    // Soft shadow under the die
    ctx.save();
    ctx.translate(CX, CY + RADIUS * 1.14);
    ctx.scale(1, 0.22);
    var sg = ctx.createRadialGradient(0, 0, 0, 0, 0, RADIUS * 0.8);
    sg.addColorStop(0, 'rgba(0,0,0,0.4)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Base sphere fills the tiny gaps between facets
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS * 1.0, 0, Math.PI * 2);
    ctx.fillStyle = '#8b94a3';
    ctx.fill();

    // Collect visible facets, back to front
    var visible = [];
    for (var i = 0; i < 100; i++) {
      var f = FACETS[i];
      var rn = qrot(q3, f.normal);
      if (rn[2] <= 0.02) continue;
      visible.push({ f: f, rn: rn });
    }
    visible.sort(function (a, b) { return a.rn[2] - b.rn[2]; });

    for (var j = 0; j < visible.length; j++) {
      var vf = visible[j], f2 = vf.f, rn2 = vf.rn;
      var lam = Math.max(0, dot3(rn2, LIGHT));
      var shade = 0.42 + 0.58 * lam;
      var isWin = f2.n === winFace;
      var cr, cg, cb;
      if (isWin) { cr = 56 * 0.3 + 56 * shade; cg = 189 * shade; cb = 248 * shade; }
      else { cr = 248 * shade; cg = 250 * shade; cb = 252 * shade; }

      ctx.beginPath();
      var ctrProj = null;
      for (var k2 = 0; k2 < 6; k2++) {
        var pv = project(qrot(q3, f2.verts[k2]));
        if (k2 === 0) ctx.moveTo(pv[0], pv[1]); else ctx.lineTo(pv[0], pv[1]);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgb(' + (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0) + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(15,23,42,0.22)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Number, faded out as the facet turns away (drawn screen-upright)
      if (rn2[2] > 0.5) {
        ctrProj = project(qrot(q3, f2.normal));
        var alpha = (rn2[2] - 0.5) / 0.5;
        var fs = 12.5 * ctrProj[2] * rn2[2];
        ctx.font = '700 ' + fs.toFixed(1) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = isWin
          ? 'rgba(11,18,32,' + alpha.toFixed(2) + ')'
          : 'rgba(15,23,42,' + (0.9 * alpha).toFixed(2) + ')';
        ctx.fillText(f2.n, ctrProj[0], ctrProj[1]);
      }
    }
  }

  function frame(t) {
    var dt = Math.min(40, t - lastT || 16);
    lastT = t;

    if (anim.phase === 'idle' && !anim.done) {
      // Gentle tumble while waiting for the first roll
      q3 = normalizeQ(qmul(qaxis([0.2, 1, 0.1], 0.0005 * dt), q3));
    } else if (anim.phase === 'spin') {
      var el = t - anim.t0;
      var k = Math.max(0, 1 - el / anim.dur);
      var speed = 0.0025 + 0.011 * k * k; // rad per ms, decelerating
      q3 = normalizeQ(qmul(qaxis(anim.axis, speed * dt), q3));
      if (el >= anim.dur) {
        anim.phase = 'settle';
        anim.t0 = t;
        anim.dur = 750;
        anim.qFrom = q3;
        anim.qTo = targetQuat(anim.n);
      }
    } else if (anim.phase === 'settle') {
      var u = Math.min(1, (t - anim.t0) / anim.dur);
      var e = 1 - Math.pow(1 - u, 3);
      q3 = qslerp(anim.qFrom, anim.qTo, e);
      if (u >= 1) {
        var landed = anim.n;
        winFace = landed;
        anim = { phase: 'idle', done: true };
        var lvl = levelFor(landed);
        result3dEl.className = 'difficulty ' + DIFF_LABEL[lvl][0];
        result3dEl.textContent = 'You rolled ' + landed + ' — ' + DIFF_LABEL[lvl][1];
      }
    }

    draw();
    if (mode === '3d') rafId = requestAnimationFrame(frame);
  }

  function roll3D() {
    if (anim.phase === 'spin' || anim.phase === 'settle') return;
    winFace = -1;
    result3dEl.textContent = '';
    result3dEl.className = 'difficulty';
    anim = {
      phase: 'spin',
      t0: lastT,
      dur: 1300,
      n: randInt(1, 100),
      axis: normalize3([Math.random() - 0.5, Math.random() + 0.3, Math.random() - 0.5]),
      done: false
    };
  }

  canvas.addEventListener('click', roll3D);

  // Crisp rendering on high-DPI screens
  (function setupCanvas() {
    if (!ctx) return;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = CSIZE * dpr;
    canvas.height = CSIZE * dpr;
    canvas.style.width = CSIZE + 'px';
    canvas.style.height = CSIZE + 'px';
    ctx.scale(dpr, dpr);
  })();

  // ================= Tabs =================

  function setMode(next) {
    if (mode === next) return;
    var prev = mode;
    mode = next;
    tabX.classList.toggle('active', next === 'x');
    tabXY.classList.toggle('active', next === 'xy');
    tab3D.classList.toggle('active', next === '3d');
    tabX.setAttribute('aria-selected', next === 'x');
    tabXY.setAttribute('aria-selected', next === 'xy');
    tab3D.setAttribute('aria-selected', next === '3d');

    panelAlgebra.hidden = next === '3d';
    panel3D.hidden = next !== '3d';

    if (next === '3d') {
      lastT = 0;
      rafId = requestAnimationFrame(frame);
      return;
    }
    if (prev === '3d') {
      if (rafId) cancelAnimationFrame(rafId);
      return; // keep the current algebra problem when coming back from 3D view
    }
    // Switching between x and xy: reset the card so the old problem doesn't
    // linger in the wrong mode
    placeholderEl.hidden = false;
    equationEl.hidden = true;
    revealBtn.hidden = true;
    answerEl.hidden = true;
    diffEl.textContent = '';
    diffEl.className = 'difficulty';
  }

  tabX.addEventListener('click', function () { setMode('x'); });
  tabXY.addEventListener('click', function () { setMode('xy'); });
  tab3D.addEventListener('click', function () { setMode('3d'); });
})();
</script>
</body>
</html>

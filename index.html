<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rarity Wheel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d17;
    --panel: #161627;
    --panel2: #1e1e33;
    --text: #e8e8f5;
    --dim: #8a8aa8;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a30 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 22px 10px 8px;
  }
  header h1 {
    font-size: 2.1rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd700, #ff4081, #00e5ff, #ffd700);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  header p { color: var(--dim); margin-top: 4px; font-size: .95rem; }

  .layout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .wheel-area {
    position: relative;
    width: min(520px, 96vw);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wheel-wrap { position: relative; width: 100%; }
  canvas#wheel { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 24px rgba(0,0,0,.6)); }

  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid #ffd700;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.8));
    z-index: 5;
  }

  #rollBtn {
    margin-top: 18px;
    padding: 14px 60px;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: #14142a;
    background: linear-gradient(135deg, #ffd700, #ffab00);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 200, 0, .35);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  #rollBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(255, 200, 0, .5); }
  #rollBtn:active:not(:disabled) { transform: translateY(1px); }
  #rollBtn:disabled { filter: grayscale(.7) brightness(.7); cursor: default; }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-row #rollBtn { margin-top: 0; }

  #timelapseBtn {
    padding: 14px 28px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(135deg, #7c4dff, #d500f9);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(160, 60, 255, .35);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  #timelapseBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(160, 60, 255, .5); }
  #timelapseBtn:active { transform: translateY(1px); }

  #turboBtn {
    padding: 14px 28px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #04121a;
    background: linear-gradient(135deg, #00e5ff, #00b0ff);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 200, 255, .35);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  #turboBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(0, 200, 255, .5); }
  #turboBtn:active { transform: translateY(1px); }

  #timelapseBtn.running,
  #turboBtn.running {
    color: #fff;
    background: linear-gradient(135deg, #ff1744, #ff5252);
    box-shadow: 0 4px 20px rgba(255, 40, 60, .4);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { filter: brightness(1.25); } }

  .speed-row {
    margin-top: 12px;
    width: min(420px, 100%);
    background: var(--panel);
    border: 1px solid #2b2b4a;
    border-radius: 10px;
    padding: 10px 16px 12px;
  }
  .speed-row .speed-label {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .speed-row .speed-value {
    color: var(--text);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #speedSlider {
    width: 100%;
    accent-color: #a04dff;
    cursor: pointer;
  }

  .result {
    margin-top: 16px;
    min-height: 92px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .result .name {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .result .odds { color: var(--dim); margin-top: 4px; font-size: .95rem; }
  .result.pop .name { animation: pop .45s cubic-bezier(.2, 2.5, .4, 1); }
  @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }

  .rainbow-text {
    background: linear-gradient(90deg, #ff004c, #ff9100, #ffee00, #00e676, #00b0ff, #d500f9, #ff004c);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: shimmer 3s linear infinite;
  }
  .cosmic-text {
    background: linear-gradient(90deg, #7c4dff, #00e5ff, #e040fb, #7c4dff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: shimmer 2.5s linear infinite;
  }
  .godly-text {
    background: linear-gradient(90deg, #fffde7, #ffd700, #ffffff, #ffd700, #fffde7);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: shimmer 1.8s linear infinite;
  }
  .void-text {
    background: linear-gradient(90deg, #b388ff, #4a148c, #d1c4e9, #4a148c, #b388ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: shimmer 2.2s linear infinite;
  }
  .singularity-text {
    background: linear-gradient(90deg, #ffffff, #616161, #000000, #616161, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: shimmer 1.5s linear infinite;
  }
  .claude-text {
    background: linear-gradient(90deg, #da7756, #ffb59d, #ff7043, #ffd6c2, #da7756);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent !important;
    animation: shimmer 1.5s linear infinite;
  }

  .stats-bar {
    display: flex;
    gap: 14px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    background: var(--panel);
    border: 1px solid #2b2b4a;
    border-radius: 10px;
    padding: 8px 16px;
    text-align: center;
    min-width: 110px;
  }
  .stat .label { color: var(--dim); font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }

  .dist {
    width: 100%;
    margin-top: 16px;
  }
  .dist .dist-label {
    color: var(--dim);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 6px;
  }
  .dist-viewport {
    overflow: hidden;
    border-radius: 9px;
    border: 1px solid #2b2b4a;
    background: var(--panel);
  }
  .dist-bar {
    display: flex;
    height: 28px;
    width: 100%;
  }
  .dist-seg {
    height: 100%;
  }
  .dist-controls {
    display: flex;
    gap: 14px;
    margin-top: 8px;
  }
  .dist-ctl { flex: 1; }
  .dist-ctl input[type="range"] {
    width: 100%;
    accent-color: #a04dff;
    cursor: pointer;
  }

  .index-panel {
    background: var(--panel);
    border: 1px solid #2b2b4a;
    border-radius: 14px;
    padding: 16px;
    width: min(360px, 96vw);
  }
  #indexList {
    max-height: 620px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .index-panel h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 10px;
    text-align: center;
  }
  .rarity-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: .9rem;
  }
  .rarity-row:nth-child(even) { background: var(--panel2); }
  .rarity-row .swatch {
    width: 14px; height: 14px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .rarity-row .rname { flex: 1; font-weight: 600; }
  .rarity-row .chance { color: var(--dim); font-size: .8rem; width: 62px; text-align: right; }
  .rarity-row .count { width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  .rarity-row.unfound { opacity: .45; }

  #resetBtn {
    margin-top: 12px;
    width: 100%;
    padding: 8px;
    background: none;
    border: 1px solid #3a3a5e;
    border-radius: 8px;
    color: var(--dim);
    cursor: pointer;
    font-size: .8rem;
  }
  #resetBtn:hover { color: var(--text); border-color: var(--dim); }
  #resetBtn.confirm {
    color: #fff;
    background: #c62828;
    border-color: #c62828;
    font-weight: 700;
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    opacity: 0;
  }
  .flash.go { animation: flashAnim .9s ease-out; }
  @keyframes flashAnim { 0% { opacity: .85; } 100% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <h1>RARITY WHEEL</h1>
  <p>Press ROLL and test your luck — can you hit the rarest of them all?</p>
</header>

<div class="layout">
  <div class="wheel-area">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="700" height="700"></canvas>
    </div>
    <div class="btn-row">
      <button id="rollBtn">ROLL</button>
      <button id="timelapseBtn">TIMELAPSE</button>
      <button id="turboBtn">TURBO</button>
    </div>
    <div class="speed-row">
      <div class="speed-label">
        <span>Timelapse speed</span>
        <span class="speed-value" id="speedValue">20 rolls/sec</span>
      </div>
      <input type="range" id="speedSlider" min="-100" max="400" step="1" value="130">
    </div>
    <div class="result" id="result">
      <div class="name" style="color:#555">?</div>
      <div class="odds">Spin the wheel to find out your fate</div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="label">Total Rolls</div><div class="value" id="statRolls">0</div></div>
      <div class="stat"><div class="label">Best Find</div><div class="value" id="statBest">—</div></div>
      <div class="stat"><div class="label">Found</div><div class="value" id="statFound">0 / 129</div></div>
    </div>
    <div class="dist">
      <div class="dist-label" id="distLabel">Expected Odds</div>
      <div class="dist-viewport" id="distViewport">
        <div class="dist-bar" id="distBar"></div>
      </div>
      <div class="dist-controls">
        <div class="dist-ctl">
          <div class="speed-label"><span>Zoom</span><span class="speed-value" id="zoomValue">1×</span></div>
          <input type="range" id="zoomSlider" min="0" max="500" step="1" value="0">
        </div>
        <div class="dist-ctl">
          <div class="speed-label"><span>Scroll</span><span class="speed-value" id="panValue">0%</span></div>
          <input type="range" id="panSlider" min="0" max="1000" step="1" value="0">
        </div>
      </div>
    </div>
  </div>

  <div class="index-panel">
    <h2>Rarity Index</h2>
    <div id="indexList"></div>
    <button id="resetBtn">Reset progress</button>
  </div>
</div>

<div class="flash" id="flash"></div>

  { name: "Apex", w: 1e-7, color: '#ff5722', special: 'singularity-text' },
  { name: "Omega", w: 1e-9, color: '#ffffff', special: 'rainbow-text' },
];
const TOTAL_W = RARITIES.reduce((s, r) => s + r.w, 0);
const N = RARITIES.length;
// Index in RARITIES doubles as rarity rank (higher index = rarer).
const EPIC_IDX = RARITIES.findIndex(r => r.name === 'Mythical'); // chime tier
const TOP_IDX = RARITIES.findIndex(r => r.name === 'Nebula');    // flash + fanfare tier

const SAVE_KEY = 'rarityWheelSave';
let state = { rolls: 0, counts: {} };
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved && typeof saved.rolls === 'number') state = saved;
} catch (e) {}

const wheelCanvas = document.getElementById('wheel');
const wctx = wheelCanvas.getContext('2d');
const SIZE = wheelCanvas.width;
const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 10;
const SEG = (2 * Math.PI) / N;
let rotation = -Math.PI / 2 - SEG / 2; // start with segment 0 centered under the pointer

const DARK_TEXT = new Set(['Glass', 'Iron', 'Frozen', 'Divine', 'Gold', 'Diamond', 'Godly']);

function drawWheel() {
  wctx.clearRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < N; i++) {
    const a0 = rotation + i * SEG;
    const a1 = a0 + SEG;
    wctx.beginPath();
    wctx.moveTo(CX, CY);
    wctx.arc(CX, CY, R, a0, a1);
    wctx.closePath();
    wctx.fillStyle = RARITIES[i].color;
    wctx.fill();
    wctx.strokeStyle = 'rgba(0,0,0,.55)';
    wctx.lineWidth = N > 40 ? 1 : 2;
    wctx.stroke();

    // with 100+ segments the slices are too thin for labels;
    // the result panel and index name what you land on
    if (N <= 40) {
      wctx.save();
      wctx.translate(CX, CY);
      wctx.rotate(a0 + SEG / 2);
      wctx.textAlign = 'right';
      wctx.textBaseline = 'middle';
      wctx.fillStyle = DARK_TEXT.has(RARITIES[i].name) ? '#1a1a2e' : '#ffffff';
      wctx.font = 'bold 18px Segoe UI, sans-serif';
      wctx.fillText(RARITIES[i].name, R - 14, 0);
      wctx.restore();
    }
  }
  wctx.beginPath();
  wctx.arc(CX, CY, 46, 0, 2 * Math.PI);
  wctx.fillStyle = '#14142a';
  wctx.fill();
  wctx.strokeStyle = '#ffd700';
  wctx.lineWidth = 4;
  wctx.stroke();
  wctx.fillStyle = '#ffd700';
  wctx.font = 'bold 20px Segoe UI, sans-serif';
  wctx.textAlign = 'center';
  wctx.textBaseline = 'middle';
  wctx.fillText('ROLL', CX, CY);
  wctx.beginPath();
  wctx.arc(CX, CY, R, 0, 2 * Math.PI);
  wctx.strokeStyle = '#ffd700';
  wctx.lineWidth = 5;
  wctx.stroke();
}
drawWheel();

function pickRarity() {
  let roll = Math.random() * TOTAL_W;
  for (let i = 0; i < N; i++) {
    roll -= RARITIES[i].w;
    if (roll < 0) return i;
  }
  return N - 1;
}

let audioCtx = null;
function beep(freq, dur, vol, type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function fanfare(rank) {
  const notes = rank >= TOP_IDX ? [523, 659, 784, 1047, 1319] : rank >= EPIC_IDX ? [523, 659, 784] : [440, 554];
  notes.forEach((f, i) => setTimeout(() => beep(f, 0.35, 0.12, 'triangle'), i * 110));
}

const rollBtn = document.getElementById('rollBtn');
const resultEl = document.getElementById('result');
let spinning = false;

function segmentUnderPointer(rot) {
  // pointer sits at angle -PI/2; segment i spans [rot + i*SEG, rot + (i+1)*SEG)
  let a = (-Math.PI / 2 - rot) % (2 * Math.PI);
  if (a < 0) a += 2 * Math.PI;
  return Math.floor(a / SEG) % N;
}

function spin() {
  if (spinning) return;
  spinning = true;
  rollBtn.disabled = true;
  resultEl.classList.remove('pop');
  const nameEl = resultEl.querySelector('.name');
  nameEl.className = 'name';
  nameEl.style.color = '#555';
  nameEl.style.textShadow = 'none';
  nameEl.textContent = '...';
  resultEl.querySelector('.odds').textContent = 'Rolling...';

  const target = pickRarity();
  // land somewhere inside the target segment, away from the edges
  const frac = 0.15 + Math.random() * 0.7;
  const targetRot = -Math.PI / 2 - (target + frac) * SEG;
  const spins = 5 + Math.floor(Math.random() * 3);
  const startRot = ((rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  let final = targetRot;
  while (final > startRot - spins * 2 * Math.PI) final -= 2 * Math.PI;

  const delta = final - startRot;
  const duration = 4200 + Math.random() * 600;
  const startT = performance.now();
  let lastSeg = segmentUnderPointer(startRot);
  let lastBeep = 0;

  function frame(t) {
    const p = Math.min((t - startT) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    rotation = startRot + delta * eased;
    drawWheel();
    const seg = segmentUnderPointer(rotation);
    if (seg !== lastSeg) {
      lastSeg = seg;
      // throttle ticks: 129 thin segments would otherwise be a solid buzz
      if (t - lastBeep > 45) {
        lastBeep = t;
        beep(900 + Math.random() * 200, 0.03, 0.05, 'square');
      }
    }
    if (p < 1) requestAnimationFrame(frame);
    else finish(target);
  }
  requestAnimationFrame(frame);
}

function showResult(idx) {
  const r = RARITIES[idx];
  const nameEl = resultEl.querySelector('.name');
  nameEl.textContent = r.name.toUpperCase() + '!';
  nameEl.className = 'name' + (r.special ? ' ' + r.special : '');
  nameEl.style.color = r.special ? '' : r.color;
  nameEl.style.textShadow = r.special ? 'none' : `0 0 18px ${r.color}`;
  const oneIn = Math.round(TOTAL_W / r.w);
  resultEl.querySelector('.odds').textContent =
    `${r.name} · ${(100 * r.w / TOTAL_W).toFixed(3)}% chance · 1 in ${oneIn.toLocaleString()}`;
}

function finish(idx, quick) {
  const r = RARITIES[idx];
  state.rolls++;
  state.counts[r.name] = (state.counts[r.name] || 0) + 1;

  if (quick) {
    // timelapse: the tick handles saving and UI; only big finds get effects
    if (idx >= TOP_IDX) { showResult(idx); flash(r.color); fanfare(idx); }
    else if (idx >= EPIC_IDX) beep(784, 0.15, 0.08, 'triangle');
  } else {
    save();
    showResult(idx);
    resultEl.classList.add('pop');
    if (idx >= TOP_IDX) flash(r.color); // Nebula and up
    fanfare(idx);
    spinning = false;
    rollBtn.disabled = false;
    updateUI();
  }
}

const flashEl = document.getElementById('flash');
function flash(color) {
  flashEl.style.background = `radial-gradient(circle, ${color}66 0%, transparent 70%)`;
  flashEl.classList.remove('go');
  void flashEl.offsetWidth;
  flashEl.classList.add('go');
}

const indexList = document.getElementById('indexList');
const distBar = document.getElementById('distBar');
const distLabel = document.getElementById('distLabel');
const distViewport = document.getElementById('distViewport');
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue = document.getElementById('zoomValue');
const panSlider = document.getElementById('panSlider');
const panValue = document.getElementById('panValue');
let distZoom = 1;

// zoom is logarithmic (1x to 100,000x) so the tiniest slivers become visible;
// the scroll slider pans the zoomed bar left/right through the viewport
function applyZoomPan() {
  distBar.style.width = (distZoom * 100) + '%';
  const frac = +panSlider.value / 1000;
  const max = distViewport.scrollWidth - distViewport.clientWidth;
  distViewport.scrollLeft = max > 0 ? frac * max : 0;
  zoomValue.textContent = (distZoom < 10 ? distZoom.toFixed(1) : Math.round(distZoom).toLocaleString()) + '×';
  panValue.textContent = Math.round(frac * 100) + '%';
}
zoomSlider.addEventListener('input', () => {
  distZoom = Math.pow(10, +zoomSlider.value / 100);
  applyZoomPan();
});
panSlider.addEventListener('input', applyZoomPan);

// With 129 rarities, rebuilding the DOM every tick is too slow —
// build the bar segments and index rows once, then update them in place.
const distSegs = RARITIES.map(r => {
  const seg = document.createElement('div');
  seg.className = 'dist-seg';
  seg.style.background = r.color;
  distBar.appendChild(seg);
  return seg;
});

function updateDistBar() {
  // With rolls, show the real share each rarity has appeared; before any, show the odds.
  const hasRolls = state.rolls > 0;
  distLabel.textContent = hasRolls ? 'Your Roll Distribution' : 'Expected Odds';
  RARITIES.forEach((r, i) => {
    const c = state.counts[r.name] || 0;
    const share = hasRolls ? 100 * c / state.rolls : 100 * r.w / TOTAL_W;
    distSegs[i].style.width = share + '%';
    distSegs[i].title = hasRolls
      ? `${r.name} — ${share.toFixed(2)}% of your rolls (×${c.toLocaleString()})`
      : `${r.name} — ${share < 0.001 ? share.toExponential(1) : share.toFixed(3)}% chance`;
  });
  applyZoomPan();
}

function fmtPct(pct) {
  return (pct < 0.001 ? pct.toExponential(1) : pct < 0.1 ? pct.toFixed(3) : pct.toFixed(1)) + '%';
}

// index rows, rarest first; indexRows[i] maps back to RARITIES[i]
const indexRows = [];
for (let i = N - 1; i >= 0; i--) {
  const r = RARITIES[i];
  const row = document.createElement('div');
  row.className = 'rarity-row unfound';
  row.innerHTML =
    `<div class="swatch" style="background:${r.color}"></div>` +
    `<div class="rname" style="${r.special ? '' : `color:${r.color}`}">${r.name}</div>` +
    `<div class="chance">${fmtPct(100 * r.w / TOTAL_W)}</div>` +
    `<div class="count">×0</div>`;
  indexList.appendChild(row);
  indexRows[i] = { row, nameEl: row.children[1], countEl: row.children[3] };
}

function updateUI() {
  updateDistBar();
  document.getElementById('statRolls').textContent = state.rolls.toLocaleString();
  const bestEl = document.getElementById('statBest');
  // rarest rarity rolled so far (derived from counts so old saves stay correct)
  let bestIdx = -1;
  for (let i = N - 1; i >= 0; i--) {
    if (state.counts[RARITIES[i].name]) { bestIdx = i; break; }
  }
  if (bestIdx >= 0) {
    const b = RARITIES[bestIdx];
    bestEl.textContent = b.name;
    bestEl.className = 'value' + (b.special ? ' ' + b.special : '');
    bestEl.style.color = b.special ? '' : b.color;
  } else {
    bestEl.textContent = '—';
    bestEl.className = 'value';
    bestEl.style.color = '';
  }

  let found = 0;
  for (let i = 0; i < N; i++) {
    const r = RARITIES[i];
    const c = state.counts[r.name] || 0;
    if (c) found++;
    const { row, nameEl, countEl } = indexRows[i];
    row.classList.toggle('unfound', !c);
    nameEl.className = 'rname' + (r.special && c ? ' ' + r.special : '');
    countEl.textContent = '×' + c.toLocaleString();
  }
  document.getElementById('statFound').textContent = `${found} / ${N}`;
}
updateUI();

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

// confirm() dialogs are blocked in sandboxed pages, so use a two-click confirm
const resetBtn = document.getElementById('resetBtn');
let resetArmed = null;

function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = null;
  resetBtn.textContent = 'Reset progress';
  resetBtn.classList.remove('confirm');
}

resetBtn.addEventListener('click', () => {
  if (resetArmed) {
    disarmReset();
    state = { rolls: 0, counts: {} };
    save();
    const nameEl = resultEl.querySelector('.name');
    nameEl.textContent = '?';
    nameEl.className = 'name';
    nameEl.style.color = '#555';
    nameEl.style.textShadow = 'none';
    resultEl.querySelector('.odds').textContent = 'Spin the wheel to find out your fate';
    updateUI();
  } else {
    resetBtn.textContent = 'Click again to confirm reset';
    resetBtn.classList.add('confirm');
    resetArmed = setTimeout(disarmReset, 4000);
  }
});

// ---- Timelapse: automatic rolls at a slider-chosen speed ----
const timelapseBtn = document.getElementById('timelapseBtn');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
let timelapseTimer = null;
let tlSpeed = 20;

// logarithmic slider: -100..400 maps to 10^(v/100) = 0.1..10,000 rolls/sec,
// so it moves slowly through the low speeds and races up toward the top
function sliderToSpeed(v) {
  const raw = Math.pow(10, v / 100);
  return raw < 1 ? Math.round(raw * 100) / 100 : Math.round(raw);
}
const turboBtn = document.getElementById('turboBtn');
const TURBO_SPEED = 10000000;
let turbo = false;

// Walker alias table: O(1) weighted picks so turbo's 500k rolls fit in a tick.
// Same exact odds as pickRarity, just a constant-time lookup.
const ALIAS = (() => {
  const prob = new Float64Array(N), alias = new Int32Array(N);
  const p = RARITIES.map(r => r.w * N / TOTAL_W);
  const small = [], large = [];
  p.forEach((s, i) => (s < 1 ? small : large).push(i));
  while (small.length && large.length) {
    const s = small.pop(), l = large.pop();
    prob[s] = p[s]; alias[s] = l;
    p[l] += p[s] - 1;
    (p[l] < 1 ? small : large).push(l);
  }
  while (large.length) prob[large.pop()] = 1;
  while (small.length) prob[small.pop()] = 1;
  return { prob, alias };
})();

function pickFast() {
  const u = Math.random() * N;
  const i = u | 0;
  return (u - i) < ALIAS.prob[i] ? i : ALIAS.alias[i];
}

function effSpeed() { return turbo ? TURBO_SPEED : tlSpeed; }
// timers can't fire faster than ~20/sec, so past that we batch rolls per tick
function tickInterval() { const s = effSpeed(); return s <= 20 ? Math.round(1000 / s) : 50; }
function rollsPerTick() { const s = effSpeed(); return s <= 20 ? 1 : Math.round(s / 20); }

function updateSpeed() {
  tlSpeed = sliderToSpeed(+speedSlider.value);
  speedValue.textContent = tlSpeed.toLocaleString() + ' rolls/sec';
  if (timelapseTimer) {
    clearInterval(timelapseTimer);
    timelapseTimer = setInterval(timelapseTick, tickInterval());
  }
}
speedSlider.addEventListener('input', updateSpeed);
updateSpeed();

function timelapseTick() {
  const n = rollsPerTick();
  let target;
  if (n <= 500) {
    for (let i = 0; i < n; i++) {
      target = pickRarity();
      finish(target, true);
    }
  } else {
    // turbo fast path: every roll still happens individually and fairly,
    // but tallies merge into state once per tick with no per-roll DOM work
    const local = new Array(N).fill(0);
    for (let i = 0; i < n; i++) local[pickFast()]++;
    state.rolls += n;
    target = 0;
    for (let j = 0; j < N; j++) {
      if (!local[j]) continue;
      const name = RARITIES[j].name;
      const firstFind = !state.counts[name];
      state.counts[name] = (state.counts[name] || 0) + local[j];
      target = j; // ends at the rarest rolled this tick (list runs common -> rare)
      if (firstFind && j >= TOP_IDX) { flash(RARITIES[j].color); fanfare(j); }
    }
  }
  // snap the wheel straight to the result — no time for a full spin
  rotation = -Math.PI / 2 - (target + 0.5) * SEG;
  drawWheel();
  showResult(target);
  save();
  updateUI();
}

function startTimelapse() {
  if (spinning) return; // let a manual spin finish first
  timelapseTimer = setInterval(timelapseTick, tickInterval());
  const btn = turbo ? turboBtn : timelapseBtn;
  btn.textContent = 'STOP';
  btn.classList.add('running');
  rollBtn.disabled = true;
  resultEl.classList.remove('pop');
}

function stopTimelapse() {
  clearInterval(timelapseTimer);
  timelapseTimer = null;
  turbo = false;
  timelapseBtn.textContent = 'TIMELAPSE';
  timelapseBtn.classList.remove('running');
  turboBtn.textContent = 'TURBO';
  turboBtn.classList.remove('running');
  rollBtn.disabled = false;
}

timelapseBtn.addEventListener('click', () => {
  const wasTurbo = turbo;
  if (timelapseTimer) {
    stopTimelapse();
    if (!wasTurbo) return; // plain stop; but turbo -> timelapse switches over
  }
  startTimelapse();
});

turboBtn.addEventListener('click', () => {
  const wasTurbo = turbo;
  if (timelapseTimer) {
    stopTimelapse();
    if (wasTurbo) return; // plain stop; but timelapse -> turbo switches over
  }
  turbo = true;
  startTimelapse();
});

rollBtn.addEventListener('click', spin);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spinning && !timelapseTimer) { e.preventDefault(); spin(); }
});
</script>
</body>
</html>

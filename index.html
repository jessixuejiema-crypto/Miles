<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Life in Time — 3D Game of Life</title>
<style>
  :root {
    --bg: #eef1f7;
    --panel: rgba(255, 255, 255, 0.82);
    --panel-solid: #ffffff;
    --border: rgba(20, 30, 60, 0.14);
    --text: #161d2e;
    --muted: #616c85;
    --accent: #2f7de1;
    --accent-soft: rgba(47, 125, 225, 0.14);
    --chip: rgba(20, 30, 60, 0.06);
    --shadow: 0 12px 34px rgba(18, 26, 48, 0.16);
    --danger: #c8443c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #05070d;
      --panel: rgba(16, 21, 34, 0.78);
      --panel-solid: #121727;
      --border: rgba(150, 178, 235, 0.16);
      --text: #e6ecf8;
      --muted: #93a0bd;
      --accent: #56b6ff;
      --accent-soft: rgba(86, 182, 255, 0.16);
      --chip: rgba(140, 170, 230, 0.1);
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
      --danger: #ef7a72;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1f7;
    --panel: rgba(255, 255, 255, 0.82);
    --panel-solid: #ffffff;
    --border: rgba(20, 30, 60, 0.14);
    --text: #161d2e;
    --muted: #616c85;
    --accent: #2f7de1;
    --accent-soft: rgba(47, 125, 225, 0.14);
    --chip: rgba(20, 30, 60, 0.06);
    --shadow: 0 12px 34px rgba(18, 26, 48, 0.16);
    --danger: #c8443c;
  }
  :root[data-theme="dark"] {
    --bg: #05070d;
    --panel: rgba(16, 21, 34, 0.78);
    --panel-solid: #121727;
    --border: rgba(150, 178, 235, 0.16);
    --text: #e6ecf8;
    --muted: #93a0bd;
    --accent: #56b6ff;
    --accent-soft: rgba(86, 182, 255, 0.16);
    --chip: rgba(140, 170, 230, 0.1);
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
    --danger: #ef7a72;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  #stage.drawing { cursor: crosshair; }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    pointer-events: none;
    z-index: 5;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 10px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: auto;
  }
  .logo {
    width: 30px; height: 30px;
    border-radius: 9px;
    background:
      linear-gradient(135deg, #6ef0c0, #14b8a6 45%, #1b2a6b);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    position: relative;
    flex: none;
  }
  .logo::after {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 3px;
    background: rgba(255,255,255,0.85);
    box-shadow: 6px -4px 0 -2px rgba(255,255,255,0.5), -6px 5px 0 -2px rgba(255,255,255,0.35);
  }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: 0.2px; }
  .brand p { margin: 0; font-size: 11px; color: var(--muted); }

  .stats {
    display: flex;
    gap: 6px;
    margin-left: auto;
    pointer-events: auto;
  }
  .stat {
    min-width: 62px;
    padding: 6px 10px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
  }
  .stat b {
    display: block;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .stat span {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .icon-btn {
    pointer-events: auto;
    display: none;
    width: 42px; height: 42px;
    flex: none;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 17px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
  }

  /* ---------- control panel ---------- */
  #panel {
    position: fixed;
    top: 74px;
    left: 14px;
    width: 286px;
    max-height: calc(100vh - 152px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 4;
    scrollbar-width: thin;
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: var(--chip); border-radius: 8px; }
  #panel.hidden { display: none; }

  .section + .section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .section h2 {
    margin: 0 0 9px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 700;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1; }

  button, select, input[type="text"] {
    font: inherit;
    color: var(--text);
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--chip);
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  select, input[type="text"] { cursor: pointer; width: 100%; }
  input[type="text"] { cursor: text; font-variant-numeric: tabular-nums; }
  input[type="text"].bad { border-color: var(--danger); }

  button.primary {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.toggle.on {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }

  label.field {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  label.field b {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    float: right;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 4px;
    background: var(--chip);
    border: 1px solid var(--border);
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 4px;
    background: var(--chip);
    border: 1px solid var(--border);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel-solid);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel-solid);
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  /* ---------- view bar ---------- */
  .viewbar {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    padding: 5px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 5;
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .viewbar::-webkit-scrollbar { display: none; }
  .viewbar button {
    background: transparent;
    border: 1px solid transparent;
    padding: 7px 12px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .viewbar button.on {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 650;
  }

  .hint {
    position: fixed;
    right: 14px;
    bottom: 16px;
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 3;
    pointer-events: none;
    max-width: 26vw;
  }
  #toast {
    position: fixed;
    left: 50%;
    top: 78px;
    transform: translate(-50%, -8px);
    padding: 9px 16px;
    border-radius: 12px;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s, transform 0.22s;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 820px) {
    .icon-btn { display: block; }
    .brand p { display: none; }
    .stat { min-width: 52px; padding: 5px 8px; }
    .stat b { font-size: 13px; }
    #panel {
      top: auto;
      left: 8px;
      right: 8px;
      bottom: 68px;
      width: auto;
      max-height: 52vh;
    }
    .hint { display: none; }
    .viewbar { bottom: 10px; }
  }
  @media (max-width: 520px) {
    .stats .stat.opt { display: none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <div>
      <h1>Life in Time</h1>
      <p>Conway&rsquo;s Game of Life, stacked along the time axis</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="statGen">0</b><span>gen</span></div>
    <div class="stat"><b id="statPop">0</b><span>alive</span></div>
    <div class="stat opt"><b id="statLayers">0</b><span>layers</span></div>
    <div class="stat opt"><b id="statFps">0</b><span>fps</span></div>
  </div>
  <button id="panelToggle" class="icon-btn" aria-label="Toggle controls">&#9776;</button>
</header>

<aside id="panel">
  <div class="section">
    <h2>Playback</h2>
    <div class="row">
      <button id="btnPlay" class="primary grow">&#9654;&nbsp; Play</button>
      <button id="btnStep" title="Advance one generation (N)">Step</button>
    </div>
    <div class="row" style="display:block">
      <label class="field" for="rngSpeed">Speed <b><span id="valSpeed">8</span>&nbsp;gen/s</b></label>
      <input type="range" id="rngSpeed" min="1" max="30" step="1" value="8">
    </div>
  </div>

  <div class="section">
    <h2>Board</h2>
    <div class="row">
      <select id="selSize" title="Grid size">
        <option value="24">24 &times; 24</option>
        <option value="32">32 &times; 32</option>
        <option value="40" selected>40 &times; 40</option>
        <option value="48">48 &times; 48</option>
        <option value="64">64 &times; 64</option>
      </select>
    </div>
    <div class="row" style="display:block">
      <label class="field" for="rngDepth">History depth <b><span id="valDepth">60</span>&nbsp;gens</b></label>
      <input type="range" id="rngDepth" min="1" max="140" step="1" value="60">
    </div>
    <div class="row" style="display:block">
      <label class="field" for="rngDensity">Seed density <b><span id="valDensity">28</span>%</b></label>
      <input type="range" id="rngDensity" min="2" max="80" step="1" value="28">
    </div>
    <div class="row">
      <button id="btnRandom" class="grow">Randomize</button>
      <button id="btnClear" class="grow">Clear</button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="chkWrap" checked> Wrap edges (torus)</label>
    </div>
  </div>

  <div class="section">
    <h2>Rule</h2>
    <div class="row">
      <select id="selRule">
        <option value="B3/S23" selected>Conway&rsquo;s Life &mdash; B3/S23</option>
        <option value="B36/S23">HighLife &mdash; B36/S23</option>
        <option value="B3678/S34678">Day &amp; Night &mdash; B3678/S34678</option>
        <option value="B2/S">Seeds &mdash; B2/S</option>
        <option value="B3/S12345">Maze &mdash; B3/S12345</option>
        <option value="B3/S1234">Mazectric &mdash; B3/S1234</option>
        <option value="B3/S45678">Coral &mdash; B3/S45678</option>
        <option value="B34/S34">34 Life &mdash; B34/S34</option>
        <option value="B1357/S1357">Replicator &mdash; B1357/S1357</option>
        <option value="B345/S4567">Amoeba &mdash; B345/S4567</option>
      </select>
    </div>
    <div class="row">
      <input type="text" id="txtRule" value="B3/S23" spellcheck="false" aria-label="Rule string">
    </div>
  </div>

  <div class="section">
    <h2>Patterns</h2>
    <div class="row">
      <select id="selPattern">
        <option value="glider">Glider</option>
        <option value="lwss">Lightweight spaceship</option>
        <option value="blinker">Blinker</option>
        <option value="toad">Toad</option>
        <option value="beacon">Beacon</option>
        <option value="pulsar" selected>Pulsar</option>
        <option value="pentadecathlon">Pentadecathlon</option>
        <option value="rpentomino">R-pentomino</option>
        <option value="acorn">Acorn</option>
        <option value="diehard">Diehard</option>
        <option value="gun">Gosper glider gun</option>
      </select>
    </div>
    <div class="row">
      <button id="btnStamp" class="grow">Stamp at centre</button>
      <button id="btnDraw" class="toggle" title="Paint cells on the top layer (D)">Draw</button>
    </div>
  </div>

  <div class="section">
    <h2>View</h2>
    <div class="row" style="display:block">
      <label class="field" for="rngSlab">Visible layers <b><span id="valSlab">60</span></b></label>
      <input type="range" id="rngSlab" min="1" max="140" step="1" value="60">
    </div>
    <div class="row" style="display:block">
      <label class="field" for="rngGap">Time spacing <b><span id="valGap">1.00</span></b></label>
      <input type="range" id="rngGap" min="0.3" max="2.5" step="0.05" value="1">
    </div>
    <div class="row" style="display:block">
      <label class="field" for="rngCell">Cell size <b><span id="valCell">0.80</span></b></label>
      <input type="range" id="rngCell" min="0.25" max="1" step="0.05" value="0.8">
    </div>
    <div class="row">
      <select id="selSlice" aria-label="Slice">
        <option value="none" selected>Whole board</option>
        <option value="z">Single row (slice Z)</option>
        <option value="x">Single column (slice X)</option>
      </select>
    </div>
    <div class="row" style="display:block">
      <label class="field" for="rngSlice">Slice index <b><span id="valSlice">20</span></b></label>
      <input type="range" id="rngSlice" min="0" max="39" step="1" value="20">
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="chkOrtho"> Orthographic</label>
      <label class="check"><input type="checkbox" id="chkSpin"> Auto-spin</label>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="chkGrid" checked> Grid &amp; frame</label>
      <label class="check"><input type="checkbox" id="chkTaper" checked> Taper</label>
    </div>
  </div>

  <div class="section">
    <h2>Appearance</h2>
    <div class="row">
      <select id="selPalette" aria-label="Palette">
        <option value="aurora" selected>Aurora</option>
        <option value="ember">Ember</option>
        <option value="ice">Ice</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
    </div>
    <div class="row">
      <select id="selColor" aria-label="Colour mode">
        <option value="time" selected>Colour by time</option>
        <option value="age">Colour by cell age</option>
        <option value="flat">Flat colour</option>
      </select>
    </div>
    <div class="row">
      <select id="selTheme" aria-label="Theme">
        <option value="system" selected>Theme: system</option>
        <option value="dark">Theme: dark</option>
        <option value="light">Theme: light</option>
      </select>
    </div>
  </div>
</aside>

<nav class="viewbar">
  <button data-view="free" class="on">Free</button>
  <button data-view="iso">Iso</button>
  <button data-view="top">Top</button>
  <button data-view="front">Front</button>
  <button data-view="side">Side</button>
  <button data-view="recenter">Recentre</button>
</nav>

<div class="hint">Drag to orbit &middot; Scroll to zoom &middot; Right-drag or Shift-drag to pan &middot; Space plays</div>
<div id="toast"></div>

<script>
"use strict";
(function () {

/* =====================================================================
   Life in Time — Conway's Game of Life rendered as a 3D time column.
   X and Z are the board; Y is the generation axis. The newest generation
   sits at y = 0 (the "now" plane) and history sinks below it.
   ===================================================================== */

/* ---------------------------------------------------------------- math */

const m4 = {
  create() { return new Float32Array(16); },
  perspective(o, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    o[0] = f / aspect; o[1] = 0; o[2] = 0; o[3] = 0;
    o[4] = 0; o[5] = f; o[6] = 0; o[7] = 0;
    o[8] = 0; o[9] = 0; o[10] = (far + near) * nf; o[11] = -1;
    o[12] = 0; o[13] = 0; o[14] = 2 * far * near * nf; o[15] = 0;
    return o;
  },
  ortho(o, l, r, b, t, n, f) {
    const lr = 1 / (l - r), bt = 1 / (b - t), nf = 1 / (n - f);
    o[0] = -2 * lr; o[1] = 0; o[2] = 0; o[3] = 0;
    o[4] = 0; o[5] = -2 * bt; o[6] = 0; o[7] = 0;
    o[8] = 0; o[9] = 0; o[10] = 2 * nf; o[11] = 0;
    o[12] = (l + r) * lr; o[13] = (b + t) * bt; o[14] = (f + n) * nf; o[15] = 1;
    return o;
  },
  lookAt(o, eye, ctr, up) {
    let z0 = eye[0] - ctr[0], z1 = eye[1] - ctr[1], z2 = eye[2] - ctr[2];
    let len = Math.hypot(z0, z1, z2) || 1;
    len = 1 / len; z0 *= len; z1 *= len; z2 *= len;
    let x0 = up[1] * z2 - up[2] * z1,
        x1 = up[2] * z0 - up[0] * z2,
        x2 = up[0] * z1 - up[1] * z0;
    len = Math.hypot(x0, x1, x2);
    if (len < 1e-6) { x0 = 1; x1 = 0; x2 = 0; }
    else { len = 1 / len; x0 *= len; x1 *= len; x2 *= len; }
    const y0 = z1 * x2 - z2 * x1,
          y1 = z2 * x0 - z0 * x2,
          y2 = z0 * x1 - z1 * x0;
    o[0] = x0; o[1] = y0; o[2] = z0; o[3] = 0;
    o[4] = x1; o[5] = y1; o[6] = z1; o[7] = 0;
    o[8] = x2; o[9] = y2; o[10] = z2; o[11] = 0;
    o[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
    o[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
    o[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
    o[15] = 1;
    return o;
  },
  multiply(o, a, b) {
    for (let c = 0; c < 4; c++) {
      const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
      o[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
      o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
      o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;

function step() {

  dirty.lines = true;

function stampPattern(name) {
  const p = parsePattern(PATTERNS[name]);

  let clipped = 0;
  for (const [x, z] of p.cells) {
    const gx = ox + x, gz = oz + z;

  const far = cam.dist + Math.max(sim.W, sim.H) * 3 + stackHeight() * 2 + 200;
  if (view.ortho) {
    const hh = cam.dist * Math.tan(FOV / 2);
    m4.ortho(projMat, -hh * aspect, hh * aspect, -hh, hh, -far, far);
  } else {
    m4.perspective(projMat, FOV, aspect, 0.5, far);
  }
  m4.lookAt(viewMat, eye, cam.target, [0, 1, 0]);
  m4.multiply(viewProj, projMat, viewMat);
  m4.invert(invVP, viewProj);
}

/* --------------------------------------------------- instance building */

function ensureCapacity(n) {
  if (n <= inst.cap) return;
  const cap = Math.max(1024, Math.ceil(n * 1.3));
  inst.data = new Float32Array(cap * INST_FLOATS);
  inst.cap = cap;
  inst.gpuCap = -1;
}

function buildInstances() {
  const st = sim.stack, n = st.length;
  const shown = Math.min(view.slab, n);
  const start = n - shown;
  let total = 0;
  for (let i = start; i < n; i++) total += st[i].pop;
  ensureCapacity(total);

  const arr = inst.data;
  const W = sim.W, H = sim.H;
  const ox = -(W - 1) / 2, oz = -(H - 1) / 2;
  const pal = PALETTES[view.palette].rgb;
  const mode = view.color;
  let p = 0;

  for (let i = start; i < n; i++) {
    const layer = st[i];
    const depthT = shown <= 1 ? 1 : (i - start) / (shown - 1);   // 0 oldest .. 1 newest
    const y = -(n - 1 - i) * view.gap;
    const dim = lerp(0.26, 1, Math.pow(depthT, 0.75));
    const scale = view.cell * (view.taper ? lerp(0.62, 1, Math.pow(depthT, 0.5)) : 1);
    const ids = layer.idx, ages = layer.idxAge, len = ids.length;
    const sliceX = view.slice === "x" ? view.sliceIndex : -1;
    const sliceZ = view.slice === "z" ? view.sliceIndex : -1;
    let cr = 0, cg = 0, cb = 0;
    if (mode !== "age") {
      const c = sampleStops(pal, mode === "flat" ? 0.78 : depthT);
      cr = c[0] * dim; cg = c[1] * dim; cb = c[2] * dim;
    }
    for (let k = 0; k < len; k++) {
      const id = ids[k];
      const x = id % W, z = (id / W) | 0;
      if ((sliceX >= 0 && x !== sliceX) || (sliceZ >= 0 && z !== sliceZ)) continue;
      if (mode === "age") {
        const c = sampleStops(pal, Math.min(1, Math.log2(1 + ages[k]) / 4.6));
        arr[p + 3] = c[0] * dim; arr[p + 4] = c[1] * dim; arr[p + 5] = c[2] * dim;
      } else {
        arr[p + 3] = cr; arr[p + 4] = cg; arr[p + 5] = cb;
      }
      arr[p] = ox + x; arr[p + 1] = y; arr[p + 2] = oz + z;
      arr[p + 6] = scale;
      p += INST_FLOATS;
    }
  }
  inst.count = p / INST_FLOATS;
  gl.bindBuffer(gl.ARRAY_BUFFER, inst.buf);
  if (inst.gpuCap !== inst.cap) {
    gl.bufferData(gl.ARRAY_BUFFER, inst.data.byteLength, gl.DYNAMIC_DRAW);
    inst.gpuCap = inst.cap;
  }
  if (p > 0) gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst.data.subarray(0, p));
  dirty.instances = false;
}

/* -------------------------------------------------------- line geometry */

function pushLine(a, ax, ay, az, bx, by, bz, col) {
  a.push(ax, ay, az, col[0], col[1], col[2], col[3],
         bx, by, bz, col[0], col[1], col[2], col[3]);
}

function buildLines() {
  const out = [];
  if (view.grid) {
    const W = sim.W, H = sim.H;
    const x0 = -W / 2, x1 = W / 2, z0 = -H / 2, z1 = H / 2;
    const isLight = stageIsLight();
    const soft = isLight ? [0.15, 0.2, 0.32, 0.16] : [0.55, 0.72, 1.0, 0.13];
    const strong = isLight ? [0.1, 0.15, 0.28, 0.4] : [0.6, 0.85, 1.0, 0.42];
    const step = W > 48 ? 4 : W > 32 ? 2 : 1;
    for (let x = 0; x <= W; x += step) pushLine(out, x0 + x, 0, z0, x0 + x, 0, z1, soft);
    for (let z = 0; z <= H; z += step) pushLine(out, x0, 0, z0 + z, x1, 0, z0 + z, soft);
    // "now" plane border
    pushLine(out, x0, 0, z0, x1, 0, z0, strong);
    pushLine(out, x1, 0, z0, x1, 0, z1, strong);
    pushLine(out, x1, 0, z1, x0, 0, z1, strong);
    pushLine(out, x0, 0, z1, x0, 0, z0, strong);
    // time column frame
    const yb = -stackHeight();
    const frame = isLight ? [0.1, 0.15, 0.28, 0.2] : [0.55, 0.75, 1.0, 0.2];
    pushLine(out, x0, 0, z0, x0, yb, z0, frame);
    pushLine(out, x1, 0, z0, x1, yb, z0, frame);
    pushLine(out, x1, 0, z1, x1, yb, z1, frame);
    pushLine(out, x0, 0, z1, x0, yb, z1, frame);
    pushLine(out, x0, yb, z0, x1, yb, z0, frame);
    pushLine(out, x1, yb, z0, x1, yb, z1, frame);
    pushLine(out, x1, yb, z1, x0, yb, z1, frame);
    pushLine(out, x0, yb, z1, x0, yb, z0, frame);
  }
  lines.data = new Float32Array(out);
  lines.count = out.length / 7;
  gl.bindBuffer(gl.ARRAY_BUFFER, lines.buf);
  gl.bufferData(gl.ARRAY_BUFFER, lines.data, gl.STATIC_DRAW);
  dirty.lines = false;
}

let hoverCell = null;
function buildHover() {
  if (!hoverCell) { hover.count = 0; return; }
  const out = [];
  const ox = -(sim.W - 1) / 2, oz = -(sim.H - 1) / 2;
  const x = ox + hoverCell.x, z = oz + hoverCell.z, r = 0.5, y = 0.02;
  const c = [1, 1, 1, 0.85];
  pushLine(out, x - r, y, z - r, x + r, y, z - r, c);
  pushLine(out, x + r, y, z - r, x + r, y, z + r, c);
  pushLine(out, x + r, y, z + r, x - r, y, z + r, c);
  pushLine(out, x - r, y, z + r, x - r, y, z - r, c);
  hover.data.set(out);
  hover.count = out.length / 7;
  gl.bindBuffer(gl.ARRAY_BUFFER, hover.buf);
  gl.bufferData(gl.ARRAY_BUFFER, hover.data, gl.DYNAMIC_DRAW);
}

/* ----------------------------------------------------------------- draw */

let bgColor = [0.02, 0.03, 0.05];

function stageIsLight() {
  if (view.theme === "light") return true;
  if (view.theme === "dark") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
}
function refreshStageColors() {
  const p = PALETTES[view.palette];
  bgColor = hex(stageIsLight() ? p.light : p.dark);
  dirty.lines = true;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
}

function bindAttrib(loc, size, stride, offset, divisor) {
  if (loc < 0) return;
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
  setDivisor(loc, divisor);
}

function drawScene() {
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(bgColor[0], bgColor[1], bgColor[2], 1);
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* cubes */
  if (inst.count > 0) {
    gl.useProgram(cubeProg.prog);
    gl.uniformMatrix4fv(cubeProg.u.uViewProj, false, viewProj);
    gl.uniform3fv(cubeProg.u.uCamPos, eye);
    const ld = [0.45, 0.82, 0.36];
    const l = Math.hypot(ld[0], ld[1], ld[2]);
    gl.uniform3f(cubeProg.u.uLightDir, ld[0] / l, ld[1] / l, ld[2] / l);
    gl.uniform3fv(cubeProg.u.uFogColor, bgColor);
    const fogScale = 1 / Math.max(30, cam.dist * 2.4);
    gl.uniform1f(cubeProg.u.uFogDensity, fogScale * fogScale * 1.4);
    gl.uniform1f(cubeProg.u.uEdge, stageIsLight() ? 0.28 : 0.45);

    gl.bindBuffer(gl.ARRAY_BUFFER, cubeVbo);
    bindAttrib(cubeProg.a.aPos, 3, 32, 0, 0);
    bindAttrib(cubeProg.a.aNormal, 3, 32, 12, 0);
    bindAttrib(cubeProg.a.aUv, 2, 32, 24, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, inst.buf);
    const stride = INST_FLOATS * 4;
    bindAttrib(cubeProg.a.aOffset, 3, stride, 0, 1);
    bindAttrib(cubeProg.a.aColor, 3, stride, 12, 1);
    bindAttrib(cubeProg.a.aScale, 1, stride, 24, 1);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cubeIbo);
    drawInstanced(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0, inst.count);
    setDivisor(cubeProg.a.aOffset, 0);
    setDivisor(cubeProg.a.aColor, 0);
    setDivisor(cubeProg.a.aScale, 0);
  }

  /* lines */
  const drawLines = (buf, count) => {
    if (!count) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    bindAttrib(lineProg.a.aPos, 3, 28, 0, 0);
    bindAttrib(lineProg.a.aColor, 4, 28, 12, 0);
    gl.drawArrays(gl.LINES, 0, count);
  };
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(lineProg.prog);
  gl.uniformMatrix4fv(lineProg.u.uViewProj, false, viewProj);
  drawLines(lines.buf, lines.count);
  drawLines(hover.buf, hover.count);
  gl.depthMask(true);
}

/* -------------------------------------------------------------- picking */

const rayA = [0, 0, 0], rayB = [0, 0, 0];
function pickCell(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = -((((clientY - rect.top) / rect.height) * 2) - 1);
  m4.transformPoint(rayA, [nx, ny, -1], invVP);
  m4.transformPoint(rayB, [nx, ny, 1], invVP);
  const dy = rayB[1] - rayA[1];
  if (Math.abs(dy) < 1e-8) return null;
  const t = (0 - rayA[1]) / dy;
  if (t < 0 || t > 1.0001) return null;
  const hx = rayA[0] + (rayB[0] - rayA[0]) * t;
  const hz = rayA[2] + (rayB[2] - rayA[2]) * t;
  const x = Math.round(hx + (sim.W - 1) / 2);
  const z = Math.round(hz + (sim.H - 1) / 2);
  if (x < 0 || x >= sim.W || z < 0 || z >= sim.H) return null;
  return { x, z };
}

function paintAt(clientX, clientY, value) {
  const c = pickCell(clientX, clientY);
  if (!c) return;
  const top = sim.stack[sim.stack.length - 1];
  const i = c.z * sim.W + c.x;
  if (top.cells[i] === value) return;
  top.cells[i] = value;
  top.ages[i] = value ? 1 : 0;
  indexLayer(top);
  dirty.instances = true;
}

/* ---------------------------------------------------------------- input */

let dragging = false;
let dragMode = null;          // "orbit" | "pan" | "paint"
let paintValue = 1;
let lastX = 0, lastY = 0;
const pointers = new Map();
let pinchDist = 0, pinchX = 0, pinchY = 0;

function panBy(dx, dy) {
  const scale = cam.dist * 0.0016;
  const rx = Math.sin(cam.theta), rz = -Math.cos(cam.theta);          // camera right
  const cp = Math.cos(cam.phi), sp = Math.sin(cam.phi);
  const ux = -sp * Math.cos(cam.theta), uy = cp, uz = -sp * Math.sin(cam.theta);
  cam.target[0] += (-dx * rx + dy * ux) * scale;
  cam.target[1] += (dy * uy) * scale;
  cam.target[2] += (-dx * rz + dy * uz) * scale;
  cam.goal = null;
  cam.follow = false;
}

canvas.addEventListener("contextmenu", e => e.preventDefault());

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    pinchX = (a.x + b.x) / 2; pinchY = (a.y + b.y) / 2;
    dragMode = "pinch";
    return;
  }
  lastX = e.clientX; lastY = e.clientY;
  dragging = true;
  if (drawMode && e.button === 0 && !e.shiftKey) {
    const c = pickCell(e.clientX, e.clientY);
    if (c) {
      const top = sim.stack[sim.stack.length - 1];
      paintValue = top.cells[c.z * sim.W + c.x] ? 0 : 1;
      dragMode = "paint";
      paintAt(e.clientX, e.clientY, paintValue);
      return;
    }
  }
  dragMode = (e.button === 2 || e.button === 1 || e.shiftKey) ? "pan" : "orbit";
  canvas.classList.add("dragging");
});

canvas.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId);
  if (p) { p.x = e.clientX; p.y = e.clientY; }

  if (dragMode === "pinch" && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinchDist > 0) { cam.dist *= clamp(pinchDist / Math.max(1, d), 0.5, 2); cam.autoFit = false; }
    panBy(mx - pinchX, my - pinchY);
    pinchDist = d; pinchX = mx; pinchY = my;
    cam.goal = null;
    return;
  }
  if (!dragging) {
    if (drawMode) {
      const c = pickCell(e.clientX, e.clientY);
      if (!hoverCell || !c || c.x !== hoverCell.x || c.z !== hoverCell.z) {
        hoverCell = c; buildHover();
      }
    }
    return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (dragMode === "paint") {
    paintAt(e.clientX, e.clientY, paintValue);
    const c = pickCell(e.clientX, e.clientY);
    if (c) { hoverCell = c; buildHover(); }
  } else if (dragMode === "pan") {
    panBy(dx, dy);
  } else {
    cam.theta += dx * 0.0065;
    cam.phi = clamp(cam.phi - dy * 0.0065, -Math.PI / 2 + 0.001, Math.PI / 2 - 0.001);
    cam.goal = null;
    if (cam.mode !== "free") { cam.mode = "free"; markViewButtons(); }
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2 && dragMode === "pinch") dragMode = null;
  if (pointers.size === 0) { dragging = false; dragMode = null; }
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", e => {
  if (!dragging && hoverCell) { hoverCell = null; buildHover(); }
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const k = Math.exp(clamp(e.deltaY, -120, 120) * 0.0016);
  cam.dist = clamp(cam.dist * k, 4, 900);
  cam.goal = null;
  cam.autoFit = false;
}, { passive: false });

/* ------------------------------------------------------------------- UI */

const $ = id => document.getElementById(id);
let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1700);
}

function setPlaying(v) {
  playing = v;
  $("btnPlay").innerHTML = v ? "&#10073;&#10073;&nbsp; Pause" : "&#9654;&nbsp; Play";
}
function markViewButtons() {
  document.querySelectorAll(".viewbar button").forEach(b => {
    b.classList.toggle("on", b.dataset.view === cam.mode);
  });
}
function setDrawMode(v) {
  drawMode = v;
  $("btnDraw").classList.toggle("on", v);
  canvas.classList.toggle("drawing", v);
  if (!v && hoverCell) { hoverCell = null; buildHover(); }
}
function applyTheme() {
  const root = document.documentElement;
  if (view.theme === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", view.theme);
  refreshStageColors();
}

function newBoard(size) {
  sim.W = sim.H = size;
  const sl = $("rngSlice");
  sl.max = size - 1;
  view.sliceIndex = Math.min(view.sliceIndex, size - 1);
  sl.value = view.sliceIndex;
  $("valSlice").textContent = view.sliceIndex;
  sim.pool.length = 0;
  resetBoard(density);
  frameCamera(true);
  dirty.lines = true;
}

$("btnPlay").addEventListener("click", () => setPlaying(!playing));
$("btnStep").addEventListener("click", () => { setPlaying(false); step(); });
$("rngSpeed").addEventListener("input", e => {
  speed = +e.target.value; $("valSpeed").textContent = speed;
});
$("selSize").addEventListener("change", e => newBoard(+e.target.value));
$("rngDepth").addEventListener("input", e => {
  const wasFull = view.slab >= sim.depth;
  sim.depth = +e.target.value;
  $("valDepth").textContent = sim.depth;
  const slab = $("rngSlab");
  slab.max = sim.depth;
  if (wasFull || view.slab > sim.depth) {
    view.slab = sim.depth;
    slab.value = sim.depth;
    $("valSlab").textContent = sim.depth;
  }
  trimDepth();
});
$("rngDensity").addEventListener("input", e => {
  density = +e.target.value / 100; $("valDensity").textContent = e.target.value;
});
$("btnRandom").addEventListener("click", () => { resetBoard(density); toast("Randomised"); });
$("btnClear").addEventListener("click", () => { resetBoard(0); setPlaying(false); setDrawMode(true); toast("Cleared — draw some cells"); });
$("chkWrap").addEventListener("change", e => { sim.wrap = e.target.checked; });

$("selRule").addEventListener("change", e => {
  $("txtRule").value = e.target.value;
  setRule(e.target.value);
  $("txtRule").classList.remove("bad");
  toast("Rule " + e.target.value);
});
$("txtRule").addEventListener("input", e => {
  const ok = setRule(e.target.value);
  e.target.classList.toggle("bad", !ok);
  if (ok) {
    const match = [...$("selRule").options].find(o => o.value.toLowerCase() === e.target.value.trim().toLowerCase());
    $("selRule").value = match ? match.value : $("selRule").value;
  }
});

$("btnStamp").addEventListener("click", () => {
  const name = $("selPattern").value;
  const clipped = stampPattern(name);
  toast(clipped ? "Stamped (clipped — board is smaller than the pattern)" : "Stamped " + $("selPattern").selectedOptions[0].textContent.toLowerCase());
});
$("btnDraw").addEventListener("click", () => setDrawMode(!drawMode));

$("rngSlab").addEventListener("input", e => {
  view.slab = +e.target.value; $("valSlab").textContent = view.slab;
  dirty.instances = true; dirty.lines = true;
});
$("rngGap").addEventListener("input", e => {
  view.gap = +e.target.value; $("valGap").textContent = view.gap.toFixed(2);
  dirty.instances = true; dirty.lines = true;
});
$("rngCell").addEventListener("input", e => {
  view.cell = +e.target.value; $("valCell").textContent = view.cell.toFixed(2);
  dirty.instances = true;
});
$("selSlice").addEventListener("change", e => {
  view.slice = e.target.value;
  dirty.instances = true;
  if (view.slice !== "none") toast(view.slice === "z" ? "Showing one row of the board" : "Showing one column of the board");
});
$("rngSlice").addEventListener("input", e => {
  view.sliceIndex = +e.target.value; $("valSlice").textContent = view.sliceIndex;
  dirty.instances = true;
});
$("chkOrtho").addEventListener("change", e => { view.ortho = e.target.checked; cam.goal = null; });
$("chkSpin").addEventListener("change", e => { view.spin = e.target.checked; });
$("chkGrid").addEventListener("change", e => { view.grid = e.target.checked; dirty.lines = true; });
$("chkTaper").addEventListener("change", e => { view.taper = e.target.checked; dirty.instances = true; });
$("selPalette").addEventListener("change", e => {
  view.palette = e.target.value; refreshStageColors(); dirty.instances = true;
});
$("selColor").addEventListener("change", e => { view.color = e.target.value; dirty.instances = true; });
$("selTheme").addEventListener("change", e => { view.theme = e.target.value; applyTheme(); });

document.querySelectorAll(".viewbar button").forEach(b => {
  b.addEventListener("click", () => setView(b.dataset.view));
});
$("panelToggle").addEventListener("click", () => $("panel").classList.toggle("hidden"));

if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  const onChange = () => { if (view.theme === "system") refreshStageColors(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

window.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (k === "n") { setPlaying(false); step(); }
  else if (k === "r") { resetBoard(density); toast("Randomised"); }
  else if (k === "c") { resetBoard(0); setPlaying(false); toast("Cleared"); }
  else if (k === "d") { setDrawMode(!drawMode); }
  else if (k === "g") { const c = $("chkGrid"); c.checked = !c.checked; view.grid = c.checked; dirty.lines = true; }
  else if (k === "1") setView("free");
  else if (k === "2") setView("iso");
  else if (k === "3") setView("top");
  else if (k === "4") setView("front");
  else if (k === "5") setView("side");
  else if (k === "0") setView("recenter");
});

/* ---------------------------------------------------------------- stats */

function updateStats() {
  const top = sim.stack[sim.stack.length - 1];
  $("statGen").textContent = sim.gen;
  $("statPop").textContent = top ? top.pop : 0;
  $("statLayers").textContent = sim.stack.length;
}

/* ----------------------------------------------------------------- loop */

let last = performance.now();
let acc = 0, fpsAcc = 0, fpsFrames = 0;

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;

  if (playing) {
    acc += dt;
    const period = 1 / speed;
    let budget = 6;
    while (acc >= period && budget-- > 0) { acc -= period; step(); }
    if (acc > period) acc = 0;
  }

  updateCamera(dt);
  if (dirty.instances) { buildInstances(); updateStats(); }
  if (dirty.lines) buildLines();
  drawScene();

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) {
    $("statFps").textContent = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
  }
  requestAnimationFrame(frame);
}

/* ----------------------------------------------------------------- init */

setRule("B3/S23");
sim.depth = 60;
resetBoard(density);
frameCamera(false);
applyTheme();
markViewButtons();
if (window.innerWidth <= 820) {
  $("panel").classList.add("hidden");
  setTimeout(() => toast("Tap \u2630 for controls"), 700);
}
updateStats();
setPlaying(true);
requestAnimationFrame(frame);

})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Pendulum</title>
<style>
  :root {
    --bg: #0b0e17;
    --panel: rgba(18, 23, 38, 0.82);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e8ecf4;
    --text-dim: #8b93a7;
    --accent: #6ea8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    touch-action: none;
  }
  #canvas.dragging { cursor: grabbing; }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    pointer-events: none;
    user-select: none;
  }
  #hud h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  #hud p {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  #panel {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 230px;
    user-select: none;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .row label { flex: 0 0 62px; }
  .row output {
    flex: 0 0 44px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }
  .buttons { display: flex; gap: 8px; margin-top: 2px; }
  button {
    flex: 1;
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 7px 0;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button.active { background: var(--accent); border-color: var(--accent); color: #0b0e17; }

  @media (max-width: 600px) {
    #hud h1 { font-size: 15px; }
    #hud p { font-size: 11px; }
    #panel { min-width: 200px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <h1>Triple Pendulum</h1>
  <p>Grab any bob, drag it, and let go to fling it.</p>
</div>

<div id="panel">
  <div class="row">
    <label for="gravity">Gravity</label>
    <input type="range" id="gravity" min="100" max="2500" step="10" value="1200">
    <output id="gravityOut">1200</output>
  </div>
  <div class="row">
    <label for="damping">Damping</label>
    <input type="range" id="damping" min="0" max="0.5" step="0.005" value="0">
    <output id="dampingOut">0.00</output>
  </div>
  <div class="row">
    <label for="trail">Trail</label>
    <input type="range" id="trail" min="0" max="600" step="10" value="300">
    <output id="trailOut">300</output>
  </div>
  <div class="buttons">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  const N = 3;
  const L = [150, 120, 95];          // rod lengths (px)
  const M = [1.0, 0.85, 0.7];        // bob masses
  const BOB_R = [16, 14, 12];        // bob radii (px)
  const BOB_COLOR = ["#6ea8ff", "#b78bff", "#ff7eb3"];

  let theta = [Math.PI * 0.55, Math.PI * 0.75, Math.PI * 0.9]; // from downward vertical
  let omega = [0, 0, 0];

  let g = 1200;        // px/s^2
  let damping = 0;
  let trailMax = 300;
  let paused = false;

  let pivot = { x: 0, y: 0 };
  let dpr = 1;

  const trail = [];

  // Dragging
  let dragIndex = -1;           // which bob is grabbed (0..2)
  let dragPos = { x: 0, y: 0 };
  const angleHistory = [];      // [{t, theta:[...] }] while dragging, for fling velocity

  // ---------------------------------------------------------------
  // Geometry helpers
  // ---------------------------------------------------------------
  function bobPositions(th) {
    const pts = [];
    let x = pivot.x, y = pivot.y;
    for (let i = 0; i < N; i++) {
      x += L[i] * Math.sin(th[i]);
      y += L[i] * Math.cos(th[i]);
      pts.push({ x, y });
    }
    return pts;
  }

  // ---------------------------------------------------------------
  // Physics: n-link point-mass pendulum (Lagrangian), RK4 integration
  //
  //   sum_j M_ij * a_j = b_i
  //   M_ij = c_ij l_i l_j cos(th_i - th_j),  c_ij = sum_{k>=max(i,j)} m_k
  //   b_i  = -sum_j c_ij l_i l_j sin(th_i - th_j) w_j^2
  //          - g l_i sin(th_i) * sum_{k>=i} m_k  - damping term
  // ---------------------------------------------------------------
  const cumMass = [];
  for (let i = 0; i < N; i++) {
    let s = 0;
    for (let k = i; k < N; k++) s += M[k];
    cumMass[i] = s;
  }

  function accelerations(th, w) {
    const A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const b = [0, 0, 0];
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const c = cumMass[Math.max(i, j)];
        A[i][j] = c * L[i] * L[j] * Math.cos(th[i] - th[j]);
        b[i] -= c * L[i] * L[j] * Math.sin(th[i] - th[j]) * w[j] * w[j];
      }
      b[i] -= g * L[i] * Math.sin(th[i]) * cumMass[i];
      b[i] -= damping * L[i] * L[i] * cumMass[i] * w[i];
    }
    return solve3(A, b);
  }

  function solve3(A, b) {
    // Gaussian elimination with partial pivoting on a 3x3 system
    const m = [
      [A[0][0], A[0][1], A[0][2], b[0]],
      [A[1][0], A[1][1], A[1][2], b[1]],
      [A[2][0], A[2][1], A[2][2], b[2]],
    ];
    for (let col = 0; col < 3; col++) {
      let piv = col;
      for (let r = col + 1; r < 3; r++)
        if (Math.abs(m[r][col]) > Math.abs(m[piv][col])) piv = r;
      if (piv !== col) { const t = m[col]; m[col] = m[piv]; m[piv] = t; }
      const d = m[col][col];
      if (Math.abs(d) < 1e-12) return [0, 0, 0];
      for (let r = col + 1; r < 3; r++) {
        const f = m[r][col] / d;
        for (let c = col; c < 4; c++) m[r][c] -= f * m[col][c];
      }
    }
    const x = [0, 0, 0];
    for (let r = 2; r >= 0; r--) {
      let s = m[r][3];
      for (let c = r + 1; c < 3; c++) s -= m[r][c] * x[c];
      x[r] = s / m[r][r];
    }
    return x;
  }

  function derivatives(th, w) {
    return { dth: w, dw: accelerations(th, w) };
  }

  function rk4Step(dt) {
    const k1 = derivatives(theta, omega);
    const th2 = theta.map((t, i) => t + k1.dth[i] * dt / 2);
    const w2 = omega.map((w, i) => w + k1.dw[i] * dt / 2);
    const k2 = derivatives(th2, w2);
    const th3 = theta.map((t, i) => t + k2.dth[i] * dt / 2);
    const w3 = omega.map((w, i) => w + k2.dw[i] * dt / 2);
    const k3 = derivatives(th3, w3);
    const th4 = theta.map((t, i) => t + k3.dth[i] * dt);
    const w4 = omega.map((w, i) => w + k3.dw[i] * dt);
    const k4 = derivatives(th4, w4);
    for (let i = 0; i < N; i++) {
      theta[i] += (dt / 6) * (k1.dth[i] + 2 * k2.dth[i] + 2 * k3.dth[i] + k4.dth[i]);
      omega[i] += (dt / 6) * (k1.dw[i] + 2 * k2.dw[i] + 2 * k3.dw[i] + k4.dw[i]);
    }
  }

  // ---------------------------------------------------------------
  // Dragging: FABRIK inverse kinematics on the sub-chain up to the
  // grabbed bob; deeper segments keep their absolute angles.
  // ---------------------------------------------------------------
  function applyDragIK() {
    const k = dragIndex;
    const n = k + 1; // links in the constrained sub-chain
    const pts = [{ x: pivot.x, y: pivot.y }, ...bobPositions(theta).slice(0, n)];

    // Clamp target to reach
    let reach = 0;
    for (let i = 0; i < n; i++) reach += L[i];
    let tx = dragPos.x, ty = dragPos.y;
    const dx = tx - pivot.x, dy = ty - pivot.y;
    const dist = Math.hypot(dx, dy);
    if (dist > reach) {
      tx = pivot.x + dx / dist * reach;
      ty = pivot.y + dy / dist * reach;
    }

    for (let iter = 0; iter < 12; iter++) {
      // Backward: pin end to target
      pts[n] = { x: tx, y: ty };
      for (let i = n - 1; i >= 1; i--) {
        const ddx = pts[i].x - pts[i + 1].x;
        const ddy = pts[i].y - pts[i + 1].y;
        const d = Math.hypot(ddx, ddy) || 1e-9;
        pts[i] = { x: pts[i + 1].x + ddx / d * L[i], y: pts[i + 1].y + ddy / d * L[i] };
      }
      // Forward: pin base to pivot
      pts[0] = { x: pivot.x, y: pivot.y };
      for (let i = 1; i <= n; i++) {
        const ddx = pts[i].x - pts[i - 1].x;
        const ddy = pts[i].y - pts[i - 1].y;
        const d = Math.hypot(ddx, ddy) || 1e-9;
        pts[i] = { x: pts[i - 1].x + ddx / d * L[i - 1], y: pts[i - 1].y + ddy / d * L[i - 1] };
      }
    }

    for (let i = 0; i < n; i++) {
      theta[i] = Math.atan2(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
    }
    omega = [0, 0, 0];

    angleHistory.push({ t: performance.now(), theta: theta.slice() });
    while (angleHistory.length > 12) angleHistory.shift();
  }

  function releaseFling() {
    // Estimate angular velocities from recent drag motion so the
    // pendulum flies off in the direction it was being swung.
    if (angleHistory.length < 2) return;
    const last = angleHistory[angleHistory.length - 1];
    let ref = angleHistory[0];
    for (const s of angleHistory) {
      if (last.t - s.t <= 90) { ref = s; break; }
    }
    const dt = (last.t - ref.t) / 1000;
    if (dt < 1e-3) return;
    const MAX_W = 25;
    for (let i = 0; i < N; i++) {
      let d = last.theta[i] - ref.theta[i];
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      omega[i] = Math.max(-MAX_W, Math.min(MAX_W, d / dt));
    }
  }

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener("pointerdown", (e) => {
    const p = pointerPos(e);
    const pts = bobPositions(theta);
    let best = -1, bestD = Infinity;
    for (let i = 0; i < N; i++) {
      const d = Math.hypot(p.x - pts[i].x, p.y - pts[i].y);
      if (d < BOB_R[i] + 18 && d < bestD) { best = i; bestD = d; }
    }
    if (best >= 0) {
      dragIndex = best;
      dragPos = p;
      angleHistory.length = 0;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (dragIndex >= 0) dragPos = pointerPos(e);
  });

  function endDrag() {
    if (dragIndex < 0) return;
    releaseFling();
    dragIndex = -1;
    angleHistory.length = 0;
    canvas.classList.remove("dragging");
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // ---------------------------------------------------------------
  // Controls
  // ---------------------------------------------------------------
  const $ = (id) => document.getElementById(id);

  $("gravity").addEventListener("input", (e) => {
    g = +e.target.value;
    $("gravityOut").textContent = g;
  });
  $("damping").addEventListener("input", (e) => {
    damping = +e.target.value;
    $("dampingOut").textContent = damping.toFixed(2);
  });
  $("trail").addEventListener("input", (e) => {
    trailMax = +e.target.value;
    $("trailOut").textContent = trailMax;
    if (trail.length > trailMax) trail.splice(0, trail.length - trailMax);
  });
  $("pauseBtn").addEventListener("click", () => {
    paused = !paused;
    $("pauseBtn").textContent = paused ? "Resume" : "Pause";
    $("pauseBtn").classList.toggle("active", paused);
  });
  $("resetBtn").addEventListener("click", () => {
    theta = [Math.PI * 0.55, Math.PI * 0.75, Math.PI * 0.9];
    omega = [0, 0, 0];
    trail.length = 0;
  });

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    pivot.x = window.innerWidth / 2;
    pivot.y = window.innerHeight * 0.32;
  }
  window.addEventListener("resize", resize);
  resize();

  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // Subtle vignette
    const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.75);
    grad.addColorStop(0, "#101528");
    grad.addColorStop(1, "#0b0e17");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const pts = bobPositions(theta);

    // Trail of the last bob
    if (trail.length > 1) {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 1; i < trail.length; i++) {
        const a = i / trail.length;
        ctx.strokeStyle = `rgba(255, 126, 179, ${0.35 * a})`;
        ctx.lineWidth = 1 + 2 * a;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
    }

    // Rods
    ctx.lineCap = "round";
    let prev = pivot;
    for (let i = 0; i < N; i++) {
      ctx.strokeStyle = "rgba(220, 228, 245, 0.85)";
      ctx.lineWidth = 3.5 - i * 0.7;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      prev = pts[i];
    }

    // Pivot mount
    ctx.fillStyle = "#39415a";
    ctx.beginPath();
    ctx.arc(pivot.x, pivot.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e8ecf4";
    ctx.beginPath();
    ctx.arc(pivot.x, pivot.y, 3, 0, Math.PI * 2);
    ctx.fill();

    // Bobs
    for (let i = 0; i < N; i++) {
      const r = BOB_R[i];
      const glow = ctx.createRadialGradient(pts[i].x, pts[i].y, r * 0.2, pts[i].x, pts[i].y, r * 2.6);
      glow.addColorStop(0, BOB_COLOR[i] + "55");
      glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, r * 2.6, 0, Math.PI * 2);
      ctx.fill();

      const body = ctx.createRadialGradient(
        pts[i].x - r * 0.35, pts[i].y - r * 0.35, r * 0.15,
        pts[i].x, pts[i].y, r
      );
      body.addColorStop(0, "#ffffff");
      body.addColorStop(0.25, BOB_COLOR[i]);
      body.addColorStop(1, BOB_COLOR[i]);
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
      ctx.fill();

      if (i === dragIndex) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pts[i].x, pts[i].y, r + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  // ---------------------------------------------------------------
  // Main loop — fixed-timestep physics, capped catch-up
  // ---------------------------------------------------------------
  const PHYS_DT = 1 / 480;
  let acc = 0;
  let lastT = performance.now();

  function frame(now) {
    let elapsed = (now - lastT) / 1000;
    lastT = now;
    if (elapsed > 0.1) elapsed = 0.1;

    if (dragIndex >= 0) {
      applyDragIK();
      acc = 0;
    } else if (!paused) {
      acc += elapsed;
      while (acc >= PHYS_DT) {
        rk4Step(PHYS_DT);
        acc -= PHYS_DT;
      }
    }

    if (!paused || dragIndex >= 0) {
      const pts = bobPositions(theta);
      if (trailMax > 0) {
        trail.push({ x: pts[N - 1].x, y: pts[N - 1].y });
        while (trail.length > trailMax) trail.shift();
      } else {
        trail.length = 0;
      }
    }

    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Pendulum</title>
<style>
  :root {
    --bg: #0b0e17;
    --panel: rgba(18, 23, 38, 0.82);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e8ecf4;
    --text-dim: #8b93a7;
    --accent: #6ea8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    touch-action: none;
  }
  #canvas.dragging { cursor: grabbing; }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    pointer-events: none;
    user-select: none;
  }
  #hud h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  #hud p {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  #panel {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 230px;
    user-select: none;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .row label { flex: 0 0 62px; }
  .row output {
    flex: 0 0 44px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }
  .buttons { display: flex; gap: 8px; margin-top: 2px; }
  button {
    flex: 1;
    background: rgba(255, 255, 255, 0.07);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 7px 0;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button.active { background: var(--accent); border-color: var(--accent); color: #0b0e17; }

  @media (max-width: 600px) {
    #hud h1 { font-size: 15px; }
    #hud p { font-size: 11px; }
    #panel { min-width: 200px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <h1 id="title">Triple Pendulum</h1>
  <p>Grab any bob, drag it, and let go to fling it.</p>
</div>

<div id="panel">
  <div class="row">
    <label for="links">Links</label>
    <input type="range" id="links" min="1" max="100" step="1" value="3">
    <output id="linksOut">3</output>
  </div>
  <div class="row">
    <label for="gravity">Gravity</label>
    <input type="range" id="gravity" min="0" max="2500" step="10" value="1200">
    <output id="gravityOut">1200</output>
  </div>
  <div class="row">
    <label for="damping">Damping</label>
    <input type="range" id="damping" min="0" max="0.5" step="0.005" value="0">
    <output id="dampingOut">0.00</output>
  </div>
  <div class="row">
    <label for="trail">Trail</label>
    <input type="range" id="trail" min="0" max="600" step="10" value="300">
    <output id="trailOut">300</output>
  </div>
  <div class="row">
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="0" max="12" step="1" value="5">
    <output id="zoomOut">5&times;</output>
  </div>
  <div class="buttons">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  let N = 3;             // number of links
  let g = 1200;          // px/s^2
  let damping = 0;
  let trailMax = 300;
  let zoom = 5;          // tip magnifier factor (0 = off)
  let paused = false;

  let pivot = { x: 0, y: 0 };
  let dpr = 1;

  // Chain: index 0 is the pivot, 1..N are the bobs.
  let px = [], py = [];      // positions
  let ppx = [], ppy = [];    // previous positions (Verlet)
  let linkLen = [];          // linkLen[i] = rest length of rod between i and i+1
  let bobR = 16;
  let bobColor = [];

  const trail = [];

  // Dragging (bob index 1..N, or -1)
  let dragIndex = -1;
  let dragPos = { x: 0, y: 0 };  // latest pointer position (clamped to reach)
  let dragCur = { x: 0, y: 0 };  // per-substep interpolated pin position

  // ---------------------------------------------------------------
  // Tuple names: single, double, triple ... centuple
  // ---------------------------------------------------------------
  function tupleName(n) {
    const ones = ["", "un", "duo", "tre", "quattuor", "quin", "sex", "septen", "octo", "novem"];
    const small = ["single", "double", "triple", "quadruple", "quintuple",
                   "sextuple", "septuple", "octuple", "nonuple", "decuple"];
    let name;
    if (n <= 10) name = small[n - 1];
    else if (n < 20) name = ones[n - 10] + "decuple";
    else if (n === 100) name = "centuple";
    else {
      const tens = ["vigint", "trigint", "quadragint", "quinquagint",
                    "sexagint", "septuagint", "octogint", "nonagint"];
      name = ones[n % 10] + tens[Math.floor(n / 10) - 2] + "uple";
    }
    return name[0].toUpperCase() + name.slice(1);
  }

  function updateTitle() {
    const t = tupleName(N) + " Pendulum";
    document.getElementById("title").textContent = t;
    document.title = t;
  }

  // ---------------------------------------------------------------
  // Chain construction
  // ---------------------------------------------------------------
  function totalLength() {
    return Math.min(365, window.innerHeight * 0.55, window.innerWidth * 0.42);
  }

  function buildChain() {
    const total = totalLength();
    const len = total / N;
    linkLen = new Array(N).fill(len);
    bobR = Math.max(3.5, Math.min(16, 4 + 38 / N));
    bobColor = [];
    for (let i = 0; i < N; i++) {
      const t = N === 1 ? 1 : i / (N - 1);
      bobColor.push(`hsl(${Math.round(215 + 115 * t)}, 85%, 72%)`);
    }

    // Start in a raised arc off to the side, like a wound-up pendulum.
    px = [pivot.x]; py = [pivot.y];
    let x = pivot.x, y = pivot.y;
    for (let i = 0; i < N; i++) {
      const t = N === 1 ? 0 : i / (N - 1);
      const th = Math.PI * (0.55 + 0.35 * t);  // from downward vertical
      x += len * Math.sin(th);
      y += len * Math.cos(th);
      px.push(x); py.push(y);
    }
    ppx = px.slice(); ppy = py.slice();
    trail.length = 0;
    resetEnergyRef();
  }

  // ---------------------------------------------------------------
  // Physics: Verlet integration + iterative rod-length constraints.
  // Unconditionally stable, O(N) per substep, so 1..100 links all
  // run at full speed. The pivot (index 0) and a dragged bob are
  // treated as infinite-mass during projection.
  // ---------------------------------------------------------------
  const PHYS_DT = 1 / 480;
  const ITER = 30;

  // Total mechanical energy reference. The constraint solver bleeds a
  // tiny bit of energy numerically; with damping at zero we rescale
  // velocities each frame to hold total energy exactly, so the
  // pendulum is truly frictionless and swings forever.
  let E0 = 0;

  function currentEnergy() {
    let ke = 0, pe = 0;
    for (let i = 1; i <= N; i++) {
      const vx = (px[i] - ppx[i]) / PHYS_DT;
      const vy = (py[i] - ppy[i]) / PHYS_DT;
      ke += 0.5 * (vx * vx + vy * vy);
      pe += -g * (py[i] - pivot.y);
    }
    return { E: ke + pe, ke, pe };
  }

  function resetEnergyRef() {
    E0 = currentEnergy().E;
  }

  function conserveEnergy() {
    const { ke, pe } = currentEnergy();
    const keTarget = E0 - pe;
    if (ke < 1e-6) return;
    let s = Math.sqrt(Math.max(0, keTarget) / ke);
    s = Math.max(0.95, Math.min(1.05, s));  // gentle per-frame correction
    for (let i = 1; i <= N; i++) {
      ppx[i] = px[i] - (px[i] - ppx[i]) * s;
      ppy[i] = py[i] - (py[i] - ppy[i]) * s;
    }
  }

  function integrate(dt) {
    const damp = Math.max(0, 1 - damping * 8 * dt);
    for (let i = 1; i <= N; i++) {
      const vx = (px[i] - ppx[i]) / dt * damp;
      const vy = (py[i] - ppy[i]) / dt * damp;
      ppx[i] = px[i]; ppy[i] = py[i];
      px[i] += vx * dt;
      py[i] += vy * dt + g * dt * dt;
    }
  }

  function projectRod(i) {
    // rod between points i-1 and i
    const dx = px[i] - px[i - 1];
    const dy = py[i] - py[i - 1];
    const d = Math.hypot(dx, dy) || 1e-9;
    const diff = (d - linkLen[i - 1]) / d;
    const w0 = (i - 1 === 0 || i - 1 === dragIndex) ? 0 : 1;
    const w1 = (i === dragIndex) ? 0 : 1;
    const ws = w0 + w1;
    if (!ws) return;
    px[i - 1] += dx * diff * (w0 / ws);
    py[i - 1] += dy * diff * (w0 / ws);
    px[i] -= dx * diff * (w1 / ws);
    py[i] -= dy * diff * (w1 / ws);
  }

  function pinDrag() {
    if (dragIndex >= 1) { px[dragIndex] = dragCur.x; py[dragIndex] = dragCur.y; }
  }

  function constrain() {
    px[0] = pivot.x; py[0] = pivot.y;
    pinDrag();
    for (let iter = 0; iter < ITER; iter++) {
      if (iter % 2 === 0) { for (let i = 1; i <= N; i++) projectRod(i); }
      else { for (let i = N; i >= 1; i--) projectRod(i); }
      pinDrag();
    }
  }

  function physStep(dt) {
    integrate(dt);
    constrain();
  }

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  function clampToReach(p) {
    const total = linkLen.reduce((a, b) => a + b, 0) - 0.5;
    const dx = p.x - pivot.x, dy = p.y - pivot.y;
    const d = Math.hypot(dx, dy);
    if (d <= total) return p;
    return { x: pivot.x + dx / d * total, y: pivot.y + dy / d * total };
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener("pointerdown", (e) => {
    const p = pointerPos(e);
    const slack = Math.max(bobR + 18, 24);
    let best = -1, bestD = Infinity;
    for (let i = 1; i <= N; i++) {
      const d = Math.hypot(p.x - px[i], p.y - py[i]);
      if (d < slack && d < bestD) { best = i; bestD = d; }
    }
    if (best >= 1) {
      dragIndex = best;
      dragPos = clampToReach(p);
      dragCur = { x: dragPos.x, y: dragPos.y };
      canvas.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (dragIndex >= 1) dragPos = clampToReach(pointerPos(e));
  });

  function endDrag() {
    if (dragIndex < 0) return;
    dragIndex = -1;
    canvas.classList.remove("dragging");
    resetEnergyRef();
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // ---------------------------------------------------------------
  // Controls
  // ---------------------------------------------------------------
  const $ = (id) => document.getElementById(id);

  $("links").addEventListener("input", (e) => {
    endDrag();
    N = +e.target.value;
    $("linksOut").textContent = N;
    updateTitle();
    buildChain();
  });
  $("gravity").addEventListener("input", (e) => {
    g = +e.target.value;
    $("gravityOut").textContent = g;
    resetEnergyRef();
  });
  $("damping").addEventListener("input", (e) => {
    damping = +e.target.value;
    $("dampingOut").textContent = damping.toFixed(2);
    resetEnergyRef();
  });
  $("trail").addEventListener("input", (e) => {
    trailMax = +e.target.value;
    $("trailOut").textContent = trailMax;
    if (trail.length > trailMax) trail.splice(0, trail.length - trailMax);
  });
  $("zoom").addEventListener("input", (e) => {
    zoom = +e.target.value;
    $("zoomOut").textContent = zoom ? zoom + "×" : "Off";
  });
  $("pauseBtn").addEventListener("click", () => {
    paused = !paused;
    $("pauseBtn").textContent = paused ? "Resume" : "Pause";
    $("pauseBtn").classList.toggle("active", paused);
  });
  $("resetBtn").addEventListener("click", () => {
    endDrag();
    buildChain();
  });

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    const oldPivot = { x: pivot.x, y: pivot.y };
    pivot.x = window.innerWidth / 2;
    pivot.y = window.innerHeight * 0.32;
    const dx = pivot.x - oldPivot.x, dy = pivot.y - oldPivot.y;
    for (let i = 0; i <= N && i < px.length; i++) {
      px[i] += dx; py[i] += dy;
      ppx[i] += dx; ppy[i] += dy;
    }
    const len = totalLength() / N;
    linkLen = new Array(N).fill(len);
    trail.length = 0;
    resetEnergyRef();
  }
  window.addEventListener("resize", resize);

  function drawWorld() {
    // Trail of the last bob
    if (trail.length > 1) {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 1; i < trail.length; i++) {
        const a = i / trail.length;
        ctx.strokeStyle = `rgba(255, 126, 179, ${0.35 * a})`;
        ctx.lineWidth = 1 + 2 * a;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
    }

    // Rods
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(220, 228, 245, 0.85)";
    ctx.lineWidth = Math.max(1.2, Math.min(3.5, 10 / Math.sqrt(N)));
    ctx.beginPath();
    ctx.moveTo(px[0], py[0]);
    for (let i = 1; i <= N; i++) ctx.lineTo(px[i], py[i]);
    ctx.stroke();

    // Pivot mount
    ctx.fillStyle = "#39415a";
    ctx.beginPath();
    ctx.arc(pivot.x, pivot.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e8ecf4";
    ctx.beginPath();
    ctx.arc(pivot.x, pivot.y, 3, 0, Math.PI * 2);
    ctx.fill();

    // Bobs
    const drawGlow = N <= 24;
    for (let i = 1; i <= N; i++) {
      const bx = px[i], by = py[i];
      const color = bobColor[i - 1];

      if (drawGlow) {
        const glow = ctx.createRadialGradient(bx, by, bobR * 0.2, bx, by, bobR * 2.6);
        glow.addColorStop(0, color.replace("hsl", "hsla").replace(")", ", 0.33)"));
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(bx, by, bobR * 2.6, 0, Math.PI * 2);
        ctx.fill();

        const body = ctx.createRadialGradient(
          bx - bobR * 0.35, by - bobR * 0.35, bobR * 0.15, bx, by, bobR
        );
        body.addColorStop(0, "#ffffff");
        body.addColorStop(0.25, color);
        body.addColorStop(1, color);
        ctx.fillStyle = body;
      } else {
        ctx.fillStyle = color;
      }
      ctx.beginPath();
      ctx.arc(bx, by, bobR, 0, Math.PI * 2);
      ctx.fill();

      if (i === dragIndex) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bx, by, bobR + 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawLens(w, h) {
    const R = Math.max(80, Math.min(120, Math.min(w, h) * 0.16));
    const cx = w - R - 18, cy = h - R - 18;
    const tipX = px[N], tipY = py[N];

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = "#0d1220";
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.translate(-tipX, -tipY);
    drawWorld();
    ctx.restore();

    // Rim + label
    ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "rgba(139, 147, 167, 0.9)";
    ctx.font = "11px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`tip ${zoom}×`, cx, cy - R - 8);
  }

  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // Subtle vignette
    const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.75);
    grad.addColorStop(0, "#101528");
    grad.addColorStop(1, "#0b0e17");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    drawWorld();
    if (zoom > 0) drawLens(w, h);
  }

  // ---------------------------------------------------------------
  // Main loop — fixed-timestep physics, capped catch-up
  // ---------------------------------------------------------------
  let acc = 0;
  let lastT = performance.now();

  function frame(now) {
    let elapsed = (now - lastT) / 1000;
    lastT = now;
    if (elapsed > 0.1) elapsed = 0.1;

    if (paused) {
      if (dragIndex >= 1) {
        // Move the grabbed bob and settle the chain, but keep it frozen.
        dragCur = { x: dragPos.x, y: dragPos.y };
        constrain();
        ppx = px.slice(); ppy = py.slice();
      }
      acc = 0;
    } else {
      acc += elapsed;
      const steps = Math.floor(acc / PHYS_DT);
      const dragFrom = { x: dragCur.x, y: dragCur.y };
      for (let s = 1; s <= steps; s++) {
        if (dragIndex >= 1) {
          // Spread the pointer motion across substeps so the pin moves
          // smoothly and the release velocity comes out right.
          const t = s / steps;
          dragCur = {
            x: dragFrom.x + (dragPos.x - dragFrom.x) * t,
            y: dragFrom.y + (dragPos.y - dragFrom.y) * t,
          };
        }
        physStep(PHYS_DT);
      }
      acc -= steps * PHYS_DT;
      if (steps > 0 && damping === 0 && dragIndex < 0) conserveEnergy();
    }

    if (!paused || dragIndex >= 1) {
      if (trailMax > 0) {
        trail.push({ x: px[N], y: py[N] });
        while (trail.length > trailMax) trail.shift();
      } else {
        trail.length = 0;
      }
    }

    draw();
    requestAnimationFrame(frame);
  }

  // Debug/testing handle
  window.__pend = () => ({ N, px: px.slice(), py: py.slice(), E: currentEnergy().E, E0 });

  resize();
  buildChain();
  updateTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Algebra 🎲</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #a78bfa;
    --good: #34d399;
    --dice-face: #f8fafc;
    --pip: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 0.95rem;
  }

  /* Tabs */
  .tabs {
    display: inline-flex;
    background: var(--card);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 28px;
    gap: 4px;
  }
  .tab {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1220;
  }

  /* Dice */
  .dice-zone { margin-bottom: 10px; }
  .dice {
    width: 110px;
    height: 110px;
    background: var(--dice-face);
    border-radius: 20px;
    display: inline-grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 16px;
    gap: 4px;
    cursor: pointer;
    border: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.45), inset 0 -4px 0 rgba(0,0,0,0.12);
    transition: transform 0.15s;
    user-select: none;
  }
  .dice:hover { transform: translateY(-4px) scale(1.03); }
  .dice:active { transform: translateY(0) scale(0.97); }
  .dice.rolling { animation: roll 0.6s ease-in-out; }
  @keyframes roll {
    0%   { transform: rotate(0deg)   scale(1); }
    25%  { transform: rotate(90deg)  scale(1.15); }
    50%  { transform: rotate(200deg) scale(0.9); }
    75%  { transform: rotate(310deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .pip {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--pip);
    visibility: hidden;
  }
  .pip.on { visibility: visible; }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .difficulty {
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 22px;
    min-height: 1.2em;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .difficulty.easy   { color: var(--good); }
  .difficulty.medium { color: var(--accent); }
  .difficulty.hard   { color: var(--accent-2); }

  /* Problem card */
  .card {
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 28px 24px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .placeholder { color: var(--muted); font-size: 1.05rem; }
  .equation {
    font-family: "Cambria Math", Cambria, Georgia, serif;
    font-size: 1.9rem;
    letter-spacing: 1px;
  }
  .equation .brace {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-left: 3px solid var(--accent);
    padding-left: 18px;
    text-align: left;
  }
  .reveal-btn {
    margin-top: 6px;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid #3e4f68;
    border-radius: 10px;
    padding: 9px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .reveal-btn:hover { background: #32415a; }
  .answer {
    font-family: "Cambria Math", Cambria, Georgia, serif;
    font-size: 1.4rem;
    color: var(--good);
    font-weight: 700;
  }
  footer {
    margin-top: 20px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎲 Dice Algebra</h1>
  <p class="subtitle">Click the dice to roll a random equation. The roll sets the difficulty!</p>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-x" role="tab" aria-selected="true">Solve for x</button>
    <button class="tab" id="tab-xy" role="tab" aria-selected="false">Solve for x &amp; y</button>
  </div>

  <div class="dice-zone">
    <button class="dice" id="dice" aria-label="Roll the dice">
      <span class="pip" id="p0"></span><span class="pip" id="p1"></span><span class="pip" id="p2"></span>
      <span class="pip" id="p3"></span><span class="pip" id="p4"></span><span class="pip" id="p5"></span>
      <span class="pip" id="p6"></span><span class="pip" id="p7"></span><span class="pip" id="p8"></span>
    </button>
  </div>
  <p class="hint">1–2 easy &nbsp;·&nbsp; 3–4 medium &nbsp;·&nbsp; 5–6 hard</p>
  <p class="difficulty" id="difficulty"></p>

  <div class="card" id="card">
    <p class="placeholder" id="placeholder">Roll the dice to get your first problem!</p>
    <div class="equation" id="equation" hidden></div>
    <button class="reveal-btn" id="reveal" hidden>Show answer</button>
    <p class="answer" id="answer" hidden></p>
  </div>

  <footer>Every problem has a whole-number answer. Good luck! ✏️</footer>
</div>

<script>
(function () {
  var mode = 'x'; // 'x' or 'xy'
  var rolling = false;

  var diceEl = document.getElementById('dice');
  var diffEl = document.getElementById('difficulty');
  var placeholderEl = document.getElementById('placeholder');
  var equationEl = document.getElementById('equation');
  var revealBtn = document.getElementById('reveal');
  var answerEl = document.getElementById('answer');
  var tabX = document.getElementById('tab-x');
  var tabXY = document.getElementById('tab-xy');

  // Which pips light up for each face value (3x3 grid, indices 0-8)
  var FACES = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  function showFace(n) {
    for (var i = 0; i < 9; i++) {
      document.getElementById('p' + i).classList.toggle('on', FACES[n].indexOf(i) !== -1);
    }
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function randNonZero(min, max) {
    var n = 0;
    while (n === 0) n = randInt(min, max);
    return n;
  }
  function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

  // Format "a·x" nicely: 1x -> x, -1x -> -x
  function coef(a, v) {
    if (a === 1) return v;
    if (a === -1) return '−' + v;
    return fmt(a) + v;
  }
  // Format numbers with a proper minus sign
  function fmt(n) {
    return n < 0 ? '−' + Math.abs(n) : String(n);
  }
  // Format "+ b" / "− b" as a trailing term; b of 0 gives empty string
  function trail(b) {
    if (b === 0) return '';
    return b > 0 ? ' + ' + b : ' − ' + Math.abs(b);
  }

  // ---- Single-variable generators. Each returns {text, answer} ----
  // Solutions are built backwards from a chosen integer x so answers are always whole numbers.

  function genX(level) {
    var x, a, b, c, d;
    if (level === 1) {
      // easy: x + b = c  or  ax = c  or  ax + b = c (small numbers)
      x = randInt(1, 10);
      var kind = randInt(0, 2);
      if (kind === 0) {
        b = randNonZero(-10, 10);
        return { text: 'x' + trail(b) + ' = ' + fmt(x + b), answer: x };
      }
      if (kind === 1) {
        a = randInt(2, 9);
        return { text: coef(a, 'x') + ' = ' + fmt(a * x), answer: x };
      }
      a = randInt(2, 5);
      b = randNonZero(-9, 9);
      return { text: coef(a, 'x') + trail(b) + ' = ' + fmt(a * x + b), answer: x };
    }
    if (level === 2) {
      // medium: ax + b = c with negatives, a(x + b) = c, or x/a + b = c
      x = randInt(-10, 12);
      var kind2 = randInt(0, 2);
      if (kind2 === 0) {
        a = randNonZero(-9, 9);
        b = randNonZero(-12, 12);
        return { text: coef(a, 'x') + trail(b) + ' = ' + fmt(a * x + b), answer: x };
      }
      if (kind2 === 1) {
        a = randNonZero(-6, 6);
        b = randNonZero(-8, 8);
        return { text: fmt(a) + '(x' + trail(b) + ') = ' + fmt(a * (x + b)), answer: x };
      }
      a = randInt(2, 6);
      x = a * randInt(-6, 6); // make x divisible by a
      b = randNonZero(-10, 10);
      return { text: 'x/' + a + trail(b) + ' = ' + fmt(x / a + b), answer: x };
    }
    // hard: variables on both sides  ax + b = cx + d,  or  a(x + b) = cx + d
    x = randInt(-9, 9);
    a = randNonZero(-9, 9);
    c = randNonZero(-9, 9);
    while (c === a) c = randNonZero(-9, 9); // keep it solvable
    var kind3 = randInt(0, 1);
    if (kind3 === 0) {
      b = randNonZero(-15, 15);
      d = a * x + b - c * x;
      return {
        text: coef(a, 'x') + trail(b) + ' = ' + coef(c, 'x') + trail(d),
        answer: x
      };
    }
    b = randNonZero(-8, 8);
    d = a * (x + b) - c * x;
    return {
      text: fmt(a) + '(x' + trail(b) + ') = ' + coef(c, 'x') + trail(d),
      answer: x
    };
  }

  // ---- Two-variable system generators. Each returns {lines: [eq1, eq2], answer} ----

  function eqLine(a, b, rhs) {
    // Build "ax + by = rhs" with nice signs; a is never 0 here
    var left = coef(a, 'x');
    if (b > 0) left += ' + ' + (b === 1 ? 'y' : b + 'y');
    else if (b < 0) left += ' − ' + (b === -1 ? 'y' : Math.abs(b) + 'y');
    return left + ' = ' + fmt(rhs);
  }

  function genXY(level) {
    var x, y, a1, b1, a2, b2;
    if (level === 1) {
      // easy: x + y = s, x − y = d  (substitution-friendly)
      x = randInt(1, 12); y = randInt(1, 12);
      var kind = randInt(0, 1);
      if (kind === 0) {
        return { lines: ['x + y = ' + fmt(x + y), 'x − y = ' + fmt(x - y)], x: x, y: y };
      }
      a1 = randInt(2, 4);
      return { lines: [eqLine(1, 1, x + y), eqLine(a1, 1, a1 * x + y)], x: x, y: y };
    }
    if (level === 2) {
      // medium: small coefficients, elimination needed
      x = randInt(-6, 8); y = randInt(-6, 8);
      a1 = randNonZero(-4, 4); b1 = randNonZero(-4, 4);
      a2 = randNonZero(-4, 4); b2 = randNonZero(-4, 4);
      while (a1 * b2 - a2 * b1 === 0) { a2 = randNonZero(-4, 4); b2 = randNonZero(-4, 4); }
      return {
        lines: [eqLine(a1, b1, a1 * x + b1 * y), eqLine(a2, b2, a2 * x + b2 * y)],
        x: x, y: y
      };
    }
    // hard: bigger coefficients and answers
    x = randInt(-12, 12); y = randInt(-12, 12);
    a1 = randNonZero(-8, 8); b1 = randNonZero(-8, 8);
    a2 = randNonZero(-8, 8); b2 = randNonZero(-8, 8);
    while (a1 * b2 - a2 * b1 === 0) { a2 = randNonZero(-8, 8); b2 = randNonZero(-8, 8); }
    return {
      lines: [eqLine(a1, b1, a1 * x + b1 * y), eqLine(a2, b2, a2 * x + b2 * y)],
      x: x, y: y
    };
  }

  function levelFor(face) {
    if (face <= 2) return 1;
    if (face <= 4) return 2;
    return 3;
  }

  var DIFF_LABEL = { 1: ['easy', 'Easy'], 2: ['medium', 'Medium'], 3: ['hard', 'Hard'] };

  function renderProblem(face) {
    var level = levelFor(face);
    diffEl.className = 'difficulty ' + DIFF_LABEL[level][0];
    diffEl.textContent = 'You rolled ' + face + ' — ' + DIFF_LABEL[level][1];

    placeholderEl.hidden = true;
    equationEl.hidden = false;
    revealBtn.hidden = false;
    revealBtn.textContent = 'Show answer';
    answerEl.hidden = true;

    if (mode === 'x') {
      var p = genX(level);
      equationEl.textContent = p.text;
      answerEl.textContent = 'x = ' + fmt(p.answer);
    } else {
      var s = genXY(level);
      equationEl.innerHTML = '<div class="brace"><div>' + s.lines[0] + '</div><div>' + s.lines[1] + '</div></div>';
      answerEl.textContent = 'x = ' + fmt(s.x) + ',  y = ' + fmt(s.y);
    }
  }

  diceEl.addEventListener('click', function () {
    if (rolling) return;
    rolling = true;
    diceEl.classList.add('rolling');

    // Flicker faces while the dice spins
    var flicker = setInterval(function () { showFace(randInt(1, 6)); }, 90);

    setTimeout(function () {
      clearInterval(flicker);
      diceEl.classList.remove('rolling');
      rolling = false;
      var face = randInt(1, 6);
      showFace(face);
      renderProblem(face);
    }, 600);
  });

  revealBtn.addEventListener('click', function () {
    if (answerEl.hidden) {
      answerEl.hidden = false;
      revealBtn.textContent = 'Hide answer';
    } else {
      answerEl.hidden = true;
      revealBtn.textContent = 'Show answer';
    }
  });

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    tabX.classList.toggle('active', next === 'x');
    tabXY.classList.toggle('active', next === 'xy');
    tabX.setAttribute('aria-selected', next === 'x');
    tabXY.setAttribute('aria-selected', next === 'xy');
    // Reset the card so the old problem doesn't linger in the wrong mode
    placeholderEl.hidden = false;
    equationEl.hidden = true;
    revealBtn.hidden = true;
    answerEl.hidden = true;
    diffEl.textContent = '';
    diffEl.className = 'difficulty';
  }

  tabX.addEventListener('click', function () { setMode('x'); });
  tabXY.addEventListener('click', function () { setMode('xy'); });

  showFace(5); // starting face
})();
</script>
</body>
</html>

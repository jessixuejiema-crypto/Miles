<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Colony Sim</title>
</head>
<body>
<style>
  :root{
    --bg:#16120c; --bar:#221b11; --panel:#2b2317; --ink:#efe7d6; --dim:#a89a7f;
    --accent:#f0a532; --green:#5ce080; --blue:#5a96ff; --red:#e5484d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:8px 12px; background:var(--bar); border-bottom:1px solid #3a2f1d;
  }
  .logo{font-weight:700; letter-spacing:.3px; margin-right:4px; white-space:nowrap}
  .logo small{color:var(--dim); font-weight:400}
  .group{display:flex; gap:6px; align-items:center}
  .sep{width:1px; height:22px; background:#3a2f1d}
  button,select{
    background:var(--panel); color:var(--ink); border:1px solid #453923;
    border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  button:hover{background:#382e1c}
  button.tb.active{background:#4a3a1c; border-color:var(--accent); color:#ffd98a}
  #play{background:#2a4a2a; border-color:#3f7a3f; font-weight:600; min-width:88px}
  #play:hover{background:#356035}
  #play.on{background:#5a3520; border-color:#a8683a}
  label.chk{display:flex; align-items:center; gap:5px; color:var(--dim); cursor:pointer; white-space:nowrap}
  .stats{margin-left:auto; display:flex; gap:14px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums}
  .stats b{color:var(--ink); font-weight:600}
  #wrap{position:relative; flex:1; min-height:0}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair}
  #hint{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:rgba(24,19,11,.88); border:1px solid #4a3c22; border-radius:10px;
    padding:8px 16px; color:#ffd98a; pointer-events:none; white-space:nowrap;
    transition:opacity .4s; max-width:94%; overflow:hidden; text-overflow:ellipsis;
  }
  #hint.hide{opacity:0}
  #legend{
    position:absolute; left:12px; bottom:12px; background:rgba(24,19,11,.82);
    border:1px solid #3a2f1d; border-radius:10px; padding:8px 12px;
    font-size:12px; color:var(--dim); pointer-events:none; line-height:1.7;
  }
  #legend .grad{display:inline-block; width:96px; height:8px; border-radius:4px; margin-right:7px; vertical-align:middle;
    background:linear-gradient(90deg,#2f6bff,#24d3e6,#3fe06a,#f2e33c,#ff9d2e,#ff3527)}
  #legend .bands{opacity:.72; font-size:11px}
  #legend .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 10px 0 3px; vertical-align:middle}
</style>

<div id="bar">
  <span class="logo">🐜 Ant Colony Sim <small>— editor</small></span>
  <div class="group" id="tools">
    <button class="tb active" data-tool="colony" title="Click to place an ant hill">⛰️ Colony</button>
    <button class="tb" data-tool="food" title="Click or drag to drop food">🍓 Food</button>
    <button class="tb" data-tool="wall" title="Drag to paint rock walls">🪨 Wall</button>
    <button class="tb" data-tool="erase" title="Click or drag to erase">🧽 Erase</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="play">▶ Play</button>
    <button id="reset" title="Clear ants and trails, keep the map">⟲ Reset</button>
    <button id="clearAll" title="Wipe everything">🗑 Clear</button>
    <select id="speed" title="Simulation speed">
      <option value="1">1×</option><option value="2">2×</option>
      <option value="4">4×</option><option value="8">8×</option>
    </select>
    <label class="chk"><input type="checkbox" id="trails" checked> Markers</label>
  </div>
  <div class="stats">
    <span>⏱ <b id="stTime">0:00</b></span>
    <span>🐜 <b id="stAnts">0</b></span>
    <span>🍓 delivered <b id="stFood">0</b></span>
  </div>
</div>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="legend">
    <span class="grad"></span>marker map — ant traffic, fades in ~2 min<br>
    <span class="bands">blue 1–5 · cyan 6–15 · green 16–26 · yellow 27–40 · orange 41–80 · red 81+</span><br>
    <span class="dot" style="background:#f5a83c"></span>explorer ant (20%) — blazes new paths
    <span class="dot" style="background:#e8e0cf"></span>follower ant (80%) — follows popular trails
  </div>
  <div id="hint"></div>
</div>

<script>
'use strict';
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

/* ---- tuning ---- */
const CELL = 6;            // pheromone grid cell size (px)
const FADE = 120;          // seconds for a marker to fully fade
const STEP = 1 / 60;       // fixed sim step
const DECAY = Math.pow(0.01, STEP / FADE);
const MAXV = 3;            // pheromone saturation (popular paths get brighter)
const DEP_RATE = 7;        // deposit per second at full weight
const ANT_SPEED = 46;      // px/s
const SENSOR_DIST = 15, SENSOR_ANG = 0.5;
const ANT_CAP = 200;       // per colony, keeps the sim smooth
const EXPLORER_EVERY = 5;  // every 5th ant = explorer (20%)

/* ---- state ---- */
let W = 0, H = 0, gw = 0, gh = 0;
let foodP = new Float32Array(0), traffic = new Float32Array(0), walls = new Uint8Array(0);
let blurA = new Float32Array(0), blurB = new Float32Array(0);
let colonies = [], foods = [], ants = [];
let playing = false, simTime = 0, speedMul = 1, showTrails = true;
let delivered = 0, tool = 'colony';

const pherCv = document.createElement('canvas');
const wallCv = document.createElement('canvas');
let pherCtx, wallCtx, pherImg;

/* ---- grid helpers ---- */
function cellIdx(x, y) {
  const cx = (x / CELL) | 0, cy = (y / CELL) | 0;
  if (cx < 0 || cy < 0 || cx >= gw || cy >= gh) return -1;
  return cy * gw + cx;
}
function blocked(x, y) {
  if (x < 4 || y < 4 || x > W - 4 || y > H - 4) return true;
  const i = cellIdx(x, y);
  return i >= 0 && walls[i] === 1;
}
function sense(grid, a, off) {
  const ang = a.h + off;
  const i = cellIdx(a.x + Math.cos(ang) * SENSOR_DIST, a.y + Math.sin(ang) * SENSOR_DIST);
  if (i < 0 || walls[i]) return 0;
  return grid[i];
}
function deposit(grid, a, w) {
  if (w <= 0) return;
  const i = cellIdx(a.x, a.y);
  if (i < 0) return;
  const v = grid[i] + DEP_RATE * w * STEP;
  grid[i] = v > MAXV ? MAXV : v;
}

/* ---- resize (keeps walls/trails where they overlap) ---- */
function resize() {
  const r = cv.getBoundingClientRect();
  const nw = Math.max(60, Math.round(r.width)), nh = Math.max(60, Math.round(r.height));
  if (nw === W && nh === H) return;
  const ngw = Math.ceil(nw / CELL), ngh = Math.ceil(nh / CELL);
  const nFood = new Float32Array(ngw * ngh), nTraf = new Float32Array(ngw * ngh), nWalls = new Uint8Array(ngw * ngh);
  const cw = Math.min(gw, ngw), ch = Math.min(gh, ngh);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    nFood[y * ngw + x] = foodP[y * gw + x];
    nTraf[y * ngw + x] = traffic[y * gw + x];
    nWalls[y * ngw + x] = walls[y * gw + x];
  }
  W = nw; H = nh; gw = ngw; gh = ngh;
  foodP = nFood; traffic = nTraf; walls = nWalls;
  blurA = new Float32Array(gw * gh); blurB = new Float32Array(gw * gh);
  cv.width = W; cv.height = H;
  pherCv.width = gw; pherCv.height = gh;
  wallCv.width = gw; wallCv.height = gh;
  pherCtx = pherCv.getContext('2d');
  wallCtx = wallCv.getContext('2d');
  pherImg = pherCtx.createImageData(gw, gh);
  for (const a of ants) { a.x = Math.min(Math.max(a.x, 6), W - 6); a.y = Math.min(Math.max(a.y, 6), H - 6); a.lastCell = -1; }
  redrawWalls();
}

/* ---- entities ---- */
function addColony(x, y) {
  for (const c of colonies) if (Math.hypot(c.x - x, c.y - y) < 70) { flashHint('Too close to another colony'); return; }
  if (colonies.length >= 10) { flashHint('Max 10 colonies'); return; }
  const col = { x, y, stored: 0, spawned: 0, alive: 0 };
  colonies.push(col);
  if (playing) spawnAnt(col);
}
function addFood(x, y) {
  const f = { x, y, amount: 30 };
  f.r = foodRadius(f.amount);
  foods.push(f);
}
function foodRadius(n) { return 4 + Math.sqrt(n) * 1.5; }

function spawnAnt(col) {
  if (col.alive >= ANT_CAP) return;
  const explorer = col.spawned % EXPLORER_EVERY === 0; // ant #1 explores, then every 5th
  col.spawned++; col.alive++;
  ants.push({
    x: col.x, y: col.y, h: Math.random() * TAU,
    carrying: false, explorer, colony: col,
    sinceHome: 0, sinceFood: 0,
    phase: Math.random() * TAU, wfreq: 4.5 + Math.random() * 2.5,
    sway: 0, swayAmp: 0.15, lastCell: -1
  });
}

/* ---- ant brain ---- */
function turnToward(h, target, maxTurn) {
  let d = target - h;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return h + Math.max(-maxTurn, Math.min(maxTurn, d));
}

function stepAnt(a) {
  a.sinceHome += STEP; a.sinceFood += STEP;
  const col = a.colony;

  if (a.carrying) {
    // head home, marking the food trail behind it as it goes
    const home = Math.atan2(col.y - a.y, col.x - a.x);
    a.h = turnToward(a.h, home, 5 * STEP);
    a.h += (Math.random() - 0.5) * 0.10;
    a.swayAmp = 0.55; // serpentine weave on the way home, no beelines
    deposit(foodP, a, 1 - a.sinceFood / 70);
    if (Math.hypot(col.x - a.x, col.y - a.y) < 15) {
      a.carrying = false; delivered++; col.stored++;
      a.sinceHome = 0; a.h = Math.random() * TAU;
      spawnAnt(col); // food delivered -> the colony grows by one ant
    }
  } else {
    // nearby food is spotted on sight, no trail needed
    let sawFood = false;
    for (const f of foods) {
      const dx = f.x - a.x, dy = f.y - a.y, R = f.r + 80;
      if (dx * dx + dy * dy < R * R) {
        a.h = turnToward(a.h, Math.atan2(dy, dx), 10 * STEP);
        sawFood = true;
        break;
      }
    }
    let onTrail = false;
    if (!sawFood && !a.explorer) {
      // followers sniff the food trail: strongest scent wins, so popular paths dominate
      const l = sense(foodP, a, -SENSOR_ANG), c = sense(foodP, a, 0), r = sense(foodP, a, SENSOR_ANG);
      if (Math.max(l, c, r) > 0.03) {
        onTrail = true;
        if (c >= l && c >= r) { /* stay the course */ }
        else if (l > r) a.h -= 0.15;
        else a.h += 0.15;
      }
    }
    if (sawFood) {
      a.h += (Math.random() - 0.5) * 0.05;
      a.swayAmp = 0.2;
    } else if (a.sinceHome > 200 && !onTrail) {
      // lost too long: trek home to regroup
      a.h = turnToward(a.h, Math.atan2(col.y - a.y, col.x - a.x), 4 * STEP);
      a.h += (Math.random() - 0.5) * 0.10;
      a.swayAmp = 0.5;
    } else if (onTrail) {
      a.h += (Math.random() - 0.5) * 0.08;
      a.swayAmp = 0.55; // weave along the trail
    } else {
      // fairly straight wandering covers ground; occasional sharp detours
      a.h += (Math.random() - 0.5) * (a.explorer ? 0.12 : 0.16);
      if (Math.random() < 0.008) a.h += (Math.random() - 0.5) * 2.4;
      a.swayAmp = 0.15;
    }

    if (Math.hypot(col.x - a.x, col.y - a.y) < 15) a.sinceHome = 0;

    for (let i = 0; i < foods.length; i++) {
      const f = foods[i], dx = f.x - a.x, dy = f.y - a.y;
      if (dx * dx + dy * dy < (f.r + 3) * (f.r + 3)) {
        f.amount--;
        if (f.amount <= 0) foods.splice(i, 1); else f.r = foodRadius(f.amount);
        a.carrying = true; a.sinceFood = 0; a.h += Math.PI;
        break;
      }
    }
  }

  a.sway = Math.sin(simTime * a.wfreq + a.phase) * a.swayAmp;
  const dir = a.h + a.sway;
  const nx = a.x + Math.cos(dir) * ANT_SPEED * STEP;
  const ny = a.y + Math.sin(dir) * ANT_SPEED * STEP;
  if (blocked(nx, ny)) a.h += Math.PI + (Math.random() - 0.5);
  else {
    a.x = nx; a.y = ny;
    const ci = cellIdx(nx, ny);
    if (ci !== a.lastCell) { // one tick per ant per cell: the marker map counts ant traffic
      a.lastCell = ci;
      if (ci >= 0 && traffic[ci] < 150) traffic[ci] += 1;
    }
  }
}

/* ---- sim step ---- */
function step() {
  simTime += STEP;
  for (let i = 0; i < foodP.length; i++) {
    const f = foodP[i] * DECAY; foodP[i] = f < 0.002 ? 0 : f;
    const t = traffic[i] * DECAY; traffic[i] = t < 0.002 ? 0 : t;
  }
  for (const a of ants) stepAnt(a);
}

/* ---- rendering ---- */
function redrawWalls() {
  const img = wallCtx.createImageData(gw, gh);
  const d = img.data;
  for (let i = 0; i < walls.length; i++) {
    if (!walls[i]) continue;
    const j = i * 4;
    d[j] = 92; d[j + 1] = 82; d[j + 2] = 70; d[j + 3] = 255;
  }
  wallCtx.putImageData(img, 0, 0);
}

/* traffic count -> color, anchored at the band midpoints:
   1-5 blue, 6-15 cyan, 16-26 green, 27-40 yellow, 41-80 orange, 81+ red */
const LUT_MAX = 120, LUT_RES = 2;
const lut = new Uint8Array((LUT_MAX * LUT_RES + 1) * 3);
{
  const stops = [
    [0,    38,  70, 217],
    [3,    47, 107, 255],   // blue
    [10.5, 36, 211, 230],   // cyan
    [21,   63, 224, 106],   // green
    [33.5, 242, 227, 60],   // yellow
    [60,  255, 157,  46],   // orange
    [95,  255,  53,  39],   // red
    [120, 255,  42,  30],
  ];
  for (let k = 0; k <= LUT_MAX * LUT_RES; k++) {
    const v = k / LUT_RES;
    let si = 0;
    while (si < stops.length - 2 && v > stops[si + 1][0]) si++;
    const a = stops[si], b = stops[si + 1];
    const t = Math.min(1, Math.max(0, (v - a[0]) / (b[0] - a[0])));
    lut[k * 3]     = (a[1] + (b[1] - a[1]) * t) | 0;
    lut[k * 3 + 1] = (a[2] + (b[2] - a[2]) * t) | 0;
    lut[k * 3 + 2] = (a[3] + (b[3] - a[3]) * t) | 0;
  }
}

function boxPass(src, dst) {
  // separable 3x3 box; blurB is the horizontal scratch row buffer
  for (let y = 0; y < gh; y++) {
    const row = y * gw;
    for (let x = 0; x < gw; x++) {
      const i = row + x;
      let s = src[i], n = 1;
      if (x > 0) { s += src[i - 1]; n++; }
      if (x < gw - 1) { s += src[i + 1]; n++; }
      blurB[i] = s / n;
    }
  }
  for (let y = 0; y < gh; y++) {
    const row = y * gw;
    for (let x = 0; x < gw; x++) {
      const i = row + x;
      let s = blurB[i], n = 1;
      if (y > 0) { s += blurB[i - gw]; n++; }
      if (y < gh - 1) { s += blurB[i + gw]; n++; }
      dst[i] = s / n;
    }
  }
}

function drawMarkers() {
  boxPass(traffic, blurA);
  boxPass(blurA, blurA);
  const d = pherImg.data;
  for (let i = 0; i < traffic.length; i++) {
    // keep the trail core at its true count, let the blur supply a soft halo
    const t0 = traffic[i], tb = blurA[i];
    const v = t0 > tb ? t0 : tb;
    const j = i * 4;
    if (v < 0.05) { d[j + 3] = 0; continue; }
    const k = ((v > LUT_MAX ? LUT_MAX : v) * LUT_RES) | 0;
    d[j] = lut[k * 3]; d[j + 1] = lut[k * 3 + 1]; d[j + 2] = lut[k * 3 + 2];
    d[j + 3] = Math.min(215, 45 + v * 80) | 0;
  }
  pherCtx.putImageData(pherImg, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(pherCv, 0, 0, W, H);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#16120c';
  ctx.fillRect(0, 0, W, H);

  if (showTrails) drawMarkers();

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(wallCv, 0, 0, W, H);

  // food
  for (const f of foods) {
    ctx.fillStyle = '#8f2a2e';
    ctx.beginPath(); ctx.arc(f.x, f.y + 1, f.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e5484d';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r - 1, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(f.x - f.r * 0.3, f.y - f.r * 0.3, f.r * 0.22, 0, TAU); ctx.fill();
  }

  // colonies
  for (const c of colonies) {
    ctx.fillStyle = '#6b4e2e';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, 24, 14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8a6a40';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 20, 11, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0c0905';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 7, 4.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd98a';
    ctx.font = '11px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🐜' + c.alive + '  🍓' + c.stored, c.x, c.y - 18);
  }

  // ants
  for (const a of ants) {
    const ang = a.h + a.sway;
    const cos = Math.cos(ang), sin = Math.sin(ang);
    ctx.setTransform(cos, sin, -sin, cos, a.x, a.y);
    ctx.fillStyle = a.explorer ? '#f5a83c' : '#e8e0cf';
    ctx.fillRect(-3, -1.1, 6, 2.2);
    if (a.carrying) {
      ctx.fillStyle = '#ff5f56';
      ctx.beginPath(); ctx.arc(3.6, 0, 2.3, 0, TAU); ctx.fill();
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ---- HUD ---- */
const stTime = document.getElementById('stTime');
const stAnts = document.getElementById('stAnts');
const stFood = document.getElementById('stFood');
const hintEl = document.getElementById('hint');
let flashTimer = 0, flashMsg = '';

function flashHint(msg) { flashMsg = msg; flashTimer = performance.now() + 1800; }

function updateHUD() {
  const m = (simTime / 60) | 0, s = (simTime % 60) | 0;
  stTime.textContent = m + ':' + String(s).padStart(2, '0');
  stAnts.textContent = ants.length;
  stFood.textContent = delivered;

  let msg = '';
  if (flashTimer > performance.now()) msg = flashMsg;
  else if (colonies.length === 0) msg = '① Click anywhere to place a colony (ant hill)';
  else if (foods.length === 0 && delivered === 0) msg = '② Pick 🍓 Food and click to drop food for the ants';
  else if (!playing && ants.length === 0) msg = '③ Press ▶ Play — one ant will crawl out and start exploring';
  else if (!playing) msg = 'Paused — press ▶ Play to resume';
  hintEl.textContent = msg;
  hintEl.classList.toggle('hide', msg === '');
}

/* ---- main loop ---- */
let last = performance.now(), acc = 0, hudTick = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000);
  last = t;
  if (playing) {
    acc += dt * speedMul;
    let n = 0;
    while (acc >= STEP && n < 32) { step(); acc -= STEP; n++; }
    if (n >= 32) acc = 0;
  }
  render();
  if (++hudTick % 6 === 0) updateHUD();
  requestAnimationFrame(frame);
}

/* ---- editor input ---- */
let dragging = false, lastFood = null;

function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function paintWall(x, y, set) {
  const cx = (x / CELL) | 0, cy = (y / CELL) | 0, R = set ? 2 : 3;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const nx = cx + dx, ny = cy + dy;
    if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
    if (dx * dx + dy * dy > R * R + 1) continue;
    const i = ny * gw + nx;
    walls[i] = set ? 1 : 0;
    if (set) { foodP[i] = 0; traffic[i] = 0; }
  }
  redrawWalls();
}
function erase(x, y) {
  foods = foods.filter(f => Math.hypot(f.x - x, f.y - y) > f.r + 12);
  const before = colonies.length;
  colonies = colonies.filter(c => Math.hypot(c.x - x, c.y - y) > 26);
  if (colonies.length !== before) ants = ants.filter(a => colonies.includes(a.colony));
  paintWall(x, y, false);
}
function applyTool(p, isDown) {
  if (tool === 'colony') { if (isDown) addColony(p.x, p.y); }
  else if (tool === 'food') {
    if (isDown || !lastFood || Math.hypot(lastFood.x - p.x, lastFood.y - p.y) > 26) {
      addFood(p.x, p.y); lastFood = p;
    }
  }
  else if (tool === 'wall') paintWall(p.x, p.y, true);
  else if (tool === 'erase') erase(p.x, p.y);
}

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  dragging = true; lastFood = null;
  applyTool(canvasPos(e), true);
});
cv.addEventListener('pointermove', e => { if (dragging) applyTool(canvasPos(e), false); });
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });

/* ---- toolbar ---- */
document.getElementById('tools').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tool = b.dataset.tool;
  for (const x of document.querySelectorAll('#tools .tb')) x.classList.toggle('active', x === b);
});

const playBtn = document.getElementById('play');
playBtn.addEventListener('click', () => {
  if (!playing && colonies.length === 0) { flashHint('Place a colony first!'); return; }
  playing = !playing;
  if (playing) for (const c of colonies) if (c.spawned === 0) spawnAnt(c); // the first ant emerges
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  playBtn.classList.toggle('on', playing);
});

document.getElementById('reset').addEventListener('click', () => {
  ants = []; delivered = 0; simTime = 0; playing = false;
  playBtn.textContent = '▶ Play'; playBtn.classList.remove('on');
  foodP.fill(0); traffic.fill(0);
  for (const c of colonies) { c.stored = 0; c.spawned = 0; c.alive = 0; }
});
document.getElementById('clearAll').addEventListener('click', () => {
  ants = []; colonies = []; foods = []; delivered = 0; simTime = 0; playing = false;
  playBtn.textContent = '▶ Play'; playBtn.classList.remove('on');
  foodP.fill(0); traffic.fill(0); walls.fill(0); redrawWalls();
});
document.getElementById('speed').addEventListener('change', e => { speedMul = +e.target.value; });
document.getElementById('trails').addEventListener('change', e => { showTrails = e.target.checked; });

/* ---- boot ---- */
window.addEventListener('resize', resize);
resize();
updateHUD();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
